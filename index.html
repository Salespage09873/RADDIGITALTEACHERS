<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cronograma Semanal - Escola de Inglês</title>
    <style>
        :root {
            --primary: #2c3e50;
            --secondary: #34495e;
            --accent: #3498db;
            --light: #ecf0f1;
            --dark: #2c3e50;
            --white: #ffffff;
            --shadow: 0 4px 6px rgba(0,0,0,0.1);
            --radius: 12px;
            --success: #27ae60;
            --danger: #e74c3c;
            --warning: #f39c12;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            color: var(--dark);
            line-height: 1.6;
        }

        header {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: var(--white);
            padding: 2rem 1rem;
            text-align: center;
            box-shadow: var(--shadow);
        }

        header h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }

        /* Tela de Seleção */
        #selection-screen { display: block; animation: fadeIn 0.5s ease; }
        #schedule-screen { display: none; animation: slideUp 0.5s ease; }

        .teachers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-top: 2rem;
        }

        .teacher-card {
            background: var(--white);
            border-radius: var(--radius);
            padding: 2rem;
            text-align: center;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            box-shadow: var(--shadow);
            border-bottom: 5px solid transparent;
        }

        .teacher-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
        }

        .teacher-name {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--dark);
            text-transform: uppercase;
        }

        /* Cronograma */
        .back-btn {
            background: var(--white);
            color: var(--primary);
            border: 2px solid var(--primary);
            padding: 0.8rem 1.5rem;
            border-radius: 50px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 2rem;
        }

        .back-btn:hover { background: var(--primary); color: var(--white); }

        .current-teacher-header {
            text-align: center;
            margin-bottom: 2rem;
            padding: 1.5rem;
            background: var(--white);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border-left: 10px solid var(--accent);
        }

        .days-container {
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .day-section {
            background: var(--white);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow);
        }

        .day-header {
            padding: 1rem 1.5rem;
            color: var(--white);
            font-size: 1.2rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        .classes-list {
            padding: 1.5rem;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
        }

        .class-card {
            border: 1px solid #eee;
            border-radius: 8px;
            padding: 1.2rem;
            background: #fafafa;
            position: relative;
            border-left: 4px solid var(--accent);
            transition: all 0.2s;
        }

        .class-card.completed {
            background-color: #e8f8f5;
            border-left-color: var(--success);
            opacity: 0.9;
        }

        .class-card.completed .class-time {
            text-decoration: line-through;
            color: #7f8c8d;
        }

        .class-header-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
        }

        .class-time {
            font-weight: bold;
            color: var(--primary);
            font-size: 1.1rem;
        }

        .check-btn {
            background: none;
            border: 2px solid #bdc3c7;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: transparent;
            transition: all 0.2s;
        }

        .class-card.completed .check-btn {
            background-color: var(--success);
            border-color: var(--success);
            color: white;
        }

        .check-btn:hover { border-color: var(--success); color: var(--success); }
        .class-card.completed .check-btn:hover { color: white; }

        .badges-row {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .badge {
            padding: 0.2rem 0.6rem;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: 600;
        }
        .badge-group { background-color: #e3f2fd; color: #1565c0; }
        .badge-book { background-color: #fff3e0; color: #ef6c00; }
        .badge-modal { background-color: #f3e5f5; color: #7b1fa2; }
        .badge-room { background-color: #e8f5e9; color: #2e7d32; }

        .rad-btn {
            width: 100%;
            padding: 0.8rem;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .rad-btn:hover { background-color: var(--secondary); }
        .rad-btn.has-data { background-color: var(--success); }

        /* Modal RAD */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 1rem;
        }

        .modal-content {
            background: white;
            padding: 2rem;
            border-radius: var(--radius);
            width: 100%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid #eee;
            padding-bottom: 1rem;
        }

        .close-modal {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: #7f8c8d;
        }

        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; font-weight: bold; }
        .form-group input, .form-group select {
            width: 100%;
            padding: 0.8rem;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 1rem;
        }

        .attendance-list {
            margin-top: 1.5rem;
            border-top: 1px solid #eee;
            padding-top: 1rem;
        }

        .student-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.8rem 0;
            border-bottom: 1px solid #f1f1f1;
        }

        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 24px;
        }
        .toggle-switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 24px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        input:checked + .slider { background-color: var(--success); }
        input:checked + .slider:before { transform: translateX(26px); }

        .modal-actions {
            margin-top: 2rem;
            display: flex;
            gap: 1rem;
            justify-content: flex-end;
        }

        .btn-save {
            background-color: var(--success);
            color: white;
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        
        .btn-clear {
            background-color: var(--danger);
            color: white;
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .loading { text-align: center; padding: 3rem; font-size: 1.2rem; color: var(--secondary); }
        .error-msg { background: #ffebee; color: #c62828; padding: 1rem; border-radius: var(--radius); text-align: center; margin-top: 1rem; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* Cores dos Professores */
        .color-MYCAEL { border-color: #FF6B6B; background-color: #FF6B6B; }
        .color-RAFAEL { border-color: #4ECDC4; background-color: #4ECDC4; }
        .color-HOPE { border-color: #FFE66D; background-color: #FFE66D; color: #333; }
        .color-PEDRO { border-color: #F38181; background-color: #F38181; }
        .color-DIOGO { border-color: #AA96DA; background-color: #AA96DA; }
        .color-LIVIA { border-color: #FCBAD3; background-color: #FCBAD3; }
        .color-TOSCA { border-color: #A8D8EA; background-color: #A8D8EA; }
        .color-IAGO { border-color: #FF9F43; background-color: #FF9F43; }
        .color-SARA { border-color: #54a0ff; background-color: #54a0ff; }
        .color-CAROL { border-color: #5f27cd; background-color: #5f27cd; }
    </style>
</head>
<body>

<header>
    <h1>Cronograma Semanal</h1>
    <p>Selecione seu nome para ver suas aulas e registrar o RAD</p>
</header>

<div class="container">
    <!-- Tela de Seleção -->
    <div id="selection-screen">
        <div id="loading" class="loading">Carregando cronograma...</div>
        <div id="teachers-grid" class="teachers-grid"></div>
        <div id="error-message" class="error-msg" style="display:none;"></div>
    </div>

    <!-- Tela do Cronograma Individual -->
    <div id="schedule-screen">
        <button class="back-btn" onclick="showSelection()">← Voltar para Seleção</button>
        
        <div class="current-teacher-header" id="teacher-header">
            <!-- Preenchido via JS -->
        </div>

        <div id="schedule-content" class="days-container"></div>
    </div>
</div>

<!-- Modal RAD -->
<div id="rad-modal" class="modal-overlay">
    <div class="modal-content">
        <div class="modal-header">
            <h2 id="modal-title">Registro de Aula (RAD)</h2>
            <button class="close-modal" onclick="closeModal()">&times;</button>
        </div>
        
        <input type="hidden" id="rad-class-id">
        
        <div class="form-group">
            <label>Book / Módulo</label>
            <input type="text" id="rad-book" placeholder="Ex: G1, Movers">
        </div>
        
        <div class="form-group">
            <label>Turma (Group)</label>
            <input type="text" id="rad-group" placeholder="Ex: Dune, The 100">
        </div>

        <div class="form-group">
            <label>Lição (Lesson)</label>
            <input type="text" id="rad-lesson" placeholder="Ex: Unit 3, Page 45">
        </div>

        <div class="attendance-list">
            <h3>Lista de Presença</h3>
            <p style="font-size: 0.9rem; color: #666; margin-bottom: 1rem;">Marque os alunos presentes:</p>
            <div id="attendance-container">
                <!-- Lista de alunos gerada via JS -->
            </div>
        </div>

        <div class="modal-actions">
            <button class="btn-clear" onclick="clearRadData()">Limpar RAD</button>
            <button class="btn-save" onclick="saveRadData()">Salvar Registro</button>
        </div>
    </div>
</div>

<script>
    // URL Correta da Planilha (CSV)
    const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQmSAl1ndXXSgDWbrjCiSDkmtECkP94Rr2nk-kIHV-zHd4NFSE9CzyQb6YP2Rt4lEQNYOpuvgjCYDal/pub?gid=0&single=true&output=csv';

    // Lista de Professores Válidos
    const VALID_TEACHERS = [
        { name: 'MYCAEL', color: '#FF6B6B' },
        { name: 'RAFAEL', color: '#4ECDC4' },
        { name: 'HOPE', color: '#FFE66D' },
        { name: 'PEDRO', color: '#F38181' },
        { name: 'DIOGO', color: '#AA96DA' },
        { name: 'LIVIA', color: '#FCBAD3' },
        { name: 'TOSCA', color: '#A8D8EA' },
        { name: 'IAGO', color: '#FF9F43' },
        { name: 'SARA', color: '#54a0ff' },
        { name: 'CAROL', color: '#5f27cd' }
    ];

    const DAYS_MAP = {
        'Mon': 'Segunda-feira',
        'Tue': 'Terça-feira',
        'Wed': 'Quarta-feira',
        'Thu': 'Quinta-feira',
        'Fri': 'Sexta-feira',
        'Sat': 'Sábado'
    };

    // Banco de Dados de Alunos por Turma
    const STUDENTS_DB = {
        "ADVENTURE TIME": ["Beatriz Melo De Matos", "Enzo Haas Goetten", "Isabela Nishimura Pereira", "Victor Hugo Clasen"],
        "BITA WORLD": ["Alice Marion", "Maria Carolina Crespo Candido Alves", "Valentina De Sousa Vidigal"],
        "BREAKING BAD": ["Geovanna Boaventura de Oliveira"],
        "BROOKLYN 99": ["Bruna Araújo Blumer", "Giuliane Wrzecionel Dal Berto", "Jessica Aline Bernardi", "Katherine Koch Carballo", "Miguel Anastásio Costa Junior"],
        "COLEGIO CONNECT": ["Gabriel Moreira Todeschini", "Maria Helena Tuchinski Oliveira", "Victor Leandro Tumelero Bandiera"],
        "COLEGIO CONNECT KIDS": ["Adan Afonso Perazzoli", "Alice Moura Gama Tales", "Alice Vinotti Meneguzzi", "Eduarda Tumelero Bandiera", "Luiza Tuchinski Oliveira"],
        "DEXTER LAB": ["Alice Ciprini de Quadros", "Letícia Beninica Adriano"],
        "DUNE": ["Ana Paula Pizzetti Meller Remisio", "Sofia Sayuri Iyama"],
        "FROZEN (FRIENDSHIP)": ["Maria Giovanna Cunnha Cardoso Lobato", "Sofia Rodrigues Fortes Marques"],
        "GAME OF THRONES": ["Bethina Rocha Semolini", "Miguel Bilbio de Andrade"],
        "KILL BILL": ["Thalita Aliny Medeiros", "Yasmin Deotti"],
        "MINIONS": ["Betina Guedes Cristovão", "Pérola Alvarez Garcia", "Pietra de Oliveira de Lima"],
        "PHINEAS & FERB": ["Enrico Goldoni Boschini", "Valentina Goldoni Boschini"],
        "SCANDAL": ["Fabricio Blesmann Kazapi", "Marina Barreto dos Santos Vargas", "Mirelle Barreto dos Santos Kazapi", "Rogério Vargas"],
        "SHREK": ["Eduardo Teixeira Dallago"],
        "STRANGER THINGS": ["Aline Araujo de Melo"],
        "SUITS": ["Bernardo Correia Pereira", "Matheus Henrique da Silva Tres", "Vinicius Estuqui Galandrini"],
        "THE 100": ["Caio Jazar Rodrigues", "Flavia de Andrade Lima", "Luiz Carlos Ferreira Hada"],
        "THE CHOSEN": ["Davi Rosa Larini", "Enzo Cardoso Pereira", "Karina Pereira dos Santos", "Maria Fernanda Crespo Cândido Alves"],
        "THE CROWN": ["Lara Becker", "Lorena Becker"],
        "THE GODFATHER": ["Gustavo Da Costa Schnaider", "Matheus Guilherme Sartor"],
        "THE LAST OF US": ["Bernardo Krieger Cordeiro", "Davi Knapp Dassoler"],
        "THE OFFICE": ["Ana Julia Cruz Da Silva", "Bruno Luiz Zeferino", "Julia de Almeida Antunes", "Nicole Mattos Paiva", "Nicoly Cantareli Hamade"],
        "THIS IS US": ["Andreia Campagnim", "Sueli Marta do Nascimento de Souza"],
        "TITANIC": ["Hector Augusto Ferreira Machado"],
        "VIP / TURMAS INDIVIDUAIS": ["Brenda Camargo Petri de Oliveira", "Julia Viana Linhares Pereira"],
        "ALUNOS KIDS": ["Antonella Kfouri Botelho", "Davi Pereira Hilgemberg", "Giullia Mmartins de Lara", "Lucca Kfouri Botelho", "Luíza Mussolini Ribeiro"],
        "ALUNOS COM MODALIDADE IDENTIFICADA": ["Eduardo Medrade Hosang", "Eduarda Borges Vespa", "João Henrique Cenci", "Maria Fernanda Spagnol"],
        "IN COMPANY / LOCAIS DE AULA": ["Aventura Jurássica", "Hotel Melo", "Hotel Negrini", "Get it Timbó"]
    };

    let allClasses = [];
    let radData = JSON.parse(localStorage.getItem('radData')) || {}; // Carrega dados salvos

    document.addEventListener('DOMContentLoaded', () => {
        fetchSchedule();
    });

    async function fetchSchedule() {
        try {
            const response = await fetch(SHEET_URL);
            if (!response.ok) throw new Error('Erro ao carregar planilha');
            
            const csvText = await response.text();
            parseCSV(csvText);
            renderTeacherSelection();
        } catch (error) {
            console.error(error);
            document.getElementById('loading').style.display = 'none';
            const errorDiv = document.getElementById('error-message');
            errorDiv.style.display = 'block';
            errorDiv.textContent = 'Erro ao carregar dados. Verifique sua conexão.';
        }
    }

    function parseCSV(text) {
        const lines = text.split('\n').map(line => line.trim()).filter(line => line.length > 0);
        if (lines.length < 2) return;

        // Mapeamento de colunas baseado na descrição:
        // B: Book, C: Group, D: Room, E: Modalidade, F: Horário
        // G: Monday, H: Tuesday, I: Wednesday, J: Thursday, K: Friday
        // Índices (0-based): B=1, C=2, D=3, E=4, F=5, G=6, H=7, I=8, J=9, K=10
        
        const dayColumns = {
            'Mon': 6, 'Tue': 7, 'Wed': 8, 'Thu': 9, 'Fri': 10
        };

        allClasses = [];

        for (let i = 1; i < lines.length; i++) {
            // Split simples assumindo que não há vírgulas dentro das células (comum em exportação CSV simples)
            // Se houver problemas, usar regex mais complexo
            const row = lines[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(cell => cell.trim().replace(/^"|"$/g, '').replace(/<.*?>/g, ''));

            const bookRaw = row[1] || '';
            const groupRaw = row[2] || '';
            const roomRaw = row[3] || '';
            const modalRaw = row[4] || '';
            const timeSlot = row[5] || '';

            if (!timeSlot) continue;

            for (const [dayKey, colIndex] of Object.entries(dayColumns)) {
                const cellData = row[colIndex];
                
                if (cellData && cellData.trim() !== '') {
                    const teacherName = findTeacherInString(cellData);
                    
                    if (teacherName) {
                        // Processar nome da turma
                        let fullGroupName = groupRaw.trim();
                        
                        // Lógica para "TPWER Bridge"
                        if (fullGroupName.toLowerCase().includes('bridge') && !fullGroupName.toLowerCase().includes('tpwer')) {
                            fullGroupName = 'TPWER ' + fullGroupName;
                        }
                        
                        // Extrair Book do Group se estiver junto (ex: "Dune G1")
                        let finalBook = bookRaw.trim();
                        let finalGroup = fullGroupName;
                        
                        // Se o book veio vazio na coluna B, tentar extrair do Group
                        if (!finalBook && finalGroup) {
                            const match = finalGroup.match(/\b(G\d|AW|Starter|Mover|Flyer|KET|PET|FCE|CAE|IELTS|TOEFL)\b/i);
                            if (match) {
                                finalBook = match[0];
                                finalGroup = finalGroup.replace(match[0], '').trim();
                            }
                        }

                        allClasses.push({
                            id: `${dayKey}-${timeSlot}-${teacherName}-${i}`, // ID único
                            day: dayKey,
                            time: timeSlot,
                            teacher: teacherName,
                            group: finalGroup,
                            book: finalBook,
                            modal: modalRaw.trim(),
                            room: roomRaw
                        });
                    }
                }
            }
        }
    }

    function findTeacherInString(str) {
        str = str.toUpperCase();
        for (const t of VALID_TEACHERS) {
            if (str.includes(t.name)) return t.name;
        }
        return null;
    }

    function renderTeacherSelection() {
        const grid = document.getElementById('teachers-grid');
        document.getElementById('loading').style.display = 'none';
        grid.innerHTML = '';

        const sortedTeachers = [...VALID_TEACHERS].sort((a, b) => a.name.localeCompare(b.name));

        sortedTeachers.forEach(teacher => {
            const hasClasses = allClasses.some(c => c.teacher === teacher.name);
            
            const card = document.createElement('div');
            card.className = 'teacher-card';
            card.style.borderBottomColor = teacher.color;
            
            card.innerHTML = `
                <div class="teacher-name" style="color: ${teacher.color}">${teacher.name}</div>
                <div class="teacher-role">${hasClasses ? 'Clique para ver aulas' : 'Sem aulas esta semana'}</div>
            `;
            
            card.onclick = () => showTeacherSchedule(teacher.name, teacher.color);
            grid.appendChild(card);
        });
    }

    function showTeacherSchedule(teacherName, teacherColor) {
        const teacherClasses = allClasses.filter(c => c.teacher === teacherName);
        
        if (teacherClasses.length === 0) {
            alert(`${teacherName} não possui aulas registradas nesta semana.`);
            return;
        }

        const byDay = {};
        Object.keys(DAYS_MAP).forEach(key => byDay[key] = []);
        
        teacherClasses.forEach(cls => {
            if (byDay[cls.day]) byDay[cls.day].push(cls);
        });

        Object.keys(byDay).forEach(day => {
            byDay[day].sort((a, b) => a.time.localeCompare(b.time));
        });

        const header = document.getElementById('teacher-header');
        header.style.borderLeftColor = teacherColor;
        header.innerHTML = `<h2 style="color: ${teacherColor}">Cronograma de ${teacherName}</h2>`;

        const content = document.getElementById('schedule-content');
        content.innerHTML = '';

        const daysOrder = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

        daysOrder.forEach(dayKey => {
            const classes = byDay[dayKey];
            if (classes.length > 0) {
                const daySection = document.createElement('div');
                daySection.className = 'day-section';
                
                const dayHeader = document.createElement('div');
                dayHeader.className = 'day-header';
                dayHeader.style.backgroundColor = teacherColor;
                dayHeader.textContent = DAYS_MAP[dayKey];
                daySection.appendChild(dayHeader);

                const list = document.createElement('div');
                list.className = 'classes-list';

                classes.forEach(cls => {
                    const isCompleted = radData[cls.id]?.completed || false;
                    const hasRadData = radData[cls.id] && (radData[cls.id].lesson || radData[cls.id].attendance);

                    const card = document.createElement('div');
                    card.className = `class-card ${isCompleted ? 'completed' : ''}`;
                    card.style.borderLeftColor = teacherColor;

                    let badgesHtml = '';
                    if (cls.group) badgesHtml += `<span class="badge badge-group">${cls.group}</span>`;
                    if (cls.book) badgesHtml += `<span class="badge badge-book">${cls.book}</span>`;
                    if (cls.modal) badgesHtml += `<span class="badge badge-modal">${cls.modal}</span>`;
                    if (cls.room) badgesHtml += `<span class="badge badge-room">📍 ${cls.room}</span>`;

                    card.innerHTML = `
                        <div class="class-header-actions">
                            <span class="class-time">⏰ ${cls.time}</span>
                            <button class="check-btn" onclick="toggleComplete('${cls.id}')" title="Marcar como realizada">
                                ✔
                            </button>
                        </div>
                        <div class="badges-row">${badgesHtml}</div>
                        <button class="rad-btn ${hasRadData ? 'has-data' : ''}" onclick="openRadModal('${cls.id}')">
                            ${hasRadData ? '✅ RAD Preenchido' : '📝 Preencher RAD'}
                        </button>
                    `;
                    list.appendChild(card);
                });

                daySection.appendChild(list);
                content.appendChild(daySection);
            }
        });

        document.getElementById('selection-screen').style.display = 'none';
        document.getElementById('schedule-screen').style.display = 'block';
        window.scrollTo(0, 0);
    }

    function showSelection() {
        document.getElementById('schedule-screen').style.display = 'none';
        document.getElementById('selection-screen').style.display = 'block';
    }

    // Funções RAD
    let currentClassId = null;

    function openRadModal(classId) {
        currentClassId = classId;
        const cls = allClasses.find(c => c.id === classId);
        if (!cls) return;

        const savedData = radData[classId] || {};
        
        document.getElementById('rad-class-id').value = classId;
        document.getElementById('rad-book').value = savedData.book || cls.book || '';
        document.getElementById('rad-group').value = savedData.group || cls.group || '';
        document.getElementById('rad-lesson').value = savedData.lesson || '';
        
        // Gerar lista de alunos
        const container = document.getElementById('attendance-container');
        container.innerHTML = '';
        
        // Tentar encontrar alunos pelo nome da turma
        let students = [];
        const groupName = cls.group.toUpperCase();
        
        // Busca exata ou parcial no banco de dados
        for (const [key, list] of Object.entries(STUDENTS_DB)) {
            if (groupName.includes(key.toUpperCase()) || key.toUpperCase().includes(groupName.split(' ')[0])) {
                students = list;
                break;
            }
        }
        
        // Se não achar pela turma, tenta achar pelo nome do grupo limpo
        if (students.length === 0) {
             const cleanName = cls.group.replace(/TPWER|G\d|FL\d|INTENSIVE|VIP/gi, '').trim();
             for (const [key, list] of Object.entries(STUDENTS_DB)) {
                if (key.toUpperCase().includes(cleanName.toUpperCase()) || cleanName.toUpperCase().includes(key.toUpperCase())) {
                    students = list;
                    break;
                }
            }
        }

        if (students.length > 0) {
            students.forEach(studentName => {
                const isPresent = savedData.attendance && savedData.attendance.includes(studentName);
                
                const item = document.createElement('div');
                item.className = 'student-item';
                item.innerHTML = `
                    <span>${studentName}</span>
                    <label class="toggle-switch">
                        <input type="checkbox" value="${studentName}" ${isPresent ? 'checked' : ''}>
                        <span class="slider"></span>
                    </label>
                `;
                container.appendChild(item);
            });
        } else {
            container.innerHTML = '<p style="color:#666; font-style:italic;">Nenhum aluno cadastrado para esta turma no sistema.</p>';
        }

        document.getElementById('rad-modal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('rad-modal').style.display = 'none';
        currentClassId = null;
    }

    function saveRadData() {
        if (!currentClassId) return;

        const book = document.getElementById('rad-book').value;
        const group = document.getElementById('rad-group').value;
        const lesson = document.getElementById('rad-lesson').value;
        
        const attendanceInputs = document.querySelectorAll('#attendance-container input[type="checkbox"]:checked');
        const attendanceList = Array.from(attendanceInputs).map(input => input.value);

        radData[currentClassId] = {
            book,
            group,
            lesson,
            attendance: attendanceList,
            completed: radData[currentClassId]?.completed || false
        };

        localStorage.setItem('radData', JSON.stringify(radData));
        closeModal();
        // Recarregar a view para atualizar o botão
        const teacherName = allClasses.find(c => c.id === currentClassId)?.teacher;
        const teacherObj = VALID_TEACHERS.find(t => t.name === teacherName);
        if (teacherName && teacherObj) {
            showTeacherSchedule(teacherName, teacherObj.color);
        }
    }

    function clearRadData() {
        if (!currentClassId) return;
        if(confirm("Tem certeza que deseja limpar todos os dados desta aula?")) {
            delete radData[currentClassId];
            localStorage.setItem('radData', JSON.stringify(radData));
            closeModal();
            const teacherName = allClasses.find(c => c.id === currentClassId)?.teacher;
            const teacherObj = VALID_TEACHERS.find(t => t.name === teacherName);
            if (teacherName && teacherObj) {
                showTeacherSchedule(teacherName, teacherObj.color);
            }
        }
    }

    function toggleComplete(classId) {
        if (!radData[classId]) radData[classId] = {};
        radData[classId].completed = !radData[classId].completed;
        localStorage.setItem('radData', JSON.stringify(radData));
        
        // Atualizar UI sem recarregar tudo
        const btn = event.target.closest('.class-card').querySelector('.check-btn');
        const card = event.target.closest('.class-card');
        const radBtn = card.querySelector('.rad-btn');
        
        if (radData[classId].completed) {
            card.classList.add('completed');
        } else {
            card.classList.remove('completed');
        }
    }

    // Fechar modal ao clicar fora
    window.onclick = function(event) {
        const modal = document.getElementById('rad-modal');
        if (event.target == modal) {
            closeModal();
        }
    }
</script>

</body>
</html>
