<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Portal</title>
    <style>
        :root {
            --bg-color: #050505;
            --card-bg: #0a0a0a;
            --text-main: #ffffff;
            --text-sec: #a0a0a0;
            --neon-blue: #00f3ff;
            --neon-dim: rgba(0, 243, 255, 0.1);
            --border: 1px solid #333;
            --danger: #ff2a2a;
            --success: #00ff9d;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Courier New', Courier, monospace; }
        
        body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; }

        /* Header */
        header {
            padding: 1.5rem;
            text-align: center;
            border-bottom: 2px solid var(--neon-blue);
            background: #000;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        h1 { font-size: 1.5rem; text-transform: uppercase; letter-spacing: 2px; color: var(--neon-blue); text-shadow: 0 0 10px var(--neon-dim); }

        /* Container */
        .container { max-width: 1200px; margin: 0 auto; padding: 1rem; }

        /* Buttons & Inputs */
        button {
            background: transparent;
            border: 1px solid var(--neon-blue);
            color: var(--neon-blue);
            padding: 0.8rem 1.5rem;
            cursor: pointer;
            text-transform: uppercase;
            font-weight: bold;
            transition: all 0.3s;
            border-radius: 0; /* Sem arredondamento */
            margin: 0.5rem;
        }
        button:hover { background: var(--neon-blue); color: #000; box-shadow: 0 0 15px var(--neon-blue); }
        button.secondary { border-color: var(--text-sec); color: var(--text-sec); }
        button.secondary:hover { background: var(--text-sec); color: #000; box-shadow: none; }
        
        input, select, textarea {
            background: #111;
            border: 1px solid #333;
            color: #fff;
            padding: 0.8rem;
            width: 100%;
            margin-bottom: 1rem;
            border-radius: 0;
        }
        input:focus, select:focus, textarea:focus { outline: none; border-color: var(--neon-blue); }

        /* Teacher Grid */
        .teachers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 1rem;
            margin-top: 2rem;
        }
        .teacher-card {
            background: var(--card-bg);
            border: 1px solid #333;
            padding: 1.5rem;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
            border-radius: 0;
        }
        .teacher-card:hover { border-color: var(--neon-blue); transform: translateY(-2px); }
        .teacher-name { font-weight: bold; font-size: 0.9rem; text-transform: uppercase; }

        /* Action Buttons Area */
        .action-area {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-top: 2rem;
            flex-wrap: wrap;
        }

        /* Screens */
        .screen { display: none; animation: fadeIn 0.4s ease; }
        .screen.active { display: block; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* Schedule View */
        .week-tabs { display: flex; gap: 0.5rem; margin-bottom: 1rem; overflow-x: auto; padding-bottom: 0.5rem; }
        .week-tab { white-space: nowrap; font-size: 0.8rem; padding: 0.5rem 1rem; opacity: 0.6; }
        .week-tab.active { opacity: 1; border-color: var(--neon-blue); background: var(--neon-dim); }

        .day-section { margin-bottom: 2rem; border: 1px solid #333; background: #080808; }
        .day-header {
            background: #111;
            padding: 0.8rem;
            border-bottom: 1px solid var(--neon-blue);
            color: var(--neon-blue);
            font-weight: bold;
            text-transform: uppercase;
        }
        .classes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1rem;
            padding: 1rem;
        }
        .class-card {
            border: 1px solid #333;
            padding: 1rem;
            background: #0f0f0f;
            position: relative;
        }
        .class-card.done { border-color: var(--success); }
        .class-card.no-show { border-color: var(--danger); }
        
        .class-info { font-size: 0.85rem; color: var(--text-sec); margin-bottom: 0.5rem; line-height: 1.4; }
        .class-info strong { color: #fff; }
        .badge { display: inline-block; padding: 2px 6px; border: 1px solid #444; font-size: 0.7rem; margin-right: 4px; }
        .badge-book { border-color: var(--neon-blue); color: var(--neon-blue); }
        
        .status-indicator {
            position: absolute;
            top: 5px;
            right: 5px;
            font-size: 1.2rem;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }
        .modal-content {
            background: #0a0a0a;
            border: 1px solid var(--neon-blue);
            padding: 1.5rem;
            width: 100%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            border-radius: 0;
        }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; border-bottom: 1px solid #333; padding-bottom: 0.5rem; }
        .close-modal { cursor: pointer; color: var(--text-sec); font-size: 1.5rem; }
        .close-modal:hover { color: var(--neon-blue); }

        /* Lesson Plan Specifics */
        .lp-list { list-style: none; }
        .lp-item {
            display: flex;
            align-items: center;
            padding: 0.8rem;
            border: 1px solid #333;
            margin-bottom: 0.5rem;
            background: #0f0f0f;
        }
        .lp-item.completed { border-color: var(--success); background: rgba(0, 255, 157, 0.05); }
        .lp-check { margin-right: 1rem; width: 20px; height: 20px; accent-color: var(--neon-blue); }
        .lp-name-input { flex: 1; margin: 0; padding: 0.5rem; font-size: 0.8rem; border: 1px solid #333; background: #000; }
        .lp-lesson-text { flex: 2; font-size: 0.9rem; color: #ccc; }

        /* Attendance Table */
        .attendance-table-wrapper { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
        th, td { border: 1px solid #333; padding: 0.5rem; text-align: center; }
        th { background: #111; color: var(--neon-blue); }
        td:first-child { text-align: left; position: sticky; left: 0; background: #0a0a0a; min-width: 150px; }
        .att-present { color: var(--success); }
        .att-absent { color: var(--danger); }
        .att-canceled { color: var(--text-sec); }

        /* Loading */
        .loading { text-align: center; padding: 2rem; color: var(--neon-blue); }
    </style>
</head>
<body>

<header>
    <h1>Teacher Portal</h1>
</header>

<div class="container">
    
    <!-- TELA INICIAL -->
    <div id="home-screen" class="screen active">
        <div id="loading" class="loading">Carregando dados...</div>
        
        <div id="teachers-container" style="display:none;">
            <h2 style="text-align:center; margin-bottom:1rem; color:#fff; font-size:1rem;">SELECT TEACHER</h2>
            <div class="teachers-grid" id="teachers-grid"></div>

            <div class="action-area">
                <button onclick="showAttendanceSelector()">📋 Lista de Presença</button>
                <button onclick="showLessonPlanSelector()">📚 Lesson Plan</button>
            </div>
        </div>
    </div>

    <!-- TELA DO PROFESSOR (CRONOGRAMA) -->
    <div id="teacher-screen" class="screen">
        <button class="secondary" onclick="showHome()" style="margin-bottom:1rem;">← Voltar</button>
        <h2 id="teacher-title" style="color:var(--neon-blue); margin-bottom:1rem; text-transform:uppercase;"></h2>
        
        <div class="week-tabs" id="week-tabs"></div>
        <div id="schedule-content"></div>
    </div>

    <!-- TELA DE SELEÇÃO DE TURMA (PRESENÇA / LESSON PLAN) -->
    <div id="selection-screen" class="screen">
        <button class="secondary" onclick="showHome()" style="margin-bottom:1rem;">← Voltar</button>
        <h2 id="selection-title" style="margin-bottom:1rem;"></h2>
        <select id="group-select" onchange="handleGroupSelect()"></select>
        <div id="selection-content"></div>
    </div>

</div>

<!-- MODAL RAD -->
<div id="rad-modal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>RAD - Registro de Aula</h3>
            <span class="close-modal" onclick="closeModal('rad-modal')">&times;</span>
        </div>
        <div id="rad-body"></div>
    </div>
</div>

<!-- MODAL LESSON PLAN (INTERNO DO RAD - TRAVA) -->
<div id="lp-lock-modal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>⚠️ Lesson Plan Obrigatória</h3>
            <span class="close-modal" onclick="closeModal('lp-lock-modal')">&times;</span>
        </div>
        <p style="margin-bottom:1rem; color:#ccc;">Você precisa preencher a Lesson Plan antes de finalizar o RAD.</p>
        <button onclick="forceOpenLP()">Ir para Lesson Plan</button>
    </div>
</div>

<script>
    // CONFIGURAÇÕES
    const SCHEDULE_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQmSAl1ndXXSgDWbrjCiSDkmtECkP94Rr2nk-kIHV-zHd4NFSE9CzyQb6YP2Rt4lEQNYOpuvgjCYDal/pub?output=csv';
    const STUDENTS_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSlWLLO76YOXic0n11ttKL-UKoNGTT3VKEogt3pvHONM4Hnb3upvgYj_h8DOC57xmAobUXSIznc7V6x/pub?output=csv';
    
    // Estrutura simplificada dos Books (1-10)
    const BOOKS_STRUCTURE = {};
    for(let i=1; i<=10; i++) {
        let lessons = [];
        for(let l=1; l<=35; l++) lessons.push(`Lesson ${l}`);
        // Adicionando Revisions e Tests conforme padrão
        lessons.splice(5, 0, `Revision 1-10 / Reading 2`);
        lessons.splice(11, 0, `Revision 26-35 / Reading 5&6`);
        lessons.splice(17, 0, `Revision 51-60 / Reading 8`);
        lessons.splice(23, 0, `Revision 76-85 / Reading 12`);
        lessons.splice(29, 0, `Revision 101-110 / Reading 17`);
        lessons.splice(35, 0, `Revision 126-135 / Reading 21`);
        lessons.push(`Test Book ${i}`, `Test Correction Book ${i}`);
        BOOKS_STRUCTURE[`BOOK ${i}`] = lessons;
    }
    // Mapeamento simples de nomes de livros se vier diferente
    BOOKS_STRUCTURE['G1'] = BOOKS_STRUCTURE['BOOK 1']; 
    BOOKS_STRUCTURE['G2'] = BOOKS_STRUCTURE['BOOK 2'];
    // ... (pode expandir se necessário)

    // ESTADO GLOBAL
    let teachers = ['MYCAEL', 'HOPE', 'PEDRO', 'DIOGO', 'LIVIA', 'TOSCA', 'IAGO', 'SARA', 'CAROL', 'LUISA', 'CARLA'];
    let scheduleData = [];
    let studentsData = {}; // { "Turma Name": ["Aluno 1", "Aluno 2"] }
    let currentWeekData = [];
    let currentTeacher = '';
    let currentClassId = ''; // ID único da aula para salvar RAD/LP

    // CORES DOS TEACHERS
    const TEACHER_COLORS = {
        'MYCAEL': '#FF6B6B', 'HOPE': '#FFE66D', 'PEDRO': '#F38181',
        'DIOGO': '#AA96DA', 'LIVIA': '#FCBAD3', 'TOSCA': '#A8D8EA',
        'IAGO': '#FF9F43', 'SARA': '#54a0ff', 'CAROL': '#5f27cd',
        'LUISA': '#00d2d3', 'CARLA': '#ff9ff3'
    };

    // INICIALIZAÇÃO
    document.addEventListener('DOMContentLoaded', async () => {
        await Promise.all([loadSchedule(), loadStudents()]);
        renderTeachers();
        document.getElementById('loading').style.display = 'none';
        document.getElementById('teachers-container').style.display = 'block';
    });

    async function loadSchedule() {
        try {
            const res = await fetch(SCHEDULE_URL);
            const csv = await res.text();
            parseScheduleCSV(csv);
        } catch (e) { console.error("Erro Schedule", e); }
    }

    async function loadStudents() {
        try {
            const res = await fetch(STUDENTS_URL);
            const csv = await res.text();
            const lines = csv.split('\n').slice(1);
            lines.forEach(line => {
                const [turma, aluno] = line.split(',').map(s => s.trim().replace(/"/g, ''));
                if(turma && aluno) {
                    if(!studentsData[turma]) studentsData[turma] = [];
                    studentsData[turma].push(aluno);
                }
            });
        } catch (e) { console.error("Erro Students", e); }
    }

    function parseScheduleCSV(csv) {
        const lines = csv.split('\n').filter(l => l.trim());
        const headers = lines[0].split(',').map(h => h.trim().replace(/"/g, ''));
        
        // Identificar colunas fixas: A(Lang), B(Book), C(Group), D(Room), E(Mod), F(Time)
        // Dias começam depois. Vamos assumir ordem fixa conforme pedido: A,B,C,D,E,F + Dias
        
        const dayIndices = [];
        headers.forEach((h, idx) => {
            if(idx >= 6) dayIndices.push(idx); // Colunas G em diante são dias
        });

        scheduleData = [];
        for(let i=1; i<lines.length; i++) {
            const row = lines[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(c => c.trim().replace(/^"|"$/g, ''));
            if(row.length < 7) continue;

            const book = row[1] || '';
            const group = row[2] || '';
            const room = row[3] || '';
            const mod = row[4] || '';
            const time = row[5] || '';

            dayIndices.forEach(idx => {
                const cell = row[idx];
                if(cell && cell.includes('-')) {
                    // Formato esperado na célula: "Teacher - OtherInfo" ou apenas "Teacher"
                    // Simplificação: Procurar nome do teacher na string
                    let foundTeacher = null;
                    teachers.forEach(t => {
                        if(cell.toUpperCase().includes(t)) foundTeacher = t;
                    });

                    if(foundTeacher) {
                        scheduleData.push({
                            dayHeader: headers[idx],
                            teacher: foundTeacher,
                            book: book,
                            group: group,
                            room: room,
                            mod: mod,
                            time: time,
                            rawCell: cell
                        });
                    }
                }
            });
        }
    }

    function renderTeachers() {
        const grid = document.getElementById('teachers-grid');
        grid.innerHTML = '';
        teachers.forEach(t => {
            const card = document.createElement('div');
            card.className = 'teacher-card';
            card.style.borderColor = TEACHER_COLORS[t] || '#333';
            card.innerHTML = `<div class="teacher-name" style="color:${TEACHER_COLORS[t] || '#fff'}">${t}</div>`;
            card.onclick = () => openTeacherSchedule(t);
            grid.appendChild(card);
        });
    }

    // NAVEGAÇÃO
    function showHome() {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById('home-screen').classList.add('active');
    }

    function openTeacherSchedule(teacher) {
        currentTeacher = teacher;
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById('teacher-screen').classList.add('active');
        
        const title = document.getElementById('teacher-title');
        title.innerText = `Schedule: ${teacher}`;
        title.style.color = TEACHER_COLORS[teacher] || '#fff';

        renderWeekTabs();
    }

    function renderWeekTabs() {
        // Como simplificamos para ler só a Page 1, vamos agrupar os dados atuais por "Semana" baseada no cabeçalho
        // Se a planilha tem "This Week" e "Next Week" como abas, mas estamos lendo só CSV da ativa...
        // O CSV publicado geralmente é de UMA aba específica. 
        // Para atender o pedido "Botão Próxima Semana", precisamos que o CSV tenha colunas de ambas ou mudemos a URL.
        // ASSUNÇÃO: O usuário vai trocar a URL ou o CSV já vem com colunas de várias semanas mescladas?
        // Vamos assumir que o CSV tem colunas de dias sequenciais. Vamos agrupar por dia da semana (Mon, Tue...).
        
        const daysMap = {
            'Monday': 'Segunda', 'Tuesday': 'Terça', 'Wednesday': 'Quarta', 
            'Thursday': 'Quinta', 'Friday': 'Sexta', 'Saturday': 'Sábado'
        };

        // Filtrar dados do teacher
        const myClasses = scheduleData.filter(d => d.teacher === currentTeacher);
        
        // Agrupar por Dia da Semana (extraindo do header "Monday 25", "Tuesday 26"...)
        const grouped = {};
        const order = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
        
        // Detectar semanas únicas baseadas no número do dia no header se houver, senão trata como uma semana única
        // Simplificação extrema: Mostrar tudo ordenado por dia da semana.
        
        order.forEach(day => {
            const dayClasses = myClasses.filter(c => c.dayHeader.startsWith(day));
            if(dayClasses.length > 0) {
                grouped[day] = dayClasses;
            }
        });

        const tabsContainer = document.getElementById('week-tabs');
        tabsContainer.innerHTML = '';
        
        // Criar aba única "Current Week" já que lemos só uma página
        const tab = document.createElement('div');
        tab.className = 'week-tab active';
        tab.innerText = 'This Week';
        tabsContainer.appendChild(tab);

        renderScheduleGrid(grouped);
    }

    function renderScheduleGrid(groupedData) {
        const container = document.getElementById('schedule-content');
        container.innerHTML = '';

        Object.keys(groupedData).forEach(dayKey => {
            const section = document.createElement('div');
            section.className = 'day-section';
            
            const header = document.createElement('div');
            header.className = 'day-header';
            header.innerText = dayKey;
            section.appendChild(header);

            const grid = document.createElement('div');
            grid.className = 'classes-grid';

            groupedData[dayKey].forEach(cls => {
                const id = `${cls.teacher}-${cls.dayHeader}-${cls.time}-${cls.group}`.replace(/\s/g, '');
                const savedData = getSavedData(id);
                const isDone = savedData && savedData.status === 'Realizada';
                const isNoShow = savedData && savedData.status === 'No Show';

                const card = document.createElement('div');
                card.className = `class-card ${isDone ? 'done' : ''} ${isNoShow ? 'no-show' : ''}`;
                
                let statusIcon = '';
                if(isDone) statusIcon = '<span class="status-indicator">✅</span>';
                if(isNoShow) statusIcon = '<span class="status-indicator">❌</span>';

                card.innerHTML = `
                    ${statusIcon}
                    <div class="class-info"><strong>⏰ ${cls.time}</strong></div>
                    <div class="class-info">
                        <span class="badge badge-book">${cls.book}</span>
                        <span class="badge">${cls.group}</span>
                    </div>
                    <div class="class-info">📍 ${cls.room} | 📚 ${cls.mod}</div>
                    <div style="margin-top:10px; display:flex; gap:5px;">
                        <button style="font-size:0.7rem; padding:0.3rem;" onclick="openLPView('${cls.group}', '${cls.book}', '${id}')">Lesson Plan</button>
                        <button style="font-size:0.7rem; padding:0.3rem;" onclick="openRAD('${id}', '${cls.group}', '${cls.book}')">RAD</button>
                    </div>
                `;
                grid.appendChild(card);
            });
            section.appendChild(grid);
            container.appendChild(section);
        });
    }

    // --- LESSON PLAN GLOBAL (NOVA FUNCIONALIDADE) ---
    function showLessonPlanSelector() {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById('selection-screen').classList.add('active');
        document.getElementById('selection-title').innerText = 'Selecionar Turma (Lesson Plan)';
        
        const select = document.getElementById('group-select');
        select.innerHTML = '<option value="">Selecione a Turma...</option>';
        Object.keys(studentsData).sort().forEach(turma => {
            const opt = document.createElement('option');
            opt.value = turma;
            opt.innerText = turma;
            select.appendChild(opt);
        });
        
        document.getElementById('selection-content').innerHTML = '';
        window.currentSelectionType = 'LESSON_PLAN_GLOBAL';
    }

    function handleGroupSelect() {
        const group = document.getElementById('group-select').value;
        const content = document.getElementById('selection-content');
        content.innerHTML = '';

        if(!group) return;

        if(window.currentSelectionType === 'ATTENDANCE') {
            renderAttendanceTable(group, content);
        } else if (window.currentSelectionType === 'LESSON_PLAN_GLOBAL') {
            renderGlobalLPList(group, content);
        }
    }

    function renderGlobalLPList(group, container) {
        // Buscar histórico de aulas dessa turma para saber o que já foi feito
        // Varre todos os IDs salvos no localStorage que contêm esse grupo
        const history = [];
        for(let i=0; i<localStorage.length; i++) {
            const key = localStorage.key(i);
            if(key.startsWith('rad_') && key.includes(group)) {
                const data = JSON.parse(localStorage.getItem(key));
                if(data.lp && data.lp.lessons && data.lp.lessons.length > 0) {
                    history.push({
                        date: key, // Usando key como proxy de data/aula
                        lessons: data.lp.lessons,
                        teacher: data.lp.teacherName || 'Unknown'
                    });
                }
            }
        }

        if(history.length === 0) {
            container.innerHTML = '<p style="padding:1rem; color:#666;">Nenhuma lesson plan registrada ainda para esta turma.</p>';
            return;
        }

        const list = document.createElement('ul');
        list.className = 'lp-list';
        
        // Ordenar por data (key) decrescente para ver o mais recente primeiro
        history.sort((a,b) => b.date.localeCompare(a.date));

        history.forEach(h => {
            const li = document.createElement('li');
            li.className = 'lp-item completed';
            li.style.flexDirection = 'column';
            li.style.alignItems = 'flex-start';
            
            let lessonsHtml = h.lessons.map(l => `<span class="badge badge-book" style="margin:2px;">${l}</span>`).join('');
            
            li.innerHTML = `
                <div style="width:100%; display:flex; justify-content:space-between; margin-bottom:5px;">
                    <strong style="color:var(--success)">Realizado</strong>
                    <span style="font-size:0.7rem; color:#666;">Por: ${h.teacher}</span>
                </div>
                <div>${lessonsHtml}</div>
            `;
            list.appendChild(li);
        });

        container.appendChild(list);
    }

    // --- LISTA DE PRESENÇA GLOBAL ---
    function showAttendanceSelector() {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById('selection-screen').classList.add('active');
        document.getElementById('selection-title').innerText = 'Selecionar Turma (Presença)';
        
        const select = document.getElementById('group-select');
        select.innerHTML = '<option value="">Selecione a Turma...</option>';
        Object.keys(studentsData).sort().forEach(turma => {
            const opt = document.createElement('option');
            opt.value = turma;
            opt.innerText = turma;
            select.appendChild(opt);
        });

        document.getElementById('selection-content').innerHTML = '';
        window.currentSelectionType = 'ATTENDANCE';
    }

    function renderAttendanceTable(group, container) {
        const students = studentsData[group] || [];
        if(students.length === 0) {
            container.innerHTML = '<p>Nenhum aluno encontrado para esta turma.</p>';
            return;
        }

        // Gerar dias do mês atual (simplificado: 30 dias)
        const today = new Date();
        const daysInMonth = new Date(today.getFullYear(), today.getMonth()+1, 0).getDate();
        
        let html = '<div class="attendance-table-wrapper"><table><thead><tr><th>Aluno</th>';
        for(let d=1; d<=daysInMonth; d++) {
            html += `<th>${d}</th>`;
        }
        html += '</tr></thead><tbody>';

        students.forEach(student => {
            html += `<tr><td>${student}</td>`;
            for(let d=1; d<=daysInMonth; d++) {
                // Checar se existe registro para este dia (aproximação: chave rad_*group*...)
                // Isso é complexo sem data exata no ID. Vamos mostrar apenas placeholder visual ou buscar por pattern solto.
                // Para simplificar: Mostrar tabela vazia pronta para leitura futura ou indicar "Sem dados"
                html += `<td>-</td>`; 
            }
            html += '</tr>';
        });

        html += '</tbody></table></div>';
        html += '<p style="margin-top:1rem; font-size:0.8rem; color:#666;">* Visualização simplificada. Dados detalhados disponíveis no RAD de cada aula.</p>';
        
        container.innerHTML = html;
    }

    // --- RAD & LP LOGIC ---

    function getSavedData(id) {
        const data = localStorage.getItem('rad_' + id);
        return data ? JSON.parse(data) : null;
    }

    function saveData(id, data) {
        localStorage.setItem('rad_' + id, JSON.stringify(data));
    }

    function openLPView(group, book, classId) {
        // Abre modal simples apenas para visualizar/marcar lesson plan rápida (Nova Funcionalidade Home)
        // Ou se chamado do card, abre o fluxo de registro.
        // Vamos reutilizar a lógica de LP mas focada em registrar rápido.
        
        const modal = document.getElementById('rad-modal'); // Reusando modal
        const body = document.getElementById('rad-body');
        
        // Determinar lista de lessons baseada no Book
        let lessonsList = [];
        // Tentar match simples
        for(let key in BOOKS_STRUCTURE) {
            if(book.toUpperCase().includes(key) || key.includes(book.toUpperCase())) {
                lessonsList = BOOKS_STRUCTURE[key];
                break;
            }
        }
        if(lessonsList.length === 0) lessonsList = Array.from({length: 20}, (_, i) => `Lesson ${i+1}`);

        const saved = getSavedData(classId);
        const savedLessons = saved && saved.lp ? saved.lp.lessons : [];
        const savedObs = saved && saved.lp ? saved.lp.observation : '';
        const savedTeacher = saved && saved.lp ? saved.lp.teacherName : '';

        body.innerHTML = `
            <h3 style="color:var(--neon-blue); margin-bottom:1rem;">Lesson Plan: ${group}</h3>
            <p style="margin-bottom:1rem; font-size:0.8rem; color:#aaa;">Marque o que foi realizado e assine.</p>
            
            <div style="max-height:300px; overflow-y:auto; border:1px solid #333; padding:0.5rem; margin-bottom:1rem;">
                ${lessonsList.map((l, idx) => {
                    const isChecked = savedLessons.includes(l) ? 'checked' : '';
                    const nameVal = savedLessons.includes(l) ? savedTeacher : '';
                    return `
                    <div class="lp-item ${isChecked ? 'completed' : ''}">
                        <input type="checkbox" class="lp-check" id="lp_cb_${idx}" ${isChecked} onchange="toggleLPItem(this, '${l}')">
                        <span class="lp-lesson-text">${l}</span>
                        <input type="text" class="lp-name-input" id="lp_nm_${idx}" placeholder="Seu Nome" value="${nameVal}" ${isChecked ? '' : 'disabled'}>
                    </div>`;
                }).join('')}
            </div>

            <textarea id="lp_obs" rows="3" placeholder="Observações da aula..." ${savedObs ? '' : ''}>${savedObs || ''}</textarea>
            
            <button onclick="saveLPOnly('${classId}')">Salvar Lesson Plan</button>
        `;
        
        modal.style.display = 'flex';
        window.currentRadId = classId;
    }

    function toggleLPItem(cb, lesson) {
        const inputName = cb.parentElement.querySelector('.lp-name-input');
        const parent = cb.parentElement;
        if(cb.checked) {
            inputName.disabled = false;
            inputName.focus();
            parent.classList.add('completed');
        } else {
            inputName.disabled = true;
            inputName.value = '';
            parent.classList.remove('completed');
        }
    }

    function saveLPOnly(id) {
        const checkedBoxes = document.querySelectorAll('.lp-check:checked');
        const lessons = [];
        let teacherName = '';
        
        checkedBoxes.forEach(cb => {
            lessons.push(cb.nextElementSibling.innerText); // Pega texto da lesson
            const nameInput = cb.parentElement.querySelector('.lp-name-input');
            if(nameInput.value) teacherName = nameInput.value; // Pega o último nome preenchido
        });

        const obs = document.getElementById('lp_obs').value;

        if(lessons.length === 0) {
            alert('Selecione pelo menos uma lesson.');
            return;
        }
        if(!teacherName) {
            alert('Digite seu nome ao lado da lesson marcada.');
            return;
        }

        // Salvar estrutura parcial
        let data = getSavedData(id) || {};
        data.lp = { lessons, observation: obs, teacherName };
        // Não muda o status da aula para 'Realizada' aqui, só salva o planning
        saveData(id, data);
        
        alert('Lesson Plan salva com sucesso!');
        closeModal('rad-modal');
        if(currentTeacher) openTeacherSchedule(currentTeacher); // Refresh
        else showLessonPlanSelector(); // Refresh se estiver na view global
    }

    function forceOpenLP() {
        closeModal('lp-lock-modal');
        // Abre o modal de LP novamente focado
        // Precisamos recuperar os params do RAD atual. 
        // Simplificação: O usuário clica no botão Lesson Plan do card.
    }

    function openRAD(id, group, book) {
        const saved = getSavedData(id);
        
        // TRAVA: Se não tiver LP salva, bloqueia
        if(!saved || !saved.lp || !saved.lp.lessons || saved.lp.lessons.length === 0) {
            document.getElementById('lp-lock-modal').style.display = 'flex';
            // Hack para saber qual ID abrir quando clicar no botão do modal
            window.pendingRadId = id;
            window.pendingRadGroup = group;
            window.pendingRadBook = book;
            return;
        }

        renderRADModal(id, group, book, saved);
    }

    function renderRADModal(id, group, book, savedData) {
        const modal = document.getElementById('rad-modal');
        const body = document.getElementById('rad-body');
        
        const students = studentsData[group] || [];
        const status = savedData ? savedData.status : '';
        const attendance = savedData ? savedData.attendance : {};

        let studentsHtml = '';
        if(students.length > 0) {
            studentsHtml = '<h4 style="margin:1rem 0 0.5rem; color:#fff;">Lista de Presença</h4><div style="max-height:200px; overflow-y:auto;">';
            students.forEach((stu, idx) => {
                const attStatus = attendance[stu] || 'present';
                studentsHtml += `
                    <div style="display:flex; justify-content:space-between; padding:0.5rem; border-bottom:1px solid #222;">
                        <span>${stu}</span>
                        <select style="width:100px; margin:0; padding:0.2rem; font-size:0.7rem;" onchange="updateAtt('${stu}', this.value)">
                            <option value="present" ${attStatus==='present'?'selected':''}>Presente</option>
                            <option value="absent" ${attStatus==='absent'?'selected':''}>Ausente</option>
                        </select>
                    </div>
                `;
            });
            studentsHtml += '</div>';
        } else {
            studentsHtml = '<p style="color:#666; font-size:0.8rem;">Sem alunos cadastrados para esta turma.</p>';
        }

        body.innerHTML = `
            <h3 style="color:var(--neon-blue);">RAD: ${group}</h3>
            <div style="background:#111; padding:0.5rem; margin:0.5rem 0; border:1px solid #333;">
                <strong>Lesson Realizada:</strong> ${savedData.lp.lessons.join(', ')}<br>
                <strong>Prof:</strong> ${savedData.lp.teacherName}<br>
                <em>Obs: ${savedData.lp.observation || '-'}</em>
            </div>

            ${studentsHtml}

            <h4 style="margin:1rem 0 0.5rem; color:#fff;">Status da Aula</h4>
            <select id="rad-status" style="margin-bottom:1rem;">
                <option value="Realizada" ${status==='Realizada'?'selected':''}>✅ Realizada</option>
                <option value="No Show" ${status==='No Show'?'selected':''}>❌ No Show (Aluno não veio)</option>
                <option value="Cancelada" ${status==='Cancelada'?'selected':''}>⚠️ Cancelada</option>
            </select>

            <button onclick="finalizeRAD('${id}')">SALVAR RAD</button>
        `;

        modal.style.display = 'flex';
        window.currentRadId = id;
    }

    function updateAtt(student, val) {
        // Apenas prepara, salva no final
        const id = window.currentRadId;
        let data = getSavedData(id) || {};
        if(!data.attendance) data.attendance = {};
        data.attendance[student] = val;
        saveData(id, data);
    }

    function finalizeRAD(id) {
        const status = document.getElementById('rad-status').value;
        let data = getSavedData(id) || {};
        data.status = status;
        // Attendance já foi sendo salva no onChange, mas garantimos consistência
        saveData(id, data);
        
        closeModal('rad-modal');
        if(currentTeacher) openTeacherSchedule(currentTeacher);
    }

    function closeModal(modalId) {
        document.getElementById(modalId).style.display = 'none';
    }

    // Fechar modal ao clicar fora
    window.onclick = function(event) {
        if (event.target.classList.contains('modal')) {
            event.target.style.display = "none";
        }
    }
</script>

</body>
</html>
