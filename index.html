<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cronograma de Aulas - Teachers Schedule</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .subtitle {
            font-size: 1.2rem;
            opacity: 0.9;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }

        .card h2 {
            color: #333;
            margin-bottom: 25px;
            text-align: center;
            font-size: 1.8rem;
        }

        .teacher-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .teacher-card {
            padding: 25px;
            border-radius: 12px;
            color: white;
            font-weight: bold;
            font-size: 1.2rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .teacher-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        }

        .schedule-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .btn-back {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .btn-back:hover {
            background: #5568d3;
            transform: translateX(-3px);
        }

        #teacher-name {
            font-size: 2rem;
            color: #333;
        }

        #teacher-color-indicator {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: 3px solid #333;
        }

        .week-info {
            text-align: center;
            margin-bottom: 25px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
            font-weight: bold;
            color: #667eea;
        }

        .schedule-container {
            overflow-x: auto;
            margin-bottom: 30px;
        }

        .schedule-table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        .schedule-table th,
        .schedule-table td {
            padding: 15px 10px;
            text-align: center;
            border: 2px solid #e0e0e0;
            min-width: 120px;
        }

        .schedule-table th {
            background: #667eea;
            color: white;
            font-weight: bold;
            font-size: 1.1rem;
        }

        .time-slot {
            background: #f8f9fa !important;
            font-weight: bold;
            color: #333;
            min-width: 130px;
        }

        .class-cell {
            border-radius: 8px;
            padding: 10px !important;
            color: white;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }

        .class-cell .subject {
            font-weight: bold;
            font-size: 0.95rem;
            margin-bottom: 5px;
        }

        .class-cell .teacher {
            font-size: 0.9rem;
            margin-bottom: 5px;
        }

        .class-cell .room {
            font-size: 0.85rem;
            opacity: 0.9;
        }

        .empty-cell {
            background: #f8f9fa;
            color: #ccc;
            font-size: 1.5rem;
        }

        .legend {
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .legend h3 {
            margin-bottom: 15px;
            color: #333;
        }

        #legend-content {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            background: white;
            padding: 8px 15px;
            border-radius: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .legend-color {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 2px solid #333;
        }

        .legend-name {
            font-weight: bold;
            color: #333;
        }

        .hidden {
            display: none !important;
        }

        #loading {
            text-align: center;
            padding: 50px;
            color: white;
        }

        .spinner {
            border: 5px solid #f3f3f3;
            border-top: 5px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Responsividade */
        @media (max-width: 768px) {
            header h1 {
                font-size: 1.8rem;
            }

            .card {
                padding: 20px;
            }

            .teacher-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 15px;
            }

            .teacher-card {
                padding: 20px;
                font-size: 1rem;
            }

            .schedule-table th,
            .schedule-table td {
                padding: 10px 5px;
                font-size: 0.85rem;
                min-width: 80px;
            }

            .schedule-header {
                flex-direction: column;
                text-align: center;
            }

            #teacher-name {
                font-size: 1.5rem;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
            }

            header h1 {
                font-size: 1.5rem;
            }

            .teacher-grid {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📚 Cronograma de Aulas da Semana</h1>
            <p class="subtitle">Selecione seu nome para ver suas aulas</p>
        </header>

        <!-- Tela de Seleção do Professor -->
        <div id="teacher-selection" class="card">
            <h2>Quem é você?</h2>
            <div class="teacher-grid" id="teacher-grid">
                <!-- Professores serão inseridos via JavaScript -->
            </div>
        </div>

        <!-- Tela do Cronograma -->
        <div id="schedule-view" class="card hidden">
            <div class="schedule-header">
                <button id="back-btn" class="btn-back">← Voltar</button>
                <h2 id="teacher-name"></h2>
                <div id="teacher-color-indicator"></div>
            </div>
            
            <div class="week-info">
                <span id="current-week"></span>
            </div>

            <div class="schedule-container">
                <table class="schedule-table">
                    <thead>
                        <tr>
                            <th>Horário</th>
                            <th>Segunda</th>
                            <th>Terça</th>
                            <th>Quarta</th>
                            <th>Quinta</th>
                            <th>Sexta</th>
                            <th>Sábado</th>
                        </tr>
                    </thead>
                    <tbody id="schedule-body">
                        <!-- Horário das aulas serão inseridos via JavaScript -->
                    </tbody>
                </table>
            </div>

            <div class="legend">
                <h3>Legenda</h3>
                <div id="legend-content"></div>
            </div>
        </div>

        <!-- Loading -->
        <div id="loading" class="hidden">
            <div class="spinner"></div>
            <p>Carregando cronograma...</p>
        </div>
    </div>

    <script>
        // Configuração do Google Sheets - URL pública CSV
        const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQmSAl1ndXXSgDWbrjCiSDkmtECkP94Rr2nk-kIHV-zHd4NFSE9CzyQb6YP2Rt4lEQNYOpuvgjCYDal/pub?output=csv';
        
        // Cores para cada professor (cores vibrantes e distintas)
        const TEACHER_COLORS = {
            'MYCAEL': '#FF6B6B',
            'RAFAEL': '#4ECDC4',
            'HOPE': '#FFE66D',
            'TA': '#95E1D3',
            'PEDRO': '#F38181',
            'DIOGO': '#AA96DA',
            'LIVIA': '#FCBAD3',
            'TOSCA': '#A8D8EA',
            'CANCELLED': '#CCCCCC',
            '/': '#EEEEEE'
        };
        
        // Dias da semana em português
        const DAYS_MAP = {
            'Mon 17TH': 'Segunda',
            'Tue 18TH': 'Terça',
            'Wed 19TH': 'Quarta',
            'Thu 20TH': 'Quinta',
            'Fri 21ST': 'Sexta'
        };
        
        let scheduleData = [];
        let teachers = new Set();
        let selectedTeacher = null;
        let teachersArray = [];
        
        // Elementos do DOM
        const teacherSelectionView = document.getElementById('teacher-selection');
        const scheduleView = document.getElementById('schedule-view');
        const teacherGrid = document.getElementById('teacher-grid');
        const teacherNameEl = document.getElementById('teacher-name');
        const teacherColorIndicator = document.getElementById('teacher-color-indicator');
        const scheduleBody = document.getElementById('schedule-body');
        const currentWeekEl = document.getElementById('current-week');
        const legendContent = document.getElementById('legend-content');
        const backBtn = document.getElementById('back-btn');
        const loadingEl = document.getElementById('loading');
        
        // Inicialização
        document.addEventListener('DOMContentLoaded', () => {
            loadSchedule();
        });
        
        // Função para parsear CSV
        function parseCSV(text) {
            const lines = text.trim().split('\n');
            const result = [];
            
            if (lines.length === 0) return result;
            
            // Cabeçalho
            const headers = lines[0].split(',').map(h => h.trim().replace(/"/g, ''));
            
            for (let i = 1; i < lines.length; i++) {
                const values = [];
                let inQuotes = false;
                let currentValue = '';
                
                for (let char of lines[i]) {
                    if (char === '"') {
                        inQuotes = !inQuotes;
                    } else if (char === ',' && !inQuotes) {
                        values.push(currentValue.trim().replace(/^"|"$/g, ''));
                        currentValue = '';
                    } else {
                        currentValue += char;
                    }
                }
                values.push(currentValue.trim().replace(/^"|"$/g, ''));
                
                const row = {};
                headers.forEach((header, index) => {
                    row[header] = values[index] || '';
                });
                result.push(row);
            }
            
            return result;
        }
        
        // Carregar dados do Google Sheets
        async function loadSchedule() {
            try {
                const response = await fetch(SHEET_CSV_URL);
                const csvText = await response.text();
                scheduleData = parseCSV(csvText);
                
                // Extrair todos os professores únicos
                scheduleData.forEach(row => {
                    Object.keys(DAYS_MAP).forEach(dayKey => {
                        const teacher = row[dayKey]?.trim() || '';
                        if (teacher && teacher !== 'CANCELLED' && teacher !== '/' && teacher !== '') {
                            teachers.add(teacher);
                        }
                    });
                });
                
                renderTeacherCards();
                updateSchedule();
            } catch (error) {
                console.error('Erro ao carregar cronograma:', error);
                document.getElementById('schedule-body').innerHTML = `
                    <tr>
                        <td colspan="7" style="text-align: center; padding: 40px;">
                            Erro ao carregar dados. Verifique sua conexão com a internet.
                        </td>
                    </tr>
                `;
            }
        }
        
        // Renderizar cards dos professores
        function renderTeacherCards() {
            teacherGrid.innerHTML = '';
            teachersArray = Array.from(teachers);
            
            if (teachersArray.length === 0) {
                teacherGrid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #667eea;">Nenhum professor encontrado no cronograma.</p>';
                return;
            }
            
            teachersArray.forEach(teacher => {
                const card = document.createElement('div');
                card.className = 'teacher-card';
                const color = TEACHER_COLORS[teacher] || getRandomColor();
                card.style.backgroundColor = color;
                card.textContent = teacher;
                card.onclick = () => showTeacherSchedule(teacher);
                teacherGrid.appendChild(card);
            });
        }
        
        // Atualizar tabela de horários
        function updateSchedule() {
            if (!selectedTeacher) {
                renderFullSchedule();
            } else {
                renderTeacherSchedule(selectedTeacher);
            }
        }
        
        // Renderizar cronograma completo
        function renderFullSchedule() {
            scheduleBody.innerHTML = '';
            
            scheduleData.forEach(row => {
                const timeSlot = row['⌚'] || row['Horario'] || '';
                if (!timeSlot) return;
                
                const tr = document.createElement('tr');
                
                // Horário
                const timeCell = document.createElement('td');
                timeCell.className = 'time-slot';
                timeCell.textContent = timeSlot;
                tr.appendChild(timeCell);
                
                // Dias da semana
                Object.keys(DAYS_MAP).forEach(dayKey => {
                    const cell = document.createElement('td');
                    const teacher = row[dayKey]?.trim() || '';
                    
                    if (teacher && teacher !== 'CANCELLED' && teacher !== '/') {
                        const group = row['Group'] || '';
                        const room = row['Room'] || '';
                        
                        cell.className = 'class-cell';
                        const color = TEACHER_COLORS[teacher] || '#667eea';
                        cell.style.backgroundColor = color;
                        cell.innerHTML = `
                            <div class="subject">${group}</div>
                            <div class="teacher">${teacher}</div>
                            <div class="room">${room}</div>
                        `;
                    } else if (teacher === 'CANCELLED') {
                        cell.className = 'empty-cell';
                        cell.textContent = 'CANCELLED';
                        cell.style.backgroundColor = '#CCCCCC';
                    } else {
                        cell.className = 'empty-cell';
                        cell.textContent = '-';
                    }
                    
                    tr.appendChild(cell);
                });
                
                scheduleBody.appendChild(tr);
            });
        }
        
        // Renderizar cronograma de um professor específico
        function renderTeacherSchedule(teacherName) {
            scheduleBody.innerHTML = '';
            
            scheduleData.forEach(row => {
                const timeSlot = row['⌚'] || row['Horario'] || '';
                if (!timeSlot) return;
                
                const tr = document.createElement('tr');
                
                // Horário
                const timeCell = document.createElement('td');
                timeCell.className = 'time-slot';
                timeCell.textContent = timeSlot;
                tr.appendChild(timeCell);
                
                // Dias da semana
                Object.keys(DAYS_MAP).forEach(dayKey => {
                    const cell = document.createElement('td');
                    const teacher = row[dayKey]?.trim() || '';
                    
                    if (teacher === teacherName) {
                        const group = row['Group'] || '';
                        const room = row['Room'] || '';
                        
                        cell.className = 'class-cell';
                        const color = TEACHER_COLORS[teacherName] || '#667eea';
                        cell.style.backgroundColor = color;
                        cell.innerHTML = `
                            <div class="subject">${group}</div>
                            <div class="teacher">${teacherName}</div>
                            <div class="room">${room}</div>
                        `;
                    } else {
                        cell.className = 'empty-cell';
                        cell.textContent = '-';
                    }
                    
                    tr.appendChild(cell);
                });
                
                scheduleBody.appendChild(tr);
            });
        }
        
        // Mostrar cronograma do professor
        function showTeacherSchedule(teacherName) {
            selectedTeacher = teacherName;
            const color = TEACHER_COLORS[teacherName] || '#667eea';
            
            teacherNameEl.textContent = teacherName;
            teacherNameEl.style.color = color;
            teacherColorIndicator.style.backgroundColor = color;
            
            // Atualizar informação da semana
            const weekInfo = getWeekInfo();
            currentWeekEl.textContent = `Semana de ${weekInfo.start} a ${weekInfo.end}`;
            
            // Renderizar tabela de horários
            renderTeacherSchedule(teacherName);
            
            // Renderizar legenda
            renderLegend();
            
            // Trocar visualização
            teacherSelectionView.classList.add('hidden');
            scheduleView.classList.remove('hidden');
        }
        
        // Renderizar legenda
        function renderLegend() {
            legendContent.innerHTML = '';
            
            teachersArray.forEach(teacher => {
                const item = document.createElement('div');
                item.className = 'legend-item';
                const color = TEACHER_COLORS[teacher] || '#667eea';
                item.innerHTML = `
                    <div class="legend-color" style="background-color: ${color}"></div>
                    <span class="legend-name">${teacher}</span>
                `;
                legendContent.appendChild(item);
            });
        }
        
        // Gerar cor aleatória
        function getRandomColor() {
            const colors = ['#FF6B6B', '#4ECDC4', '#45B7D1', '#96CEB4', '#FFEAA7', 
                            '#DDA0DD', '#98D8C8', '#F7DC6F', '#BB8FCE', '#85C1E9'];
            return colors[Math.floor(Math.random() * colors.length)];
        }
        
        // Obter informações da semana atual
        function getWeekInfo() {
            const now = new Date();
            const dayOfWeek = now.getDay();
            const diff = now.getDate() - dayOfWeek + (dayOfWeek === 0 ? -6 : 1);
            
            const startOfWeek = new Date(now.setDate(diff));
            const endOfWeek = new Date(now.setDate(diff + 5));
            
            const options = { day: '2-digit', month: '2-digit' };
            return {
                start: startOfWeek.toLocaleDateString('pt-BR', options),
                end: endOfWeek.toLocaleDateString('pt-BR', options)
            };
        }
        
        // Voltar para seleção
        backBtn.addEventListener('click', () => {
            selectedTeacher = null;
            scheduleView.classList.add('hidden');
            teacherSelectionView.classList.remove('hidden');
        });
        
        // Mostrar/ocultar loading
        function showLoading(show) {
            if (show) {
                loadingEl.classList.remove('hidden');
                teacherSelectionView.classList.add('hidden');
                scheduleView.classList.add('hidden');
            } else {
                loadingEl.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
