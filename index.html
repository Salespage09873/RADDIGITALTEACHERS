<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cronograma Semanal - Escola</title>
    <style>
        :root {
            --bg-color: #050505;
            --card-bg: #121212;
            --text-main: #ffffff;
            --text-sec: #a0a0a0;
            --accent: #00f3ff; /* Azul Neon */
            --accent-dim: rgba(0, 243, 255, 0.1);
            --border: #333;
            --danger: #ff4757;
            --success: #2ed573;
            --warning: #ffa502;
            --font-main: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; -webkit-tap-highlight-color: transparent; }
        
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-main);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-color); }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

        header {
            background: linear-gradient(180deg, #0a0a0a 0%, var(--bg-color) 100%);
            padding: 1.5rem 1rem;
            text-align: center;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        h1 { font-size: 1.5rem; font-weight: 300; letter-spacing: 2px; text-transform: uppercase; color: var(--accent); margin-bottom: 0.5rem; }
        p.subtitle { font-size: 0.9rem; color: var(--text-sec); }

        .container { max-width: 1200px; margin: 0 auto; padding: 1rem; }

        /* Loading & Error */
        .status-msg { text-align: center; padding: 2rem; color: var(--text-sec); }
        .error-msg { color: var(--danger); background: rgba(255, 71, 87, 0.1); padding: 1rem; border-radius: 4px; margin-top: 1rem; display: none; border: 1px solid var(--danger); }

        /* Teacher Grid */
        .teachers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .teacher-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 2px; /* Less rounded */
            padding: 1.5rem 1rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100px;
        }

        .teacher-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 3px;
            background: currentColor;
            opacity: 0.5;
        }

        .teacher-card:hover {
            transform: translateY(-3px);
            border-color: var(--accent);
            box-shadow: 0 5px 15px rgba(0, 243, 255, 0.15);
        }

        .teacher-name { font-size: 1.1rem; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; color: var(--text-main); }
        .teacher-status { font-size: 0.75rem; color: var(--text-sec); margin-top: 0.5rem; }

        /* Buttons Global */
        .btn-global {
            background: transparent;
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 0.8rem 1.5rem;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s;
            border-radius: 2px;
            margin-top: 2rem;
            width: 100%;
            max-width: 300px;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }
        .btn-global:hover { background: var(--accent); color: #000; box-shadow: 0 0 15px var(--accent); }

        /* Screens */
        .screen { display: none; animation: fadeIn 0.4s ease; }
        .screen.active { display: block; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Teacher Profile Header */
        .profile-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border);
        }
        .back-btn {
            background: none; border: none; color: var(--text-sec);
            font-size: 1rem; cursor: pointer; display: flex; align-items: center; gap: 0.5rem;
            transition: color 0.3s;
        }
        .back-btn:hover { color: var(--accent); }
        .teacher-title { font-size: 1.8rem; font-weight: 300; color: var(--text-main); text-transform: uppercase; }

        /* Week Tabs */
        .week-tabs {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
            overflow-x: auto;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--border);
        }
        .week-tab {
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text-sec);
            padding: 0.6rem 1.2rem;
            white-space: nowrap;
            cursor: pointer;
            font-size: 0.85rem;
            text-transform: uppercase;
            border-radius: 2px;
            transition: all 0.3s;
        }
        .week-tab.active {
            background: var(--accent);
            color: #000;
            border-color: var(--accent);
            font-weight: bold;
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.3);
        }

        /* Schedule Days */
        .days-container { display: flex; flex-direction: column; gap: 1.5rem; }
        .day-section {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 2px;
            overflow: hidden;
        }
        .day-header {
            background: rgba(255,255,255,0.03);
            padding: 0.8rem 1rem;
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
        }
        .classes-list {
            padding: 1rem;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1rem;
        }

        /* Class Card */
        .class-card {
            background: #0f0f0f;
            border: 1px solid #222;
            border-left: 3px solid var(--accent);
            padding: 1rem;
            border-radius: 2px;
            position: relative;
            transition: transform 0.2s;
        }
        .class-card:hover { transform: translateX(3px); border-color: #333; }
        .class-card.completed { border-left-color: var(--success); opacity: 0.8; }
        .class-card.cancelled { border-left-color: var(--danger); opacity: 0.6; }
        .class-card.noshow { border-left-color: var(--warning); }

        .class-time { font-size: 1.1rem; font-weight: bold; color: var(--text-main); margin-bottom: 0.5rem; display: block; }
        .class-info { font-size: 0.85rem; color: var(--text-sec); margin-bottom: 0.3rem; }
        .class-label { color: var(--accent); font-size: 0.7rem; text-transform: uppercase; margin-right: 0.3rem; }
        
        .badges { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0.5rem 0; }
        .badge {
            font-size: 0.7rem; padding: 0.2rem 0.5rem; border-radius: 2px;
            text-transform: uppercase; font-weight: bold; letter-spacing: 0.5px;
        }
        .badge-group { background: rgba(0, 243, 255, 0.1); color: var(--accent); border: 1px solid rgba(0, 243, 255, 0.3); }
        .badge-book { background: rgba(255, 165, 2, 0.1); color: var(--warning); border: 1px solid rgba(255, 165, 2, 0.3); }
        .badge-room { background: rgba(46, 213, 115, 0.1); color: var(--success); border: 1px solid rgba(46, 213, 115, 0.3); }
        .badge-mod { background: rgba(255, 255, 255, 0.1); color: #fff; border: 1px solid #333; }

        .action-row { display: flex; gap: 0.5rem; margin-top: 0.8rem; }
        .btn-sm {
            flex: 1; padding: 0.4rem; font-size: 0.7rem; border: 1px solid #333;
            background: #1a1a1a; color: var(--text-sec); cursor: pointer;
            border-radius: 2px; text-transform: uppercase; transition: all 0.2s;
        }
        .btn-sm:hover { background: #333; color: #fff; }
        .btn-rad { border-color: var(--accent); color: var(--accent); }
        .btn-rad:hover { background: var(--accent); color: #000; }
        .btn-check { border-color: var(--success); color: var(--success); }
        .btn-check.done { background: var(--success); color: #000; }

        /* Modals */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 1000;
            display: none; justify-content: center; align-items: center;
            backdrop-filter: blur(5px);
        }
        .modal-overlay.open { display: flex; animation: fadeIn 0.3s; }
        .modal-content {
            background: var(--card-bg); border: 1px solid var(--border);
            width: 95%; max-width: 500px; max-height: 90vh;
            overflow-y: auto; border-radius: 4px;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            display: flex; flex-direction: column;
        }
        .modal-header {
            padding: 1rem; border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center;
            background: #0a0a0a; position: sticky; top: 0; z-index: 10;
        }
        .modal-title { font-size: 1.1rem; color: var(--accent); text-transform: uppercase; }
        .close-modal { background: none; border: none; color: #fff; font-size: 1.5rem; cursor: pointer; }
        .modal-body { padding: 1.5rem; }
        
        /* Form Elements */
        .form-group { margin-bottom: 1.2rem; }
        .form-label { display: block; font-size: 0.8rem; color: var(--text-sec); margin-bottom: 0.5rem; text-transform: uppercase; }
        .form-control {
            width: 100%; padding: 0.8rem; background: #0a0a0a;
            border: 1px solid #333; color: #fff; border-radius: 2px;
            font-family: inherit; font-size: 0.9rem;
        }
        .form-control:focus { border-color: var(--accent); }
        
        .checkbox-list { max-height: 200px; overflow-y: auto; border: 1px solid #333; padding: 0.5rem; background: #0a0a0a; }
        .checkbox-item {
            display: flex; align-items: center; padding: 0.5rem;
            border-bottom: 1px solid #1a1a1a; font-size: 0.85rem;
        }
        .checkbox-item:last-child { border-bottom: none; }
        .checkbox-item input { margin-right: 0.8rem; accent-color: var(--accent); }
        
        .student-list { max-height: 300px; overflow-y: auto; }
        .student-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 0.6rem 0; border-bottom: 1px solid #222;
        }
        .student-name { font-size: 0.9rem; }
        .status-select {
            background: #0a0a0a; border: 1px solid #333; color: #fff;
            padding: 0.3rem; font-size: 0.75rem; border-radius: 2px;
        }

        .btn-save {
            width: 100%; padding: 1rem; background: var(--accent);
            color: #000; border: none; font-weight: bold;
            text-transform: uppercase; cursor: pointer; margin-top: 1rem;
            border-radius: 2px; font-size: 1rem;
        }
        .btn-clear {
            width: 100%; padding: 0.8rem; background: transparent;
            color: var(--danger); border: 1px solid var(--danger);
            cursor: pointer; margin-top: 0.5rem; border-radius: 2px;
            text-transform: uppercase; font-size: 0.8rem;
        }

        /* Attendance View */
        .attendance-controls { display: flex; gap: 1rem; margin-bottom: 1rem; flex-wrap: wrap; }
        .attendance-table-wrapper { overflow-x: auto; }
        .attendance-table { width: 100%; border-collapse: collapse; min-width: 600px; }
        .attendance-table th, .attendance-table td {
            border: 1px solid #333; padding: 0.6rem; text-align: center; font-size: 0.85rem;
        }
        .attendance-table th { background: #0a0a0a; color: var(--accent); text-transform: uppercase; }
        .attendance-table td:first-child { text-align: left; position: sticky; left: 0; background: var(--card-bg); font-weight: bold; }
        .att-cell { cursor: pointer; user-select: none; }
        .att-P { color: var(--success); font-weight: bold; }
        .att-A { color: var(--danger); }
        .att-C { color: var(--text-sec); text-decoration: line-through; }

        /* Calculator Tab inside Teacher Profile */
        .calc-stats {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; margin-top: 1rem;
        }
        .stat-card {
            background: #0a0a0a; border: 1px solid #333; padding: 1rem;
            text-align: center; border-radius: 2px;
        }
        .stat-val { font-size: 1.5rem; font-weight: bold; color: var(--accent); display: block; }
        .stat-label { font-size: 0.7rem; text-transform: uppercase; color: var(--text-sec); }

        /* Mobile Adjustments */
        @media (max-width: 600px) {
            .teachers-grid { grid-template-columns: repeat(2, 1fr); }
            .class-card { margin-bottom: 0.5rem; }
            .modal-content { width: 100%; height: 100%; max-height: 100%; border: none; border-radius: 0; }
            .profile-header { flex-direction: column; align-items: flex-start; gap: 1rem; }
            .week-tabs { justify-content: flex-start; }
        }
    </style>
</head>
<body>

<header>
    <h1>School System</h1>
    <p class="subtitle">Cronograma & Gestão de Aulas</p>
</header>

<div class="container">
    
    <!-- TELA INICIAL -->
    <div id="screen-home" class="screen active">
        <div id="loading" class="status-msg">Carregando dados...</div>
        <div id="error-box" class="error-msg"></div>
        
        <div id="teachers-grid" class="teachers-grid"></div>
        
        <button class="btn-global" onclick="showAttendanceScreen()">📋 Lista de Presença Geral</button>
    </div>

    <!-- TELA DO PROFESSOR -->
    <div id="screen-teacher" class="screen">
        <div class="profile-header">
            <button class="back-btn" onclick="goHome()">← Voltar</button>
            <h2 id="teacher-name-display" class="teacher-title">Nome do Teacher</h2>
            <div style="width: 60px;"></div> <!-- Spacer for centering -->
        </div>

        <!-- Abas de Semana -->
        <div id="week-tabs-container" class="week-tabs"></div>

        <!-- Conteúdo do Cronograma -->
        <div id="schedule-content" class="days-container"></div>
        
        <!-- Calculadora (Aba interna) -->
        <div id="calculator-section" style="margin-top: 3rem; display:none;">
            <h3 style="color:var(--accent); border-bottom:1px solid #333; padding-bottom:0.5rem; margin-bottom:1rem;">CLASS CALCULATOR (<span id="calc-month-display"></span>)</h3>
            <div class="calc-stats">
                <div class="stat-card">
                    <span class="stat-val" id="stat-school-done">0</span>
                    <span class="stat-label">Escola (Realizadas)</span>
                </div>
                <div class="stat-card">
                    <span class="stat-val" id="stat-in-company-done">0</span>
                    <span class="stat-label">In Company (Realizadas)</span>
                </div>
                <div class="stat-card">
                    <span class="stat-val" id="stat-school-noshow">0</span>
                    <span class="stat-label">Escola (No Show)</span>
                </div>
                <div class="stat-card">
                    <span class="stat-val" id="stat-in-company-noshow">0</span>
                    <span class="stat-label">In Company (No Show)</span>
                </div>
            </div>
        </div>
    </div>

    <!-- TELA DE PRESENÇA GERAL -->
    <div id="screen-attendance" class="screen">
        <div class="profile-header">
            <button class="back-btn" onclick="goHome()">← Voltar</button>
            <h2 class="teacher-title">Lista de Presença</h2>
            <div style="width: 60px;"></div>
        </div>
        
        <div class="attendance-controls">
            <select id="att-group-select" class="form-control" onchange="renderAttendanceTable()">
                <option value="">Selecione a Turma...</option>
            </select>
            <input type="month" id="att-date-select" class="form-control" onchange="renderAttendanceTable()">
        </div>

        <div id="attendance-table-container" class="attendance-table-wrapper">
            <table class="attendance-table">
                <thead>
                    <tr id="att-table-head"><th>Aluno</th></tr>
                </thead>
                <tbody id="att-table-body"></tbody>
            </table>
        </div>
    </div>

</div>

<!-- MODAL RAD -->
<div id="modal-rad" class="modal-overlay">
    <div class="modal-content">
        <div class="modal-header">
            <span class="modal-title">RAD - Registro de Aula</span>
            <button class="close-modal" onclick="closeModal('modal-rad')">&times;</button>
        </div>
        <div class="modal-body">
            <div class="form-group">
                <label class="form-label">Status da Aula</label>
                <select id="rad-status" class="form-control">
                    <option value="realized">Realizada</option>
                    <option value="cancelled">Cancelada</option>
                    <option value="noshow">No Show</option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label">Lesson Plan (Selecione o que foi feito)</label>
                <div id="rad-lesson-plan" class="checkbox-list">
                    <!-- Preenchido via JS -->
                </div>
                <div style="margin-top:0.5rem; font-size:0.75rem; color:var(--text-sec);">
                    Última aula registrada: <span id="rad-last-lesson" style="color:var(--accent)">Nenhuma</span>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Lista de Presença</label>
                <div id="rad-students" class="student-list">
                    <!-- Alunos carregados aqui -->
                </div>
            </div>

            <button class="btn-save" onclick="saveRAD()">Salvar Registro</button>
            <button class="btn-clear" onclick="clearRAD()">Limpar RAD</button>
        </div>
    </div>
</div>

<script>
    // CONFIGURAÇÕES
    const SCHEDULE_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQmSAl1ndXXSgDWbrjCiSDkmtECkP94Rr2nk-kIHV-zHd4NFSE9CzyQb6YP2Rt4lEQNYOpuvgjCYDal/pub?output=csv';
    const STUDENTS_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSlWLLO76YOXic0n11ttKL-UKoNGTT3VKEogt3pvHONM4Hnb3upvgYj_h8DOC57xmAobUXSIznc7V6x/pub?output=csv';

    // PROFESSORES VÁLIDOS
    const VALID_TEACHERS = [
        { name: 'MYCAEL', color: '#FF6B6B' }, { name: 'HOPE', color: '#FFE66D' },
        { name: 'PEDRO', color: '#F38181' }, { name: 'DIOGO', color: '#AA96DA' },
        { name: 'LIVIA', color: '#FCBAD3' }, { name: 'TOSCA', color: '#A8D8EA' },
        { name: 'IAGO', color: '#FF9F43' }, { name: 'SARA', color: '#54a0ff' },
        { name: 'CAROL', color: '#5f27cd' }, { name: 'CARLA', color: '#00d2d3' },
        { name: 'LUISA', color: '#ff9ff3' }
    ];

    // ESTRUTURA DOS BOOKS (LESSONS)
    const BOOK_STRUCTURE = {
        'G1': Array.from({length: 42}, (_, i) => i < 41 ? `Lesson ${i+1}` : 'Test Book 1'), // Simplificado para exemplo
        'G2': Array.from({length: 46}, (_, i) => {
            if(i===5 || i===11 || i===17 || i===23 || i===29 || i===35) return `Revision ${i*2}-${i*2+15}`;
            if(i===44) return 'Test Correction Book 2';
            if(i===45) return 'Test Book 2';
            return `Lesson ${i+1}`;
        }),
        'DEFAULT': Array.from({length: 46}, (_, i) => `Lesson ${i+1}`)
    };
    // Gerar estrutura genérica para todos os books G1-G10 baseado no prompt
    function getBookLessons(bookName) {
        // Lógica simplificada: retorna array de lessons baseado no número do book se possível, ou default
        // Para este código, vou usar um gerador dinâmico baseado no padrão descrito
        let lessons = [];
        for(let i=1; i<=35; i++) lessons.push(`Lesson ${i}`);
        // Inserindo Revisions nos pontos chave (aproximado conforme prompt)
        lessons.splice(5, 0, "Revision 1-10 / Reading 2");
        lessons.splice(11, 0, "Revision 26-35 / Reading 5&6");
        lessons.splice(17, 0, "Revision 51-60 / Reading 8");
        lessons.splice(23, 0, "Revision 76-85 / Reading 12");
        lessons.splice(29, 0, "Revision 101-110 / Reading 17");
        lessons.splice(35, 0, "Revision 126-135 / Reading 21");
        // Finais
        lessons.push("Revision 86-100 / Reading 18");
        lessons.push("Revision 111-120 / Reading 14");
        lessons.push("Revision 136-145 / Reading 9");
        lessons.push(`Test Book ${bookName.replace('G','')}`);
        lessons.push(`Test Correction Book ${bookName.replace('G','')}`);
        return lessons;
    }

    let allClasses = [];
    let studentsDB = {}; // Mapa: NomeDaTurma -> [Lista de Alunos]
    let currentTeacher = null;
    let currentWeekData = [];
    let activeWeekName = '';
    let radCurrentClassId = null;

    // INICIALIZAÇÃO
    document.addEventListener('DOMContentLoaded', () => {
        Promise.all([fetch(SCHEDULE_URL), fetch(STUDENTS_URL)])
            .then(([res1, res2]) => Promise.all([res1.text(), res2.text()]))
            .then(([csvSchedule, csvStudents]) => {
                parseStudents(csvStudents);
                parseSchedule(csvSchedule);
                renderTeachers();
                document.getElementById('loading').style.display = 'none';
                
                // Set default month to current
                const now = new Date();
                document.getElementById('att-date-select').value = now.toISOString().slice(0, 7);
            })
            .catch(err => {
                console.error(err);
                document.getElementById('loading').style.display = 'none';
                const errBox = document.getElementById('error-box');
                errBox.style.display = 'block';
                errBox.textContent = "Erro ao carregar planilhas. Verifique sua conexão.";
            });
    });

    // PARSE ALUNOS
    function parseStudents(csv) {
        const lines = csv.split('\n').slice(1); // Skip header
        lines.forEach(line => {
            const parts = line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/); // CSV split safe
            if(parts.length >= 2) {
                let group = parts[0].trim().replace(/"/g, '').toUpperCase();
                let name = parts[1].trim().replace(/"/g, '');
                if(group && name) {
                    if(!studentsDB[group]) studentsDB[group] = [];
                    studentsDB[group].push(name);
                }
            }
        });
        populateGroupSelect();
    }

    function populateGroupSelect() {
        const sel = document.getElementById('att-group-select');
        sel.innerHTML = '<option value="">Selecione a Turma...</option>';
        Object.keys(studentsDB).sort().forEach(g => {
            const opt = document.createElement('option');
            opt.value = g;
            opt.textContent = g;
            sel.appendChild(opt);
        });
    }

    // PARSE CRONOGRAMA (LÓGICA ROBUSTA DE DATAS E SEMANAS)
    function parseSchedule(csv) {
        const lines = csv.split('\n').map(l => l.trim()).filter(l => l);
        if(lines.length < 2) return;

        // Cabeçalhos
        const headers = lines[0].split(',').map(h => h.trim().replace(/"/g, ''));
        
        // Identificar colunas de Data (procura por padrões de data ou nomes de dias com números)
        // Estrutura esperada: A(Lang), B(Book), C(Group), D(Room), E(Mod), F(Time), G..K(Days)
        // Mas o usuário disse que nomeou as ABAS do sheets como "This Week", "Next Week".
        // O CSV pub?output=csv de um sheet com múltiplas abas geralmente publica apenas a aba ativa OU todas concatenadas?
        // NA VERDADE: pub?output=csv publica APENAS a aba visível/ativa no momento da geração do link se não especificado gid.
        // SE o link tem &gid=XXXX, ele pega aquela aba específica.
        // PARA FUNCIONAR COM "THIS WEEK" E "NEXT WEEK" AUTOMÁTICO:
        // Precisamos assumir que o usuário vai trocar o GID na URL ou que o CSV vem com cabeçalhos repetidos?
        // SOLUÇÃO MELHOR PARA ESTE CASO: O usuário disse "troquei o nome das páginas... para ficar mais fácil".
        // Se ele publicou a planilha inteira como CSV, o Google Sheets NÃO faz isso nativamente em um único CSV limpo separando por abas.
        // Ele publica a aba selecionada.
        // ESTRATÉGIA ADOTADA: Vamos assumir que o CSV contém as colunas de data no topo.
        // Se houver múltiplas semanas no mesmo CSV (colunas extras), detectamos pelas datas.
        // Se o usuário quiser alternar entre abas do Sheet, ele precisaria de 2 URLs ou um script.
        // MAS, o pedido foi: "reconheça automaticamente".
        // Vou implementar a detecção de colunas de data no CSV. Se tiver colunas "Mon 25", "Tue 26"...
        // E agrupar por semana baseada na data.

        const dayCols = [];
        headers.forEach((h, idx) => {
            // Detecta se é coluna de dia (ex: "Monday 25", "Mon", etc)
            if(h.match(/mon|tue|wed|thu|fri|sat|sun/i) && idx > 5) {
                dayCols.push({ index: idx, header: h });
            }
        });

        if(dayCols.length === 0) {
            // Fallback: assume colunas G a K (indices 6 a 10) se não detectar nomes
            for(let i=6; i<=10; i++) {
                if(headers[i]) dayCols.push({ index: i, header: headers[i] });
            }
        }

        // Agrupar colunas por Semana
        // Vamos extrair a data do header se possível, senão assumir ordem
        let weeks = {}; // "August Week 4" -> [cols]
        
        // Lógica simples: O usuário disse que nomeou as abas. 
        // Como o CSV é plano, vamos assumir que as colunas estão em ordem cronológica.
        // Vamos criar semanas baseadas na continuidade das datas nos headers.
        // Se o header for "This Week", tratamos como uma semana.
        
        // SIMPLIFICAÇÃO: Vamos tratar TODAS as colunas de dia encontradas como uma única linha do tempo
        // e depois dividir em "Semanas" no front-end baseado na data extraída do header.
        
        allClasses = [];

        for(let i=1; i<lines.length; i++) {
            const row = lines[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(c => c.trim().replace(/^"|"$/g, '').replace(/<.*?>/g, ''));
            
            const book = row[1] || '';
            const groupRaw = row[2] || '';
            const room = row[3] || '';
            const mod = row[4] || '';
            const time = row[5] || '';

            if(!time) continue;

            // Processar cada coluna de dia
            dayCols.forEach(col => {
                const cell = row[col.index];
                if(!cell) return;

                // Extrair Professor
                const teacherName = findTeacher(cell);
                if(!teacherName) return;

                // Extrair dados da turma
                const { groupName, bookName, modalName } = parseGroupInfo(groupRaw, mod, book);

                // Extrair Data do Header da Coluna para determinar a Semana
                // Ex Header: "Monday 25", "This Week" (não tem data direta aqui se for nome de aba)
                // PROBLEMA: No CSV flat, perdemos o nome da aba "This Week".
                // SOLUÇÃO: O usuário deve garantir que o Cabeçalho da Coluna tenha a data.
                // Ex: "Mon 25/08".
                // Se o header for apenas "Monday", assumimos a data atual? Não, perigoso.
                // Vamos assumir que o cabeçalho tem a data. Se não tiver, usamos a data de "Hoje" como referência relativa?
                // Melhor: Vamos usar a data de hoje + offset da coluna? Não funciona para "Next Week".
                // HIPÓTESE: O usuário colocou a data no cabeçalho da coluna no Sheets.
                
                let weekKey = "Current Week";
                const dateMatch = col.header.match(/(\d{1,2})[/\-](\d{1,2})/); // Procura 25/08
                if(dateMatch) {
                    const day = parseInt(dateMatch[1]);
                    const month = parseInt(dateMatch[2]);
                    // Determinar mês e semana
                    const monthName = new Date(2023, month-1, 1).toLocaleString('en-US', { month: 'long' });
                    const weekNum = Math.ceil(day / 7);
                    weekKey = `${monthName} Week ${weekNum}`;
                } else if (col.header.toLowerCase().includes('this')) {
                    // Fallback se não tiver data mas disser "This"
                    const now = new Date();
                    const monthName = now.toLocaleString('en-US', { month: 'long' });
                    // Calc semana aproximada
                    const weekNum = Math.ceil(now.getDate() / 7);
                    weekKey = `${monthName} Week ${weekNum}`;
                } else if (col.header.toLowerCase().includes('next')) {
                     const now = new Date();
                     // Proximo mes ou proxima semana? Vamos simplificar
                     const nextWeek = new Date(now);
                     nextWeek.setDate(now.getDate() + 7);
                     const monthName = nextWeek.toLocaleString('en-US', { month: 'long' });
                     const weekNum = Math.ceil(nextWeek.getDate() / 7);
                     weekKey = `${monthName} Week ${weekNum}`;
                }

                // Ordenação dos dias dentro da semana
                let dayOrder = 0;
                if(col.header.match(/mon/i)) dayOrder = 1;
                else if(col.header.match(/tue/i)) dayOrder = 2;
                else if(col.header.match(/wed/i)) dayOrder = 3;
                else if(col.header.match(/thu/i)) dayOrder = 4;
                else if(col.header.match(/fri/i)) dayOrder = 5;
                else if(col.header.match(/sat/i)) dayOrder = 6;

                allClasses.push({
                    id: `cls_${teacherName}_${weekKey}_${dayOrder}_${time}_${groupName}`,
                    teacher: teacherName,
                    weekKey: weekKey,
                    dayOrder: dayOrder,
                    dayName: col.header.split(' ')[0], // Pega só "Mon"
                    time: time,
                    group: groupName,
                    book: bookName,
                    modal: modalName,
                    room: room,
                    rawGroup: groupRaw
                });
            });
        }
    }

    function findTeacher(str) {
        str = str.toUpperCase();
        for(const t of VALID_TEACHERS) {
            if(str.includes(t.name)) return t.name;
        }
        return null;
    }

    function parseGroupInfo(raw, mod, bookCol) {
        let g = raw.toUpperCase();
        let b = bookCol.trim().toUpperCase();
        let m = mod.trim().toUpperCase();
        
        // Limpeza
        if(!b && g.match(/G\d/)) {
            const match = g.match(/(G\d)/);
            if(match) { b = match[1]; g = g.replace(match[1], '').trim(); }
        }
        
        return { groupName: g || 'Unknown', bookName: b, modalName: m };
    }

    // RENDERIZADORES
    function renderTeachers() {
        const grid = document.getElementById('teachers-grid');
        grid.innerHTML = '';
        VALID_TEACHERS.sort((a,b) => a.name.localeCompare(b.name)).forEach(t => {
            const hasClass = allClasses.some(c => c.teacher === t.name);
            const div = document.createElement('div');
            div.className = 'teacher-card';
            div.style.color = t.color;
            div.innerHTML = `
                <div class="teacher-name">${t.name}</div>
                <div class="teacher-status">${hasClass ? 'Ver Agenda' : 'Sem aulas'}</div>
            `;
            div.onclick = () => openTeacherProfile(t.name, t.color);
            grid.appendChild(div);
        });
    }

    function openTeacherProfile(name, color) {
        currentTeacher = { name, color };
        document.getElementById('screen-home').classList.remove('active');
        document.getElementById('screen-attendance').classList.remove('active');
        document.getElementById('screen-teacher').classList.add('active');
        
        document.getElementById('teacher-name-display').textContent = name;
        document.getElementById('teacher-name-display').style.color = color;
        document.getElementById('calculator-section').style.display = 'none';

        renderWeekTabs();
    }

    function renderWeekTabs() {
        // Extrair semanas únicas e ordenar
        const weeks = [...new Set(allClasses.filter(c => c.teacher === currentTeacher.name).map(c => c.weekKey))];
        // Ordenação simples de strings "August Week 4", "September Week 1"
        weeks.sort((a,b) => {
            const mA = a.split(' ')[0];
            const mB = b.split(' ')[0];
            const wA = parseInt(a.split(' ')[2]);
            const wB = parseInt(b.split(' ')[2]);
            const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
            if(months.indexOf(mA) !== months.indexOf(mB)) return months.indexOf(mA) - months.indexOf(mB);
            return wA - wB;
        });

        const container = document.getElementById('week-tabs-container');
        container.innerHTML = '';
        
        if(weeks.length === 0) {
            container.innerHTML = '<div style="color:#666; padding:1rem;">Nenhuma semana encontrada.</div>';
            return;
        }

        weeks.forEach((w, idx) => {
            const btn = document.createElement('div');
            btn.className = `week-tab ${idx===0 ? 'active' : ''}`;
            btn.textContent = w;
            btn.onclick = () => {
                document.querySelectorAll('.week-tab').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                loadScheduleForWeek(w);
            };
            container.appendChild(btn);
        });

        // Carregar primeira semana
        if(weeks.length > 0) loadScheduleForWeek(weeks[0]);
    }

    function loadScheduleForWeek(weekKey) {
        activeWeekName = weekKey;
        const classes = allClasses.filter(c => c.teacher === currentTeacher.name && c.weekKey === weekKey);
        
        // Agrupar por dia
        const daysMap = {};
        classes.forEach(c => {
            if(!daysMap[c.dayOrder]) daysMap[c.dayOrder] = [];
            daysMap[c.dayOrder].push(c);
        });

        const container = document.getElementById('schedule-content');
        container.innerHTML = '';

        const dayNames = ['','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];

        Object.keys(daysMap).sort().forEach(order => {
            const dayClasses = daysMap[order];
            dayClasses.sort((a,b) => a.time.localeCompare(b.time));
            
            const section = document.createElement('div');
            section.className = 'day-section';
            section.innerHTML = `
                <div class="day-header">
                    <span>${dayNames[order]}</span>
                    <span style="font-size:0.8rem; opacity:0.7">${weekKey}</span>
                </div>
                <div class="classes-list" id="list-day-${order}"></div>
            `;
            
            const list = section.querySelector('.classes-list');
            dayClasses.forEach(cls => {
                const card = createClassCard(cls);
                list.appendChild(card);
            });
            container.appendChild(section);
        });

        updateCalculator(weekKey);
    }

    function createClassCard(cls) {
        const savedData = getSavedRAD(cls.id);
        const isDone = savedData && savedData.status === 'realized';
        const isCancelled = savedData && savedData.status === 'cancelled';
        const isNoShow = savedData && savedData.status === 'noshow';
        
        let statusClass = '';
        if(isDone) statusClass = 'completed';
        else if(isCancelled) statusClass = 'cancelled';
        else if(isNoShow) statusClass = 'noshow';

        const div = document.createElement('div');
        div.className = `class-card ${statusClass}`;
        div.style.borderLeftColor = currentTeacher.color;
        
        div.innerHTML = `
            <span class="class-time">⏰ ${cls.time}</span>
            <div class="class-info"><span class="class-label">TURMA</span> ${cls.group}</div>
            <div class="badges">
                ${cls.book ? `<span class="badge badge-book">BOOK ${cls.book}</span>` : ''}
                ${cls.room ? `<span class="badge badge-room">📍 ${cls.room}</span>` : ''}
                ${cls.modal ? `<span class="badge badge-mod">${cls.modal}</span>` : ''}
            </div>
            ${savedData && savedData.lessons && savedData.lessons.length > 0 ? 
                `<div style="font-size:0.75rem; color:var(--accent); margin-top:0.5rem;">Feito: ${savedData.lessons.join(', ')}</div>` : ''}
            
            <div class="action-row">
                <button class="btn-sm btn-rad" onclick="openRAD('${cls.id}')">RAD</button>
                <button class="btn-sm btn-check ${isDone ? 'done' : ''}" onclick="toggleComplete('${cls.id}')">✓</button>
            </div>
        `;
        return div;
    }

    // RAD LOGIC
    window.openRAD = function(id) {
        radCurrentClassId = id;
        const cls = allClasses.find(c => c.id === id);
        if(!cls) return;

        const modal = document.getElementById('modal-rad');
        const saved = getSavedRAD(id) || {};
        
        document.getElementById('rad-status').value = saved.status || 'realized';
        
        // Lesson Plan
        const lessonsContainer = document.getElementById('rad-lesson-plan');
        lessonsContainer.innerHTML = '';
        const availableLessons = getBookLessons(cls.book || 'G1');
        
        const lastLesson = saved.lessons && saved.lessons.length > 0 ? saved.lessons[saved.lessons.length-1] : (getLastGlobalLesson(cls.book) || 'None');
        document.getElementById('rad-last-lesson').textContent = lastLesson;

        availableLessons.forEach((les, idx) => {
            const isChecked = saved.lessons && saved.lessons.includes(les);
            const item = document.createElement('div');
            item.className = 'checkbox-item';
            item.innerHTML = `
                <input type="checkbox" id="les_${idx}" value="${les}" ${isChecked ? 'checked' : ''}>
                <label for="les_${idx}">${les}</label>
            `;
            lessonsContainer.appendChild(item);
        });

        // Students
        const studContainer = document.getElementById('rad-students');
        studContainer.innerHTML = '';
        const students = studentsDB[cls.group.toUpperCase()] || [];
        
        if(students.length === 0) {
            studContainer.innerHTML = '<div style="padding:1rem; color:#666; text-align:center;">Nenhum aluno cadastrado para esta turma.</div>';
        } else {
            students.forEach((name, idx) => {
                const attStatus = (saved.attendance && saved.attendance[name]) ? saved.attendance[name] : 'P';
                const item = document.createElement('div');
                item.className = 'student-item';
                item.innerHTML = `
                    <span class="student-name">${name}</span>
                    <select class="status-select" data-student="${name}">
                        <option value="P" ${attStatus==='P'?'selected':''}>Presente</option>
                        <option value="A" ${attStatus==='A'?'selected':''}>Ausente</option>
                        <option value="C" ${attStatus==='C'?'selected':''}>Cancelado</option>
                    </select>
                `;
                studContainer.appendChild(item);
            });
        }

        modal.classList.add('open');
    };

    window.saveRAD = function() {
        if(!radCurrentClassId) return;
        
        const status = document.getElementById('rad-status').value;
        const lessons = Array.from(document.querySelectorAll('#rad-lesson-plan input:checked')).map(i => i.value);
        
        const attendance = {};
        document.querySelectorAll('#rad-students .status-select').forEach(sel => {
            attendance[sel.dataset.student] = sel.value;
        });

        const data = { status, lessons, attendance, timestamp: new Date().toISOString() };
        localStorage.setItem(`rad_${radCurrentClassId}`, JSON.stringify(data));
        
        closeModal('modal-rad');
        loadScheduleForWeek(activeWeekName); // Refresh
        updateCalculator(activeWeekName);
    };

    window.clearRAD = function() {
        if(!radCurrentClassId) return;
        if(confirm('Tem certeza que deseja limpar todos os dados deste RAD?')) {
            localStorage.removeItem(`rad_${radCurrentClassId}`);
            closeModal('modal-rad');
            loadScheduleForWeek(activeWeekName);
            updateCalculator(activeWeekName);
        }
    };

    window.toggleComplete = function(id) {
        const saved = getSavedRAD(id) || { status: 'realized', lessons: [], attendance: {} };
        if(saved.status === 'realized') {
            saved.status = 'pending'; // Remove completude visual
        } else {
            saved.status = 'realized';
        }
        localStorage.setItem(`rad_${id}`, JSON.stringify(saved));
        loadScheduleForWeek(activeWeekName);
        updateCalculator(activeWeekName);
    };

    function getSavedRAD(id) {
        const data = localStorage.getItem(`rad_${id}`);
        return data ? JSON.parse(data) : null;
    }

    function getLastGlobalLesson(book) {
        // Varre todos os RADs salvos para achar a última lesson deste book
        let last = null;
        for(let i=0; i<localStorage.length; i++) {
            const key = localStorage.key(i);
            if(key.startsWith('rad_')) {
                const d = JSON.parse(localStorage.getItem(key));
                if(d.lessons && d.lessons.length > 0) {
                    // Checar se pertence ao book (precisaria do ID da classe para saber o book exato, simplificação aqui)
                    // Para simplificar, retornamos "Veja histórico" ou null se não tiver contexto
                }
            }
        }
        return last;
    }

    // CALCULATOR
    function updateCalculator(weekKey) {
        // Filtrar aulas do teacher e semana (ou mês derivado da semana)
        // Para cálculo mensal, precisamos extrair o mês da weekKey
        const monthStr = weekKey.split(' ')[0]; // "August"
        document.getElementById('calc-month-display').textContent = monthStr;
        document.getElementById('calculator-section').style.display = 'block';

        // Pegar todas as semanas que batem com este mês para o teacher
        const relevantClasses = allClasses.filter(c => 
            c.teacher === currentTeacher.name && 
            c.weekKey.startsWith(monthStr)
        );

        let schoolDone = 0, inCompDone = 0, schoolNo = 0, inCompNo = 0;

        relevantClasses.forEach(c => {
            const rad = getSavedRAD(c.id);
            if(rad && rad.status) {
                const isInCompany = c.modal.includes('IN-C') || c.room.includes('Hotel') || c.room.includes('Aventura') || c.group.includes('IN COMPANY');
                
                if(rad.status === 'realized') {
                    if(isInCompany) inCompDone++; else schoolDone++;
                } else if(rad.status === 'noshow') {
                    if(isInCompany) inCompNo++; else schoolNo++;
                }
            }
        });

        document.getElementById('stat-school-done').textContent = schoolDone;
        document.getElementById('stat-in-company-done').textContent = inCompDone;
        document.getElementById('stat-school-noshow').textContent = schoolNo;
        document.getElementById('stat-in-company-noshow').textContent = inCompNo;
    }

    // ATTENDANCE SCREEN
    window.showAttendanceScreen = function() {
        document.getElementById('screen-home').classList.remove('active');
        document.getElementById('screen-teacher').classList.remove('active');
        document.getElementById('screen-attendance').classList.add('active');
    };

    window.renderAttendanceTable = function() {
        const group = document.getElementById('att-group-select').value;
        const monthVal = document.getElementById('att-date-select').value; // YYYY-MM
        const tbody = document.getElementById('att-table-body');
        const theadRow = document.getElementById('att-table-head');
        
        tbody.innerHTML = '';
        theadRow.innerHTML = '<th>Aluno</th>';

        if(!group || !monthVal) return;

        const students = studentsDB[group.toUpperCase()] || [];
        const [year, month] = monthVal.split('-').map(Number);
        const daysInMonth = new Date(year, month, 0).getDate();

        // Header Dias
        for(let d=1; d<=daysInMonth; d++) {
            const th = document.createElement('th');
            th.textContent = d;
            theadRow.appendChild(th);
        }

        // Linhas Alunos
        students.forEach(student => {
            const tr = document.createElement('tr');
            const tdName = document.createElement('td');
            tdName.textContent = student;
            tr.appendChild(tdName);

            for(let d=1; d<=daysInMonth; d++) {
                const td = document.createElement('td');
                td.className = 'att-cell';
                // Tentar achar um RAD que bata com este dia (aproximação: checa todos os RADs do grupo)
                // Isso é pesado, idealmente teríamos um index. Vamos fazer busca simples.
                // Nota: O ID da classe tem a semana, não o dia exato. 
                // Para simplificar nesta demo, vamos deixar vazio ou simular.
                // Em produção, cruzaríamos data exata.
                td.textContent = '-'; 
                td.onclick = () => {
                    const vals = ['-', 'P', 'A'];
                    const next = vals[(vals.indexOf(td.textContent)+1)%3];
                    td.textContent = next;
                    td.className = `att-cell att-${next}`;
                    // Salvar em localStorage genérico de presença manual
                    const key = `att_manual_${group}_${monthVal}_${d}_${student}`;
                    localStorage.setItem(key, next);
                };
                
                // Carregar salvo
                const key = `att_manual_${group}_${monthVal}_${d}_${student}`;
                const saved = localStorage.getItem(key);
                if(saved) {
                    td.textContent = saved;
                    td.className = `att-cell att-${saved}`;
                }

                tr.appendChild(td);
            }
            tbody.appendChild(tr);
        });
    };

    // UTILS
    function closeModal(id) { document.getElementById(id).classList.remove('open'); }
    function goHome() {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById('screen-home').classList.add('active');
    }
