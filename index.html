<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cronograma Semanal</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --card-bg: #f8f9fa;
            --text-main: #212529;
            --text-sec: #6c757d;
            --primary: #0d6efd;
            --primary-light: #e7f1ff;
            --primary-dim: rgba(13, 110, 253, 0.1);
            --border-color: #dee2e6;
            --danger: #dc3545;
            --success: #198754;
            --warning: #ffc107;
            --shadow: 0 2px 8px rgba(0,0,0,0.08);
            --shadow-hover: 0 4px 16px rgba(0,0,0,0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            overflow-x: hidden;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .hidden { display: none !important; }

        header {
            text-align: center;
            padding: 30px 0;
            border-bottom: 3px solid var(--primary);
            margin-bottom: 30px;
            background: linear-gradient(180deg, var(--primary-light) 0%, transparent 100%);
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--primary);
            margin-bottom: 10px;
        }

        h2, h3 { 
            font-weight: 600; 
            letter-spacing: 0.5px; 
        }

        .header-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 15px;
        }

        button {
            background: var(--bg-color);
            border: 2px solid var(--primary);
            color: var(--primary);
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            border-radius: 6px;
            margin: 5px;
            box-shadow: var(--shadow);
        }

        button:hover {
            background: var(--primary);
            color: #fff;
            box-shadow: var(--shadow-hover);
            transform: translateY(-1px);
        }

        button.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }

        button.btn-danger {
            border-color: var(--danger);
            color: var(--danger);
        }

        button.btn-danger:hover {
            background: var(--danger);
            color: #fff;
        }

        button.btn-success {
            border-color: var(--success);
            color: var(--success);
        }

        button.btn-success:hover {
            background: var(--success);
            color: #fff;
        }

        .teachers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            justify-items: center;
            margin-top: 20px;
        }

        .teacher-card {
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            padding: 20px;
            width: 100%;
            max-width: 200px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            border-radius: 8px;
            position: relative;
            overflow: hidden;
            box-shadow: var(--shadow);
        }

        .teacher-card:hover {
            border-color: var(--primary);
            transform: translateY(-3px);
            box-shadow: var(--shadow-hover);
            background: var(--primary-light);
        }

        .teacher-name {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-main);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .schedule-header {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 20px;
        }

        .week-selector {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .day-section {
            margin-bottom: 40px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            background: var(--card-bg);
            box-shadow: var(--shadow);
        }

        .day-header {
            background: var(--primary-light);
            color: var(--primary);
            padding: 15px 20px;
            font-weight: 700;
            text-transform: uppercase;
            border-bottom: 2px solid var(--primary);
            font-size: 1.2rem;
            letter-spacing: 0.5px;
        }

        .classes-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 15px;
            padding: 20px;
        }

        .class-card {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            padding: 18px;
            border-radius: 6px;
            position: relative;
            transition: all 0.3s ease;
            box-shadow: var(--shadow);
        }

        .class-card:hover {
            border-color: var(--primary);
            box-shadow: var(--shadow-hover);
        }

        .class-time {
            font-size: 1.3rem;
            color: var(--primary);
            font-weight: 700;
            margin-bottom: 8px;
            display: block;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 8px;
        }

        .class-info {
            font-size: 0.95rem;
            color: var(--text-sec);
            margin-bottom: 5px;
        }

        .badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-right: 5px;
            margin-bottom: 5px;
            color: #fff;
        }

        .badge-book { background: var(--warning); color: #000; }
        .badge-room { background: var(--success); }
        .badge-modal { background: var(--primary); }

        .action-btn {
            width: 100%;
            margin-top: 12px;
            padding: 10px;
            font-size: 0.85rem;
            border: 2px solid var(--border-color);
            color: var(--text-sec);
            background: var(--bg-color);
            border-radius: 6px;
            font-weight: 600;
        }
        
        .action-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
            background: var(--primary-light);
            transform: none;
            box-shadow: none;
        }

        .status-indicator {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }
        .status-done { background: var(--success); }
        .status-noshow { background: var(--danger); }
        .status-cancel { background: var(--warning); }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(4px);
        }

        .modal-content {
            background: var(--bg-color);
            border: none;
            border-radius: 12px;
            padding: 30px;
            width: 90%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 15px;
        }

        .modal-header h3 {
            color: var(--primary);
            font-size: 1.2rem;
        }

        .close-modal {
            background: none;
            border: none;
            color: var(--text-sec);
            font-size: 1.8rem;
            cursor: pointer;
            padding: 0 8px;
            margin: 0;
            box-shadow: none;
            font-weight: 300;
        }

        .close-modal:hover {
            color: var(--text-main);
            background: none;
            transform: none;
        }

        input, select, textarea {
            width: 100%;
            background: var(--bg-color);
            border: 2px solid var(--border-color);
            color: var(--text-main);
            padding: 10px 14px;
            margin-bottom: 12px;
            border-radius: 6px;
            font-family: inherit;
            font-size: 0.95rem;
            transition: border-color 0.3s ease;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-dim);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
            font-family: inherit;
        }

        label {
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--text-sec);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: block;
            margin-bottom: 6px;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
            background: var(--card-bg);
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            transition: all 0.2s ease;
        }

        .checkbox-group:hover {
            border-color: var(--primary);
            background: var(--primary-light);
        }

        .checkbox-group input {
            width: auto;
            margin-right: 12px;
            margin-bottom: 0;
            accent-color: var(--primary);
            transform: scale(1.1);
        }

        .checkbox-group label {
            flex: 1;
            cursor: pointer;
            font-size: 0.9rem;
            color: var(--text-main);
            text-transform: none;
            font-weight: 400;
            margin-bottom: 0;
        }

        .attendance-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            font-size: 0.85rem;
            background: var(--bg-color);
            border-radius: 6px;
            overflow: hidden;
        }

        .attendance-table th, .attendance-table td {
            border: 1px solid var(--border-color);
            padding: 10px 12px;
            text-align: center;
        }

        .attendance-table th {
            background: var(--primary-light);
            color: var(--primary);
            font-weight: 700;
        }

        .attendance-table tr:hover {
            background: var(--card-bg);
        }

        #loading-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-color);
            z-index: 2000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .loader {
            width: 50px;
            height: 50px;
            border: 4px solid var(--border-color);
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        #loading-screen p {
            margin-top: 20px;
            color: var(--primary);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .observations-box {
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 15px;
        }

        .observations-box textarea {
            margin-bottom: 0;
            border: 1px solid var(--border-color);
        }

        .observations-box textarea:focus {
            border-color: var(--primary);
        }

        /* Estilos para Lesson Plan por Turma */
        .group-lesson-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .group-card {
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: var(--shadow);
            text-align: center;
        }

        .group-card:hover {
            border-color: var(--primary);
            transform: translateY(-3px);
            box-shadow: var(--shadow-hover);
            background: var(--primary-light);
        }

        .group-card h3 {
            color: var(--primary);
            font-size: 1.2rem;
            margin-bottom: 10px;
        }

        .group-card .book-info {
            font-size: 0.9rem;
            color: var(--text-sec);
            margin-bottom: 8px;
        }

        .group-card .progress {
            font-size: 0.9rem;
            color: var(--text-sec);
        }

        .group-card .progress-bar {
            width: 100%;
            height: 8px;
            background: var(--border-color);
            border-radius: 4px;
            margin-top: 10px;
            overflow: hidden;
        }

        .group-card .progress-bar .fill {
            height: 100%;
            background: var(--success);
            border-radius: 4px;
            transition: width 0.3s ease;
        }

        .lesson-item {
            display: flex;
            align-items: center;
            padding: 10px 15px;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            margin-bottom: 8px;
            transition: all 0.2s ease;
        }

        .lesson-item:hover {
            border-color: var(--primary);
            background: var(--primary-light);
        }

        .lesson-item input[type="checkbox"] {
            width: auto;
            margin-right: 15px;
            margin-bottom: 0;
            accent-color: var(--primary);
            transform: scale(1.2);
        }

        .lesson-item .lesson-label {
            flex: 1;
            font-size: 0.95rem;
        }

        .lesson-item .lesson-date {
            font-size: 0.8rem;
            color: var(--text-sec);
            margin-left: 10px;
        }

        .lesson-item .lesson-checked {
            color: var(--success);
            font-weight: 600;
        }

        .lesson-item.revision {
            background: #fff3cd;
            border-color: var(--warning);
        }

        .lesson-item.revision:hover {
            background: #ffe69c;
            border-color: var(--warning);
        }

        .lesson-item .revision-badge {
            background: var(--warning);
            color: #000;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 0.7rem;
            font-weight: 700;
            margin-left: 10px;
        }

        .lesson-item.test {
            background: #f8d7da;
            border-color: var(--danger);
        }

        .lesson-item.test:hover {
            background: #f5c6cb;
            border-color: var(--danger);
        }

        .lesson-item .test-badge {
            background: var(--danger);
            color: #fff;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 0.7rem;
            font-weight: 700;
            margin-left: 10px;
        }

        .group-lessons-container {
            max-height: 500px;
            overflow-y: auto;
            padding: 5px;
        }

        .group-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--border-color);
            flex-wrap: wrap;
            gap: 10px;
        }

        .group-header h2 {
            color: var(--primary);
        }

        .group-header .book-badge {
            background: var(--primary-light);
            color: var(--primary);
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        @media (max-width: 600px) {
            .teachers-grid { grid-template-columns: repeat(2, 1fr); gap: 15px; }
            .classes-list { grid-template-columns: 1fr; padding: 15px; }
            h1 { font-size: 1.5rem; }
            .modal-content { width: 95%; padding: 20px; }
            .class-card { padding: 15px; }
            .day-header { padding: 12px 15px; font-size: 1rem; }
            .teacher-card { max-width: 100%; padding: 15px; }
            .week-selector button { padding: 8px 16px; font-size: 0.85rem; }
            .group-lesson-grid { grid-template-columns: 1fr; }
            .header-buttons { flex-direction: column; align-items: center; }
            .group-header { flex-direction: column; align-items: stretch; text-align: center; }
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--card-bg);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #0b5ed7;
        }
    </style>
</head>
<body>

    <div id="loading-screen">
        <div class="loader"></div>
        <p>Carregando Sistema...</p>
    </div>

    <header>
        <h1>Sistema de Gestão</h1>
        <p style="color: var(--text-sec); font-size: 0.95rem; font-weight: 500;">GERENCIAMENTO DE AULAS E LESSON PLANS</p>
        
        <div class="header-buttons">
            <button onclick="showSelection()" class="active" id="btn-schedule">📅 Cronograma</button>
            <button onclick="showLessonPlans()" id="btn-lessons">📚 Lesson Plans por Turma</button>
        </div>
    </header>

    <div class="container">
        <!-- Tela Inicial: Seleção de Teachers -->
        <div id="selection-screen">
            <div class="teachers-grid" id="teachers-grid">
            </div>
            
            <div style="text-align: center; margin-top: 40px;">
                <button onclick="openAttendanceList()" style="border-color: var(--success); color: var(--success);">
                    📋 Lista de Presença Geral
                </button>
            </div>
        </div>

        <!-- Tela do Cronograma do Teacher -->
        <div id="schedule-screen" class="hidden">
            <div class="schedule-header">
                <button onclick="showSelection()" style="align-self: flex-start; border-color: var(--text-sec); color: var(--text-sec);">
                    ← Voltar
                </button>
                <h2 id="current-teacher-name" style="color: var(--primary); text-align: center;"></h2>
                
                <div class="week-selector" id="week-selector">
                </div>
            </div>

            <div id="schedule-content">
            </div>
        </div>

        <!-- Tela de Lesson Plans por Turma -->
        <div id="lesson-plan-screen" class="hidden">
            <div style="margin-bottom: 20px;">
                <button onclick="showSelection()" style="border-color: var(--text-sec); color: var(--text-sec);">
                    ← Voltar
                </button>
            </div>
            
            <div id="lesson-plan-content">
                <!-- Lista de turmas será renderizada aqui -->
            </div>
        </div>
    </div>

    <!-- MODAL RAD -->
    <div id="rad-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3>RAD - Registro de Aula</h3>
                <button class="close-modal" onclick="closeModal('rad-modal')">✕</button>
            </div>
            
            <div id="rad-class-info" style="margin-bottom: 15px; padding: 12px; background: var(--card-bg); border-radius: 6px; border-left: 4px solid var(--primary);"></div>

            <label>Status da Aula:</label>
            <select id="rad-status" onchange="toggleRadFields()">
                <option value="">Selecione...</option>
                <option value="realizada">Realizada</option>
                <option value="noshow">No Show (Aluno não veio)</option>
                <option value="cancelada">Cancelada</option>
            </select>

            <div id="rad-fields" class="hidden">
                <hr style="border: 0; border-top: 2px solid var(--border-color); margin: 20px 0;">
                
                <label>Lesson Plan Realizada:</label>
                <div id="lesson-plan-container" style="max-height: 200px; overflow-y: auto; margin-bottom: 15px; border: 2px solid var(--border-color); border-radius: 6px; padding: 8px;">
                </div>

                <label>Lista de Presença:</label>
                <div id="attendance-container" style="max-height: 200px; overflow-y: auto; margin-bottom: 15px; border: 2px solid var(--border-color); border-radius: 6px; padding: 8px;">
                </div>

                <div class="observations-box">
                    <label style="color: var(--primary);">📝 Observações:</label>
                    <textarea id="rad-observations" placeholder="Digite aqui suas observações sobre a aula..." rows="3"></textarea>
                </div>

                <button onclick="saveRad()" class="btn-success" style="width: 100%; background: var(--success); color: #fff; border-color: var(--success);">
                    💾 SALVAR RAD
                </button>
                <button onclick="clearRad()" class="btn-danger" style="width: 100%; margin-top: 8px; border-color: var(--danger); color: var(--danger);">
                    🗑️ LIMPAR DADOS
                </button>
            </div>
        </div>
    </div>

    <!-- MODAL LESSON PLAN DETALHADO POR TURMA -->
    <div id="lesson-detail-modal" class="modal-overlay hidden">
        <div class="modal-content" style="max-width: 700px;">
            <div class="modal-header">
                <h3 id="lesson-detail-title">📖 Lesson Plan - Turma</h3>
                <button class="close-modal" onclick="closeModal('lesson-detail-modal')">✕</button>
            </div>
            
            <div id="lesson-detail-content">
                <!-- Conteúdo da turma será renderizado aqui -->
            </div>
            
            <div style="margin-top: 15px; display: flex; gap: 10px; flex-wrap: wrap;">
                <button onclick="saveLessonProgress()" class="btn-success" style="flex: 1; background: var(--success); color: #fff; border-color: var(--success);">
                    💾 SALVAR PROGRESSO
                </button>
                <button onclick="resetLessonProgress()" class="btn-danger" style="flex: 1; border-color: var(--danger); color: var(--danger);">
                    🔄 RESETAR PROGRESSO
                </button>
            </div>
        </div>
    </div>

    <!-- MODAL LISTA DE PRESENÇA GERAL -->
    <div id="attendance-modal" class="modal-overlay hidden">
        <div class="modal-content" style="max-width: 800px;">
            <div class="modal-header">
                <h3>Controle de Presença por Turma</h3>
                <button class="close-modal" onclick="closeModal('attendance-modal')">✕</button>
            </div>
            
            <div style="display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 15px;">
                <select id="att-group-select" onchange="loadAttendanceTable()" style="flex: 1; min-width: 150px;">
                    <option value="">Selecione a Turma...</option>
                </select>
                <input type="month" id="att-month-select" onchange="loadAttendanceTable()" style="flex: 0 1 auto; width: auto;">
            </div>

            <div id="attendance-table-container" style="overflow-x: auto; margin-top: 20px;">
            </div>
        </div>
    </div>

<script>
    // CONFIGURAÇÕES
    const SCHEDULE_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQmSAl1ndXXSgDWbrjCiSDkmtECkP94Rr2nk-kIHV-zHd4NFSE9CzyQb6YP2Rt4lEQNYOpuvgjCYDal/pub?output=csv';
    const STUDENTS_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSlWLLO76YOXic0n11ttKL-UKoNGTT3VKEogt3pvHONM4Hnb3upvgYj_h8DOC57xmAobUXSIznc7V6x/pub?output=csv';

    // ========== GERAR LESSON PLANS PADRÃO (FALLBACK) ==========
    function generateDefaultLessons() {
        lessonsData = {};
        Object.keys(BOOK_MAPPING).forEach(bookKey => {
            const { bookNum, totalLessons } = BOOK_MAPPING[bookKey];
            lessonsData[bookKey] = generateLessonPlan(bookNum, totalLessons);
        });
    }

    function generateLessonPlan(bookNum, totalLessons) {
        const lessons = [];
        let lessonCounter = 1;
        let revisionCounter = 1;
        let i = 1;
        
        while (i <= totalLessons) {
            // 5 Lessons
            for (let j = 0; j < 5 && i <= totalLessons; j++) {
                lessons.push({
                    id: `b${bookNum}_l${i}`,
                    label: `Lesson ${i}`,
                    isRevision: false,
                    isTest: false,
                    book: bookNum,
                    order: i
                });
                i++;
                lessonCounter++;
            }
            
            // 1 Revision (se ainda não chegou ao final)
            if (i <= totalLessons) {
                const start = i - 5;
                const end = i - 1;
                lessons.push({
                    id: `b${bookNum}_rev${revisionCounter}`,
                    label: `Revision ${start}-${end}`,
                    isRevision: true,
                    isTest: false,
                    book: bookNum,
                    order: i
                });
                revisionCounter++;
                i++;
            }
        }
        
        // Adiciona o Test no final
        lessons.push({
            id: `b${bookNum}_test`,
            label: `Test Book ${bookNum}`,
            isRevision: false,
            isTest: true,
            book: bookNum,
            order: totalLessons + 1
        });
        
        return lessons;
    }

    function parseScheduleCSV(text) {
        const lines = text.split('\n').map(l => l.trim()).filter(l => l);
        if(lines.length < 2) return;

        const COL_BOOK = 1;
        const COL_GROUP = 2;
        const COL_ROOM = 3;
        const COL_MODAL = 4;
        const COL_TIME = 5;
        const DAYS_START = 6;

        const daysMap = ['Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta'];

        scheduleData = [];

        for(let i=1; i<lines.length; i++) {
            const row = lines[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(c => c.replace(/"/g, '').trim());
            
            const book = row[COL_BOOK] || '';
            const groupRaw = row[COL_GROUP] || '';
            const room = row[COL_ROOM] || '';
            const modal = row[COL_MODAL] || '';
            const time = row[COL_TIME] || '';

            if(!time) continue;

            for(let d=0; d<5; d++) {
                const cellContent = row[DAYS_START + d];
                if(cellContent && cellContent.trim() !== '') {
                    const teacherName = findTeacherInString(cellContent);
                    
                    if(teacherName) {
                        scheduleData.push({
                            book: cleanText(book),
                            group: cleanText(groupRaw),
                            room: cleanText(room),
                            modal: cleanText(modal),
                            time: cleanText(time),
                            dayIndex: d,
                            dayName: daysMap[d],
                            teacher: teacherName,
                            rawCell: cellContent
                        });
                    }
                }
            }
        }

        allWeeks = {
            'This Week': scheduleData
        };
    }

    function parseStudentsCSV(text) {
        const lines = text.split('\n').map(l => l.trim()).filter(l => l);
        if(lines.length < 2) return;
        
        const rawGroups = {};
        
        for(let i=1; i<lines.length; i++) {
            const parts = lines[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
            if(parts.length >= 2) {
                let group = parts[0].replace(/"/g, '').trim();
                const student = parts[1].replace(/"/g, '').trim();
                
                if(group && student) {
                    if(!rawGroups[group]) rawGroups[group] = [];
                    if(!rawGroups[group].includes(student)) {
                        rawGroups[group].push(student);
                    }
                }
            }
        }
        
        Object.keys(rawGroups).forEach(groupName => {
            const students = rawGroups[groupName];
            studentsData[groupName] = students;
            
            const upperKey = groupName.toUpperCase().trim();
            if(upperKey !== groupName) {
                studentsData[upperKey] = students;
            }
            
            if(groupName.includes('Hannah') || groupName.includes('Montanah') || 
               groupName.toUpperCase().includes('HANNAH') || groupName.toUpperCase().includes('MONTANAH')) {
                const hannahKey = 'Hannah Montanah';
                if(!studentsData[hannahKey]) {
                    studentsData[hannahKey] = [];
                }
                students.forEach(s => {
                    if(!studentsData[hannahKey].includes(s)) {
                        studentsData[hannahKey].push(s);
                    }
                });
            }
        });
    }

    // ========== PARSE LESSON PLANS DA PLANILHA ==========
    function parseLessonsCSV(text) {
        const lines = text.split('\n').map(l => l.trim()).filter(l => l);
        if(lines.length < 2) {
            generateDefaultLessons();
            return;
        }
        
        // Estrutura esperada: Coluna A = Book, Coluna B = Lesson Name
        const bookLessons = {};
        
        console.log('📖 Processando lesson plans da planilha...');
        
        for(let i=1; i<lines.length; i++) {
            const parts = lines[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(c => c.replace(/"/g, '').trim());
            if(parts.length >= 2) {
                let book = parts[0] || 'G1';
                const lessonLabel = parts[1] || `Lesson ${i}`;
                
                // Limpa o nome do livro
                book = book.replace(/['"]/g, '').trim();
                
                if(!bookLessons[book]) bookLessons[book] = [];
                
                // Detecta se é uma revision baseado no nome
                const isRevision = lessonLabel.toLowerCase().includes('revision') || 
                                   lessonLabel.toLowerCase().includes('review') ||
                                   lessonLabel.toLowerCase().includes('rev') ||
                                   /^\d+-\d+/.test(lessonLabel) || // Padrão "1-5", "6-10"
                                   lessonLabel.includes('–') || // En dash
                                   lessonLabel.includes('-'); // Hífen
                
                // Detecta se é o test final
                const isTest = lessonLabel.toLowerCase().includes('test') || 
                               lessonLabel.toLowerCase().includes('final') ||
                               lessonLabel.toLowerCase().includes('exam');
                
                // Tenta extrair o número da lesson
                let order = i;
                const numMatch = lessonLabel.match(/\d+/);
                if (numMatch) {
                    order = parseInt(numMatch[0]);
                }
                
                bookLessons[book].push({
                    id: `b_${book}_l${i}`,
                    label: lessonLabel,
                    isRevision: isRevision,
                    isTest: isTest,
                    book: book,
                    order: order,
                    rawLabel: lessonLabel
                });
            }
        }
        
        // Se não carregou nada, usa o padrão gerado
        if(Object.keys(bookLessons).length === 0) {
            console.warn('⚠️ Nenhuma lesson plan encontrada na planilha, usando padrão.');
            generateDefaultLessons();
        } else {
            lessonsData = bookLessons;
        }
        
        console.log('📚 Lesson Plans carregados do Sheets:', Object.keys(lessonsData));
        Object.keys(lessonsData).forEach(book => {
            const revisions = lessonsData[book].filter(l => l.isRevision);
            const tests = lessonsData[book].filter(l => l.isTest);
            console.log(`   ${book}: ${lessonsData[book].length} aulas (${revisions.length} revisions, ${tests.length} tests)`);
        });
    }

    function cleanText(str) {
        return str ? str.replace(/<.*?>/g, '').trim() : '';
    }

    function findTeacherInString(str) {
        const upperStr = str.toUpperCase();
        for(const t of VALID_TEACHERS) {
            if(upperStr.includes(t.name)) return t.name;
        }
        return null;
    }

    // ========== CONSTRUIR MAPA TURMA -> LIVRO ==========
    function buildGroupBookMap() {
        groupBookMap = {};
        
        // Usa os dados do cronograma para mapear
        scheduleData.forEach(item => {
            if (item.group && item.book) {
                const bookKey = item.book.toUpperCase().trim();
                // Tenta encontrar o livro correspondente
                let foundBook = null;
                
                // Primeiro tenta correspondência exata com as chaves do lessonsData
                const bookKeys = Object.keys(lessonsData);
                foundBook = bookKeys.find(b => b.toUpperCase() === bookKey);
                
                // Se não encontrou, tenta correspondência parcial
                if (!foundBook) {
                    foundBook = bookKeys.find(b => 
                        b.toUpperCase().includes(bookKey) || 
                        bookKey.includes(b.toUpperCase())
                    );
                }
                
                // Se ainda não encontrou, usa o BOOK_MAPPING
                if (!foundBook) {
                    Object.keys(BOOK_MAPPING).forEach(book => {
                        if (bookKey.includes(book) || book.includes(bookKey)) {
                            foundBook = book;
                        }
                    });
                }
                
                if (foundBook) {
                    groupBookMap[item.group] = foundBook;
                }
            }
        });
        
        // Se ainda não mapeou todas as turmas, tenta inferir pelo nome
        Object.keys(studentsData).forEach(group => {
            if (!groupBookMap[group]) {
                const upperGroup = group.toUpperCase();
                // Tenta encontrar um livro que combine
                const bookKeys = Object.keys(lessonsData);
                const match = bookKeys.find(book => 
                    upperGroup.includes(book) || book.includes(upperGroup)
                );
                if (match) {
                    groupBookMap[group] = match;
                }
            }
        });
        
        console.log('📚 Mapa Turma -> Livro:', groupBookMap);
    }

    // ========== CRONOGRAMA ==========
    function renderSchedule() {
        const container = document.getElementById('schedule-content');
        container.innerHTML = '';

        if(currentWeekData.length === 0) {
            container.innerHTML = '<p style="text-align:center; color: var(--text-sec); margin-top:50px; font-size:1.1rem;">Nenhuma aula encontrada para esta semana.</p>';
            return;
        }

        const daysOrder = ['Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta'];
        
        daysOrder.forEach(day => {
            const dayClasses = currentWeekData.filter(c => c.dayName === day);
            if(dayClasses.length > 0) {
                const section = document.createElement('div');
                section.className = 'day-section';
                
                const header = document.createElement('div');
                header.className = 'day-header';
                header.textContent = day;
                section.appendChild(header);

                const list = document.createElement('div');
                list.className = 'classes-list';

                dayClasses.forEach(cls => {
                    const card = document.createElement('div');
                    card.className = 'class-card';
                    
                    const radKey = getRadKey(cls);
                    const savedRad = localStorage.getItem(radKey);
                    const status = savedRad ? JSON.parse(savedRad).status : null;

                    let statusBadge = '';
                    if(status === 'realizada') statusBadge = '<div class="status-indicator status-done" title="Realizada"></div>';
                    if(status === 'noshow') statusBadge = '<div class="status-indicator status-noshow" title="No Show"></div>';
                    if(status === 'cancelada') statusBadge = '<div class="status-indicator status-cancel" title="Cancelada"></div>';

                    // Verifica progresso da turma
                    const groupProgress = currentLessonProgress[cls.group] || [];
                    const completed = groupProgress.filter(p => p.completed).length;
                    const total = getGroupTotalLessons(cls.group);
                    const progressText = total > 0 ? `${completed}/${total}` : '';

                    card.innerHTML = `
                        ${statusBadge}
                        <span class="class-time">${cls.time}</span>
                        <div class="class-info"><strong>Turma:</strong> ${cls.group}</div>
                        <div class="class-info">
                            <span class="badge badge-book">${cls.book || 'N/A'}</span>
                            <span class="badge badge-room">Sala: ${cls.room || '-'}</span>
                            <span class="badge badge-modal">${cls.modal || 'REGULAR'}</span>
                            ${progressText ? `<span class="badge" style="background: var(--success);">${progressText}</span>` : ''}
                        </div>
                        <button class="action-btn" onclick="openRad('${cls.time}', '${cls.group}', '${cls.book}', '${cls.room}', '${cls.dayName}')">ABRIR RAD</button>
                    `;
                    list.appendChild(card);
                });

                section.appendChild(list);
                container.appendChild(section);
            }
        });
    }

    function getGroupTotalLessons(group) {
        const book = groupBookMap[group];
        if (book && lessonsData[book]) {
            return lessonsData[book].length;
        }
        // Fallback: tenta encontrar o livro pelo nome da turma
        const upperGroup = group.toUpperCase();
        for (const [bookKey, lessons] of Object.entries(lessonsData)) {
            if (upperGroup.includes(bookKey) || bookKey.includes(upperGroup)) {
                return lessons.length;
            }
        }
        return 46;
    }

    let currentRadClass = null;

    function getRadKey(cls) {
        return `rad_${currentTeacher.name}_${cls.dayName}_${cls.time}_${cls.group}`;

    function openRad(time, group, book, room, day) {
        currentRadClass = { time, group, book, room, day };
        const modal = document.getElementById('rad-modal');
        const infoDiv = document.getElementById('rad-class-info');
        
        infoDiv.innerHTML = `
            <strong style="color: var(--primary);">${day} - ${time}</strong><br>

        `;

        document.getElementById('rad-status').value = '';
        document.getElementById('rad-observations').value = '';
        toggleRadFields();
        
        const saved = localStorage.getItem(getRadKey(currentRadClass));
        if(saved) {
            const data = JSON.parse(saved);
            document.getElementById('rad-status').value = data.status;
            document.getElementById('rad-observations').value = data.observations || '';
            toggleRadFields();
            if(data.status && data.status !== '') {
                renderLessonPlanCheckboxes(group, data.lessons || []);
                renderAttendanceCheckboxes(group, data.attendance || []);
            }
        } else {
            renderLessonPlanCheckboxes(group, []);
            renderAttendanceCheckboxes(group, []);
        }

        modal.classList.remove('hidden');
    }

    function toggleRadFields() {
        const status = document.getElementById('rad-status').value;
        const fields = document.getElementById('rad-fields');
        if(status) fields.classList.remove('hidden');
        else fields.classList.add('hidden');
    }

    function renderLessonPlanCheckboxes(group, checkedIds) {
        const container = document.getElementById('lesson-plan-container');
        container.innerHTML = '';
        
        const lessons = getGroupLessons(group);
        
        if (lessons.length === 0) {
            container.innerHTML = '<p style="color: var(--text-sec);">Nenhuma lesson plan encontrada para esta turma.</p>';
            return;
        }

        lessons.forEach((lesson, index) => {
            const div = document.createElement('div');
            div.className = 'checkbox-group';
            if (lesson.isRevision) {
                div.style.borderLeft = '4px solid var(--warning)';
                div.style.background = '#fff3cd';
            }
            if (lesson.isTest) {
                div.style.borderLeft = '4px solid var(--danger)';
                div.style.background = '#f8d7da';
            }
            
            const lessonId = `lp_${index}`;
            const isChecked = checkedIds.includes(lesson.id) ? 'checked' : '';
            
            let labelStyle = '';
            if (lesson.isRevision) labelStyle = 'color: #856404; font-weight: 600;';
            if (lesson.isTest) labelStyle = 'color: var(--danger); font-weight: 700;';
            
            div.innerHTML = `
                <input type="checkbox" id="${lessonId}" value="${lesson.id}" ${isChecked}>
                <label for="${lessonId}" style="${labelStyle}">
                    ${lesson.label}
                    ${lesson.isRevision ? ' 🔄' : ''}
                    ${lesson.isTest ? ' 📝' : ''}
                </label>
            `;
            container.appendChild(div);
        });
    }

    function getGroupLessons(group) {
        const book = groupBookMap[group];
        if (book && lessonsData[book]) {
            return lessonsData[book];
        }
        
        // Tenta encontrar pelo nome da turma
        const upperGroup = group.toUpperCase();
        for (const [bookKey, lessons] of Object.entries(lessonsData)) {
            if (upperGroup.includes(bookKey) || bookKey.includes(upperGroup)) {
                return lessons;
            }
        }
        
        // Fallback: gera lessons baseado no livro da turma
        const bookMatch = Object.keys(BOOK_MAPPING).find(b => 
            upperGroup.includes(b) || b.includes(upperGroup)
        );
        if (bookMatch) {
            const { bookNum, totalLessons } = BOOK_MAPPING[bookMatch];
            return generateLessonPlan(bookNum, totalLessons);
        }
        
        return [];
    }

    function renderAttendanceCheckboxes(groupRaw, presentList) {
        const container = document.getElementById('attendance-container');
        container.innerHTML = '';
        
        let students = [];
        const keys = Object.keys(studentsData);
        
        let match = null;
        const groupVariations = [
            groupRaw,
            groupRaw.toUpperCase().trim(),
            groupRaw.replace(/\s+/g, ' ').trim(),
            groupRaw.toUpperCase().replace(/\s+/g, ' ').trim(),
        ];
        
        for (const variation of groupVariations) {
            if (match) break;
            match = keys.find(k => k === variation);
            if (!match) {
                const upperVariation = variation.toUpperCase().trim();
                match = keys.find(k => k.toUpperCase().trim() === upperVariation);
            }
        }
        
        if (!match) {
            const upperGroup = groupRaw.toUpperCase().trim();
            match = keys.find(k => {
                const upperK = k.toUpperCase().trim();
                return upperK.includes(upperGroup) || upperGroup.includes(upperK);
            });
        }
        
        if (match && studentsData[match]) {
            students = studentsData[match];
        } else {
            students = ["Aluno 1", "Aluno 2", "Aluno 3"];
        }

        students = [...new Set(students)];

        students.forEach((student) => {
            const div = document.createElement('div');
            div.className = 'checkbox-group';
            const isPresent = presentList.includes(student) ? 'checked' : '';
            
            div.innerHTML = `
                <input type="checkbox" class="att-check" value="${student}" ${isPresent}>
                <label>${student}</label>
            `;
            container.appendChild(div);
        });
    }

    function saveRad() {
        const status = document.getElementById('rad-status').value;
        if(!status) { alert('Selecione o status da aula!'); return; }

        const lessonsChecked = Array.from(document.querySelectorAll('#lesson-plan-container input:checked')).map(cb => cb.value);
        const attendanceChecked = Array.from(document.querySelectorAll('.att-check:checked')).map(cb => cb.value);
        const observations = document.getElementById('rad-observations').value.trim();

        const data = {
            status,
            lessons: lessonsChecked,
            attendance: attendanceChecked,
            observations: observations,
            dateSaved: new Date().toISOString()
        };

        localStorage.setItem(getRadKey(currentRadClass), JSON.stringify(data));
        closeModal('rad-modal');
        renderSchedule();
        alert('✅ RAD Salvo com Sucesso!');
    }

    function clearRad() {
        if(confirm('Tem certeza que deseja limpar todos os dados deste RAD?')) {
            localStorage.removeItem(getRadKey(currentRadClass));
            openRad(currentRadClass.time, currentRadClass.group, currentRadClass.book, currentRadClass.room, currentRadClass.day);
        }
    }

    // ========== LESSON PLANS POR TURMA ==========
    function loadLessonProgress() {
        const saved = localStorage.getItem('lessonProgress');
        if(saved) {
            try {
                currentLessonProgress = JSON.parse(saved);
            } catch(e) {
                currentLessonProgress = {};
            }
        } else {
            currentLessonProgress = {};
        }
    }

    function saveLessonProgress() {
        localStorage.setItem('lessonProgress', JSON.stringify(currentLessonProgress));
        renderGroupLessonPlans();
    }

    function renderGroupLessonPlans() {
        const container = document.getElementById('lesson-plan-content');
        
        const groups = [...new Set(scheduleData.map(item => item.group).filter(g => g))];
        
        if (groups.length === 0) {
            container.innerHTML = `
                <h2 style="color: var(--primary); text-align: center; margin-bottom: 30px;">📚 Lesson Plans por Turma</h2>
                <p style="text-align:center; color: var(--text-sec);">Nenhuma turma encontrada no cronograma.</p>
            `;
            return;
        }
        
        container.innerHTML = `
            <h2 style="color: var(--primary); text-align: center; margin-bottom: 30px;">📚 Lesson Plans por Turma</h2>
            <div class="group-lesson-grid" id="group-lesson-grid">
            </div>
        `;
        
        const grid = document.getElementById('group-lesson-grid');
        
        groups.sort().forEach(group => {
            const book = groupBookMap[group] || 'Livro não definido';
            const lessons = getGroupLessons(group);
            const progress = currentLessonProgress[group] || [];
            const completed = progress.filter(p => p.completed).length;
            const total = lessons.length;
            const percentage = total > 0 ? Math.round((completed / total) * 100) : 0;
            
            // Conta quantas revisions foram concluídas
            const revisionsCompleted = progress.filter(p => {
                const lesson = lessons.find(l => l.id === p.lesson);
                return lesson && lesson.isRevision && p.completed;
            }).length;
            const totalRevisions = lessons.filter(l => l.isRevision).length;
            
            const card = document.createElement('div');
            card.className = 'group-card';
            card.innerHTML = `
                <h3>${group}</h3>
                <div class="book-info">📖 ${book}</div>
                <div class="progress">${completed} de ${total} aulas concluídas</div>
                ${totalRevisions > 0 ? `<div class="progress" style="font-size:0.8rem; color: var(--warning);">🔄 ${revisionsCompleted}/${totalRevisions} revisions</div>` : ''}
                <div class="progress-bar">
                    <div class="fill" style="width: ${percentage}%;"></div>
                </div>
                <button onclick="openGroupDetail('${group}')" style="margin-top: 15px; width: 100%;">
                    Ver Detalhes
                </button>
            `;
            grid.appendChild(card);
        });
    }

    function openGroupDetail(group) {
        currentGroup = group;
        const modal = document.getElementById('lesson-detail-modal');
        const title = document.getElementById('lesson-detail-title');
        const content = document.getElementById('lesson-detail-content');
        
        const book = groupBookMap[group] || 'Livro não definido';
        title.textContent = `📖 Lesson Plan - ${group}`;
        
        const lessons = getGroupLessons(group);
        const progress = currentLessonProgress[group] || [];
        
        if (lessons.length === 0) {
            content.innerHTML = `
                <div class="group-header">
                    <h2>${group}</h2>
                    <span class="book-badge">${book}</span>
                </div>
                <p style="color: var(--text-sec);">Nenhuma lesson plan disponível para esta turma.</p>
            `;
            modal.classList.remove('hidden');
            return;
        }
        
        const revisions = lessons.filter(l => l.isRevision);
        const tests = lessons.filter(l => l.isTest);
        const regularLessons = lessons.filter(l => !l.isRevision && !l.isTest);
        
        let html = `
            <div class="group-header">
                <div>
                    <h2>${group}</h2>
                    <span class="book-badge">📖 ${book}</span>
                </div>
                <div style="display: flex; gap: 15px; flex-wrap: wrap;">
                    <span style="color: var(--text-sec);">Total: ${lessons.length} aulas</span>
                    <span style="color: var(--success);">✅ ${progress.filter(p => p.completed).length} concluídas</span>
                    ${revisions.length > 0 ? `<span style="color: var(--warning);">🔄 ${revisions.length} revisions</span>` : ''}
                    ${tests.length > 0 ? `<span style="color: var(--danger);">📝 ${tests.length} tests</span>` : ''}
                </div>
                <div style="margin-top: 10px; width: 100%; display: flex; gap: 10px; flex-wrap: wrap;">
                    <button onclick="markAllGroupLessons('${group}', true)" style="font-size: 0.8rem; padding: 6px 12px; flex: 1;">
                        Marcar Todas
                    </button>
                    <button onclick="markAllGroupLessons('${group}', false)" style="font-size: 0.8rem; padding: 6px 12px; flex: 1; border-color: var(--danger); color: var(--danger);">
                        Desmarcar Todas
                    </button>
                </div>
            </div>
            <div class="group-lessons-container">
        `;
        
        lessons.forEach((lesson, index) => {
            const progressItem = progress.find(p => p.lesson === lesson.id);
            const isChecked = progressItem ? progressItem.completed : false;
            const date = progressItem ? progressItem.date : '';
            
            let extraClass = '';
            let extraBadge = '';
            if (lesson.isRevision) {
                extraClass = ' revision';
                extraBadge = ' <span class="revision-badge">REVISION</span>';
            }
            if (lesson.isTest) {
                extraClass = ' test';
                extraBadge = ' <span class="test-badge">TEST</span>';
            }
            
            html += `
                <div class="lesson-item${extraClass}">
                    <input type="checkbox" id="lg_${index}" ${isChecked ? 'checked' : ''} 
                           onchange="toggleGroupLesson('${group}', '${lesson.id}', this.checked)">
                    <label for="lg_${index}" class="lesson-label">
                        ${lesson.label}
                        ${extraBadge}
                    </label>
                    ${date ? `<span class="lesson-date">📅 ${date}</span>` : ''}
                    ${isChecked ? '<span class="lesson-checked">✓</span>' : ''}
                </div>
            `;
        });
        
        html += '</div>';
        content.innerHTML = html;
        modal.classList.remove('hidden');
    }

    function toggleGroupLesson(group, lessonId, completed) {
        if(!currentLessonProgress[group]) currentLessonProgress[group] = [];
        
        const existing = currentLessonProgress[group].find(p => p.lesson === lessonId);
        if(existing) {
            existing.completed = completed;
            if(completed) {
                existing.date = new Date().toLocaleDateString('pt-BR');
            } else {
                existing.date = '';
            }
        } else {
            currentLessonProgress[group].push({
                lesson: lessonId,
                completed: completed,
                date: completed ? new Date().toLocaleDateString('pt-BR') : ''
            });
        }
        
        saveLessonProgress();
        if(currentGroup) {
            openGroupDetail(currentGroup);
        }
        renderGroupLessonPlans();
    }

    function markAllGroupLessons(group, completed) {
        const lessons = getGroupLessons(group);
        if(!currentLessonProgress[group]) currentLessonProgress[group] = [];
        
        lessons.forEach(lesson => {
            const existing = currentLessonProgress[group].find(p => p.lesson === lesson.id);
            if(existing) {
                existing.completed = completed;
                if(completed) {
                    existing.date = new Date().toLocaleDateString('pt-BR');
                } else {
                    existing.date = '';
                }
            } else {
                currentLessonProgress[group].push({
                    lesson: lesson.id,
                    completed: completed,
                    date: completed ? new Date().toLocaleDateString('pt-BR') : ''
                });
            }
        });
        
        saveLessonProgress();
        if(currentGroup) {
            openGroupDetail(currentGroup);
        }
        renderGroupLessonPlans();
    }

    function resetLessonProgress() {
        if(!currentGroup) return;
        if(confirm(`Tem certeza que deseja resetar todo o progresso da turma ${currentGroup}?`)) {
            currentLessonProgress[currentGroup] = [];
            saveLessonProgress();
            if(currentGroup) {
                openGroupDetail(currentGroup);
            }
            renderGroupLessonPlans();
        }
    }

    // ========== LISTA DE PRESENÇA GERAL ==========
    function openAttendanceList() {
        document.getElementById('attendance-modal').classList.remove('hidden');
        loadAttendanceTable();
    }

    function populateGroupSelect() {
        const select = document.getElementById('att-group-select');
        const groups = Object.keys(studentsData).sort();
        groups.forEach(g => {
            const opt = document.createElement('option');
            opt.value = g;
            opt.textContent = g;
            select.appendChild(opt);
        });
    }

    function loadAttendanceTable() {
        const group = document.getElementById('att-group-select').value;
        const monthVal = document.getElementById('att-month-select').value;
        const container = document.getElementById('attendance-table-container');
        
        if(!group) {
            container.innerHTML = '<p style="color: var(--text-sec);">Selecione uma turma.</p>';
            return;
        }

        const students = studentsData[group] || [];
        if(students.length === 0) {
            container.innerHTML = '<p style="color: var(--text-sec);">Nenhum aluno encontrado para esta turma.</p>';
            return;
        }

        const [year, month] = monthVal.split('-').map(Number);
        const daysInMonth = new Date(year, month, 0).getDate();
        
        let html = '<table class="attendance-table"><thead><tr><th>Aluno</th>';
        for(let d=1; d<=daysInMonth; d++) {
            html += `<th>${d}</th>`;
        }
        html += '</tr></thead><tbody>';

        students.forEach(student => {
            html += `<tr><td style="text-align:left; padding-left:10px; font-weight:500;">${student}</td>`;
            for(let d=1; d<=daysInMonth; d++) {
                html += `<td>•</td>`;
            }
            html += '</tr>';
        });

        html += '</tbody></table>';
        html += '<p style="font-size:0.8rem; color: var(--text-sec); margin-top:12px; font-style:italic;">* Visualização estrutural. O controle detalhado por dia é feito no RAD de cada aula.</p>';
        
        container.innerHTML = html;
    }

    function closeModal(id) {
        document.getElementById(id).classList.add('hidden');
    }

</script>
</body>
</html>
