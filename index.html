<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cronograma Escolar</title>
    <style>
        :root {
            --bg-color: #050505;
            --card-bg: #0a0a0a;
            --text-main: #ffffff;
            --text-sec: #a0a0a0;
            --accent: #00f3ff;
            --accent-dim: rgba(0, 243, 255, 0.1);
            --border: #333;
            --danger: #ff4757;
            --success: #2ed573;
            --warning: #ffa502;
            --font-main: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-main);
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* --- Header & Nav --- */
        header {
            background: rgba(5, 5, 5, 0.95);
            border-bottom: 1px solid var(--border);
            padding: 1rem;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
            text-align: center;
        }

        h1 { font-size: 1.2rem; letter-spacing: 1px; text-transform: uppercase; color: var(--accent); margin-bottom: 0.5rem; }
        p.subtitle { font-size: 0.8rem; color: var(--text-sec); }

        /* --- Containers --- */
        .container { max-width: 1200px; margin: 0 auto; padding: 1.5rem 1rem; }
        .hidden { display: none !important; }
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* --- Teacher Grid (Home) --- */
        .teachers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .teacher-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 4px; /* Less rounded */
            padding: 1.5rem 1rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 120px;
        }

        .teacher-card:hover { border-color: var(--accent); box-shadow: 0 0 15px var(--accent-dim); transform: translateY(-2px); }
        .teacher-name { font-weight: 600; font-size: 1rem; text-transform: uppercase; letter-spacing: 1px; z-index: 2; }
        
        /* Action Button on Home */
        .action-btn-large {
            grid-column: 1 / -1;
            background: linear-gradient(90deg, #1a1a1a, #2a2a2a);
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 1rem;
            border-radius: 4px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            margin-top: 2rem;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .action-btn-large:active { transform: scale(0.98); }

        /* --- Professor View --- */
        .prof-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid var(--border);
            padding-bottom: 1rem;
        }

        .back-btn {
            background: transparent;
            border: 1px solid var(--text-sec);
            color: var(--text-sec);
            padding: 0.5rem 1rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: 0.3s;
        }
        .back-btn:hover { border-color: var(--accent); color: var(--accent); }

        .week-selector {
            display: flex;
            gap: 0.5rem;
            overflow-x: auto;
            padding-bottom: 0.5rem;
            margin-bottom: 1rem;
            scrollbar-width: thin;
            scrollbar-color: var(--accent) var(--bg-color);
        }
        
        .week-btn {
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text-sec);
            padding: 0.6rem 1.2rem;
            border-radius: 4px;
            white-space: nowrap;
            cursor: pointer;
            font-size: 0.85rem;
            transition: 0.3s;
        }
        .week-btn.active { background: var(--accent); color: #000; border-color: var(--accent); font-weight: bold; }

        .schedule-list { display: flex; flex-direction: column; gap: 1rem; }

        .day-group {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 4px;
            overflow: hidden;
        }

        .day-title {
            background: #111;
            padding: 0.8rem 1rem;
            font-size: 0.9rem;
            font-weight: bold;
            color: var(--accent);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
        }

        .class-item {
            padding: 1rem;
            border-bottom: 1px solid #222;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .class-item:last-child { border-bottom: none; }

        .class-row { display: flex; justify-content: space-between; align-items: center; font-size: 0.9rem; }
        .c-time { color: var(--text-sec); font-family: monospace; font-size: 1rem; }
        .c-info { display: flex; flex-direction: column; gap: 2px; flex: 1; margin-left: 1rem; }
        .c-group { font-weight: bold; color: #fff; }
        .c-details { font-size: 0.8rem; color: var(--text-sec); display: flex; gap: 10px; flex-wrap: wrap; }
        .badge { padding: 2px 6px; border-radius: 2px; background: #222; font-size: 0.7rem; border: 1px solid #333; }
        .badge-book { border-color: var(--accent); color: var(--accent); }
        
        .rad-btn {
            background: transparent;
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 0.4rem 0.8rem;
            border-radius: 4px;
            font-size: 0.75rem;
            cursor: pointer;
            text-transform: uppercase;
            font-weight: bold;
            margin-top: 0.5rem;
            align-self: flex-start;
        }
        .rad-btn.done { background: var(--accent); color: #000; }

        /* --- Modals & Tabs --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            display: flex; justify-content: center; align-items: flex-end; /* Mobile bottom sheet style */
            opacity: 0; pointer-events: none; transition: 0.3s;
        }
        .modal-overlay.open { opacity: 1; pointer-events: all; }
        
        .modal-content {
            background: #111;
            width: 100%;
            max-width: 600px;
            height: 90vh;
            border-top: 2px solid var(--accent);
            border-radius: 8px 8px 0 0;
            display: flex; flex-direction: column;
            transform: translateY(100%); transition: 0.3s;
        }
        .modal-overlay.open .modal-content { transform: translateY(0); }
        
        @media(min-width: 600px) {
            .modal-overlay { align-items: center; }
            .modal-content { height: auto; max-height: 90vh; border-radius: 8px; }
        }

        .modal-header {
            padding: 1rem; border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center;
            background: #1a1a1a;
        }
        .modal-body { padding: 1.5rem; overflow-y: auto; flex: 1; }
        .close-modal { background: none; border: none; color: #fff; font-size: 1.5rem; cursor: pointer; }

        /* Tabs inside Modal */
        .tabs { display: flex; border-bottom: 1px solid var(--border); margin-bottom: 1rem; }
        .tab-btn {
            flex: 1; padding: 1rem; background: none; border: none;
            color: var(--text-sec); cursor: pointer; border-bottom: 2px solid transparent;
            font-weight: 600; text-transform: uppercase; font-size: 0.85rem;
        }
        .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.3s; }

        /* Forms */
        .form-group { margin-bottom: 1.2rem; }
        label { display: block; color: var(--text-sec); font-size: 0.85rem; margin-bottom: 0.5rem; }
        select, input[type="text"], textarea {
            width: 100%; background: #0a0a0a; border: 1px solid var(--border);
            color: #fff; padding: 0.8rem; border-radius: 4px; font-family: inherit;
        }
        select:focus, input:focus, textarea:focus { outline: none; border-color: var(--accent); }
        
        .checkbox-list { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; max-height: 300px; overflow-y: auto; }
        .checkbox-item {
            display: flex; align-items: center; gap: 0.5rem;
            background: #111; padding: 0.5rem; border: 1px solid var(--border); border-radius: 4px;
            font-size: 0.8rem; cursor: pointer;
        }
        .checkbox-item.selected { border-color: var(--accent); background: var(--accent-dim); }
        .checkbox-item input { accent-color: var(--accent); }

        .status-options { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
        .status-btn {
            flex: 1; padding: 0.8rem; border: 1px solid var(--border);
            background: #111; color: var(--text-sec); border-radius: 4px;
            cursor: pointer; font-size: 0.8rem; text-align: center;
        }
        .status-btn.active { border-color: var(--success); color: var(--success); background: rgba(46, 213, 115, 0.1); }
        .status-btn.cancelled.active { border-color: var(--danger); color: var(--danger); background: rgba(255, 71, 87, 0.1); }
        .status-btn.noshow.active { border-color: var(--warning); color: var(--warning); background: rgba(255, 165, 2, 0.1); }

        .btn-save {
            width: 100%; padding: 1rem; background: var(--accent); color: #000;
            border: none; border-radius: 4px; font-weight: bold; text-transform: uppercase;
            cursor: pointer; margin-top: 1rem;
        }

        /* Attendance Table */
        .attendance-table-wrapper { overflow-x: auto; }
        .attendance-table { width: 100%; border-collapse: collapse; font-size: 0.8rem; min-width: 600px; }
        .attendance-table th, .attendance-table td {
            border: 1px solid var(--border); padding: 0.5rem; text-align: center;
        }
        .attendance-table th { background: #111; color: var(--accent); position: sticky; left: 0; }
        .attendance-table td:first-child { text-align: left; position: sticky; left: 0; background: #111; z-index: 1; min-width: 150px; }
        .att-mark { cursor: pointer; user-select: none; }
        .att-p { color: var(--success); }
        .att-a { color: var(--danger); }
        .att-c { color: var(--text-sec); }

        /* Calculator */
        .calc-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem; }
        .calc-card { background: #111; padding: 1rem; border-radius: 4px; border: 1px solid var(--border); text-align: center; }
        .calc-val { font-size: 1.5rem; font-weight: bold; color: var(--accent); display: block; }
        .calc-label { font-size: 0.75rem; color: var(--text-sec); text-transform: uppercase; }

        /* Loading */
        .loader {
            border: 4px solid #111; border-top: 4px solid var(--accent);
            border-radius: 50%; width: 40px; height: 40px;
            animation: spin 1s linear infinite; margin: 2rem auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    </style>
</head>
<body>

<header>
    <h1 id="app-title">Cronograma</h1>
    <p class="subtitle" id="current-date-display"></p>
</header>

<div class="container">
    
    <!-- TELA INICIAL -->
    <div id="home-screen" class="fade-in">
        <div id="loading" class="loader"></div>
        <div id="teachers-container" class="teachers-grid"></div>
        <button class="action-btn-large" onclick="openAttendanceSelector()">
            📋 Lista de Presença Geral
        </button>
    </div>

    <!-- TELA DO PROFESSOR -->
    <div id="prof-screen" class="hidden fade-in">
        <div class="prof-header">
            <button class="back-btn" onclick="goHome()">← Voltar</button>
            <h2 id="prof-name-display" style="color:var(--accent); text-transform:uppercase;"></h2>
            <div style="width: 60px;"></div> <!-- Spacer for centering -->
        </div>

        <!-- Seletor de Semanas -->
        <div id="week-selector-container" class="week-selector"></div>

        <div id="schedule-container" class="schedule-list"></div>
        
        <div style="margin-top: 2rem; border-top: 1px solid var(--border); padding-top: 1rem;">
            <button class="action-btn-large" style="margin-top:0; font-size:0.8rem; padding: 0.8rem;" onclick="openCalcCalculator()">
                📊 Class Calculator
            </button>
        </div>
    </div>

    <!-- TELA DE SELEÇÃO DE PRESENÇA (HOME) -->
    <div id="attendance-select-screen" class="hidden fade-in">
        <div class="prof-header">
            <button class="back-btn" onclick="goHome()">← Voltar</button>
            <h2>Selecione a Turma</h2>
            <div style="width: 60px;"></div>
        </div>
        <div id="group-list-container" class="teachers-grid"></div>
    </div>

    <!-- TELA DE VISUALIZAÇÃO DE PRESENÇA -->
    <div id="attendance-view-screen" class="hidden fade-in">
        <div class="prof-header">
            <button class="back-btn" onclick="showAttendanceSelector()">← Voltar</button>
            <h2 id="att-view-title">Presença</h2>
            <div style="width: 60px;"></div>
        </div>
        <div class="form-group">
            <label>Mês de Referência:</label>
            <select id="att-month-select" onchange="renderAttendanceTable()"></select>
        </div>
        <div class="attendance-table-wrapper">
            <table class="attendance-table" id="att-table"></table>
        </div>
    </div>

</div>

<!-- MODAL RAD -->
<div id="rad-modal" class="modal-overlay">
    <div class="modal-content">
        <div class="modal-header">
            <h3 style="color:var(--accent)">RAD - Registro de Aula</h3>
            <button class="close-modal" onclick="closeModal('rad-modal')">&times;</button>
        </div>
        <div class="modal-body">
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('rad-main')">Dados</button>
                <button class="tab-btn" onclick="switchTab('rad-lesson')">Lesson Plan</button>
                <button class="tab-btn" onclick="switchTab('rad-attend')">Presença</button>
            </div>

            <!-- Tab Dados -->
            <div id="rad-main" class="tab-content active">
                <div class="form-group">
                    <label>Status da Aula:</label>
                    <div class="status-options">
                        <div class="status-btn active" data-status="realizada" onclick="setRadStatus('realizada')">Realizada</div>
                        <div class="status-btn cancelled" data-status="cancelada" onclick="setRadStatus('cancelada')">Cancelada</div>
                        <div class="status-btn noshow" data-status="noshow" onclick="setRadStatus('noshow')">No Show</div>
                    </div>
                </div>
                <div class="form-group">
                    <label>Observações:</label>
                    <textarea id="rad-obs" rows="3" placeholder="Anotações sobre a aula..."></textarea>
                </div>
            </div>

            <!-- Tab Lesson Plan -->
            <div id="rad-lesson" class="tab-content">
                <div class="form-group">
                    <label>Conteúdo Realizado (Marque o que foi feito):</label>
                    <div id="lesson-plan-list" class="checkbox-list">
                        <!-- Checkboxes injetados via JS -->
                    </div>
                    <p style="font-size:0.7rem; color:#666; margin-top:5px;">* Baseado no histórico da turma.</p>
                </div>
            </div>

            <!-- Tab Presença -->
            <div id="rad-attend" class="tab-content">
                <div id="rad-students-list">
                    <!-- Lista de alunos injetada via JS -->
                </div>
            </div>

            <button class="btn-save" onclick="saveRad()">Salvar Registro</button>
            <button class="back-btn" style="width:100%; margin-top:0.5rem; border-color:#333; color:#666;" onclick="clearRad()">Limpar RAD</button>
        </div>
    </div>
</div>

<!-- MODAL CALCULATOR -->
<div id="calc-modal" class="modal-overlay">
    <div class="modal-content">
        <div class="modal-header">
            <h3 style="color:var(--accent)">Class Calculator</h3>
            <button class="close-modal" onclick="closeModal('calc-modal')">&times;</button>
        </div>
        <div class="modal-body">
            <div class="form-group">
                <label>Selecione o Mês:</label>
                <select id="calc-month-select" onchange="updateCalcStats()"></select>
            </div>
            
            <div class="calc-grid">
                <div class="calc-card">
                    <span class="calc-val" id="stat-school-done">0</span>
                    <span class="calc-label">Escola (Realizadas)</span>
                </div>
                <div class="calc-card">
                    <span class="calc-val" id="stat-in-company-done">0</span>
                    <span class="calc-label">In Company (Realizadas)</span>
                </div>
                <div class="calc-card">
                    <span class="calc-val" id="stat-school-noshow">0</span>
                    <span class="calc-label">Escola (No Show)</span>
                </div>
                <div class="calc-card">
                    <span class="calc-val" id="stat-in-company-noshow">0</span>
                    <span class="calc-label">In Company (No Show)</span>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // --- CONFIGURAÇÕES ---
    const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQmSAl1ndXXSgDWbrjCiSDkmtECkP94Rr2nk-kIHV-zHd4NFSE9CzyQb6YP2Rt4lEQNYOpuvgjCYDal/pub?output=csv';
    const STUDENTS_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSlWLLO76YOXic0n11ttKL-UKoNGTT3VKEogt3pvHONM4Hnb3upvgYj_h8DOC57xmAobUXSIznc7V6x/pub?output=csv';

    // Professores Válidos
    const VALID_TEACHERS = [
        { name: 'MYCAEL', color: '#FF6B6B' }, { name: 'HOPE', color: '#FFE66D' },
        { name: 'PEDRO', color: '#F38181' }, { name: 'DIOGO', color: '#AA96DA' },
        { name: 'LIVIA', color: '#FCBAD3' }, { name: 'TOSCA', color: '#A8D8EA' },
        { name: 'IAGO', color: '#FF9F43' }, { name: 'SARA', color: '#54a0ff' },
        { name: 'CAROL', color: '#5f27cd' }, { name: 'CARLA', color: '#00d2d3' },
        { name: 'LUISA', color: '#ff9ff3' }
    ];

    // Estrutura dos Books (Simplificada para o exemplo, mas expansível)
    const BOOK_STRUCTURE = {
        '1': Array.from({length: 42}, (_, i) => i < 41 ? `Lesson ${i+1}` : 'Test Book 1'), // Exemplo simplificado
        'DEFAULT': Array.from({length: 46}, (_, i) => {
            if (i % 6 === 5 && i < 40) return `Revision ${i*2}-${i*2+10}`;
            if (i === 44) return 'Test Book';
            if (i === 45) return 'Test Correction';
            return `Lesson ${i+1}`;
        })
    };

    // Estado Global
    let allClasses = [];
    let studentsData = {}; // { "TURMA": ["Aluno 1", "Aluno 2"] }
    let weeksMap = {}; // { "WeekName": [classes...] }
    let currentProf = null;
    let currentWeek = null;
    let radContext = null; // { classId, date, group, book }

    // --- INICIALIZAÇÃO ---
    document.addEventListener('DOMContentLoaded', () => {
        document.getElementById('current-date-display').innerText = new Date().toLocaleDateString('pt-BR');
        loadData();
    });

    async function loadData() {
        try {
            const [sheetRes, studentsRes] = await Promise.all([
                fetch(SHEET_URL).then(r => r.text()),
                fetch(STUDENTS_URL).then(r => r.text())
            ]);
            
            parseStudents(studentsRes);
            parseSchedule(sheetRes);
            renderHome();
        } catch (e) {
            console.error(e);
            document.getElementById('loading').innerHTML = '<p style="color:var(--danger)">Erro ao carregar dados. Verifique a conexão.</p>';
        }
    }

    function parseStudents(csv) {
        const lines = csv.split('\n').slice(1); // Pula header
        studentsData = {};
        lines.forEach(line => {
            const parts = line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/); // Split CSV seguro
            if (parts.length >= 2) {
                let group = parts[0].trim().replace(/"/g, '').toUpperCase();
                let name = parts[1].trim().replace(/"/g, '');
                if (!studentsData[group]) studentsData[group] = [];
                studentsData[group].push(name);
            }
        });
    }

    function parseSchedule(csv) {
        const lines = csv.split('\n').map(l => l.trim()).filter(l => l);
        if (lines.length < 2) return;

        const headers = lines[0].split(',').map(h => h.trim().replace(/"/g, ''));
        
        // Identificar colunas de dias (F, G, H... ou índices dinâmicos)
        // Estrutura esperada: A(Lang), B(Book), C(Group), D(Room), E(Mod), F(Hour), G..K(Days)
        // Mas o usuário disse que agora tem "This Week", "Next Week" como nomes de páginas.
        // O CSV pub?output=csv de uma planilha com múltiplas abas geralmente só exporta a aba ativa OU concatena tudo se for um range específico.
        // ASSUNÇÃO: O CSV contém todas as semanas concatenadas ou a estrutura de colunas muda.
        // Vamos assumir que o CSV tem colunas de data explícitas no cabeçalho ou estrutura fixa.
        
        // Correção baseada no prompt anterior: "sempre que eu colocar uma semana nova quero que o site reconheça automaticamente"
        // Isso implica que o CSV deve ter colunas com datas. Vamos procurar por padrões de data no cabeçalho.
        
        const dayCols = [];
        const dateMap = {}; // Map index -> Date String
        
        headers.forEach((h, idx) => {
            // Tenta encontrar datas ou nomes de dias seguidos de data
            // Ex: "Monday 25/08", "Tue 26", etc.
            if (idx >= 5) { // Ignora as primeiras colunas fixas
                dayCols.push(idx);
                dateMap[idx] = h; // Salva o nome da coluna como identificador da data/semana
            }
        });

        allClasses = [];
        let classIdCounter = 0;

        for (let i = 1; i < lines.length; i++) {
            const row = lines[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(c => c.trim().replace(/^"|"$/g, ''));
            if (row.length < 6) continue;

            const book = row[1] || '';
            const groupRaw = row[2] || '';
            const room = row[3] || '';
            const mod = row[4] || '';
            const time = row[5] || '';

            // Processar cada coluna de dia
            dayCols.forEach(colIdx => {
                const cell = row[colIdx];
                if (!cell) return;

                // Extrair professor da célula
                const teacherName = findTeacher(cell);
                if (!teacherName) return;

                // Determinar a semana baseada no cabeçalho da coluna
                // Lógica simples: Agrupar por nome da semana se existir, ou gerar um ID único
                // O usuário renomeou as abas para "This Week", "Next Week". 
                // No CSV exportado, isso pode aparecer no cabeçalho ou precisamos inferir.
                // Vamos usar o texto do cabeçalho como chave da semana.
                const weekKey = dateMap[colIdx] || `Week_${colIdx}`;
                
                // Tentar extrair data real do cabeçalho para ordenação
                const dateObj = parseDateFromHeader(dateMap[colIdx]);

                allClasses.push({
                    id: `cls_${classIdCounter++}`,
                    weekKey: weekKey,
                    dateObj: dateObj,
                    dayName: dateMap[colIdx],
                    time: time,
                    book: book,
                    groupRaw: groupRaw,
                    group: parseGroupName(groupRaw),
                    room: room,
                    mod: mod,
                    teacher: teacherName,
                    rawCell: cell
                });
            });
        }

        organizeWeeks();
    }

    function parseDateFromHeader(headerStr) {
        // Tenta extrair data de strings como "Monday 25/08" ou "This Week"
        // Se for "This Week", retorna data atual + offset? 
        // Para simplificar, vamos retornar um objeto Date baseado na string se possível, ou Infinity para ordenação relativa
        const dateMatch = headerStr.match(/(\d{1,2})\/(\d{1,2})/);
        if (dateMatch) {
            const d = parseInt(dateMatch[1]);
            const m = parseInt(dateMatch[2]) - 1;
            const year = new Date().getFullYear();
            return new Date(year, m, d);
        }
        // Fallback para ordenação de "This Week" vs "Next Week"
        if (headerStr.toLowerCase().includes('this')) return new Date();
        if (headerStr.toLowerCase().includes('next')) {
            const d = new Date(); d.setDate(d.getDate() + 7); return d;
        }
        return new Date(0); // Antigo
    }

    function organizeWeeks() {
        weeksMap = {};
        allClasses.forEach(cls => {
            if (!weeksMap[cls.weekKey]) weeksMap[cls.weekKey] = [];
            weeksMap[cls.weekKey].push(cls);
        });

        // Ordenar chaves das semanas por data
        Object.keys(weeksMap).forEach(key => {
            weeksMap[key].sort((a, b) => a.dateObj - b.dateObj);
        });
    }

    function findTeacher(str) {
        str = str.toUpperCase();
        for (let t of VALID_TEACHERS) {
            if (str.includes(t.name)) return t.name;
        }
        return null;
    }

    function parseGroupName(raw) {
        // Lógica simples para separar Nome da Turma e Book se estiverem juntos
        // Ex: "Dune G1" -> Group: Dune, Book: G1 (se book vier vazio da col B)
        return raw; 
    }

    // --- RENDERIZAÇÃO HOME ---
    function renderHome() {
        document.getElementById('loading').classList.add('hidden');
        const container = document.getElementById('teachers-container');
        container.innerHTML = '';

        VALID_TEACHERS.sort((a,b) => a.name.localeCompare(b.name)).forEach(t => {
            const card = document.createElement('div');
            card.className = 'teacher-card';
            card.style.borderColor = t.color;
            card.innerHTML = `<div class="teacher-name" style="color:${t.color}">${t.name}</div>`;
            card.onclick = () => openProfView(t.name, t.color);
            container.appendChild(card);
        });
    }

    // --- NAVEGAÇÃO ---
    function goHome() {
        document.getElementById('home-screen').classList.remove('hidden');
        document.getElementById('prof-screen').classList.add('hidden');
        document.getElementById('attendance-select-screen').classList.add('hidden');
        document.getElementById('attendance-view-screen').classList.add('hidden');
        currentProf = null;
    }

    function openProfView(name, color) {
        currentProf = { name, color };
        document.getElementById('home-screen').classList.add('hidden');
        document.getElementById('prof-screen').classList.remove('hidden');
        
        const title = document.getElementById('prof-name-display');
        title.innerText = name;
        title.style.color = color;

        renderWeekSelector();
    }

    function renderWeekSelector() {
        const container = document.getElementById('week-selector-container');
        container.innerHTML = '';
        
        const weeks = Object.keys(weeksMap).sort((a,b) => {
            // Ordenar baseado na primeira data de cada semana
            const dA = weeksMap[a][0]?.dateObj || new Date(0);
            const dB = weeksMap[b][0]?.dateObj || new Date(0);
            return dA - dB;
        });

        if (weeks.length === 0) {
            container.innerHTML = '<p style="color:#666; padding:1rem;">Nenhuma semana encontrada.</p>';
            return;
        }

        weeks.forEach((wKey, idx) => {
            const btn = document.createElement('button');
            btn.className = `week-btn ${idx === 0 ? 'active' : ''}`;
            // Formatar nome da semana: "August Week 4" ou manter o original "This Week"
            btn.innerText = wKey; 
            btn.onclick = () => {
                document.querySelectorAll('.week-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                renderSchedule(wKey);
            };
            container.appendChild(btn);
        });

        // Renderizar a primeira semana por padrão
        if (weeks.length > 0) renderSchedule(weeks[0]);
    }

    function renderSchedule(weekKey) {
        currentWeek = weekKey;
        const classes = weeksMap[weekKey] || [];
        const container = document.getElementById('schedule-container');
        container.innerHTML = '';

        // Agrupar por dia (usando o nome da coluna/header como dia)
        const byDay = {};
        classes.forEach(c => {
            if (!byDay[c.dayName]) byDay[c.dayName] = [];
            byDay[c.dayName].push(c);
        });

        // Ordenar dias (Segunda a Sexta/Sabado) baseado na data
        const sortedDays = Object.keys(byDay).sort((a,b) => {
            // Encontrar a menor data dentro desse dia para comparar
            const dA = byDay[a][0].dateObj;
            const dB = byDay[b][0].dateObj;
            return dA - dB;
        });

        sortedDays.forEach(day => {
            const dayDiv = document.createElement('div');
            dayDiv.className = 'day-group';
            
            // Format date for title
            const dateStr = byDay[day][0].dateObj.toLocaleDateString('pt-BR', {day:'2-digit', month:'2-digit'});
            
            dayDiv.innerHTML = `<div class="day-title">${day} <span style="opacity:0.7; font-weight:normal">(${dateStr})</span></div>`;
            
            const list = document.createElement('div');
            list.className = 'schedule-list'; // Reusing style
            
            byDay[day].forEach(cls => {
                if (cls.teacher !== currentProf.name) return; // Filter only current prof

                const radData = getRadData(cls.id);
                const isDone = radData && radData.status === 'realizada';

                const item = document.createElement('div');
                item.className = 'class-item';
                item.innerHTML = `
                    <div class="class-row">
                        <span class="c-time">${cls.time}</span>
                        <span class="badge badge-book">${cls.book}</span>
                    </div>
                    <div class="c-info">
                        <span class="c-group">${cls.group}</span>
                        <div class="c-details">
                            <span>📍 ${cls.room}</span>
                            <span>${cls.mod}</span>
                        </div>
                    </div>
                    <button class="rad-btn ${isDone ? 'done' : ''}" onclick="openRad('${cls.id}')">
                        ${isDone ? 'RAD ✓' : 'RAD'}
                    </button>
                `;
                list.appendChild(item);
            });

            dayDiv.appendChild(list);
            container.appendChild(dayDiv);
        });
        
        if (container.innerHTML === '') {
            container.innerHTML = '<p style="text-align:center; color:#666; margin-top:2rem;">Sem aulas nesta semana.</p>';
        }
    }

    // --- RAD SYSTEM ---
    function openRad(classId) {
        const cls = allClasses.find(c => c.id === classId);
        if (!cls) return;

        radContext = cls;
        const modal = document.getElementById('rad-modal');
        
        // Reset tabs
        switchTab('rad-main');
        
        // Load Data
        const saved = getRadData(classId) || { status: 'realizada', obs: '', lessons: [], attendance: {} };
        
        document.getElementById('rad-obs').value = saved.obs || '';
        setRadStatus(saved.status || 'realizada');
        
        // Render Lessons
        renderLessonPlan(cls.book, saved.lessons || []);
        
        // Render Attendance
        renderRadAttendance(cls.group, saved.attendance || {});

        modal.classList.add('open');
    }

    function renderLessonPlan(bookRaw, savedLessons) {
        const container = document.getElementById('lesson-plan-list');
        container.innerHTML = '';
        
        // Simplificação: Usar estrutura genérica ou tentar mapear bookRaw para 1-10
        // Se bookRaw for "G1", usa estrutura 1. Se não, usa DEFAULT.
        let structure = BOOK_STRUCTURE.DEFAULT;
        // Aqui poderia haver um map mais complexo baseado no input do usuário
        
        structure.forEach((lesson, idx) => {
            const id = `less_${idx}`;
            const isChecked = savedLessons.includes(id);
            
            const div = document.createElement('div');
            div.className = `checkbox-item ${isChecked ? 'selected' : ''}`;
            div.onclick = (e) => {
                // Toggle visual
                if(e.target.tagName !== 'INPUT') {
                    const input = div.querySelector('input');
                    input.checked = !input.checked;
                    div.classList.toggle('selected');
                }
            };
            div.innerHTML = `
                <input type="checkbox" id="${id}" value="${id}" ${isChecked ? 'checked' : ''}>
                <label for="${id}" style="margin:0; cursor:pointer; flex:1;">${lesson}</label>
            `;
            container.appendChild(div);
        });
    }

    function renderRadAttendance(groupRaw, savedAtt) {
        const container = document.getElementById('rad-students-list');
        container.innerHTML = '';
        
        // Normalizar nome do grupo para buscar no studentsData
        const searchGroup = Object.keys(studentsData).find(k => k.includes(groupRaw.toUpperCase())) || groupRaw.toUpperCase();
        const students = studentsData[searchGroup] || [];

        if (students.length === 0) {
            container.innerHTML = '<p style="color:#666; font-size:0.8rem;">Nenhum aluno encontrado para esta turma na base de dados.</p>';
            return;
        }

        students.forEach((name, idx) => {
            const attId = `att_${idx}`;
            const status = savedAtt[attId] || 'present'; // present, absent
            
            const div = document.createElement('div');
            div.style.display = 'flex';
            div.style.justifyContent = 'space-between';
            div.style.alignItems = 'center';
            div.style.padding = '0.5rem';
            div.style.borderBottom = '1px solid #222';
            
            div.innerHTML = `
                <span style="font-size:0.9rem;">${name}</span>
                <select onchange="updateAttTemp('${attId}', this.value)" style="width:100px; padding:0.2rem; font-size:0.8rem;">
                    <option value="present" ${status === 'present' ? 'selected' : ''}>Presente</option>
                    <option value="absent" ${status === 'absent' ? 'selected' : ''}>Ausente</option>
                </select>
            `;
            container.appendChild(div);
        });
    }

    window.updateAttTemp = (id, val) => {
        if (!radContext.tempAtt) radContext.tempAtt = {};
        radContext.tempAtt[id] = val;
    };

    function setRadStatus(status) {
        document.querySelectorAll('.status-btn').forEach(b => {
            b.classList.remove('active');
            if (b.dataset.status === status) b.classList.add('active');
        });
        radContext.tempStatus = status;
    }

    function switchTab(tabId) {
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        event.target.classList.add('active');
    }

    function saveRad() {
        if (!radContext) return;

        // Collect Lessons
        const lessons = [];
        document.querySelectorAll('#lesson-plan-list input:checked').forEach(i => lessons.push(i.value));

        // Collect Attendance
        const attendance = radContext.tempAtt || {};

        const data = {
            status: radContext.tempStatus || 'realizada',
            obs: document.getElementById('rad-obs').value,
            lessons: lessons,
            attendance: attendance,
            timestamp: new Date().toISOString()
        };

        localStorage.setItem(`rad_${radContext.id}`, JSON.stringify(data));
        
        closeModal('rad-modal');
        renderSchedule(currentWeek); // Refresh UI
        alert('RAD salvo com sucesso!');
    }

    function clearRad() {
        if(confirm('Tem certeza que deseja limpar este RAD?')) {
            localStorage.removeItem(`rad_${radContext.id}`);
            closeModal('rad-modal');
            renderSchedule(currentWeek);
        }
    }

    function getRadData(id) {
        const data = localStorage.getItem(`rad_${id}`);
        return data ? JSON.parse(data) : null;
    }

    // --- ATTENDANCE GLOBAL ---
    function openAttendanceSelector() {
        document.getElementById('home-screen').classList.add('hidden');
        document.getElementById('attendance-select-screen').classList.remove('hidden');
        
        const container = document.getElementById('group-list-container');
        container.innerHTML = '';
        
        const groups = Object.keys(studentsData).sort();
        groups.forEach(g => {
            const card = document.createElement('div');
            card.className = 'teacher-card';
            card.style.height = 'auto';
            card.style.padding = '1rem';
            card.innerHTML = `<div class="teacher-name">${g}</div>`;
            card.onclick = () => openAttendanceView(g);
            container.appendChild(card);
        });
    }

    function showAttendanceSelector() {
        document.getElementById('attendance-view-screen').classList.add('hidden');
        document.getElementById('attendance-select-screen').classList.remove('hidden');
    }

    function openAttendanceView(group) {
        document.getElementById('attendance-select-screen').classList.add('hidden');
        document.getElementById('attendance-view-screen').classList.remove('hidden');
        document.getElementById('att-view-title').innerText = group;
        
        // Populate months
        const select = document.getElementById('att-month-select');
        select.innerHTML = '';
        const months = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
        const currMonth = new Date().getMonth();
        
        months.forEach((m, idx) => {
            const opt = document.createElement('option');
            opt.value = idx;
            opt.innerText = m;
            if (idx === currMonth) opt.selected = true;
            select.appendChild(opt);
        });

        renderAttendanceTable(group);
    }

    function renderAttendanceTable(group) {
        const monthIdx = parseInt(document.getElementById('att-month-select').value);
        const table = document.getElementById('att-table');
        table.innerHTML = '';
        
        const students = studentsData[group] || [];
        if (students.length === 0) {
            table.innerHTML = '<tr><td>Sem alunos</td></tr>';
            return;
        }

        // Header
        const daysInMonth = new Date(new Date().getFullYear(), monthIdx + 1, 0).getDate();
        let headerHtml = '<tr><th>Aluno</th>';
        for (let d = 1; d <= daysInMonth; d++) {
            headerHtml += `<th>${d}</th>`;
        }
        headerHtml += '</tr>';
        table.innerHTML = headerHtml;

        // Rows
        students.forEach((student, sIdx) => {
            let rowHtml = `<tr><td>${student}</td>`;
            for (let d = 1; d <= daysInMonth; d++) {
                // Simulação: Buscar dados reais exigiria salvar RAD com data específica (YYYY-MM-DD)
                // Aqui mostramos apenas a estrutura. Para funcionar 100%, o RAD precisa salvar a data da aula.
                // Vamos assumir que o RAD salva a data baseada no objeto class.dateObj
                rowHtml += `<td class="att-mark" onclick="toggleAtt(this)">-</td>`;
            }
            rowHtml += '</tr>';
            table.innerHTML += rowHtml;
        });
    }

    window.toggleAtt = (cell) => {
        const states = ['-', 'P', 'A', 'C']; // Presente, Ausente, Cancelado
        const colors = ['', 'var(--success)', 'var(--danger)', 'var(--text-sec)'];
        let currentState = cell.innerText;
        let nextIdx = (states.indexOf(currentState) + 1) % states.length;
        
        cell.innerText = states[nextIdx];
        cell.style.color = colors[nextIdx];
        cell.className = `att-mark ${nextIdx === 1 ? 'att-p' : nextIdx === 2 ? 'att-a' : nextIdx === 3 ? 'att-c' : ''}`;
    };

    // --- CALCULATOR ---
    function openCalcCalculator() {
        const modal = document.getElementById('calc-modal');
        const select = document.getElementById('calc-month-select');
        select.innerHTML = '';
        const months = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
        months.forEach((m, i) => {
            const opt = document.createElement('option');
            opt.value = i;
            opt.innerText = m;
            select.appendChild(opt);
        });
        select.value = new Date().getMonth();
        
        updateCalcStats();
        modal.classList.add('open');
    }

    function updateCalcStats() {
        if (!currentProf) return;
        const month = parseInt(document.getElementById('calc-month-select').value);
        
        let schoolDone = 0, inCompanyDone = 0;
        let schoolNoShow = 0, inCompanyNoShow = 0;

        // Percorrer todas as classes do professor
        const profClasses = allClasses.filter(c => c.teacher === currentProf.name);
        
        profClasses.forEach(c => {
            const rad = getRadData(c.id);
            if (!rad) return;

            // Verificar se a aula é neste mês
            const cDate = c.dateObj;
            if (cDate.getMonth() !== month) return;

            const isInCompany = c.mod.toUpperCase().includes('IN-C') || c.room.toLowerCase().includes('hotel') || c.room.toLowerCase().includes('empresa');
            
            if (rad.status === 'realizada') {
                if (isInCompany) inCompanyDone++;
                else schoolDone++;
            } else if (rad.status === 'noshow') {
                if (isInCompany) inCompanyNoShow++;
                else schoolNoShow++;
            }
        });

        document.getElementById('stat-school-done').innerText = schoolDone;
        document.getElementById('stat-in-company-done').innerText = inCompanyDone;
        document.getElementById('stat-school-noshow').innerText = schoolNoShow;
        document.getElementById('stat-in-company-noshow').innerText = inCompanyNoShow;
    }

    // --- UTILS ---
    function closeModal(id) {
        document.getElementById(id).classList.remove('open');
    }
    
    // Fechar modal ao clicar fora
    document.querySelectorAll('.modal-overlay').forEach(m => {
        m.addEventListener('click', (e) => {
            if (e.target === m) m.classList.remove('open');
        });
    });

</script>
