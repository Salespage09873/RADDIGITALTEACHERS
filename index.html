<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cronograma Semanal</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --card-bg: #f8f9fa;
            --text-main: #212529;
            --text-sec: #6c757d;
            --primary: #0d6efd;
            --primary-light: #e7f1ff;
            --primary-dim: rgba(13, 110, 253, 0.1);
            --border-color: #dee2e6;
            --danger: #dc3545;
            --success: #198754;
            --warning: #ffc107;
            --shadow: 0 2px 8px rgba(0,0,0,0.08);
            --shadow-hover: 0 4px 16px rgba(0,0,0,0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            overflow-x: hidden;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .hidden { display: none !important; }
        .flex { display: flex; }
        .grid { display: grid; }
        .center { align-items: center; justify-content: center; }
        .between { justify-content: space-between; }

        header {
            text-align: center;
            padding: 30px 0;
            border-bottom: 3px solid var(--primary);
            margin-bottom: 30px;
            background: linear-gradient(180deg, var(--primary-light) 0%, transparent 100%);
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--primary);
            margin-bottom: 10px;
        }

        h2, h3 { 
            font-weight: 600; 
            letter-spacing: 0.5px; 
        }

        button {
            background: var(--bg-color);
            border: 2px solid var(--primary);
            color: var(--primary);
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            border-radius: 6px;
            margin: 5px;
            box-shadow: var(--shadow);
        }

        button:hover {
            background: var(--primary);
            color: #fff;
            box-shadow: var(--shadow-hover);
            transform: translateY(-1px);
        }

        button.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }

        button.btn-danger {
            border-color: var(--danger);
            color: var(--danger);
        }

        button.btn-danger:hover {
            background: var(--danger);
            color: #fff;
        }

        button.btn-success {
            border-color: var(--success);
            color: var(--success);
        }

        button.btn-success:hover {
            background: var(--success);
            color: #fff;
        }

        .teachers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            justify-items: center;
            margin-top: 20px;
        }

        .teacher-card {
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            padding: 20px;
            width: 100%;
            max-width: 200px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            border-radius: 8px;
            position: relative;
            overflow: hidden;
            box-shadow: var(--shadow);
        }

        .teacher-card:hover {
            border-color: var(--primary);
            transform: translateY(-3px);
            box-shadow: var(--shadow-hover);
            background: var(--primary-light);
        }

        .teacher-name {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-main);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .schedule-header {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 20px;
        }

        .week-selector {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .day-section {
            margin-bottom: 40px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            background: var(--card-bg);
            box-shadow: var(--shadow);
        }

        .day-header {
            background: var(--primary-light);
            color: var(--primary);
            padding: 15px 20px;
            font-weight: 700;
            text-transform: uppercase;
            border-bottom: 2px solid var(--primary);
            font-size: 1.2rem;
            letter-spacing: 0.5px;
        }

        .classes-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 15px;
            padding: 20px;
        }

        .class-card {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            padding: 18px;
            border-radius: 6px;
            position: relative;
            transition: all 0.3s ease;
            box-shadow: var(--shadow);
        }

        .class-card:hover {
            border-color: var(--primary);
            box-shadow: var(--shadow-hover);
        }

        .class-time {
            font-size: 1.3rem;
            color: var(--primary);
            font-weight: 700;
            margin-bottom: 8px;
            display: block;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 8px;
        }

        .class-info {
            font-size: 0.95rem;
            color: var(--text-sec);
            margin-bottom: 5px;
        }

        .badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-right: 5px;
            margin-bottom: 5px;
            color: #fff;
        }

        .badge-book { background: var(--warning); color: #000; }
        .badge-room { background: var(--success); }
        .badge-modal { background: var(--primary); }

        .action-btn {
            width: 100%;
            margin-top: 12px;
            padding: 10px;
            font-size: 0.85rem;
            border: 2px solid var(--border-color);
            color: var(--text-sec);
            background: var(--bg-color);
            border-radius: 6px;
            font-weight: 600;
        }
        
        .action-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
            background: var(--primary-light);
            transform: none;
            box-shadow: none;
        }

        .status-indicator {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }
        .status-done { background: var(--success); }
        .status-noshow { background: var(--danger); }
        .status-cancel { background: var(--warning); }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(4px);
        }

        .modal-content {
            background: var(--bg-color);
            border: none;
            border-radius: 12px;
            padding: 30px;
            width: 90%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 15px;
        }

        .modal-header h3 {
            color: var(--primary);
            font-size: 1.2rem;
        }

        .close-modal {
            background: none;
            border: none;
            color: var(--text-sec);
            font-size: 1.8rem;
            cursor: pointer;
            padding: 0 8px;
            margin: 0;
            box-shadow: none;
            font-weight: 300;
        }

        .close-modal:hover {
            color: var(--text-main);
            background: none;
            transform: none;
        }

        input, select, textarea {
            width: 100%;
            background: var(--bg-color);
            border: 2px solid var(--border-color);
            color: var(--text-main);
            padding: 10px 14px;
            margin-bottom: 12px;
            border-radius: 6px;
            font-family: inherit;
            font-size: 0.95rem;
            transition: border-color 0.3s ease;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-dim);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
            font-family: inherit;
        }

        label {
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--text-sec);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: block;
            margin-bottom: 6px;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
            background: var(--card-bg);
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            transition: all 0.2s ease;
        }

        .checkbox-group:hover {
            border-color: var(--primary);
            background: var(--primary-light);
        }

        .checkbox-group input {
            width: auto;
            margin-right: 12px;
            margin-bottom: 0;
            accent-color: var(--primary);
            transform: scale(1.1);
        }

        .checkbox-group label {
            flex: 1;
            cursor: pointer;
            font-size: 0.9rem;
            color: var(--text-main);
            text-transform: none;
            font-weight: 400;
            margin-bottom: 0;
        }

        .attendance-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            font-size: 0.85rem;
            background: var(--bg-color);
            border-radius: 6px;
            overflow: hidden;
        }

        .attendance-table th, .attendance-table td {
            border: 1px solid var(--border-color);
            padding: 10px 12px;
            text-align: center;
        }

        .attendance-table th {
            background: var(--primary-light);
            color: var(--primary);
            font-weight: 700;
        }

        .attendance-table tr:hover {
            background: var(--card-bg);
        }

        .att-present { color: var(--success); font-weight: 700; }
        .att-absent { color: var(--danger); font-weight: 700; }

        #loading-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-color);
            z-index: 2000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .loader {
            width: 50px;
            height: 50px;
            border: 4px solid var(--border-color);
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        #loading-screen p {
            margin-top: 20px;
            color: var(--primary);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .observations-box {
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 15px;
        }

        .observations-box textarea {
            margin-bottom: 0;
            border: 1px solid var(--border-color);
        }

        .observations-box textarea:focus {
            border-color: var(--primary);
        }

        @media (max-width: 600px) {
            .teachers-grid { grid-template-columns: repeat(2, 1fr); gap: 15px; }
            .classes-list { grid-template-columns: 1fr; padding: 15px; }
            h1 { font-size: 1.5rem; }
            .modal-content { width: 95%; padding: 20px; }
            .class-card { padding: 15px; }
            .day-header { padding: 12px 15px; font-size: 1rem; }
            .teacher-card { max-width: 100%; padding: 15px; }
            .week-selector button { padding: 8px 16px; font-size: 0.85rem; }
        }

        @media (max-width: 400px) {
            .teachers-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
            .container { padding: 10px; }
            button { padding: 10px 16px; font-size: 0.85rem; }
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--card-bg);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #0b5ed7;
        }
    </style>
</head>
<body>

    <div id="loading-screen">
        <div class="loader"></div>
        <p>Carregando Sistema...</p>
    </div>

    <header>
        <h1>Sistema de Gestão</h1>
        <p style="color: var(--text-sec); font-size: 0.95rem; font-weight: 500;">SELECIONE O PROFESSOR</p>
    </header>

    <div class="container">
        <div id="selection-screen">
            <div class="teachers-grid" id="teachers-grid">
            </div>
            
            <div style="text-align: center; margin-top: 40px;">
                <button onclick="openAttendanceList()" style="border-color: var(--success); color: var(--success);">
                    📋 Lista de Presença Geral
                </button>
            </div>
        </div>

        <div id="schedule-screen" class="hidden">
            <div class="schedule-header">
                <button onclick="showSelection()" style="align-self: flex-start; border-color: var(--text-sec); color: var(--text-sec);">
                    ← Voltar
                </button>
                <h2 id="current-teacher-name" style="color: var(--primary); text-align: center;"></h2>
                
                <div class="week-selector" id="week-selector">
                </div>
            </div>

            <div id="schedule-content">
            </div>
        </div>
    </div>

    <div id="rad-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3>RAD - Registro de Aula</h3>
                <button class="close-modal" onclick="closeModal('rad-modal')">✕</button>
            </div>
            
            <div id="rad-class-info" style="margin-bottom: 15px; padding: 12px; background: var(--card-bg); border-radius: 6px; border-left: 4px solid var(--primary);"></div>

            <label>Status da Aula:</label>
            <select id="rad-status" onchange="toggleRadFields()">
                <option value="">Selecione...</option>
                <option value="realizada">Realizada</option>
                <option value="noshow">No Show (Aluno não veio)</option>
                <option value="cancelada">Cancelada</option>
            </select>

            <div id="rad-fields" class="hidden">
                <hr style="border: 0; border-top: 2px solid var(--border-color); margin: 20px 0;">
                
                <label>Lesson Plan Realizada:</label>
                <div id="lesson-plan-container" style="max-height: 200px; overflow-y: auto; margin-bottom: 15px; border: 2px solid var(--border-color); border-radius: 6px; padding: 8px;">
                </div>

                <label>Lista de Presença:</label>
                <div id="attendance-container" style="max-height: 200px; overflow-y: auto; margin-bottom: 15px; border: 2px solid var(--border-color); border-radius: 6px; padding: 8px;">
                </div>

                <div class="observations-box">
                    <label style="color: var(--primary);">📝 Observações:</label>
                    <textarea id="rad-observations" placeholder="Digite aqui suas observações sobre a aula..." rows="3"></textarea>
                </div>

                <button onclick="saveRad()" class="btn-success" style="width: 100%; background: var(--success); color: #fff; border-color: var(--success);">
                    💾 SALVAR RAD
                </button>
                <button onclick="clearRad()" class="btn-danger" style="width: 100%; margin-top: 8px; border-color: var(--danger); color: var(--danger);">
                    🗑️ LIMPAR DADOS
                </button>
            </div>
        </div>
    </div>

    <div id="attendance-modal" class="modal-overlay hidden">
        <div class="modal-content" style="max-width: 800px;">
            <div class="modal-header">
                <h3>Controle de Presença por Turma</h3>
                <button class="close-modal" onclick="closeModal('attendance-modal')">✕</button>
            </div>
            
            <div style="display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 15px;">
                <select id="att-group-select" onchange="loadAttendanceTable()" style="flex: 1; min-width: 150px;">
                    <option value="">Selecione a Turma...</option>
                </select>
                <input type="month" id="att-month-select" onchange="loadAttendanceTable()" style="flex: 0 1 auto; width: auto;">
            </div>

            <div id="attendance-table-container" style="overflow-x: auto; margin-top: 20px;">
            </div>
        </div>
    </div>

<script>
    // CONFIGURAÇÕES
    const SCHEDULE_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQmSAl1ndXXSgDWbrjCiSDkmtECkP94Rr2nk-kIHV-zHd4NFSE9CzyQb6YP2Rt4lEQNYOpuvgjCYDal/pub?output=csv';
    const STUDENTS_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSlWLLO76YOXic0n11ttKL-UKoNGTT3VKEogt3pvHONM4Hnb3upvgYj_h8DOC57xmAobUXSIznc7V6x/pub?output=csv';

    const VALID_TEACHERS = [
        { name: 'MYCAEL', color: '#0d6efd' },
        { name: 'HOPE', color: '#0d6efd' },
        { name: 'PEDRO', color: '#0d6efd' },
        { name: 'DIOGO', color: '#0d6efd' },
        { name: 'LIVIA', color: '#0d6efd' },
        { name: 'TOSCA', color: '#0d6efd' },
        { name: 'IAGO', color: '#0d6efd' },
        { name: 'SARA', color: '#0d6efd' },
        { name: 'CAROL', color: '#0d6efd' },
        { name: 'CARLA', color: '#0d6efd' },
        { name: 'LUISA', color: '#0d6efd' }
    ];

    const BOOKS_STRUCTURE = {
        'G1': generateLessons(1, 42),
        'G2': generateLessons(2, 46),
        'G3': generateLessons(3, 46),
        'G4': generateLessons(4, 46),
        'G5': generateLessons(5, 46),
        'G6': generateLessons(6, 46),
        'G7': generateLessons(7, 46),
        'G8': generateLessons(8, 46),
        'G9': generateLessons(9, 46),
        'AW': generateLessons(10, 46),
        'DEFAULT': generateLessons(0, 46)
    };

    function generateLessons(bookNum, total) {
        let lessons = [];
        for(let i=1; i<=total; i++) {
            let label = `Lesson ${i}`;
            if(i % 5 === 0 && i < total) label = `Revision ${i-4}-${i} / Reading`;
            if(i === total) label = `Test Book ${bookNum || '?'}`;
            lessons.push({ id: `b${bookNum}_l${i}`, label: label });
        }
        return lessons;
    }

    let scheduleData = [];
    let studentsData = {};
    let currentTeacher = null;
    let currentWeekData = [];
    let allWeeks = {};

    document.addEventListener('DOMContentLoaded', () => {
        Promise.all([fetchSchedule(), fetchStudents()])
            .then(() => {
                document.getElementById('loading-screen').classList.add('hidden');
                renderTeachers();
                populateGroupSelect();
                const now = new Date();
                document.getElementById('att-month-select').value = now.toISOString().slice(0, 7);
            })
            .catch(err => {
                console.error(err);
                document.getElementById('loading-screen').innerHTML = '<p style="color: var(--danger);">Erro ao carregar dados. Recarregue a página.</p>';
            });
    });

    async function fetchSchedule() {
        const res = await fetch(SCHEDULE_URL);
        const text = await res.text();
        parseScheduleCSV(text);
    }

    async function fetchStudents() {
        try {
            const res = await fetch(STUDENTS_URL);
            const text = await res.text();
            parseStudentsCSV(text);
        } catch (e) {
            console.warn("Falha ao carregar lista de alunos, operando sem ela.", e);
        }
    }

    function parseScheduleCSV(text) {
        const lines = text.split('\n').map(l => l.trim()).filter(l => l);
        if(lines.length < 2) return;

        const headers = lines[0].split(',').map(h => h.replace(/"/g, '').trim());
        
        const COL_BOOK = 1;
        const COL_GROUP = 2;
        const COL_ROOM = 3;
        const COL_MODAL = 4;
        const COL_TIME = 5;
        const DAYS_START = 6;

        const daysMap = ['Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta'];

        scheduleData = [];

        for(let i=1; i<lines.length; i++) {
            const row = lines[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(c => c.replace(/"/g, '').trim());
            
            const book = row[COL_BOOK] || '';
            const groupRaw = row[COL_GROUP] || '';
            const room = row[COL_ROOM] || '';
            const modal = row[COL_MODAL] || '';
            const time = row[COL_TIME] || '';

            if(!time) continue;

            for(let d=0; d<5; d++) {
                const cellContent = row[DAYS_START + d];
                if(cellContent && cellContent.trim() !== '') {
                    const teacherName = findTeacherInString(cellContent);
                    
                    if(teacherName) {
                        scheduleData.push({
                            book: cleanText(book),
                            group: cleanText(groupRaw),
                            room: cleanText(room),
                            modal: cleanText(modal),
                            time: cleanText(time),
                            dayIndex: d,
                            dayName: daysMap[d],
                            teacher: teacherName,
                            rawCell: cellContent
                        });
                    }
                }
            }
        }

        allWeeks = {
            'This Week': scheduleData
        };
    }

    function parseStudentsCSV(text) {
        const lines = text.split('\n').map(l => l.trim()).filter(l => l);
        if(lines.length < 2) return;
        
        console.log('📊 Total de linhas na planilha de alunos:', lines.length);
        
        for(let i=1; i<lines.length; i++) {
            const parts = lines[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
            if(parts.length >= 2) {
                const group = parts[0].replace(/"/g, '').trim();
                const student = parts[1].replace(/"/g, '').trim();
                
                if(group && student) {
                    if(!studentsData[group]) studentsData[group] = [];
                    studentsData[group].push(student);
                }
            }
        }
        
        console.log('📚 Turmas carregadas:', Object.keys(studentsData));
        Object.keys(studentsData).forEach(group => {
            console.log(`   ${group}: ${studentsData[group].length} alunos`);
        });
    }

    function cleanText(str) {
        return str ? str.replace(/<.*?>/g, '').trim() : '';
    }

    function findTeacherInString(str) {
        const upperStr = str.toUpperCase();
        for(const t of VALID_TEACHERS) {
            if(upperStr.includes(t.name)) return t.name;
        }
        return null;
    }

    function renderTeachers() {
        const grid = document.getElementById('teachers-grid');
        grid.innerHTML = '';
        
        VALID_TEACHERS.sort((a,b) => a.name.localeCompare(b.name)).forEach(t => {
            const card = document.createElement('div');
            card.className = 'teacher-card';
            card.style.borderColor = t.color;
            card.innerHTML = `
                <div class="teacher-name" style="color: ${t.color}">${t.name}</div>
            `;
            card.onclick = () => openTeacherSchedule(t.name, t.color);
            grid.appendChild(card);
        });
    }

    function openTeacherSchedule(name, color) {
        currentTeacher = { name, color };
        document.getElementById('selection-screen').classList.add('hidden');
        document.getElementById('schedule-screen').classList.remove('hidden');
        
        const title = document.getElementById('current-teacher-name');
        title.textContent = `CRONOGRAMA: ${name}`;
        title.style.color = color;

        renderWeekSelector();
        loadWeekData('This Week');
    }

    function showSelection() {
        document.getElementById('schedule-screen').classList.add('hidden');
        document.getElementById('selection-screen').classList.remove('hidden');
        currentTeacher = null;
    }

    function renderWeekSelector() {
        const container = document.getElementById('week-selector');
        container.innerHTML = '';
        
        const weeks = Object.keys(allWeeks);
        
        weeks.forEach((weekName, index) => {
            const btn = document.createElement('button');
            btn.textContent = weekName;
            if(index === 0) btn.classList.add('active');
            btn.onclick = () => {
                document.querySelectorAll('.week-selector button').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                loadWeekData(weekName);
            };
            container.appendChild(btn);
        });
    }

    function loadWeekData(weekName) {
        const data = allWeeks[weekName] || [];
        currentWeekData = data.filter(item => item.teacher === currentTeacher.name);
        renderSchedule();
    }

    function renderSchedule() {
        const container = document.getElementById('schedule-content');
        container.innerHTML = '';

        if(currentWeekData.length === 0) {
            container.innerHTML = '<p style="text-align:center; color: var(--text-sec); margin-top:50px; font-size:1.1rem;">Nenhuma aula encontrada para esta semana.</p>';
            return;
        }

        const daysOrder = ['Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta'];
        
        daysOrder.forEach(day => {
            const dayClasses = currentWeekData.filter(c => c.dayName === day);
            if(dayClasses.length > 0) {
                const section = document.createElement('div');
                section.className = 'day-section';
                
                const header = document.createElement('div');
                header.className = 'day-header';
                header.textContent = day;
                section.appendChild(header);

                const list = document.createElement('div');
                list.className = 'classes-list';

                dayClasses.forEach(cls => {
                    const card = document.createElement('div');
                    card.className = 'class-card';
                    
                    const radKey = getRadKey(cls);
                    const savedRad = localStorage.getItem(radKey);
                    const status = savedRad ? JSON.parse(savedRad).status : null;

                    let statusBadge = '';
                    if(status === 'realizada') statusBadge = '<div class="status-indicator status-done" title="Realizada"></div>';
                    if(status === 'noshow') statusBadge = '<div class="status-indicator status-noshow" title="No Show"></div>';
                    if(status === 'cancelada') statusBadge = '<div class="status-indicator status-cancel" title="Cancelada"></div>';

                    let nextLessonLabel = "Ver Lesson Plan";
                    if(savedRad) {
                        const parsed = JSON.parse(savedRad);
                        if(parsed.lessons && parsed.lessons.length > 0) {
                            const last = parsed.lessons[parsed.lessons.length-1];
                            nextLessonLabel = `Próximo: Após ${last}`;
                        }
                    }

                    card.innerHTML = `
                        ${statusBadge}
                        <span class="class-time">${cls.time}</span>
                        <div class="class-info"><strong>Turma:</strong> ${cls.group}</div>
                        <div class="class-info">
                            <span class="badge badge-book">${cls.book || 'N/A'}</span>
                            <span class="badge badge-room">Sala: ${cls.room || '-'}</span>
                            <span class="badge badge-modal">${cls.modal || 'REGULAR'}</span>
                        </div>
                        <div style="font-size:0.8rem; color: var(--primary); margin: 8px 0; border-top: 1px solid var(--border-color); padding-top: 8px;">
                            ${nextLessonLabel}
                        </div>
                        <button class="action-btn" onclick="openRad('${cls.time}', '${cls.group}', '${cls.book}', '${cls.room}', '${cls.dayName}')">ABRIR RAD</button>
                    `;
                    list.appendChild(card);
                });

                section.appendChild(list);
                container.appendChild(section);
            }
        });
    }

    let currentRadClass = null;

    function getRadKey(cls) {
        return `rad_${currentTeacher.name}_${cls.dayName}_${cls.time}_${cls.group}`;
    }

    function openRad(time, group, book, room, day) {
        currentRadClass = { time, group, book, room, day };
        const modal = document.getElementById('rad-modal');
        const infoDiv = document.getElementById('rad-class-info');
        
        infoDiv.innerHTML = `
            <strong style="color: var(--primary);">${day} - ${time}</strong><br>
            <span style="color: var(--text-sec);">Turma: ${group} | Book: ${book} | Sala: ${room}</span>
        `;

        document.getElementById('rad-status').value = '';
        document.getElementById('rad-observations').value = '';
        toggleRadFields();
        
        const saved = localStorage.getItem(getRadKey(currentRadClass));
        if(saved) {
            const data = JSON.parse(saved);
            document.getElementById('rad-status').value = data.status;
            document.getElementById('rad-observations').value = data.observations || '';
            toggleRadFields();
            if(data.status && data.status !== '') {
                renderLessonPlanCheckboxes(book, data.lessons || []);
                renderAttendanceCheckboxes(group, data.attendance || []);
            }
        } else {
            renderLessonPlanCheckboxes(book, []);
            renderAttendanceCheckboxes(group, []);
        }

        modal.classList.remove('hidden');
    }

    function toggleRadFields() {
        const status = document.getElementById('rad-status').value;
        const fields = document.getElementById('rad-fields');
        if(status) fields.classList.remove('hidden');
        else fields.classList.add('hidden');
    }

    function renderLessonPlanCheckboxes(bookRaw, checkedIds) {
        const container = document.getElementById('lesson-plan-container');
        container.innerHTML = '';
        
        let structure = BOOKS_STRUCTURE['DEFAULT'];
        const bookClean = (bookRaw || '').toUpperCase();
        
        if(bookClean.includes('G1')) structure = BOOKS_STRUCTURE['G1'];
        else if(bookClean.includes('G2')) structure = BOOKS_STRUCTURE['G2'];
        else if(bookClean.includes('G3')) structure = BOOKS_STRUCTURE['G3'];
        else if(bookClean.includes('G4')) structure = BOOKS_STRUCTURE['G4'];
        else if(bookClean.includes('G5')) structure = BOOKS_STRUCTURE['G5'];
        else if(bookClean.includes('G6')) structure = BOOKS_STRUCTURE['G6'];
        else if(bookClean.includes('G7')) structure = BOOKS_STRUCTURE['G7'];
        else if(bookClean.includes('G8') || bookClean.includes('CROWN')) structure = BOOKS_STRUCTURE['G8'];
        else if(bookClean.includes('G9') || bookClean.includes('SQUID')) structure = BOOKS_STRUCTURE['G9'];
        else if(bookClean.includes('AW') || bookClean.includes('MIB')) structure = BOOKS_STRUCTURE['AW'];

        structure.forEach(lesson => {
            const div = document.createElement('div');
            div.className = 'checkbox-group';
            const isChecked = checkedIds.includes(lesson.id) ? 'checked' : '';
            
            div.innerHTML = `
                <input type="checkbox" id="${lesson.id}" value="${lesson.id}" ${isChecked}>
                <label for="${lesson.id}">${lesson.label}</label>
            `;
            container.appendChild(div);
        });
    }

    function renderAttendanceCheckboxes(groupRaw, presentList) {
        const container = document.getElementById('attendance-container');
        container.innerHTML = '';
        
        console.log('🔍 Buscando alunos para turma:', groupRaw);
        console.log('📚 Turmas disponíveis:', Object.keys(studentsData));
        
        let students = [];
        const keys = Object.keys(studentsData);
        
        // Tenta encontrar a turma com correspondência exata primeiro
        let match = keys.find(k => k === groupRaw);
        
        // Se não encontrar exata, tenta correspondência case-insensitive
        if(!match) {
            match = keys.find(k => k.toUpperCase() === groupRaw.toUpperCase());
        }
        
        // Se ainda não encontrar, tenta correspondência parcial
        if(!match) {
            match = keys.find(k => groupRaw.toUpperCase().includes(k.toUpperCase()) || k.toUpperCase().includes(groupRaw.toUpperCase()));
        }
        
        if(match && studentsData[match]) {
            students = studentsData[match];
            console.log(`✅ Encontrados ${students.length} alunos para "${match}"`);
        } else {
            console.warn(`⚠️ Nenhuma turma encontrada para "${groupRaw}"`);
            // Fallback para turmas VIP
            if(groupRaw.toUpperCase() === 'VIP') {
                students = ['Aluno VIP 1', 'Aluno VIP 2', 'Aluno VIP 3'];
                console.log('👑 Usando fallback para VIP');
            } else {
                students = ["Aluno 1", "Aluno 2", "Aluno 3"];
                console.log('📝 Usando fallback genérico');
            }
        }

        students.forEach((student) => {
            const div = document.createElement('div');
            div.className = 'checkbox-group';
            const isPresent = presentList.includes(student) ? 'checked' : '';
            
            div.innerHTML = `
                <input type="checkbox" class="att-check" value="${student}" ${isPresent}>
                <label>${student}</label>
            `;
            container.appendChild(div);
        });
    }

    function saveRad() {
        const status = document.getElementById('rad-status').value;
        if(!status) { alert('Selecione o status da aula!'); return; }

        const lessonsChecked = Array.from(document.querySelectorAll('#lesson-plan-container input:checked')).map(cb => cb.value);
        const attendanceChecked = Array.from(document.querySelectorAll('.att-check:checked')).map(cb => cb.value);
        const observations = document.getElementById('rad-observations').value.trim();

        const data = {
            status,
            lessons: lessonsChecked,
            attendance: attendanceChecked,
            observations: observations,
            dateSaved: new Date().toISOString()
        };

        localStorage.setItem(getRadKey(currentRadClass), JSON.stringify(data));
        closeModal('rad-modal');
        renderSchedule();
        alert('✅ RAD Salvo com Sucesso!');
    }

    function clearRad() {
        if(confirm('Tem certeza que deseja limpar todos os dados deste RAD?')) {
            localStorage.removeItem(getRadKey(currentRadClass));
            openRad(currentRadClass.time, currentRadClass.group, currentRadClass.book, currentRadClass.room, currentRadClass.day);
        }
    }

    function openAttendanceList() {
        document.getElementById('attendance-modal').classList.remove('hidden');
        loadAttendanceTable();
    }

    function populateGroupSelect() {
        const select = document.getElementById('att-group-select');
        const groups = Object.keys(studentsData).sort();
        groups.forEach(g => {
            const opt = document.createElement('option');
            opt.value = g;
            opt.textContent = g;
            select.appendChild(opt);
        });
    }

    function loadAttendanceTable() {
        const group = document.getElementById('att-group-select').value;
        const monthVal = document.getElementById('att-month-select').value;
        const container = document.getElementById('attendance-table-container');
        
        if(!group) {
            container.innerHTML = '<p style="color: var(--text-sec);">Selecione uma turma.</p>';
            return;
        }

        const students = studentsData[group] || [];
        if(students.length === 0) {
            container.innerHTML = '<p style="color: var(--text-sec);">Nenhum aluno encontrado para esta turma.</p>';
            return;
        }

        const [year, month] = monthVal.split('-').map(Number);
        const daysInMonth = new Date(year, month, 0).getDate();
        
        let html = '<table class="attendance-table"><thead><tr><th>Aluno</th>';
        for(let d=1; d<=daysInMonth; d++) {
            html += `<th>${d}</th>`;
        }
        html += '</tr></thead><tbody>';

        students.forEach(student => {
            html += `<tr><td style="text-align:left; padding-left:10px; font-weight:500;">${student}</td>`;
            for(let d=1; d<=daysInMonth; d++) {
                html += `<td>•</td>`;
            }
            html += '</tr>';
        });

        html += '</tbody></table>';
        html += '<p style="font-size:0.8rem; color: var(--text-sec); margin-top:12px; font-style:italic;">* Visualização estrutural. O controle detalhado por dia é feito no RAD de cada aula.</p>';
        
        container.innerHTML = html;
    }

    function closeModal(id) {
        document.getElementById(id).classList.add('hidden');
    }

</script>
</body>
</html>
