<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>School Management System</title>
    <style>
        :root {
            --bg-color: #050505;
            --card-bg: #121212;
            --text-main: #ffffff;
            --text-sec: #a0a0a0;
            --accent: #00f3ff;
            --accent-dim: rgba(0, 243, 255, 0.1);
            --danger: #ff2a6d;
            --success: #05ffa1;
            --warning: #ffb700;
            --border: #333;
            --radius: 4px; /* Menos arredondado */
            --font-main: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; -webkit-tap-highlight-color: transparent; }
        
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-main);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-color); }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

        header {
            background: rgba(5, 5, 5, 0.95);
            border-bottom: 1px solid var(--border);
            padding: 1rem;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
            text-align: center;
        }

        h1, h2, h3 { font-weight: 600; letter-spacing: 0.5px; }
        h1 { font-size: 1.2rem; color: var(--accent); text-transform: uppercase; }

        .container { max-width: 1200px; margin: 0 auto; padding: 1rem; }

        /* Telas */
        .screen { display: none; animation: fadeIn 0.4s ease; }
        .screen.active { display: block; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Grid de Professores */
        .teachers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .teacher-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-left: 3px solid var(--accent);
            padding: 1.5rem 1rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            border-radius: var(--radius);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100px;
        }

        .teacher-card:hover {
            transform: translateY(-3px);
            border-color: var(--accent);
            box-shadow: 0 5px 15px rgba(0, 243, 255, 0.15);
        }

        .teacher-name { font-size: 1rem; font-weight: bold; text-transform: uppercase; color: var(--text-main); }
        .teacher-status { font-size: 0.75rem; color: var(--text-sec); margin-top: 0.5rem; }

        /* Botões Gerais */
        .btn {
            background: transparent;
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 0.8rem 1.5rem;
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: var(--radius);
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            width: 100%;
            margin-top: 1rem;
        }

        .btn:hover, .btn.active { background: var(--accent); color: #000; }
        .btn-danger { border-color: var(--danger); color: var(--danger); }
        .btn-danger:hover { background: var(--danger); color: #fff; }
        .btn-back { border: none; color: var(--text-sec); width: auto; padding: 0.5rem; font-size: 1rem; }
        .btn-back:hover { color: var(--text-main); background: transparent; transform: none; }

        /* Tela do Professor */
        .profile-header {
            margin-bottom: 1.5rem;
            border-bottom: 1px solid var(--border);
            padding-bottom: 1rem;
        }
        
        .week-selector {
            margin-top: 1rem;
            display: flex;
            gap: 0.5rem;
            overflow-x: auto;
            padding-bottom: 0.5rem;
        }

        .week-btn {
            white-space: nowrap;
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text-sec);
            padding: 0.5rem 1rem;
            border-radius: var(--radius);
            cursor: pointer;
            font-size: 0.85rem;
        }

        .week-btn.active { background: var(--accent); color: #000; border-color: var(--accent); }

        /* Dias e Aulas */
        .day-section { margin-bottom: 2rem; }
        .day-title {
            font-size: 1.1rem;
            color: var(--accent);
            border-left: 3px solid var(--accent);
            padding-left: 0.8rem;
            margin-bottom: 1rem;
            text-transform: uppercase;
        }

        .classes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1rem;
        }

        .class-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1rem;
            position: relative;
            transition: transform 0.2s;
        }

        .class-card:hover { border-color: var(--text-sec); }
        .class-card.completed { border-left: 4px solid var(--success); }
        .class-card.noshow { border-left: 4px solid var(--danger); }
        .class-card.cancelled { border-left: 4px solid var(--warning); }

        .class-time { font-size: 1.2rem; font-weight: bold; color: var(--text-main); margin-bottom: 0.5rem; }
        .class-info { font-size: 0.9rem; color: var(--text-sec); margin-bottom: 0.3rem; display: flex; align-items: center; gap: 0.5rem; }
        .badge { font-size: 0.7rem; padding: 0.2rem 0.5rem; border-radius: 2px; background: #222; color: var(--accent); border: 1px solid var(--accent); }
        
        .last-lesson-badge {
            margin-top: 0.5rem;
            font-size: 0.8rem;
            color: var(--warning);
            background: rgba(255, 183, 0, 0.1);
            padding: 0.3rem;
            border-radius: 2px;
            border: 1px solid var(--warning);
        }

        .action-buttons { display: flex; gap: 0.5rem; margin-top: 1rem; }
        .action-btn { flex: 1; padding: 0.6rem; font-size: 0.8rem; border-radius: var(--radius); border: none; cursor: pointer; font-weight: bold; }
        .btn-rad { background: var(--accent); color: #000; }
        .btn-plan { background: #333; color: #fff; }

        /* Modais */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }
        .modal-overlay.open { display: flex; animation: fadeIn 0.3s; }

        .modal-content {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            width: 100%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 1.5rem;
            position: relative;
        }

        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; border-bottom: 1px solid var(--border); padding-bottom: 1rem; }
        .close-modal { background: none; border: none; color: var(--text-sec); font-size: 1.5rem; cursor: pointer; }

        /* Formulários e Inputs */
        .form-group { margin-bottom: 1rem; }
        label { display: block; color: var(--text-sec); font-size: 0.85rem; margin-bottom: 0.5rem; }
        input, select, textarea {
            width: 100%;
            background: #000;
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 0.8rem;
            border-radius: var(--radius);
            font-family: inherit;
        }
        input:focus, select:focus, textarea:focus { border-color: var(--accent); }

        /* Lista de Alunos no RAD */
        .student-list { max-height: 300px; overflow-y: auto; border: 1px solid var(--border); border-radius: var(--radius); margin-top: 0.5rem; }
        .student-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 0.8rem; border-bottom: 1px solid #222;
        }
        .student-item:last-child { border-bottom: none; }
        .checkbox-custom {
            width: 20px; height: 20px; border: 1px solid var(--text-sec);
            border-radius: 4px; display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: all 0.2s;
        }
        .checkbox-custom.checked { background: var(--success); border-color: var(--success); color: #000; }
        .checkbox-custom.absent { background: var(--danger); border-color: var(--danger); color: #fff; }

        /* Lesson Plan Checklist */
        .lesson-checklist { max-height: 400px; overflow-y: auto; border: 1px solid var(--border); padding: 0.5rem; border-radius: var(--radius); }
        .lesson-item {
            display: flex; align-items: center; gap: 0.8rem;
            padding: 0.6rem; border-bottom: 1px solid #222; cursor: pointer;
        }
        .lesson-item:hover { background: #1a1a1a; }
        .lesson-item.selected { color: var(--accent); font-weight: bold; }
        .lesson-checkbox {
            width: 18px; height: 18px; border: 1px solid var(--text-sec);
            border-radius: 3px; display: flex; align-items: center; justify-content: center;
        }
        .lesson-item.selected .lesson-checkbox { background: var(--accent); border-color: var(--accent); color: #000; }
        .lesson-item.selected .lesson-checkbox::after { content: '✓'; font-size: 12px; }

        /* Tabs Internas (Calculator/Presence) */
        .tabs { display: flex; gap: 1rem; margin-bottom: 1rem; border-bottom: 1px solid var(--border); }
        .tab-btn {
            background: none; border: none; color: var(--text-sec);
            padding: 0.8rem 0; cursor: pointer; font-weight: 600; position: relative;
        }
        .tab-btn.active { color: var(--accent); }
        .tab-btn.active::after {
            content: ''; position: absolute; bottom: -1px; left: 0; width: 100%;
            height: 2px; background: var(--accent);
        }

        /* Tabela de Presença */
        .presence-table-container { overflow-x: auto; }
        .presence-table { width: 100%; border-collapse: collapse; min-width: 600px; }
        .presence-table th, .presence-table td {
            text-align: center; padding: 0.8rem; border: 1px solid #333; font-size: 0.85rem;
        }
        .presence-table th { background: #111; color: var(--accent); position: sticky; top: 0; }
        .presence-table td:first-child { text-align: left; position: sticky; left: 0; background: var(--card-bg); z-index: 1; }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
        .dot-present { background: var(--success); }
        .dot-absent { background: var(--danger); }
        .dot-cancel { background: var(--warning); }

        /* Loading */
        .loader {
            border: 3px solid #222; border-top: 3px solid var(--accent);
            border-radius: 50%; width: 40px; height: 40px;
            animation: spin 1s linear infinite; margin: 2rem auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Responsividade Mobile */
        @media (max-width: 600px) {
            .teachers-grid { grid-template-columns: repeat(2, 1fr); }
            .classes-grid { grid-template-columns: 1fr; }
            .modal-content { max-height: 95vh; padding: 1rem; }
            h1 { font-size: 1rem; }
        }
    </style>
</head>
<body>

<header>
    <h1 id="header-title">School System</h1>
</header>

<div class="container">
    
    <!-- TELA INICIAL -->
    <div id="home-screen" class="screen active">
        <div id="loading" class="loader"></div>
        
        <div id="teachers-container" style="display:none;">
            <h2 style="color: var(--text-sec); font-size: 0.9rem; text-transform: uppercase; margin-bottom: 0.5rem;">Professores</h2>
            <div class="teachers-grid" id="teachers-grid"></div>
            
            <button class="btn" onclick="showPresenceSelector()" style="margin-top: 2rem; border-style: dashed;">
                📋 Lista de Presença Geral
            </button>
        </div>
        
        <div id="error-msg" style="color: var(--danger); text-align: center; margin-top: 2rem; display: none;"></div>
    </div>

    <!-- TELA DO PROFESSOR -->
    <div id="teacher-screen" class="screen">
        <button class="btn btn-back" onclick="goHome()">← Voltar</button>
        
        <div class="profile-header">
            <h2 id="prof-name" style="color: var(--accent); font-size: 1.5rem; margin-bottom: 0.5rem;"></h2>
            <p id="prof-stats" style="color: var(--text-sec); font-size: 0.9rem;"></p>
            
            <div class="week-selector" id="week-selector">
                <!-- Semanas geradas via JS -->
            </div>
        </div>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('schedule')">Cronograma</button>
            <button class="tab-btn" onclick="switchTab('calculator')">Calculadora</button>
        </div>

        <div id="tab-schedule" class="tab-content">
            <div id="schedule-container"></div>
        </div>

        <div id="tab-calculator" class="tab-content" style="display: none;">
            <div class="form-group">
                <label>Mês de Referência</label>
                <select id="calc-month" onchange="renderCalculator()"></select>
            </div>
            <div id="calc-results" style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-top: 1rem;">
                <!-- Cards de stats -->
            </div>
        </div>
    </div>

    <!-- TELA DE PRESENÇA GERAL -->
    <div id="presence-screen" class="screen">
        <button class="btn btn-back" onclick="goHome()">← Voltar</button>
        <h2 style="margin: 1rem 0;">Lista de Presença por Turma</h2>
        
        <div class="form-group">
            <label>Selecione a Turma</label>
            <select id="presence-group-select" onchange="loadPresenceTable()"></select>
        </div>
        <div class="form-group">
            <label>Mês</label>
            <select id="presence-month-select" onchange="loadPresenceTable()"></select>
        </div>

        <div class="presence-table-container">
            <table class="presence-table" id="presence-table">
                <thead><tr><th>Aluno</th></tr></thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

</div>

<!-- MODAL RAD -->
<div id="rad-modal" class="modal-overlay">
    <div class="modal-content">
        <div class="modal-header">
            <h3>Registro de Aula (RAD)</h3>
            <button class="close-modal" onclick="closeModal('rad-modal')">&times;</button>
        </div>
        <div id="rad-form">
            <div class="form-group">
                <label>Status da Aula</label>
                <select id="rad-status" onchange="toggleRadFields()">
                    <option value="realized">Realizada</option>
                    <option value="noshow">No Show (Aluno não veio)</option>
                    <option value="cancelled">Cancelada</option>
                </select>
            </div>

            <div id="rad-details">
                <div class="form-group">
                    <label>Lesson Plan Realizado</label>
                    <button class="btn" type="button" style="padding: 0.5rem; font-size: 0.8rem;" onclick="openLessonPlan()">Selecionar Lições</button>
                    <div id="selected-lessons-display" style="margin-top: 0.5rem; font-size: 0.85rem; color: var(--accent);"></div>
                </div>

                <div class="form-group">
                    <label>Lista de Presença</label>
                    <div class="student-list" id="rad-student-list"></div>
                </div>
            </div>

            <div class="action-buttons">
                <button class="action-btn btn-danger" onclick="clearRadData()">Limpar RAD</button>
                <button class="action-btn btn-rad" onclick="saveRad()">Salvar Registro</button>
            </div>
        </div>
    </div>
</div>

<!-- MODAL LESSON PLAN -->
<div id="lesson-modal" class="modal-overlay">
    <div class="modal-content">
        <div class="modal-header">
            <h3>Selecionar Lições</h3>
            <button class="close-modal" onclick="closeModal('lesson-modal')">&times;</button>
        </div>
        <p style="font-size: 0.8rem; color: var(--text-sec); margin-bottom: 1rem;">Marque as lições realizadas nesta aula.</p>
        <div class="lesson-checklist" id="lesson-checklist-container"></div>
        <button class="btn" onclick="confirmLessonPlan()">Confirmar Seleção</button>
    </div>
</div>

<script>
    // --- CONFIGURAÇÃO ---
    const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQmSAl1ndXXSgDWbrjCiSDkmtECkP94Rr2nk-kIHV-zHd4NFSE9CzyQb6YP2Rt4lEQNYOpuvgjCYDal/pub?output=csv';
    const STUDENTS_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSlWLLO76YOXic0n11ttKL-UKoNGTT3VKEogt3pvHONM4Hnb3upvgYj_h8DOC57xmAobUXSIznc7V6x/pub?output=csv';

    // Estrutura dos Books (Simplificada para o exemplo, mas expansível)
    const BOOKS_STRUCTURE = {
        'G1': ['Lesson 1', 'Lesson 2', 'Lesson 3', 'Lesson 4', 'Lesson 5', 'Revision 1-10', 'Test Book 1'],
        'G2': ['Lesson 1', 'Lesson 2', 'Lesson 3', 'Lesson 4', 'Lesson 5', 'Revision 1-10', 'Test Book 2'],
        'G3': ['Lesson 1', 'Lesson 2', 'Lesson 3', 'Lesson 4', 'Lesson 5', 'Revision 1-10', 'Test Book 3'],
        'G4': ['Lesson 1', 'Lesson 2', 'Lesson 3', 'Lesson 4', 'Lesson 5', 'Revision 1-10', 'Test Book 4'],
        'G5': ['Lesson 1', 'Lesson 2', 'Lesson 3', 'Lesson 4', 'Lesson 5', 'Revision 1-10', 'Test Book 5'],
        'G6': ['Lesson 1', 'Lesson 2', 'Lesson 3', 'Lesson 4', 'Lesson 5', 'Revision 1-10', 'Test Book 6'],
        'G7': ['Lesson 1', 'Lesson 2', 'Lesson 3', 'Lesson 4', 'Lesson 5', 'Revision 1-10', 'Test Book 7'],
        'G8': ['Lesson 1', 'Lesson 2', 'Lesson 3', 'Lesson 4', 'Lesson 5', 'Revision 1-10', 'Test Book 8'],
        'G9': ['Lesson 1', 'Lesson 2', 'Lesson 3', 'Lesson 4', 'Lesson 5', 'Revision 1-10', 'Test Book 9'],
        'G10': ['Lesson 1', 'Lesson 2', 'Lesson 3', 'Lesson 4', 'Lesson 5', 'Revision 1-10', 'Test Book 10'],
        'DEFAULT': Array.from({length: 46}, (_, i) => `Lesson ${i+1}`) // Fallback
    };

    const TEACHERS_LIST = [
        { name: 'MYCAEL', color: '#FF6B6B' }, { name: 'HOPE', color: '#FFE66D' },
        { name: 'PEDRO', color: '#F38181' }, { name: 'DIOGO', color: '#AA96DA' },
        { name: 'LIVIA', color: '#FCBAD3' }, { name: 'TOSCA', color: '#A8D8EA' },
        { name: 'IAGO', color: '#FF9F43' }, { name: 'SARA', color: '#54a0ff' },
        { name: 'CAROL', color: '#5f27cd' }, { name: 'CARLA', color: '#00f3ff' },
        { name: 'LUISA', color: '#05ffa1' }
    ];

    let allClasses = [];
    let studentsDB = {}; // { "Turma Name": ["Aluno 1", "Aluno 2"] }
    let currentTeacher = null;
    let currentWeek = null;
    let currentClassData = null; // Para o RAD
    let tempLessons = [];

    // --- INICIALIZAÇÃO ---
    document.addEventListener('DOMContentLoaded', () => {
        Promise.all([fetch(SHEET_URL).then(r => r.text()), fetch(STUDENTS_URL).then(r => r.text())])
            .then(([csvSchedule, csvStudents]) => {
                parseStudents(csvStudents);
                parseSchedule(csvSchedule);
                renderHome();
            })
            .catch(err => {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error-msg').style.display = 'block';
                document.getElementById('error-msg').innerText = 'Erro ao carregar dados. Verifique a conexão.';
                console.error(err);
            });
        
        initMonthSelects();
    });

    function initMonthSelects() {
        const months = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
        const now = new Date();
        
        const selects = [document.getElementById('calc-month'), document.getElementById('presence-month-select')];
        selects.forEach(sel => {
            if(!sel) return;
            sel.innerHTML = '';
            months.forEach((m, idx) => {
                const opt = document.createElement('option');
                opt.value = idx;
                opt.text = m;
                if(idx === now.getMonth()) opt.selected = true;
                sel.appendChild(opt);
            });
        });
    }

    // --- PARSING ---
    function parseStudents(csv) {
        const lines = csv.split('\n').slice(1); // Skip header
        lines.forEach(line => {
            const parts = line.split(',').map(p => p.trim().replace(/"/g, ''));
            if(parts.length >= 2) {
                const group = parts[0].toUpperCase();
                const student = parts[1];
                if(!studentsDB[group]) studentsDB[group] = [];
                studentsDB[group].push(student);
            }
        });
    }

    function parseSchedule(csv) {
        const lines = csv.split('\n').map(l => l.trim()).filter(l => l);
        if(lines.length < 2) return;

        const headers = lines[0].split(',').map(h => h.trim().replace(/"/g, ''));
        
        // Identificar colunas de data (procura padrões de mês/dia ou apenas datas)
        // Assumindo estrutura: A(Lang), B(Book), C(Group), D(Room), E(Mod), F(Time), G... (Datas)
        const dateCols = [];
        const weekMap = {}; // { "WeekName": [colIndex1, colIndex2...] }

        headers.forEach((h, idx) => {
            if(idx < 6) return; // Pula as primeiras 6 colunas fixas
            // Tenta extrair nome da semana do cabeçalho se vier formatado, senão usa a data
            // Se o CSV vem com "August Week 4" no topo de várias colunas, agrupamos.
            // Simplificação: Vamos tratar cada coluna como um dia, e agrupar por semana no render.
            dateCols.push({ index: idx, header: h });
        });

        allClasses = [];

        for(let i=1; i<lines.length; i++) {
            // Split robusto para CSV
            const row = lines[i].match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g) || lines[i].split(',');
            const cleanRow = row.map(c => c ? c.trim().replace(/^"|"$/g, '').replace(/<.*?>/g, '') : '');

            const book = cleanRow[1] || '';
            const groupRaw = cleanRow[2] || '';
            const room = cleanRow[3] || '';
            const mod = cleanRow[4] || '';
            const time = cleanRow[5] || '';

            if(!time) continue;

            // Processar grupos e books
            const { groupName, bookName, modalName } = parseGroupInfo(groupRaw, mod, book);

            dateCols.forEach(col => {
                const cell = cleanRow[col.index];
                if(!cell) return;

                // Extrair professor da célula
                const teacher = findTeacher(cell);
                if(teacher) {
                    // Extrair data do header da coluna para ordenação
                    // Ex Header: "Mon 04" -> Data fictícia para ordenar
                    const dateObj = parseDateFromHeader(col.header);
                    
                    allClasses.push({
                        dayHeader: col.header,
                        dateObj: dateObj,
                        time: time,
                        teacher: teacher,
                        group: groupName,
                        book: bookName,
                        modal: modalName,
                        room: room,
                        rawCell: cell
                    });
                }
            });
        }
    }

    function parseGroupInfo(rawGroup, rawMod, rawBook) {
        let gName = rawGroup.toUpperCase();
        let bName = rawBook.toUpperCase();
        let mName = rawMod.toUpperCase();

        // Lógica simples de extração se estiver tudo misturado
        if(!bName && gName.match(/G\d/)) {
            const match = gName.match(/G\d+/);
            if(match) {
                bName = match[0];
                gName = gName.replace(bName, '').trim();
            }
        }
        
        // Normalizar nomes de turmas famosas
        if(gName.includes('BRIDGE')) gName = 'TPWER BRIDGE';
        
        return { groupName: gName, bookName: bName, modalName: mName };
    }

    function findTeacher(str) {
        str = str.toUpperCase();
        for(let t of TEACHERS_LIST) {
            if(str.includes(t.name)) return t.name;
        }
        return null;
    }

    function parseDateFromHeader(header) {
        // Tenta extrair dia e mês do header ex: "Mon 04" ou "September Week 1"
        // Para simplificar a ordenação, vamos criar uma data aproximada baseada no ano atual
        const now = new Date();
        const year = now.getFullYear();
        
        // Se tiver nome do mês
        const months = ['january', 'february', 'march', 'april', 'may', 'june', 'july', 'august', 'september', 'october', 'november', 'december'];
        const lowerH = header.toLowerCase();
        
        let monthIdx = -1;
        let day = 1;

        months.forEach((m, idx) => {
            if(lowerH.includes(m)) monthIdx = idx;
        });

        // Extrair número do dia
        const numMatch = header.match(/\d+/);
        if(numMatch) day = parseInt(numMatch[0]);

        if(monthIdx === -1) monthIdx = now.getMonth(); // Fallback

        return new Date(year, monthIdx, day);
    }

    // --- RENDERIZAÇÃO ---
    function renderHome() {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('teachers-container').style.display = 'block';
        const grid = document.getElementById('teachers-grid');
        grid.innerHTML = '';

        TEACHERS_LIST.sort((a,b) => a.name.localeCompare(b.name)).forEach(t => {
            const hasClass = allClasses.some(c => c.teacher === t.name);
            const card = document.createElement('div');
            card.className = 'teacher-card';
            card.style.borderLeftColor = t.color;
            card.innerHTML = `
                <div class="teacher-name" style="color:${t.color}">${t.name}</div>
                <div class="teacher-status">${hasClass ? 'Ver Agenda' : 'Sem aulas'}</div>
            `;
            card.onclick = () => openTeacherProfile(t);
            grid.appendChild(card);
        });
    }

    function openTeacherProfile(teacher) {
        currentTeacher = teacher;
        document.getElementById('home-screen').classList.remove('active');
        document.getElementById('teacher-screen').classList.add('active');
        
        document.getElementById('prof-name').innerText = teacher.name;
        document.getElementById('prof-name').style.color = teacher.color;
        
        // Renderizar Selector de Semanas
        renderWeekSelector();
        switchTab('schedule');
    }

    function renderWeekSelector() {
        const container = document.getElementById('week-selector');
        container.innerHTML = '';

        // Agrupar classes por semana baseada no dateObj
        const weeks = {};
        allClasses.filter(c => c.teacher === currentTeacher.name).forEach(c => {
            // Criar chave única da semana (ex: 2023-W35)
            const d = c.dateObj;
            // Simples: Mês + Semana do Mês
            const monthName = d.toLocaleString('default', { month: 'long' });
            // Calculo simples de semana do mês
            const weekNum = Math.ceil(d.getDate() / 7);
            const key = `${monthName} Week ${weekNum}`;
            
            if(!weeks[key]) weeks[key] = [];
            weeks[key].push(c);
        });

        const sortedKeys = Object.keys(weeks).sort((a,b) => {
            // Ordenação básica de strings pode falhar entre meses, idealmente usaria data mínima
            return weeks[a][0].dateObj - weeks[b][0].dateObj;
        });

        if(sortedKeys.length === 0) {
            container.innerHTML = '<span style="color:#666; font-size:0.8rem;">Nenhuma aula encontrada.</span>';
            return;
        }

        sortedKeys.forEach((key, idx) => {
            const btn = document.createElement('button');
            btn.className = `week-btn ${idx === 0 ? 'active' : ''}`;
            btn.innerText = key;
            btn.onclick = () => {
                document.querySelectorAll('.week-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentWeek = key;
                renderSchedule(weeks[key]);
            };
            container.appendChild(btn);
        });

        // Trigger first week
        if(sortedKeys.length > 0) {
            currentWeek = sortedKeys[0];
            renderSchedule(weeks[sortedKeys[0]]);
        }
    }

    function renderSchedule(classes) {
        const container = document.getElementById('schedule-container');
        container.innerHTML = '';

        // Agrupar por dia da semana (Seg, Ter...) baseado no header ou dateObj
        const days = {};
        const dayNames = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
        
        classes.forEach(c => {
            const dayName = dayNames[c.dateObj.getDay()];
            if(!days[dayName]) days[dayName] = [];
            days[dayName].push(c);
        });

        const order = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];

        order.forEach(day => {
            if(days[day] && days[day].length > 0) {
                const section = document.createElement('div');
                section.className = 'day-section';
                
                // Formatar data completa para o título
                const dateStr = days[day][0].dateObj.toLocaleDateString('pt-BR', {day:'numeric', month:'short'});
                
                section.innerHTML = `<div class="day-title">${day} (${dateStr})</div>`;
                
                const grid = document.createElement('div');
                grid.className = 'classes-grid';

                days[day].sort((a,b) => a.time.localeCompare(b.time)).forEach(cls => {
                    const card = document.createElement('div');
                    card.className = 'class-card';
                    
                    // Checar status salvo
                    const radKey = getRadKey(cls);
                    const savedRad = localStorage.getItem(radKey);
                    const status = savedRad ? JSON.parse(savedRad).status : null;
                    
                    if(status === 'realized') card.classList.add('completed');
                    if(status === 'noshow') card.classList.add('noshow');
                    if(status === 'cancelled') card.classList.add('cancelled');

                    // Buscar última lesson
                    const lastLesson = getLastLesson(cls.group, cls.book);

                    card.innerHTML = `
                        <div class="class-time">⏰ ${cls.time}</div>
                        <div class="class-info">📚 ${cls.book || 'N/A'}</div>
                        <div class="class-info">🏫 ${cls.group}</div>
                        <div class="class-info">📍 ${cls.room}</div>
                        ${lastLesson ? `<div class="last-lesson-badge">Última: ${lastLesson}</div>` : ''}
                        
                        <div class="action-buttons">
                            <button class="action-btn btn-plan" onclick='openLessonPlanModal(${JSON.stringify(cls)})'>Lesson Plan</button>
                            <button class="action-btn btn-rad" onclick='openRadModal(${JSON.stringify(cls)})'>RAD</button>
                        </div>
                    `;
                    grid.appendChild(card);
                });

                section.appendChild(grid);
                container.appendChild(section);
            }
        });
    }

    // --- LÓGICA DE RAD E LESSON PLAN ---
    
    function getRadKey(cls) {
        return `rad_${cls.teacher}_${cls.dateObj.getTime()}_${cls.time}_${cls.group}`;
    }

    function getLastLesson(group, book) {
        // Procura no localStorage por qualquer RAD anterior deste grupo/book
        // Isso é uma simplificação. O ideal seria um banco de dados central.
        // Vamos varrer o localStorage
        let last = null;
        let maxDate = 0;
        
        for (let i = 0; i < localStorage.length; i++) {
            const key = localStorage.key(i);
            if(key.startsWith('rad_')) {
                const data = JSON.parse(localStorage.getItem(key));
                // Verifica se é do mesmo grupo (aproximado) e tem lessons
                if(data.group && data.group.toUpperCase().includes(group.toUpperCase()) && data.lessons && data.lessons.length > 0) {
                    const d = parseInt(key.split('_')[2]);
                    if(d > maxDate) {
                        maxDate = d;
                        last = data.lessons[data.lessons.length - 1];
                    }
                }
            }
        }
        return last;
    }

    function openRadModal(cls) {
        currentClassData = cls;
        const modal = document.getElementById('rad-modal');
        modal.classList.add('open');
        
        // Carregar dados salvos
        const key = getRadKey(cls);
        const saved = localStorage.getItem(key);
        const data = saved ? JSON.parse(saved) : { status: 'realized', lessons: [], attendance: {} };

        document.getElementById('rad-status').value = data.status;
        toggleRadFields();
        
        // Renderizar Lessons selecionadas
        tempLessons = data.lessons || [];
        updateSelectedLessonsDisplay();

        // Renderizar Lista de Alunos
        renderStudentList(cls.group, data.attendance || {});
    }

    function toggleRadFields() {
        const status = document.getElementById('rad-status').value;
        const details = document.getElementById('rad-details');
        details.style.display = (status === 'realized' || status === 'noshow') ? 'block' : 'none';
    }

    function renderStudentList(groupRaw, savedAttendance) {
        const list = document.getElementById('rad-student-list');
        list.innerHTML = '';
        
        // Tentar encontrar o grupo no DB (case insensitive)
        const groupName = Object.keys(studentsDB).find(k => k.toUpperCase() === groupRaw.toUpperCase()) || groupRaw;
        const students = studentsDB[groupName] || [];

        if(students.length === 0) {
            list.innerHTML = '<div style="padding:1rem; text-align:center; color:#666;">Nenhum aluno cadastrado para esta turma.</div>';
            return;
        }

        students.forEach(student => {
            const item = document.createElement('div');
            item.className = 'student-item';
            
            const isPresent = savedAttendance[student] === true;
            const isAbsent = savedAttendance[student] === false;

            item.innerHTML = `
                <span>${student}</span>
                <div class="checkbox-custom ${isPresent ? 'checked' : ''} ${isAbsent ? 'absent' : ''}" 
                     onclick="toggleStudentAttendance('${student}', this)">
                     ${isPresent ? '✓' : (isAbsent ? '✕' : '')}
                </div>
            `;
            list.appendChild(item);
        });
    }

    window.toggleStudentAttendance = function(name, el) {
        // Cicla: Nenhum -> Presente -> Ausente -> Nenhum
        if(el.classList.contains('checked')) {
            el.classList.remove('checked');
            el.classList.add('absent');
            el.innerHTML = '✕';
        } else if(el.classList.contains('absent')) {
            el.classList.remove('absent');
            el.innerHTML = '';
        } else {
            el.classList.add('checked');
            el.innerHTML = '✓';
        }
    };

    // --- LESSON PLAN LOGIC ---
    window.openLessonPlanModal = function(cls) {
        currentClassData = cls;
        const modal = document.getElementById('lesson-modal');
        modal.classList.add('open');
        
        // Carregar lessons salvas se houver
        const key = getRadKey(cls);
        const saved = localStorage.getItem(key);
        tempLessons = saved ? JSON.parse(saved).lessons : [];

        renderLessonChecklist(cls.book);
    };

    function renderLessonChecklist(bookRaw) {
        const container = document.getElementById('lesson-checklist-container');
        container.innerHTML = '';
        
        // Normalizar book name para chave (G1, G2...)
        let key = Object.keys(BOOKS_STRUCTURE).find(k => bookRaw && bookRaw.toUpperCase().includes(k)) || 'DEFAULT';
        const lessons = BOOKS_STRUCTURE[key];

        lessons.forEach((lesson, idx) => {
            const isSelected = tempLessons.includes(lesson);
            const item = document.createElement('div');
            item.className = `lesson-item ${isSelected ? 'selected' : ''}`;
            item.onclick = () => toggleLesson(lesson, item);
            item.innerHTML = `
                <div class="lesson-checkbox"></div>
                <span>${lesson}</span>
            `;
            container.appendChild(item);
        });
    }

    function toggleLesson(lesson, el) {
        if(tempLessons.includes(lesson)) {
            tempLessons = tempLessons.filter(l => l !== lesson);
            el.classList.remove('selected');
        } else {
            tempLessons.push(lesson);
            el.classList.add('selected');
        }
    }

    window.confirmLessonPlan = function() {
        updateSelectedLessonsDisplay();
        closeModal('lesson-modal');
    };

    function updateSelectedLessonsDisplay() {
        const div = document.getElementById('selected-lessons-display');
        div.innerText = tempLessons.length > 0 ? tempLessons.join(', ') : 'Nenhuma lição selecionada';
    }

    window.saveRad = function() {
        if(!currentClassData) return;
        
        const status = document.getElementById('rad-status').value;
        const attendance = {};
        
        // Coletar presença
        document.querySelectorAll('#rad-student-list .student-item').forEach(item => {
            const name = item.querySelector('span').innerText;
            const chk = item.querySelector('.checkbox-custom');
            if(chk.classList.contains('checked')) attendance[name] = true;
            if(chk.classList.contains('absent')) attendance[name] = false;
        });

        const data = {
            status: status,
            lessons: tempLessons,
            attendance: attendance,
            group: currentClassData.group,
            timestamp: new Date().toISOString()
        };

        localStorage.setItem(getRadKey(currentClassData), JSON.stringify(data));
        
        closeModal('rad-modal');
        renderSchedule(allClasses.filter(c => c.teacher === currentTeacher.name && c.dayHeader.includes(currentWeek.split(' ')[0]))); // Re-render simples
        alert('RAD Salvo com sucesso!');
    };

    window.clearRadData = function() {
        if(confirm('Tem certeza que deseja limpar todos os dados deste RAD?')) {
            localStorage.removeItem(getRadKey(currentClassData));
            closeModal('rad-modal');
            location.reload(); // Recarrega para atualizar status visual
        }
    };

    // --- CALCULADORA ---
    function switchTab(tabName) {
        document.querySelectorAll('.tab-content').forEach(el => el.style.display = 'none');
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        
        document.getElementById(`tab-${tabName}`).style.display = 'block';
        event.target.classList.add('active');

        if(tabName === 'calculator') renderCalculator();
    }

    function renderCalculator() {
        const monthIdx = parseInt(document.getElementById('calc-month').value);
        const container = document.getElementById('calc-results');
        
        let schoolRealized = 0;
        let inCompanyRealized = 0;
        let schoolNoShow = 0;
        let inCompanyNoShow = 0;

        // Filtrar aulas do professor no mês selecionado
        const classes = allClasses.filter(c => {
            return c.teacher === currentTeacher.name && 
                   c.dateObj.getMonth() === monthIdx;
        });

        classes.forEach(c => {
            const rad = JSON.parse(localStorage.getItem(getRadKey(c)) || '{}');
            if(rad.status === 'realized') {
                if(c.modal.includes('IN-C') || c.room.includes('IN-C') || c.group.includes('IN-C')) {
                    inCompanyRealized++;
                } else {
                    schoolRealized++;
                }
            } else if (rad.status === 'noshow') {
                if(c.modal.includes('IN-C') || c.room.includes('IN-C') || c.group.includes('IN-C')) {
                    inCompanyNoShow++;
                } else {
                    schoolNoShow++;
                }
            }
        });

        container.innerHTML = `
            <div class="class-card" style="text-align:center">
                <h3 style="color:var(--success)">${schoolRealized}</h3>
                <p style="font-size:0.8rem; color:#aaa;">Aulas Escola (Realizadas)</p>
            </div>
            <div class="class-card" style="text-align:center">
                <h3 style="color:var(--accent)">${inCompanyRealized}</h3>
                <p style="font-size:0.8rem; color:#aaa;">Aulas In-Company (Realizadas)</p>
            </div>
            <div class="class-card" style="text-align:center">
                <h3 style="color:var(--warning)">${schoolNoShow}</h3>
                <p style="font-size:0.8rem; color:#aaa;">Aulas Escola (No Show)</p>
            </div>
            <div class="class-card" style="text-align:center">
                <h3 style="color:var(--danger)">${inCompanyNoShow}</h3>
                <p style="font-size:0.8rem; color:#aaa;">Aulas In-Company (No Show)</p>
            </div>
        `;
    }

    // --- PRESENÇA GERAL ---
    window.showPresenceSelector = function() {
        document.getElementById('home-screen').classList.remove('active');
        document.getElementById('presence-screen').classList.add('active');
        
        const sel = document.getElementById('presence-group-select');
        sel.innerHTML = '<option value="">Selecione a Turma...</option>';
        Object.keys(studentsDB).sort().forEach(g => {
            const opt = document.createElement('option');
            opt.value = g;
            opt.text = g;
            sel.appendChild(opt);
        });
    };

    window.loadPresenceTable = function() {
        const group = document.getElementById('presence-group-select').value;
        const monthIdx = parseInt(document.getElementById('presence-month-select').value);
        const tbody = document.querySelector('#presence-table tbody');
        const thead = document.querySelector('#presence-table thead tr');
        
        tbody.innerHTML = '';
        thead.innerHTML = '<th>Aluno</th>';

        if(!group) return;

        const students = studentsDB[group] || [];
        const daysInMonth = new Date(new Date().getFullYear(), monthIdx + 1, 0).getDate();
        const monthNameShort = new Date(new Date().getFullYear(), monthIdx, 1).toLocaleString('default', {month:'short'});

        // Cabeçalho dias
        for(let d=1; d<=daysInMonth; d++) {
            const th = document.createElement('th');
            th.innerText = d;
            th.style.fontSize = '0.7rem';
            thead.appendChild(th);
        }

        // Linhas alunos
        students.forEach(student => {
            const tr = document.createElement('tr');
            let html = `<td style="text-align:left; font-weight:500;">${student}</td>`;
            
            for(let d=1; d<=daysInMonth; d++) {
                // Procurar aula neste dia
                // Nota: Isso é pesado, idealmente teríamos um índice.
                // Vamos simplificar: procurar no localStorage por chaves que batam com este aluno/grupo/dia
                // Como não temos data exata da aula no localStorage facilmente sem varrer tudo, 
                // vamos apenas mostrar dots se houver registro naquele dia aproximado.
                
                // Melhoria: Varre as aulas do cronograma deste grupo neste mês
                const targetDate = new Date(new Date().getFullYear(), monthIdx, d);
                const classOnDay = allClasses.find(c => 
                    c.group.toUpperCase() === group.toUpperCase() &&
                    c.dateObj.getDate() === d &&
                    c.dateObj.getMonth() === monthIdx
                );

                if(classOnDay) {
                    const rad = JSON.parse(localStorage.getItem(getRadKey(classOnDay)) || '{}');
                    if(rad.attendance && rad.attendance[student] === true) {
                        html += `<td><span class="status-dot dot-present"></span></td>`;
                    } else if (rad.attendance && rad.attendance[student] === false) {
                        html += `<td><span class="status-dot dot-absent"></span></td>`;
                    } else if (rad.status === 'cancelled') {
                        html += `<td><span class="status-dot dot-cancel"></span></td>`;
                    } else {
                        html += `<td>-</td>`;
                    }
                } else {
                    html += `<td style="background:#111;"></td>`; // Dia sem aula
                }
            }
            tr.innerHTML = html;
            tbody.appendChild(tr);
        });
    };

    // --- UTILS ---
    function closeModal(id) { document.getElementById(id).classList.remove('open'); }
    function goHome() {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById('home-screen').classList.add('active');
    }
</script>
