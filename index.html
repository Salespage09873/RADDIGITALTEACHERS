<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Portal</title>
    <style>
        :root {
            --bg-color: #050505;
            --card-bg: #0a0a0a;
            --text-main: #ffffff;
            --text-sec: #a0a0a0;
            --neon-blue: #00f3ff;
            --neon-dim: rgba(0, 243, 255, 0.1);
            --border: 1px solid #333;
            --danger: #ff2a2a;
            --success: #00ff9d;
            --warning: #ffaa00;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Courier New', Courier, monospace; }
        
        body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; }

        /* Header */
        header {
            padding: 1.5rem;
            text-align: center;
            border-bottom: 2px solid var(--neon-blue);
            background: #000;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        h1 { font-size: 1.5rem; text-transform: uppercase; letter-spacing: 2px; color: var(--neon-blue); text-shadow: 0 0 10px var(--neon-dim); }

        /* Container */
        .container { max-width: 1200px; margin: 0 auto; padding: 1rem; }

        /* Buttons & Inputs */
        button {
            background: transparent;
            border: 1px solid var(--neon-blue);
            color: var(--neon-blue);
            padding: 0.8rem 1.5rem;
            cursor: pointer;
            text-transform: uppercase;
            font-weight: bold;
            transition: all 0.3s;
            border-radius: 0;
            margin: 0.5rem;
            position: relative;
            overflow: hidden;
        }
        button:hover:not(:disabled) { background: var(--neon-blue); color: #000; box-shadow: 0 0 15px var(--neon-blue); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        button.secondary { border-color: var(--text-sec); color: var(--text-sec); }
        button.secondary:hover:not(:disabled) { background: var(--text-sec); color: #000; box-shadow: none; }
        button.danger { border-color: var(--danger); color: var(--danger); }
        button.danger:hover:not(:disabled) { background: var(--danger); color: #000; box-shadow: 0 0 15px var(--danger); }
        button.success { border-color: var(--success); color: var(--success); }
        button.success:hover:not(:disabled) { background: var(--success); color: #000; box-shadow: 0 0 15px var(--success); }
        
        input, select, textarea {
            background: #111;
            border: 1px solid #333;
            color: #fff;
            padding: 0.8rem;
            width: 100%;
            margin-bottom: 1rem;
            border-radius: 0;
        }
        input:focus, select:focus, textarea:focus { outline: none; border-color: var(--neon-blue); }
        input:disabled, select:disabled, textarea:disabled { opacity: 0.5; cursor: not-allowed; }

        /* Teacher Grid */
        .teachers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 1rem;
            margin-top: 2rem;
        }
        .teacher-card {
            background: var(--card-bg);
            border: 1px solid #333;
            padding: 1.5rem;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
            border-radius: 0;
        }
        .teacher-card:hover { border-color: var(--neon-blue); transform: translateY(-2px); }
        .teacher-name { font-weight: bold; font-size: 0.9rem; text-transform: uppercase; }

        /* Action Buttons Area */
        .action-area {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-top: 2rem;
            flex-wrap: wrap;
        }

        /* Screens */
        .screen { display: none; animation: fadeIn 0.4s ease; }
        .screen.active { display: block; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* Schedule View */
        .week-tabs { display: flex; gap: 0.5rem; margin-bottom: 1rem; overflow-x: auto; padding-bottom: 0.5rem; }
        .week-tab { white-space: nowrap; font-size: 0.8rem; padding: 0.5rem 1rem; opacity: 0.6; cursor: pointer; }
        .week-tab.active { opacity: 1; border-color: var(--neon-blue); background: var(--neon-dim); }
        .week-tab:hover:not(.active) { opacity: 0.8; }

        .day-section { margin-bottom: 2rem; border: 1px solid #333; background: #080808; }
        .day-header {
            background: #111;
            padding: 0.8rem;
            border-bottom: 1px solid var(--neon-blue);
            color: var(--neon-blue);
            font-weight: bold;
            text-transform: uppercase;
        }
        .classes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1rem;
            padding: 1rem;
        }
        .class-card {
            border: 1px solid #333;
            padding: 1rem;
            background: #0f0f0f;
            position: relative;
        }
        .class-card.done { border-color: var(--success); }
        .class-card.no-show { border-color: var(--danger); }
        .class-card.canceled { border-color: var(--warning); }
        
        .class-info { font-size: 0.85rem; color: var(--text-sec); margin-bottom: 0.5rem; line-height: 1.4; }
        .class-info strong { color: #fff; }
        .badge { display: inline-block; padding: 2px 6px; border: 1px solid #444; font-size: 0.7rem; margin-right: 4px; }
        .badge-book { border-color: var(--neon-blue); color: var(--neon-blue); }
        .badge-success { border-color: var(--success); color: var(--success); }
        .badge-danger { border-color: var(--danger); color: var(--danger); }
        .badge-warning { border-color: var(--warning); color: var(--warning); }
        
        .status-indicator {
            position: absolute;
            top: 5px;
            right: 5px;
            font-size: 1.2rem;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }
        .modal-content {
            background: #0a0a0a;
            border: 1px solid var(--neon-blue);
            padding: 1.5rem;
            width: 100%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            border-radius: 0;
        }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; border-bottom: 1px solid #333; padding-bottom: 0.5rem; }
        .close-modal { cursor: pointer; color: var(--text-sec); font-size: 1.5rem; }
        .close-modal:hover { color: var(--neon-blue); }

        /* Lesson Plan Specifics */
        .lp-list { list-style: none; }
        .lp-item {
            display: flex;
            align-items: center;
            padding: 0.8rem;
            border: 1px solid #333;
            margin-bottom: 0.5rem;
            background: #0f0f0f;
        }
        .lp-item.completed { border-color: var(--success); background: rgba(0, 255, 157, 0.05); }
        .lp-check { margin-right: 1rem; width: 20px; height: 20px; accent-color: var(--neon-blue); }
        .lp-name-input { flex: 1; margin: 0; padding: 0.5rem; font-size: 0.8rem; border: 1px solid #333; background: #000; }
        .lp-lesson-text { flex: 2; font-size: 0.9rem; color: #ccc; }

        /* Attendance Table */
        .attendance-table-wrapper { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
        th, td { border: 1px solid #333; padding: 0.5rem; text-align: center; }
        th { background: #111; color: var(--neon-blue); }
        td:first-child { text-align: left; position: sticky; left: 0; background: #0a0a0a; min-width: 150px; }
        .att-present { color: var(--success); }
        .att-absent { color: var(--danger); }
        .att-canceled { color: var(--text-sec); }

        /* Loading */
        .loading { text-align: center; padding: 2rem; color: var(--neon-blue); }
        .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 3px solid rgba(0, 243, 255, 0.1);
            border-top: 3px solid var(--neon-blue);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 1rem;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Toast/Notification */
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #0a0a0a;
            border: 1px solid var(--neon-blue);
            padding: 1rem 2rem;
            z-index: 2000;
            animation: slideIn 0.3s ease;
            max-width: 400px;
        }
        .toast.success { border-color: var(--success); }
        .toast.error { border-color: var(--danger); }
        .toast.warning { border-color: var(--warning); }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        .error-boundary {
            border: 1px solid var(--danger);
            background: rgba(255, 42, 42, 0.1);
            padding: 1rem;
            margin: 1rem 0;
            color: var(--danger);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .teachers-grid { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); }
            .classes-grid { grid-template-columns: 1fr; }
            .modal-content { max-width: 100%; margin: 0 0.5rem; }
        }
    </style>
</head>
<body>

<header>
    <h1>Teacher Portal</h1>
</header>

<div class="container">
    
    <!-- TELA INICIAL -->
    <div id="home-screen" class="screen active">
        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p>Carregando dados...</p>
        </div>
        
        <div id="teachers-container" style="display:none;">
            <h2 style="text-align:center; margin-bottom:1rem; color:#fff; font-size:1rem;">SELECT TEACHER</h2>
            <div class="teachers-grid" id="teachers-grid"></div>

            <div class="action-area">
                <button onclick="showAttendanceSelector()">📋 Lista de Presença</button>
                <button onclick="showLessonPlanSelector()">📚 Lesson Plan</button>
            </div>
        </div>
    </div>

    <!-- TELA DO PROFESSOR (CRONOGRAMA) -->
    <div id="teacher-screen" class="screen">
        <button class="secondary" onclick="showHome()" style="margin-bottom:1rem;">← Voltar</button>
        <h2 id="teacher-title" style="color:var(--neon-blue); margin-bottom:1rem; text-transform:uppercase;"></h2>
        
        <div class="week-tabs" id="week-tabs"></div>
        <div id="schedule-content"></div>
    </div>

    <!-- TELA DE SELEÇÃO DE TURMA (PRESENÇA / LESSON PLAN) -->
    <div id="selection-screen" class="screen">
        <button class="secondary" onclick="showHome()" style="margin-bottom:1rem;">← Voltar</button>
        <h2 id="selection-title" style="margin-bottom:1rem;"></h2>
        <select id="group-select" onchange="handleGroupSelect()"></select>
        <div id="selection-content"></div>
    </div>

</div>

<!-- MODAL RAD -->
<div id="rad-modal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>RAD - Registro de Aula</h3>
            <span class="close-modal" onclick="closeModal('rad-modal')">&times;</span>
        </div>
        <div id="rad-body"></div>
    </div>
</div>

<!-- MODAL LESSON PLAN (INTERNO DO RAD - TRAVA) -->
<div id="lp-lock-modal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>⚠️ Lesson Plan Obrigatória</h3>
            <span class="close-modal" onclick="closeModal('lp-lock-modal')">&times;</span>
        </div>
        <p style="margin-bottom:1rem; color:#ccc;">Você precisa preencher a Lesson Plan antes de finalizar o RAD.</p>
        <button onclick="forceOpenLP()">Ir para Lesson Plan</button>
    </div>
</div>

<!-- TOAST CONTAINER -->
<div id="toast-container"></div>

<script>
    // ============================================
    // CONFIGURAÇÕES
    // ============================================
    
    // URLs das planilhas
    const SCHEDULE_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQmSAl1ndXXSgDWbrjCiSDkmtECkP94Rr2nk-kIHV-zHd4NFSE9CzyQb6YP2Rt4lEQNYOpuvgjCYDal/pub?output=csv';
    const STUDENTS_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSlWLLO76YOXic0n11ttKL-UKoNGTT3VKEogt3pvHONM4Hnb3upvgYj_h8DOC57xmAobUXSIznc7V6x/pub?output=csv';
    
    // URLs das Lesson Plans por Book
    const LP_URLS = {
        'G1': 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQmSAl1ndXXSgDWbrjCiSDkmtECkP94Rr2nk-kIHV-zHd4NFSE9CzyQb6YP2Rt4lEQNYOpuvgjCYDal/pub?output=csv',
        'G2': 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQmSAl1ndXXSgDWbrjCiSDkmtECkP94Rr2nk-kIHV-zHd4NFSE9CzyQb6YP2Rt4lEQNYOpuvgjCYDal/pub?output=csv',
        'G3': 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQmSAl1ndXXSgDWbrjCiSDkmtECkP94Rr2nk-kIHV-zHd4NFSE9CzyQb6YP2Rt4lEQNYOpuvgjCYDal/pub?output=csv',
        'G4': 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQmSAl1ndXXSgDWbrjCiSDkmtECkP94Rr2nk-kIHV-zHd4NFSE9CzyQb6YP2Rt4lEQNYOpuvgjCYDal/pub?output=csv',
        'G5': 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQmSAl1ndXXSgDWbrjCiSDkmtECkP94Rr2nk-kIHV-zHd4NFSE9CzyQb6YP2Rt4lEQNYOpuvgjCYDal/pub?output=csv',
        'G6': 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQmSAl1ndXXSgDWbrjCiSDkmtECkP94Rr2nk-kIHV-zHd4NFSE9CzyQb6YP2Rt4lEQNYOpuvgjCYDal/pub?output=csv',
        'G7': 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQmSAl1ndXXSgDWbrjCiSDkmtECkP94Rr2nk-kIHV-zHd4NFSE9CzyQb6YP2Rt4lEQNYOpuvgjCYDal/pub?output=csv',
        'G8': 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQmSAl1ndXXSgDWbrjCiSDkmtECkP94Rr2nk-kIHV-zHd4NFSE9CzyQb6YP2Rt4lEQNYOpuvgjCYDal/pub?output=csv',
        'G9': 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQmSAl1ndXXSgDWbrjCiSDkmtECkP94Rr2nk-kIHV-zHd4NFSE9CzyQb6YP2Rt4lEQNYOpuvgjCYDal/pub?output=csv',
        'G10': 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQmSAl1ndXXSgDWbrjCiSDkmtECkP94Rr2nk-kIHV-zHd4NFSE9CzyQb6YP2Rt4lEQNYOpuvgjCYDal/pub?output=csv'
    };

    // ============================================
    // ESTADO GLOBAL
    // ============================================
    
    let teachers = ['MYCAEL', 'HOPE', 'PEDRO', 'DIOGO', 'LIVIA', 'TOSCA', 'IAGO', 'SARA', 'CAROL', 'LUISA', 'CARLA'];
    let scheduleData = [];
    let studentsData = {};
    let lpData = {}; // Armazena as Lesson Plans carregadas
    let currentWeekData = [];
    let currentTeacher = '';
    let currentClassId = '';
    let isLoading = false;

    // Mapeamento de cores dos professores
    const TEACHER_COLORS = {
        'MYCAEL': '#FF6B6B', 'HOPE': '#FFE66D', 'PEDRO': '#F38181',
        'DIOGO': '#AA96DA', 'LIVIA': '#FCBAD3', 'TOSCA': '#A8D8EA',
        'IAGO': '#FF9F43', 'SARA': '#54a0ff', 'CAROL': '#5f27cd',
        'LUISA': '#00d2d3', 'CARLA': '#ff9ff3'
    };

    // ============================================
    // SISTEMA DE TOAST (NOTIFICAÇÕES)
    // ============================================
    
    function showToast(message, type = 'info', duration = 5000) {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        toast.className = `toast ${type}`;
        toast.textContent = message;
        container.appendChild(toast);
        
        setTimeout(() => {
            toast.style.opacity = '0';
            toast.style.transition = 'opacity 0.3s';
            setTimeout(() => toast.remove(), 300);
        }, duration);
    }

    // ============================================
    // TRATAMENTO DE ERROS
    // ============================================
    
    function handleError(error, context = '') {
        console.error(`Error ${context}:`, error);
        showToast(`Erro ${context}: ${error.message || 'Desconhecido'}`, 'error');
        return null;
    }

    function safeExecute(fn, fallback = null) {
        try {
            return fn();
        } catch (error) {
            handleError(error, 'safeExecute');
            return fallback;
        }
    }

    // ============================================
    // LOADING STATES
    // ============================================
    
    function showLoading(elementId) {
        const element = document.getElementById(elementId);
        if (element) {
            element.innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Carregando...</p>
                </div>
            `;
        }
    }

    function hideLoading(elementId) {
        const element = document.getElementById(elementId);
        if (element) {
            // Remove o loading se existir
            const loading = element.querySelector('.loading');
            if (loading) loading.remove();
        }
    }

    function setLoadingState(button, isLoading) {
        if (button) {
            button.disabled = isLoading;
            button.textContent = isLoading ? '⏳ Carregando...' : button.dataset.originalText || button.textContent;
        }
    }

    // ============================================
    // CARREGAMENTO DE DADOS
    // ============================================
    
    async function loadData() {
        showLoading('loading');
        
        try {
            const results = await Promise.allSettled([
                loadSchedule(),
                loadStudents(),
                loadAllLessonPlans()
            ]);

            // Verifica resultados
            results.forEach((result, index) => {
                const names = ['Schedule', 'Students', 'Lesson Plans'];
                if (result.status === 'rejected') {
                    handleError(result.reason, names[index]);
                }
            });

            // Verifica se pelo menos os dados essenciais foram carregados
            if (scheduleData.length === 0) {
                showToast('Dados de cronograma não carregados. Verifique a planilha.', 'warning');
            }
            
            if (Object.keys(studentsData).length === 0) {
                showToast('Dados de alunos não carregados. Verifique a planilha.', 'warning');
            }

            renderTeachers();
            document.getElementById('loading').style.display = 'none';
            document.getElementById('teachers-container').style.display = 'block';
            
            showToast('Dados carregados com sucesso!', 'success', 3000);
        } catch (error) {
            handleError(error, 'loadData');
            document.getElementById('loading').innerHTML = `
                <div class="error-boundary">
                    <strong>❌ Erro ao carregar dados</strong>
                    <p>${error.message || 'Tente recarregar a página'}</p>
                    <button onclick="location.reload()">Recarregar</button>
                </div>
            `;
        }
    }

    async function loadSchedule() {
        try {
            const response = await fetch(SCHEDULE_URL);
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const csv = await response.text();
            parseScheduleCSV(csv);
            return true;
        } catch (error) {
            throw new Error(`Schedule: ${error.message}`);
        }
    }

    async function loadStudents() {
        try {
            const response = await fetch(STUDENTS_URL);
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const csv = await response.text();
            parseStudentsCSV(csv);
            return true;
        } catch (error) {
            throw new Error(`Students: ${error.message}`);
        }
    }

    async function loadAllLessonPlans() {
        const promises = Object.entries(LP_URLS).map(async ([book, url]) => {
            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error(`HTTP ${response.status} for ${book}`);
                const csv = await response.text();
                lpData[book] = parseLessonPlanCSV(csv);
                return true;
            } catch (error) {
                console.warn(`Failed to load LP for ${book}:`, error);
                lpData[book] = []; // Fallback para array vazio
                return false;
            }
        });

        await Promise.allSettled(promises);
    }

    // ============================================
    // PARSERS
    // ============================================
    
    function parseScheduleCSV(csv) {
        const lines = csv.split('\n').filter(l => l.trim());
        if (lines.length < 2) throw new Error('CSV vazio ou inválido');
        
        const headers = lines[0].split(',').map(h => h.trim().replace(/"/g, ''));
        const dayIndices = headers.map((h, idx) => idx >= 6 ? idx : null).filter(idx => idx !== null);

        scheduleData = [];
        for (let i = 1; i < lines.length; i++) {
            if (!lines[i].trim()) continue;
            
            const row = lines[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(c => c.trim().replace(/^"|"$/g, ''));
            if (row.length < 7) continue;

            const book = row[1] || '';
            const group = row[2] || '';
            const room = row[3] || '';
            const mod = row[4] || '';
            const time = row[5] || '';

            dayIndices.forEach(idx => {
                const cell = row[idx];
                if (cell && cell.includes('-')) {
                    let foundTeacher = null;
                    teachers.forEach(t => {
                        if (cell.toUpperCase().includes(t)) foundTeacher = t;
                    });

                    if (foundTeacher) {
                        scheduleData.push({
                            dayHeader: headers[idx],
                            teacher: foundTeacher,
                            book: book,
                            group: group,
                            room: room,
                            mod: mod,
                            time: time,
                            rawCell: cell
                        });
                    }
                }
            });
        }
    }

    function parseStudentsCSV(csv) {
        const lines = csv.split('\n').filter(l => l.trim());
        if (lines.length < 2) throw new Error('CSV de alunos vazio ou inválido');
        
        // Pula cabeçalho
        for (let i = 1; i < lines.length; i++) {
            if (!lines[i].trim()) continue;
            const [turma, aluno] = lines[i].split(',').map(s => s.trim().replace(/"/g, ''));
            if (turma && aluno) {
                if (!studentsData[turma]) studentsData[turma] = [];
                studentsData[turma].push(aluno);
            }
        }
    }

    function parseLessonPlanCSV(csv) {
        const lines = csv.split('\n').filter(l => l.trim());
        if (lines.length < 2) return [];
        
        const lessons = [];
        // Pula cabeçalho
        for (let i = 1; i < lines.length; i++) {
            if (!lines[i].trim()) continue;
            const row = lines[i].split(',').map(s => s.trim().replace(/"/g, ''));
            if (row[0]) lessons.push(row[0]);
        }
        return lessons;
    }

    // ============================================
    // UI RENDERIZAÇÃO
    // ============================================
    
    function renderTeachers() {
        const grid = document.getElementById('teachers-grid');
        grid.innerHTML = '';
        
        teachers.forEach(t => {
            const card = document.createElement('div');
            card.className = 'teacher-card';
            card.style.borderColor = TEACHER_COLORS[t] || '#333';
            card.innerHTML = `<div class="teacher-name" style="color:${TEACHER_COLORS[t] || '#fff'}">${t}</div>`;
            card.onclick = () => safeExecute(() => openTeacherSchedule(t));
            grid.appendChild(card);
        });
    }

    function renderWeekTabs() {
        const myClasses = scheduleData.filter(d => d.teacher === currentTeacher);
        const grouped = {};
        const order = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
        
        order.forEach(day => {
            const dayClasses = myClasses.filter(c => c.dayHeader.startsWith(day));
            if (dayClasses.length > 0) {
                grouped[day] = dayClasses;
            }
        });

        const tabsContainer = document.getElementById('week-tabs');
        tabsContainer.innerHTML = '';
        
        const tab = document.createElement('div');
        tab.className = 'week-tab active';
        tab.innerText = 'This Week';
        tabsContainer.appendChild(tab);

        renderScheduleGrid(grouped);
    }

    function renderScheduleGrid(groupedData) {
        const container = document.getElementById('schedule-content');
        container.innerHTML = '';

        if (Object.keys(groupedData).length === 0) {
            container.innerHTML = '<p style="text-align:center; padding:2rem; color:#666;">Nenhuma aula encontrada para este professor.</p>';
            return;
        }

        Object.keys(groupedData).forEach(dayKey => {
            const section = document.createElement('div');
            section.className = 'day-section';
            
            const header = document.createElement('div');
            header.className = 'day-header';
            header.innerText = dayKey;
            section.appendChild(header);

            const grid = document.createElement('div');
            grid.className = 'classes-grid';

            groupedData[dayKey].forEach(cls => {
                const id = `${cls.teacher}-${cls.dayHeader}-${cls.time}-${cls.group}`.replace(/\s/g, '');
                const savedData = getSavedData(id);
                const isDone = savedData && savedData.status === 'Realizada';
                const isNoShow = savedData && savedData.status === 'No Show';
                const isCanceled = savedData && savedData.status === 'Cancelada';

                const card = document.createElement('div');
                card.className = `class-card ${isDone ? 'done' : ''} ${isNoShow ? 'no-show' : ''} ${isCanceled ? 'canceled' : ''}`;
                
                let statusIcon = '';
                if (isDone) statusIcon = '<span class="status-indicator">✅</span>';
                if (isNoShow) statusIcon = '<span class="status-indicator">❌</span>';
                if (isCanceled) statusIcon = '<span class="status-indicator">⚠️</span>';

                // Verifica se tem Lesson Plan para este grupo
                const hasLP = lpData[cls.group] && lpData[cls.group].length > 0;

                card.innerHTML = `
                    ${statusIcon}
                    <div class="class-info"><strong>⏰ ${cls.time}</strong></div>
                    <div class="class-info">
                        <span class="badge badge-book">${cls.book}</span>
                        <span class="badge">${cls.group}</span>
                        ${hasLP ? '<span class="badge badge-success">📚 LP</span>' : '<span class="badge badge-danger">📚 Sem LP</span>'}
                    </div>
                    <div class="class-info">📍 ${cls.room} | 📚 ${cls.mod}</div>
                    <div style="margin-top:10px; display:flex; gap:5px;">
                        <button style="font-size:0.7rem; padding:0.3rem;" onclick="openLPView('${cls.group}', '${cls.book}', '${id}')">Lesson Plan</button>
                        <button style="font-size:0.7rem; padding:0.3rem;" onclick="openRAD('${id}', '${cls.group}', '${cls.book}')">RAD</button>
                    </div>
                `;
                grid.appendChild(card);
            });
            section.appendChild(grid);
            container.appendChild(section);
        });
    }

    // ============================================
    // LESSON PLAN FUNCTIONS
    // ============================================
    
    function showLessonPlanSelector() {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById('selection-screen').classList.add('active');
        document.getElementById('selection-title').innerText = 'Selecionar Turma (Lesson Plan)';
        
        const select = document.getElementById('group-select');
        select.innerHTML = '<option value="">Selecione a Turma...</option>';
        
        const turmas = Object.keys(studentsData).sort();
        if (turmas.length === 0) {
            select.innerHTML = '<option value="">Nenhuma turma encontrada</option>';
            document.getElementById('selection-content').innerHTML = '<p style="color:#666;">Não há turmas cadastradas.</p>';
            return;
        }

        turmas.forEach(turma => {
            const opt = document.createElement('option');
            opt.value = turma;
            opt.innerText = turma;
            select.appendChild(opt);
        });
        
        document.getElementById('selection-content').innerHTML = '';
        window.currentSelectionType = 'LESSON_PLAN_GLOBAL';
    }

    function renderGlobalLPList(group, container) {
        try {
            // Busca as lições da Lesson Plan para este grupo
            const lessons = lpData[group] || [];
            
            if (lessons.length === 0) {
                container.innerHTML = `
                    <div class="error-boundary">
                        <p>⚠️ Nenhuma Lesson Plan encontrada para a turma ${group}.</p>
                        <p style="font-size:0.8rem; margin-top:0.5rem;">Verifique se a planilha de Lesson Plan está configurada corretamente.</p>
                    </div>
                `;
                return;
            }

            // Busca histórico de aulas dessa turma
            const history = [];
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key && key.startsWith('rad_') && key.includes(group)) {
                    try {
                        const data = JSON.parse(localStorage.getItem(key));
                        if (data && data.lp && data.lp.lessons && data.lp.lessons.length > 0) {
                            history.push({
                                date: key,
                                lessons: data.lp.lessons,
                                teacher: data.lp.teacherName || 'Unknown',
                                status: data.status || 'Registrada'
                            });
                        }
                    } catch (e) {
                        console.warn('Erro ao ler histórico:', e);
                    }
                }
            }

            const list = document.createElement('ul');
            list.className = 'lp-list';
            
            // Mostra todas as lições disponíveis
            const allLessonsList = document.createElement('div');
            allLessonsList.innerHTML = `
                <h4 style="margin:1rem 0 0.5rem; color:var(--neon-blue);">📚 Todas as Lições Disponíveis (${lessons.length})</h4>
                <div style="display:flex; flex-wrap:wrap; gap:0.5rem; margin-bottom:1rem;">
                    ${lessons.map(l => `<span class="badge badge-book">${l}</span>`).join('')}
                </div>
            `;
            list.appendChild(allLessonsList);

            // Mostra histórico se existir
            if (history.length > 0) {
                const historyDiv = document.createElement('div');
                historyDiv.innerHTML = `<h4 style="margin:1rem 0 0.5rem; color:var(--success);">📋 Histórico de Aulas Realizadas (${history.length})</h4>`;
                
                history.sort((a, b) => b.date.localeCompare(a.date));
                history.forEach(h => {
                    const li = document.createElement('li');
                    li.className = 'lp-item completed';
                    li.style.flexDirection = 'column';
                    li.style.alignItems = 'flex-start';
                    
                    const statusBadge = h.status === 'Realizada' ? 'badge-success' : 'badge-warning';
                    
                    li.innerHTML = `
                        <div style="width:100%; display:flex; justify-content:space-between; margin-bottom:5px;">
                            <strong style="color:var(--success)">${h.status}</strong>
                            <span style="font-size:0.7rem; color:#666;">Por: ${h.teacher}</span>
                        </div>
                        <div style="display:flex; flex-wrap:wrap; gap:0.3rem;">
                            ${h.lessons.map(l => `<span class="badge badge-book">${l}</span>`).join('')}
                        </div>
                    `;
                    historyDiv.appendChild(li);
                });
                list.appendChild(historyDiv);
            } else {
                const noHistory = document.createElement('p');
                noHistory.style.color = '#666';
                noHistory.style.margin = '1rem 0';
                noHistory.textContent = 'Nenhuma aula registrada ainda para esta turma.';
                list.appendChild(noHistory);
            }

            container.appendChild(list);
        } catch (error) {
            handleError(error, 'renderGlobalLPList');
            container.innerHTML = `<div class="error-boundary">❌ Erro ao carregar Lesson Plan: ${error.message}</div>`;
        }
    }

    // ============================================
    // ATTENDANCE FUNCTIONS
    // ============================================
    
    function showAttendanceSelector() {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById('selection-screen').classList.add('active');
        document.getElementById('selection-title').innerText = 'Selecionar Turma (Presença)';
        
        const select = document.getElementById('group-select');
        select.innerHTML = '<option value="">Selecione a Turma...</option>';
        
        const turmas = Object.keys(studentsData).sort();
        if (turmas.length === 0) {
            select.innerHTML = '<option value="">Nenhuma turma encontrada</option>';
            document.getElementById('selection-content').innerHTML = '<p style="color:#666;">Não há turmas cadastradas.</p>';
            return;
        }

        turmas.forEach(turma => {
            const opt = document.createElement('option');
            opt.value = turma;
            opt.innerText = turma;
            select.appendChild(opt);
        });

        document.getElementById('selection-content').innerHTML = '';
        window.currentSelectionType = 'ATTENDANCE';
    }

    function renderAttendanceTable(group, container) {
        try {
            const students = studentsData[group] || [];
            if (students.length === 0) {
                container.innerHTML = '<p style="color:#666;">Nenhum aluno encontrado para esta turma.</p>';
                return;
            }

            // Busca dados de presença do localStorage
            const attendanceData = {};
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key && key.startsWith('rad_') && key.includes(group)) {
                    try {
                        const data = JSON.parse(localStorage.getItem(key));
                        if (data && data.attendance) {
                            Object.entries(data.attendance).forEach(([student, status]) => {
                                if (!attendanceData[student]) attendanceData[student] = {};
                                attendanceData[student][key] = status;
                            });
                        }
                    } catch (e) {
                        console.warn('Erro ao ler presença:', e);
                    }
                }
            }

            const today = new Date();
            const daysInMonth = new Date(today.getFullYear(), today.getMonth() + 1, 0).getDate();
            
            let html = '<div class="attendance-table-wrapper"><table><thead><tr><th>Aluno</th>';
            
            // Cabeçalho dos dias
            for (let d = 1; d <= daysInMonth; d++) {
                const date = new Date(today.getFullYear(), today.getMonth(), d);
                const isWeekend = date.getDay() === 0 || date.getDay() === 6;
                html += `<th style="${isWeekend ? 'color:#666;' : ''}">${d}</th>`;
            }
            html += '<th>Faltas</th></tr></thead><tbody>';

            students.forEach(student => {
                html += `<tr><td>${student}</td>`;
                let faltas = 0;
                
                for (let d = 1; d <= daysInMonth; d++) {
                    const dateKey = `rad_${group}-${today.getFullYear()}-${today.getMonth() + 1}-${d}`;
                    const status = attendanceData[student] && attendanceData[student][dateKey];
                    
                    if (status === 'absent') {
                        html += `<td class="att-absent">❌</td>`;
                        faltas++;
                    } else if (status === 'present') {
                        html += `<td class="att-present">✅</td>`;
                    } else {
                        html += `<td style="color:#333;">-</td>`;
                    }
                }
                html += `<td style="color:var(--danger); font-weight:bold;">${faltas}</td>`;
                html += '</tr>';
            });

            html += '</tbody></table></div>';
            html += '<p style="margin-top:1rem; font-size:0.8rem; color:#666;">✅ Presente | ❌ Ausente | - Sem registro</p>';
            
            container.innerHTML = html;
        } catch (error) {
            handleError(error, 'renderAttendanceTable');
            container.innerHTML = `<div class="error-boundary">❌ Erro ao carregar presença: ${error.message}</div>`;
        }
    }

    // ============================================
    // RAD FUNCTIONS
    // ============================================
    
    function getSavedData(id) {
        try {
            const data = localStorage.getItem('rad_' + id);
            return data ? JSON.parse(data) : null;
        } catch (error) {
            console.warn('Erro ao ler dados salvos:', error);
            return null;
        }
    }

    function saveData(id, data) {
        try {
            localStorage.setItem('rad_' + id, JSON.stringify(data));
            return true;
        } catch (error) {
            handleError(error, 'saveData');
            return false;
        }
    }

    function openLPView(group, book, classId) {
        try {
            // Busca a Lesson Plan para este grupo
            const lessons = lpData[group] || [];
            
            if (lessons.length === 0) {
                showToast(`⚠️ Nenhuma Lesson Plan disponível para a turma ${group}`, 'warning');
                return;
            }

            const modal = document.getElementById('rad-modal');
            const body = document.getElementById('rad-body');
            
            const saved = getSavedData(classId);
            const savedLessons = saved && saved.lp ? saved.lp.lessons : [];
            const savedObs = saved && saved.lp ? saved.lp.observation : '';
            const savedTeacher = saved && saved.lp ? saved.lp.teacherName : '';

            // Limita a exibição para não sobrecarregar
            const displayLessons = lessons.slice(0, 30); // Mostra no máximo 30

            body.innerHTML = `
                <h3 style="color:var(--neon-blue); margin-bottom:1rem;">Lesson Plan: ${group}</h3>
                <p style="margin-bottom:1rem; font-size:0.8rem; color:#aaa;">Total de lições: ${lessons.length} | Exibindo: ${displayLessons.length}</p>
                <p style="margin-bottom:1rem; font-size:0.7rem; color:#666;">Marque o que foi realizado e assine.</p>
                
                <div style="max-height:300px; overflow-y:auto; border:1px solid #333; padding:0.5rem; margin-bottom:1rem;">
                    ${displayLessons.map((l, idx) => {
                        const isChecked = savedLessons.includes(l) ? 'checked' : '';
                        const nameVal = savedLessons.includes(l) ? savedTeacher : '';
                        return `
                        <div class="lp-item ${isChecked ? 'completed' : ''}">
                            <input type="checkbox" class="lp-check" id="lp_cb_${idx}" ${isChecked} onchange="toggleLPItem(this, '${l}')">
                            <span class="lp-lesson-text">${l}</span>
                            <input type="text" class="lp-name-input" id="lp_nm_${idx}" placeholder="Seu Nome" value="${nameVal}" ${isChecked ? '' : 'disabled'}>
                        </div>`;
                    }).join('')}
                </div>
                ${lessons.length > 30 ? '<p style="font-size:0.7rem; color:#666;">... e mais lições disponíveis</p>' : ''}

                <textarea id="lp_obs" rows="3" placeholder="Observações da aula...">${savedObs || ''}</textarea>
                
                <button onclick="saveLPOnly('${classId}')" class="success">Salvar Lesson Plan</button>
            `;
            
            modal.style.display = 'flex';
            window.currentRadId = classId;
        } catch (error) {
            handleError(error, 'openLPView');
            showToast('Erro ao abrir Lesson Plan', 'error');
        }
    }

    function toggleLPItem(cb, lesson) {
        try {
            const inputName = cb.parentElement.querySelector('.lp-name-input');
            const parent = cb.parentElement;
            if (cb.checked) {
                inputName.disabled = false;
                inputName.focus();
                parent.classList.add('completed');
            } else {
                inputName.disabled = true;
                inputName.value = '';
                parent.classList.remove('completed');
            }
        } catch (error) {
            handleError(error, 'toggleLPItem');
        }
    }

    function saveLPOnly(id) {
        try {
            const checkedBoxes = document.querySelectorAll('.lp-check:checked');
            const lessons = [];
            let teacherName = '';
            
            checkedBoxes.forEach(cb => {
                const lessonText = cb.nextElementSibling.innerText;
                if (lessonText) lessons.push(lessonText);
                const nameInput = cb.parentElement.querySelector('.lp-name-input');
                if (nameInput && nameInput.value) teacherName = nameInput.value;
            });

            const obs = document.getElementById('lp_obs')?.value || '';

            if (lessons.length === 0) {
                showToast('Selecione pelo menos uma lição.', 'warning');
                return;
            }
            if (!teacherName) {
                showToast('Digite seu nome ao lado da lição marcada.', 'warning');
                return;
            }

            let data = getSavedData(id) || {};
            data.lp = { lessons, observation: obs, teacherName };
            data.lastUpdated = new Date().toISOString();
            
            if (saveData(id, data)) {
                showToast('✅ Lesson Plan salva com sucesso!', 'success');
                closeModal('rad-modal');
                if (currentTeacher) openTeacherSchedule(currentTeacher);
                else showLessonPlanSelector();
            }
        } catch (error) {
            handleError(error, 'saveLPOnly');
            showToast('Erro ao salvar Lesson Plan', 'error');
        }
    }

    function forceOpenLP() {
        try {
            closeModal('lp-lock-modal');
            // Tenta abrir o LP novamente
            if (window.pendingRadId && window.pendingRadGroup) {
                openLPView(window.pendingRadGroup, window.pendingRadBook, window.pendingRadId);
            } else {
                showToast('Erro: Dados da aula não encontrados', 'error');
            }
        } catch (error) {
            handleError(error, 'forceOpenLP');
        }
    }

    function openRAD(id, group, book) {
        try {
            const saved = getSavedData(id);
            
            // Verifica se tem LP salva
            if (!saved || !saved.lp || !saved.lp.lessons || saved.lp.lessons.length === 0) {
                document.getElementById('lp-lock-modal').style.display = 'flex';
                window.pendingRadId = id;
                window.pendingRadGroup = group;
                window.pendingRadBook = book;
                return;
            }

            renderRADModal(id, group, book, saved);
        } catch (error) {
            handleError(error, 'openRAD');
            showToast('Erro ao abrir RAD', 'error');
        }
    }

    function renderRADModal(id, group, book, savedData) {
        try {
            const modal = document.getElementById('rad-modal');
            const body = document.getElementById('rad-body');
            
            const students = studentsData[group] || [];
            const status = savedData ? savedData.status : '';
            const attendance = savedData ? savedData.attendance : {};

            let studentsHtml = '';
            if (students.length > 0) {
                studentsHtml = '<h4 style="margin:1rem 0 0.5rem; color:#fff;">Lista de Presença</h4><div style="max-height:200px; overflow-y:auto;">';
                students.forEach((stu, idx) => {
                    const attStatus = attendance[stu] || 'present';
                    studentsHtml += `
                        <div style="display:flex; justify-content:space-between; padding:0.5rem; border-bottom:1px solid #222;">
                            <span>${stu}</span>
                            <select style="width:100px; margin:0; padding:0.2rem; font-size:0.7rem;" onchange="updateAtt('${stu}', this.value)">
                                <option value="present" ${attStatus==='present'?'selected':''}>Presente</option>
                                <option value="absent" ${attStatus==='absent'?'selected':''}>Ausente</option>
                            </select>
                        </div>
                    `;
                });
                studentsHtml += '</div>';
            } else {
                studentsHtml = '<p style="color:#666; font-size:0.8rem;">Sem alunos cadastrados para esta turma.</p>';
            }

            body.innerHTML = `
                <h3 style="color:var(--neon-blue);">RAD: ${group}</h3>
                <div style="background:#111; padding:0.5rem; margin:0.5rem 0; border:1px solid #333;">
                    <strong>Lesson Realizada:</strong> ${savedData.lp.lessons.join(', ')}<br>
                    <strong>Prof:</strong> ${savedData.lp.teacherName}<br>
                    <em>Obs: ${savedData.lp.observation || '-'}</em>
                </div>

                ${studentsHtml}

                <h4 style="margin:1rem 0 0.5rem; color:#fff;">Status da Aula</h4>
                <select id="rad-status" style="margin-bottom:1rem;">
                    <option value="Realizada" ${status==='Realizada'?'selected':''}>✅ Realizada</option>
                    <option value="No Show" ${status==='No Show'?'selected':''}>❌ No Show</option>
                    <option value="Cancelada" ${status==='Cancelada'?'selected':''}>⚠️ Cancelada</option>
                </select>

                <button onclick="finalizeRAD('${id}')" class="success">SALVAR RAD</button>
            `;

            modal.style.display = 'flex';
            window.currentRadId = id;
        } catch (error) {
            handleError(error, 'renderRADModal');
            showToast('Erro ao renderizar RAD', 'error');
        }
    }

    function updateAtt(student, val) {
        try {
            const id = window.currentRadId;
            let data = getSavedData(id) || {};
            if (!data.attendance) data.attendance = {};
            data.attendance[student] = val;
            saveData(id, data);
        } catch (error) {
            handleError(error, 'updateAtt');
        }
    }

    function finalizeRAD(id) {
        try {
            const statusSelect = document.getElementById('rad-status');
            if (!statusSelect) {
                showToast('Erro: Status não encontrado', 'error');
                return;
            }
            
            const status = statusSelect.value;
            let data = getSavedData(id) || {};
            data.status = status;
            data.finalizedAt = new Date().toISOString();
            
            if (saveData(id, data)) {
                showToast('✅ RAD salvo com sucesso!', 'success');
                closeModal('rad-modal');
                if (currentTeacher) openTeacherSchedule(currentTeacher);
            }
        } catch (error) {
            handleError(error, 'finalizeRAD');
            showToast('Erro ao salvar RAD', 'error');
        }
    }

    // ============================================
    // NAVEGAÇÃO E UTILIDADES
    // ============================================
    
    function showHome() {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById('home-screen').classList.add('active');
    }

    function openTeacherSchedule(teacher) {
        try {
            currentTeacher = teacher;
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById('teacher-screen').classList.add('active');
            
            const title = document.getElementById('teacher-title');
            title.innerText = `Schedule: ${teacher}`;
            title.style.color = TEACHER_COLORS[teacher] || '#fff';

            renderWeekTabs();
        } catch (error) {
            handleError(error, 'openTeacherSchedule');
        }
    }

    function handleGroupSelect() {
        try {
            const group = document.getElementById('group-select').value;
            const content = document.getElementById('selection-content');
            content.innerHTML = '';

            if (!group) return;

            if (window.currentSelectionType === 'ATTENDANCE') {
                renderAttendanceTable(group, content);
            } else if (window.currentSelectionType === 'LESSON_PLAN_GLOBAL') {
                renderGlobalLPList(group, content);
            }
        } catch (error) {
            handleError(error, 'handleGroupSelect');
        }
    }

    function closeModal(modalId) {
        const modal = document.getElementById(modalId);
        if (modal) modal.style.display = 'none';
    }

    // Fechar modal ao clicar fora
    window.onclick = function(event) {
        if (event.target.classList.contains('modal')) {
            event.target.style.display = 'none';
        }
    }

    // ============================================
    // INICIALIZAÇÃO
    // ============================================
    
    document.addEventListener('DOMContentLoaded', () => {
        loadData().catch(error => {
            handleError(error, 'inicialização');
        });
    });
</script>
