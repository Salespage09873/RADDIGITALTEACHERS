<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>School Management System</title>
    <style>
        :root {
            --bg-color: #050505;
            --card-bg: #121212;
            --text-main: #ffffff;
            --text-sec: #a0a0a0;
            --accent: #00f3ff;
            --accent-dim: rgba(0, 243, 255, 0.1);
            --danger: #ff2a2a;
            --success: #00ff9d;
            --warning: #ffaa00;
            --border-radius: 4px; /* Menos arredondado */
            --font-main: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-main);
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* Header & Nav */
        header {
            background: rgba(10, 10, 10, 0.95);
            border-bottom: 1px solid #333;
            padding: 1rem;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        h1 { font-size: 1.2rem; text-transform: uppercase; letter-spacing: 2px; color: var(--accent); text-align: center; }

        .week-nav {
            display: flex;
            overflow-x: auto;
            gap: 10px;
            padding: 10px 0;
            scrollbar-width: none;
        }
        .week-nav::-webkit-scrollbar { display: none; }

        .week-btn {
            background: var(--card-bg);
            border: 1px solid #333;
            color: var(--text-sec);
            padding: 8px 16px;
            border-radius: var(--border-radius);
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }

        .week-btn.active {
            background: var(--accent);
            color: #000;
            border-color: var(--accent);
            font-weight: bold;
            box-shadow: 0 0 15px var(--accent-dim);
        }

        /* Container */
        .container { padding: 1rem; max-width: 1200px; margin: 0 auto; padding-bottom: 80px; }

        /* Teacher Grid */
        .teacher-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
        }

        .teacher-card {
            background: var(--card-bg);
            border: 1px solid #333;
            border-left: 3px solid var(--accent);
            padding: 1.5rem 1rem;
            text-align: center;
            border-radius: var(--border-radius);
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100px;
        }

        .teacher-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 243, 255, 0.15);
            border-color: var(--accent);
        }

        .teacher-name { font-weight: bold; font-size: 1rem; text-transform: uppercase; letter-spacing: 1px; }
        .teacher-role { font-size: 0.75rem; color: var(--text-sec); margin-top: 5px; }

        /* Action Button (Presence) */
        .action-section {
            margin-top: 2rem;
            text-align: center;
            border-top: 1px solid #222;
            padding-top: 1.5rem;
        }
        
        .btn-main {
            background: transparent;
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 12px 24px;
            font-size: 1rem;
            border-radius: var(--border-radius);
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s;
            width: 100%;
            max-width: 300px;
        }

        .btn-main:hover { background: var(--accent); color: #000; }

        /* Views */
        .view { display: none; animation: fadeIn 0.4s ease; }
        .view.active { display: block; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Schedule View */
        .schedule-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid #333;
            padding-bottom: 1rem;
        }
        
        .back-btn { background: none; border: none; color: var(--text-sec); cursor: pointer; font-size: 1rem; display: flex; align-items: center; gap: 5px; }
        .back-btn:hover { color: var(--accent); }

        .day-section { margin-bottom: 2rem; }
        .day-title {
            font-size: 1.1rem;
            color: var(--accent);
            border-left: 3px solid var(--accent);
            padding-left: 10px;
            margin-bottom: 1rem;
            text-transform: uppercase;
        }

        .class-card {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: var(--border-radius);
            padding: 1rem;
            margin-bottom: 1rem;
            position: relative;
        }

        .class-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.5rem; }
        .class-time { font-size: 0.9rem; color: var(--accent); font-weight: bold; }
        .class-status { font-size: 0.7rem; padding: 2px 6px; border-radius: 2px; text-transform: uppercase; }
        .status-realizada { background: var(--success); color: #000; }
        .status-cancelada { background: var(--danger); color: #fff; }
        .status-noshow { background: var(--warning); color: #000; }

        .class-info { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; font-size: 0.85rem; color: #ccc; margin-bottom: 0.5rem; }
        .info-label { color: #666; font-size: 0.7rem; text-transform: uppercase; }
        .info-value { color: #fff; font-weight: 500; }
        
        .last-lesson-info {
            background: rgba(0, 243, 255, 0.05);
            border: 1px solid rgba(0, 243, 255, 0.2);
            padding: 8px;
            border-radius: var(--border-radius);
            font-size: 0.8rem;
            margin-top: 8px;
            color: var(--accent);
        }

        .class-actions { display: flex; gap: 10px; margin-top: 1rem; }
        .btn-sm {
            flex: 1;
            padding: 8px;
            border: none;
            border-radius: var(--border-radius);
            font-size: 0.8rem;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
        }
        .btn-rad { background: var(--accent); color: #000; }
        .btn-calc { background: #333; color: #fff; }

        /* Modals */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            display: none;
            justify-content: center;
            align-items: flex-end; /* Mobile first: bottom sheet */
        }
        @media(min-width: 768px) { .modal-overlay { align-items: center; } }

        .modal-content {
            background: #121212;
            width: 100%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
            border-top: 2px solid var(--accent);
            padding: 1.5rem;
            border-radius: var(--border-radius) var(--border-radius) 0 0;
            position: relative;
        }
        @media(min-width: 768px) { .modal-content { border-radius: var(--border-radius); border-top: 2px solid var(--accent); } }

        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; border-bottom: 1px solid #333; padding-bottom: 1rem; }
        .close-modal { background: none; border: none; color: #fff; font-size: 1.5rem; cursor: pointer; }

        /* Forms */
        .form-group { margin-bottom: 1.2rem; }
        label { display: block; color: var(--text-sec); font-size: 0.8rem; margin-bottom: 0.5rem; text-transform: uppercase; }
        select, input[type="text"], textarea {
            width: 100%;
            background: #0a0a0a;
            border: 1px solid #333;
            color: #fff;
            padding: 10px;
            border-radius: var(--border-radius);
            font-family: inherit;
        }
        select:focus, input:focus, textarea:focus { outline: none; border-color: var(--accent); }

        /* Student List in RAD */
        .student-list { max-height: 300px; overflow-y: auto; border: 1px solid #333; border-radius: var(--border-radius); }
        .student-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px; border-bottom: 1px solid #222;
        }
        .student-item:last-child { border-bottom: none; }
        .checkbox-custom {
            width: 20px; height: 20px;
            accent-color: var(--accent);
            cursor: pointer;
        }

        /* Lesson Plan Grid */
        .lesson-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 8px;
            max-height: 400px;
            overflow-y: auto;
            padding: 5px;
        }
        .lesson-item {
            background: #1a1a1a;
            border: 1px solid #333;
            padding: 8px;
            border-radius: var(--border-radius);
            font-size: 0.8rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .lesson-item.selected {
            border-color: var(--success);
            background: rgba(0, 255, 157, 0.1);
            color: var(--success);
        }
        .lesson-item input { display: none; }

        /* Presence View */
        .presence-filters { display: flex; gap: 10px; margin-bottom: 1rem; flex-wrap: wrap; }
        .presence-table-wrapper { overflow-x: auto; }
        .presence-table {
            width: 100%; border-collapse: collapse; font-size: 0.8rem;
            min-width: 600px;
        }
        .presence-table th, .presence-table td {
            border: 1px solid #333; padding: 8px; text-align: center;
        }
        .presence-table th { background: #1a1a1a; color: var(--accent); position: sticky; left: 0; }
        .presence-table td:first-child { text-align: left; position: sticky; left: 0; background: #121212; font-weight: bold; min-width: 150px; }
        .p-mark { width: 20px; height: 20px; display: inline-block; border-radius: 50%; }
        .p-present { background: var(--success); }
        .p-absent { background: var(--danger); }
        .p-cancel { background: var(--text-sec); }

        /* Calculator Tabs inside Teacher View */
        .teacher-tabs { display: flex; gap: 10px; margin-bottom: 1rem; border-bottom: 1px solid #333; }
        .tab-btn {
            background: none; border: none; color: var(--text-sec);
            padding: 10px; cursor: pointer; font-weight: bold; border-bottom: 2px solid transparent;
        }
        .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }

        .stats-grid {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; margin-top: 1rem;
        }
        .stat-card {
            background: #1a1a1a; padding: 1rem; border-radius: var(--border-radius);
            text-align: center; border: 1px solid #333;
        }
        .stat-val { font-size: 1.5rem; font-weight: bold; color: var(--accent); display: block; }
        .stat-label { font-size: 0.7rem; text-transform: uppercase; color: var(--text-sec); }

        /* Loading */
        .loader { text-align: center; padding: 2rem; color: var(--accent); }
    </style>
</head>
<body>

<header>
    <h1 id="app-title">School System</h1>
    <div class="week-nav" id="week-nav">
        <!-- Weeks injected here -->
    </div>
</header>

<div class="container">
    
    <!-- HOME VIEW -->
    <div id="view-home" class="view active">
        <div id="loading" class="loader">Carregando dados...</div>
        
        <div id="teacher-list" style="display:none;">
            <h2 style="color:var(--text-sec); font-size:0.9rem; text-transform:uppercase; margin-bottom:1rem;">Professores</h2>
            <div class="teacher-grid" id="teacher-grid"></div>
            
            <div class="action-section">
                <button class="btn-main" onclick="openPresenceView()">📋 Lista de Presença Geral</button>
            </div>
        </div>
        
        <div id="error-msg" style="color:var(--danger); text-align:center; display:none;"></div>
    </div>

    <!-- TEACHER SCHEDULE VIEW -->
    <div id="view-schedule" class="view">
        <div class="schedule-header">
            <button class="back-btn" onclick="showView('view-home')">← Voltar</button>
            <h2 id="current-teacher-name" style="color:var(--accent); text-transform:uppercase;"></h2>
            <div style="width:60px;"></div> <!-- Spacer -->
        </div>

        <div class="teacher-tabs">
            <button class="tab-btn active" onclick="switchTeacherTab('schedule')">Cronograma</button>
            <button class="tab-btn" onclick="switchTeacherTab('calculator')">Calculadora</button>
        </div>

        <div id="teacher-schedule-content"></div>
        <div id="teacher-calculator-content" style="display:none;">
            <div class="form-group">
                <label>Mês de Referência</label>
                <select id="calc-month-select" onchange="renderCalculator()"></select>
            </div>
            <div class="stats-grid" id="calc-stats"></div>
        </div>
    </div>

    <!-- PRESENCE VIEW -->
    <div id="view-presence" class="view">
        <div class="schedule-header">
            <button class="back-btn" onclick="showView('view-home')">← Voltar</button>
            <h2>Lista de Presença</h2>
            <div style="width:60px;"></div>
        </div>
        
        <div class="presence-filters">
            <select id="presence-group-select" onchange="renderPresenceTable()" style="flex:1;">
                <option value="">Selecione a Turma...</option>
            </select>
            <select id="presence-month-select" onchange="renderPresenceTable()" style="flex:1;">
                <!-- Months -->
            </select>
        </div>

        <div class="presence-table-wrapper">
            <table class="presence-table" id="presence-table">
                <thead><tr><th>Aluno</th></tr></thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

</div>

<!-- MODALS -->

<!-- RAD Modal -->
<div id="modal-rad" class="modal-overlay">
    <div class="modal-content">
        <div class="modal-header">
            <h3>Registro de Aula (RAD)</h3>
            <button class="close-modal" onclick="closeModal('modal-rad')">&times;</button>
        </div>
        <div id="rad-content"></div>
    </div>
</div>

<!-- Lesson Plan Modal -->
<div id="modal-lesson" class="modal-overlay">
    <div class="modal-content">
        <div class="modal-header">
            <h3>Lesson Plan</h3>
            <button class="close-modal" onclick="closeModal('modal-lesson')">&times;</button>
        </div>
        <div id="lesson-content"></div>
    </div>
</div>

<script>
    // --- CONFIG ---
    const SCHEDULE_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQmSAl1ndXXSgDWbrjCiSDkmtECkP94Rr2nk-kIHV-zHd4NFSE9CzyQb6YP2Rt4lEQNYOpuvgjCYDal/pub?output=csv';
    const STUDENTS_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSlWLLO76YOXic0n11ttKL-UKoNGTT3VKEogt3pvHONM4Hnb3upvgYj_h8DOC57xmAobUXSIznc7V6x/pub?output=csv';
    
    // Teachers List
    const TEACHERS = [
        'MYCAEL', 'HOPE', 'PEDRO', 'DIOGO', 'LIVIA', 'TOSCA', 'IAGO', 'SARA', 'CAROL'
    ].sort();

    // Books Structure (Simplified for code size, full list logic applied)
    const BOOKS_STRUCTURE = {
        '1': Array.from({length: 42}, (_, i) => i < 41 ? `Lesson ${i+1}` : 'Test Book 1'), // Simplified generation logic below
        // We will generate dynamically in init
    };

    // Generate Book Lists properly based on user input
    function generateBookList(bookNum) {
        const list = [];
        const totalLessons = 35; 
        // Logic pattern from user input
        // L1-L5, Rev1, L6-L10, Rev2, L11-L15, Rev3, L16-L20, Rev4, L21-L25, Rev5, L26-L30, Rev6, L31-L35, Rev7, Rev8, Rev9, Rev10, Test, TestCorr
        
        let count = 1;
        // Lessons 1-5
        for(let i=1; i<=5; i++) list.push(`Lesson ${i}`);
        list.push(`Revision 1–10 / Reading 2 / Revision 11–25`);
        
        // Lessons 6-10
        for(let i=6; i<=10; i++) list.push(`Lesson ${i}`);
        list.push(`Revision 26–35 / Reading 5 & 6 / Revision 36–50`);

        // Lessons 11-15
        for(let i=11; i<=15; i++) list.push(`Lesson ${i}`);
        list.push(`Revision 51–60 / Reading 8 / Revision 61–75`);

        // Lessons 16-20
        for(let i=16; i<=20; i++) list.push(`Lesson ${i}`);
        list.push(`Revision 76–85 / Reading 12 / Revision 86–100`);

        // Lessons 21-25
        for(let i=21; i<=25; i++) list.push(`Lesson ${i}`);
        list.push(`Revision 101–110 / Reading 17 / Revision 111–125`);

        // Lessons 26-30
        for(let i=26; i<=30; i++) list.push(`Lesson ${i}`);
        list.push(`Revision 126–135 / Reading 21 / Revision 136–150`);

        // Lessons 31-35
        for(let i=31; i<=35; i++) list.push(`Lesson ${i}`);
        
        // Revisions final block
        list.push(`Revision 86–100 / Reading 18 / Revision 101–110`);
        list.push(`Revision 111–120 / Reading 14 / Revision 121–135`);
        list.push(`Revision 136–145 / Reading 9 / Revision 146–160`);
        
        list.push(`Test Book ${bookNum}`);
        if(bookNum != 1) list.push(`Test Correction Book ${bookNum}`); // Book 1 has specific note but usually correction exists
        
        return list;
    }

    // Pre-generate books 1-10
    for(let i=1; i<=10; i++) BOOKS_STRUCTURE[i] = generateBookList(i);

    // State
    let scheduleData = [];
    let studentsData = {}; // Map: GroupName -> [StudentNames]
    let weeks = []; // [{id: 'august-week-4', label: 'August Week 4', days: ['Mon', 'Tue'...], dateRange: ...}]
    let currentWeekId = null;
    let currentTeacher = null;
    let radData = JSON.parse(localStorage.getItem('radData')) || {};
    let lessonData = JSON.parse(localStorage.getItem('lessonData')) || {};

    // --- INIT ---
    window.addEventListener('DOMContentLoaded', () => {
        Promise.all([fetch(SCHEDULE_URL).then(r=>r.text()), fetch(STUDENTS_URL).then(r=>r.text())])
            .then(([schedCsv, studCsv]) => {
                parseSchedule(schedCsv);
                parseStudents(studCsv);
                initWeeks();
                renderHome();
                initMonthSelects();
            })
            .catch(err => {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error-msg').style.display = 'block';
                document.getElementById('error-msg').textContent = 'Erro ao carregar dados. Verifique a conexão.';
                console.error(err);
            });
    });

    function parseSchedule(csv) {
        const lines = csv.split('\n').map(l=>l.trim()).filter(l=>l);
        if(lines.length < 2) return;
        
        const headers = lines[0].split(',').map(h=>h.trim().replace(/"/g,''));
        
        // Identify Day Columns (F onwards usually, but dynamic)
        // Headers expected: A(Language), B(Book), C(Group), D(Room), E(Modality), F(Time), G(Mon), H(Tue)...
        // We need to find columns that look like dates/days
        
        const dayCols = [];
        const monthMap = { 'jan':'0', 'feb':'1', 'mar':'2', 'apr':'3', 'may':'4', 'jun':'5', 'jul':'6', 'aug':'7', 'sep':'8', 'oct':'9', 'nov':'10', 'dec':'11' };
        
        headers.forEach((h, idx) => {
            const lower = h.toLowerCase();
            // Check if header contains a month name and a number (e.g., "August 26", "Sep 01")
            const foundMonth = Object.keys(monthMap).find(m => lower.includes(m));
            if(foundMonth) {
                dayCols.push({ index: idx, header: h, month: monthMap[foundMonth] });
            }
        });

        // Group into weeks
        // Simple logic: consecutive days form a week. Break if gap > 2 days or month change logic if needed.
        // For now, assume contiguous columns in CSV are contiguous days.
        if(dayCols.length === 0) return;

        let currentWeekDays = [];
        let weekCounter = 1;
        let lastMonth = -1;
        let weeksTemp = [];

        dayCols.forEach((col, i) => {
            const m = parseInt(col.month);
            // Extract day number from header string "August 26" -> 26
            const dayNum = parseInt(col.header.replace(/[^\d]/g, ''));
            
            // New week logic: If it's the first column OR if the day number resets (e.g. 31 -> 1) OR Monday detection
            // Better: Just group by ISO week or simple 5-day chunks? 
            // User asked for "August Week 4". Let's try to detect week number from date.
            const dateObj = new Date(2024, m, dayNum); // Year arbitrary
            const weekNo = Math.ceil((dateObj.getDate() + 6 - dateObj.getDay()) / 7); // Approx week of month
            
            const monthName = col.header.match(/[a-zA-Z]+/)[0];
            const weekLabel = `${monthName} Week ${weekNo}`;
            
            // Unique ID
            const weekId = `${monthName.toLowerCase()}-w${weekNo}`;
            
            if(!weeksTemp.find(w=>w.id === weekId)) {
                weeksTemp.push({ id: weekId, label: weekLabel, cols: [] });
            }
            weeksTemp[weeksTemp.length-1].cols.push(col);
        });

        weeks = weeksTemp;
        if(weeks.length > 0) currentWeekId = weeks[weeks.length-1].id; // Default to last week

        // Parse Rows
        scheduleData = [];
        for(let i=1; i<lines.length; i++) {
            // Handle CSV with commas inside quotes roughly
            const row = lines[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(c=>c.trim().replace(/^"|"$/g,''));
            
            const bookRaw = row[1] || '';
            const groupRaw = row[2] || '';
            const roomRaw = row[3] || '';
            const modRaw = row[4] || '';
            const timeRaw = row[5] || '';

            // Clean book name to get number
            const bookMatch = bookRaw.match(/(\d+)/);
            const bookNum = bookMatch ? bookMatch[1] : '1';

            // Extract Teacher from cell content in day columns
            weeks.forEach(week => {
                week.cols.forEach(col => {
                    const cell = row[col.index] || '';
                    if(!cell) return;

                    // Find teacher in cell
                    const foundTeacher = TEACHERS.find(t => cell.toUpperCase().includes(t));
                    if(foundTeacher) {
                        scheduleData.push({
                            weekId: week.id,
                            dayLabel: col.header, // e.g. "August 26"
                            dayObj: new Date(2024, col.month, parseInt(col.header.replace(/[^\d]/g,''))),
                            time: timeRaw,
                            teacher: foundTeacher,
                            group: groupRaw,
                            book: `Book ${bookNum}`,
                            bookNum: bookNum,
                            room: roomRaw,
                            mod: modRaw,
                            rawCell: cell
                        });
                    }
                });
            });
        }
    }

    function parseStudents(csv) {
        const lines = csv.split('\n').map(l=>l.trim()).filter(l=>l);
        if(lines.length < 2) return;
        // Skip header
        for(let i=1; i<lines.length; i++) {
            const parts = lines[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(c=>c.trim().replace(/^"|"$/g,''));
            if(parts.length >= 2) {
                const group = parts[0].trim();
                const student = parts[1].trim();
                if(!studentsData[group]) studentsData[group] = [];
                studentsData[group].push(student);
            }
        }
    }

    function initWeeks() {
        const nav = document.getElementById('week-nav');
        nav.innerHTML = '';
        weeks.forEach(w => {
            const btn = document.createElement('button');
            btn.className = `week-btn ${w.id === currentWeekId ? 'active' : ''}`;
            btn.textContent = w.label;
            btn.onclick = () => {
                currentWeekId = w.id;
                document.querySelectorAll('.week-btn').forEach(b=>b.classList.remove('active'));
                btn.classList.add('active');
                if(currentTeacher) renderTeacherSchedule();
            };
            nav.appendChild(btn);
        });
    }

    function initMonthSelects() {
        const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
        const selects = [document.getElementById('calc-month-select'), document.getElementById('presence-month-select')];
        const now = new Date();
        
        selects.forEach(sel => {
            if(!sel) return;
            sel.innerHTML = '';
            months.forEach((m, idx) => {
                const opt = document.createElement('option');
                opt.value = idx;
                opt.textContent = m;
                if(idx === now.getMonth()) opt.selected = true;
                sel.appendChild(opt);
            });
        });
    }

    function renderHome() {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('teacher-list').style.display = 'block';
        const grid = document.getElementById('teacher-grid');
        grid.innerHTML = '';
        
        TEACHERS.forEach(t => {
            const card = document.createElement('div');
            card.className = 'teacher-card';
            card.innerHTML = `
                <div class="teacher-name">${t}</div>
                <div class="teacher-role">Ver Cronograma</div>
            `;
            card.onclick = () => openTeacher(t);
            grid.appendChild(card);
        });
    }

    function showView(viewId) {
        document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
        document.getElementById(viewId).classList.add('active');
        window.scrollTo(0,0);
    }

    function openTeacher(name) {
        currentTeacher = name;
        document.getElementById('current-teacher-name').textContent = name;
        switchTeacherTab('schedule');
        showView('view-schedule');
        renderTeacherSchedule();
    }

    function switchTeacherTab(tab) {
        document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
        event.target.classList.add('active');
        
        if(tab === 'schedule') {
            document.getElementById('teacher-schedule-content').style.display = 'block';
            document.getElementById('teacher-calculator-content').style.display = 'none';
            renderTeacherSchedule();
        } else {
            document.getElementById('teacher-schedule-content').style.display = 'none';
            document.getElementById('teacher-calculator-content').style.display = 'block';
            renderCalculator();
        }
    }

    function renderTeacherSchedule() {
        const container = document.getElementById('teacher-schedule-content');
        container.innerHTML = '';
        
        const classes = scheduleData.filter(c => c.teacher === currentTeacher && c.weekId === currentWeekId);
        
        if(classes.length === 0) {
            container.innerHTML = '<div style="text-align:center;color:#666;padding:2rem;">Nenhuma aula nesta semana.</div>';
            return;
        }

        // Group by Day Label
        const byDay = {};
        classes.forEach(c => {
            if(!byDay[c.dayLabel]) byDay[c.dayLabel] = [];
            byDay[c.dayLabel].push(c);
        });

        // Sort Days by Date
        const sortedDays = Object.keys(byDay).sort((a,b) => {
            const dA = classes.find(c=>c.dayLabel===a).dayObj;
            const dB = classes.find(c=>c.dayLabel===b).dayObj;
            return dA - dB;
        });

        sortedDays.forEach(day => {
            const section = document.createElement('div');
            section.className = 'day-section';
            
            const title = document.createElement('div');
            title.className = 'day-title';
            title.textContent = day;
            section.appendChild(title);

            byDay[day].sort((a,b) => a.time.localeCompare(b.time)).forEach(cls => {
                const key = `${cls.teacher}-${cls.dayLabel}-${cls.time}-${cls.group}`;
                const rad = radData[key] || {};
                const statusClass = rad.status ? `status-${rad.status.toLowerCase()}` : '';
                const statusText = rad.status ? rad.status : 'Pendente';
                
                // Get Last Lesson from Lesson Data
                const lKey = `${cls.group}`; // Global per group
                const groupLessons = lessonData[lKey] || [];
                const lastLesson = groupLessons.length > 0 ? groupLessons[groupLessons.length-1] : 'Nenhuma aula registrada';

                const card = document.createElement('div');
                card.className = 'class-card';
                card.innerHTML = `
                    <div class="class-header">
                        <span class="class-time">⌚ ${cls.time}</span>
                        <span class="class-status ${statusClass}">${statusText}</span>
                    </div>
                    <div class="class-info">
                        <div><span class="info-label">Turma</span><div class="info-value">${cls.group}</div></div>
                        <div><span class="info-label">Sala</span><div class="info-value">${cls.room}</div></div>
                        <div><span class="info-label">Book</span><div class="info-value">${cls.book}</div></div>
                        <div><span class="info-label">Mod</span><div class="info-value">${cls.mod}</div></div>
                    </div>
                    <div class="last-lesson-info">
                        📘 Última atividade: <strong>${lastLesson}</strong>
                    </div>
                    <div class="class-actions">
                        <button class="btn-sm btn-rad" onclick='openRad("${key}", "${cls.group}", "${cls.bookNum}")'>RAD</button>
                        <button class="btn-sm btn-calc" onclick='openLessonPlan("${cls.group}", "${cls.bookNum}")'>Lesson Plan</button>
                    </div>
                `;
                section.appendChild(card);
            });
            container.appendChild(section);
        });
    }

    // --- RAD LOGIC ---
    function openRad(key, group, bookNum) {
        const rad = radData[key] || { status: '', students: {} };
        const students = studentsData[group] || [];
        const content = document.getElementById('rad-content');
        
        let studentsHtml = '';
        if(students.length === 0) {
            studentsHtml = '<div style="padding:10px;color:#666;">Nenhum aluno cadastrado para esta turma.</div>';
        } else {
            studentsHtml = '<div class="student-list">';
            students.forEach(s => {
                const checked = rad.students[s] ? 'checked' : '';
                studentsHtml += `
                    <div class="student-item">
                        <span>${s}</span>
                        <input type="checkbox" class="checkbox-custom" data-student="${s}" ${checked}>
                    </div>
                `;
            });
            studentsHtml += '</div>';
        }

        content.innerHTML = `
            <div class="form-group">
                <label>Status da Aula</label>
                <select id="rad-status">
                    <option value="">Selecione...</option>
                    <option value="Realizada" ${rad.status==='Realizada'?'selected':''}>Realizada</option>
                    <option value="Cancelada" ${rad.status==='Cancelada'?'selected':''}>Cancelada</option>
                    <option value="No Show" ${rad.status==='No Show'?'selected':''}>No Show</option>
                </select>
            </div>
            <div class="form-group">
                <label>Presença (Marque os presentes)</label>
                ${studentsHtml}
            </div>
            <button class="btn-main" onclick="saveRad('${key}')">Salvar RAD</button>
            <button class="btn-main" style="border-color:#666;color:#666;margin-top:10px;" onclick="clearRad('${key}')">Limpar RAD</button>
        `;
        
        document.getElementById('modal-rad').style.display = 'flex';
    }

    function saveRad(key) {
        const status = document.getElementById('rad-status').value;
        const checkboxes = document.querySelectorAll('.checkbox-custom:checked');
        const studentsPresent = {};
        checkboxes.forEach(cb => studentsPresent[cb.dataset.student] = true);

        radData[key] = { status, students: studentsPresent, timestamp: new Date().toISOString() };
        localStorage.setItem('radData', JSON.stringify(radData));
        
        closeModal('modal-rad');
        renderTeacherSchedule();
        alert('RAD Salvo!');
    }

    function clearRad(key) {
        if(confirm('Tem certeza que deseja limpar este RAD?')) {
            delete radData[key];
            localStorage.setItem('radData', JSON.stringify(radData));
            closeModal('modal-rad');
            renderTeacherSchedule();
        }
    }

    // --- LESSON PLAN LOGIC ---
    function openLessonPlan(group, bookNum) {
        const lKey = group;
        const completed = lessonData[lKey] || [];
        const options = BOOKS_STRUCTURE[bookNum] || [];
        
        const content = document.getElementById('lesson-content');
        let gridHtml = '<div class="lesson-grid">';
        
        options.forEach(opt => {
            const isSelected = completed.includes(opt);
            gridHtml += `
                <div class="lesson-item ${isSelected ? 'selected' : ''}" onclick="toggleLesson(this, '${group}', '${opt}')">
                    <input type="checkbox" ${isSelected ? 'checked' : ''}>
                    <span>${opt}</span>
                </div>
            `;
        });
        gridHtml += '</div>';
        
        content.innerHTML = `
            <div style="margin-bottom:1rem;color:#aaa;font-size:0.9rem;">
                Selecione as lições realizadas nesta aula. O histórico é compartilhado entre professores.
            </div>
            ${gridHtml}
        `;
        
        document.getElementById('modal-lesson').style.display = 'flex';
    }

    function toggleLesson(el, group, lesson) {
        const checkbox = el.querySelector('input');
        checkbox.checked = !checkbox.checked;
        
        if(checkbox.checked) el.classList.add('selected');
        else el.classList.remove('selected');

        let completed = lessonData[group] || [];
        if(checkbox.checked) {
            if(!completed.includes(lesson)) completed.push(lesson);
        } else {
            completed = completed.filter(l => l !== lesson);
        }
        
        lessonData[group] = completed;
        localStorage.setItem('lessonData', JSON.stringify(lessonData));
        
        // Refresh schedule to update "Last Lesson" preview if needed
        renderTeacherSchedule(); 
    }

    // --- CALCULATOR LOGIC ---
    function renderCalculator() {
        const monthIdx = parseInt(document.getElementById('calc-month-select').value);
        const statsContainer = document.getElementById('calc-stats');
        
        // Filter RADs for this teacher and month
        let schoolRealized = 0, inCompanyRealized = 0;
        let schoolNoShow = 0, inCompanyNoShow = 0;

        Object.keys(radData).forEach(key => {
            const rad = radData[key];
            if(!rad.status) return;
            
            // Decode key: teacher-dayLabel-time-group
            const parts = key.split('-');
            if(parts[0] !== currentTeacher) return;
            
            const dayLabel = parts[1]; // e.g. "August 26"
            const mod = parts.length > 4 ? parts[4] : ''; // Might need better parsing if group has dashes
            
            // Check Month
            const dMonth = new Date(2024, monthIdx, 1).toLocaleString('default', { month: 'long' });
            if(!dayLabel.toLowerCase().includes(dMonth.toLowerCase())) return;

            // Check In Company (Modality contains "IN-C" or "IN COMPANY")
            // Need to retrieve original class data to check modality accurately
            const originalClass = scheduleData.find(c => 
                c.teacher === currentTeacher && 
                c.dayLabel === dayLabel && 
                key.includes(c.time) && 
                key.includes(c.group)
            );
            
            const isInCompany = originalClass && (originalClass.mod.toUpperCase().includes('IN-C') || originalClass.mod.toUpperCase().includes('IN COMPANY') || originalClass.room.includes('Hotel') || originalClass.room.includes('Jurássica'));

            if(rad.status === 'Realizada') {
                if(isInCompany) inCompanyRealized++;
                else schoolRealized++;
            } else if (rad.status === 'No Show') {
                if(isInCompany) inCompanyNoShow++;
                else schoolNoShow++;
            }
        });

        statsContainer.innerHTML = `
            <div class="stat-card">
                <span class="stat-val" style="color:var(--success)">${schoolRealized}</span>
                <span class="stat-label">Escola (Realizadas)</span>
            </div>
            <div class="stat-card">
                <span class="stat-val" style="color:var(--accent)">${inCompanyRealized}</span>
                <span class="stat-label">In Company (Realizadas)</span>
            </div>
            <div class="stat-card">
                <span class="stat-val" style="color:var(--danger)">${schoolNoShow}</span>
                <span class="stat-label">Escola (No Show)</span>
            </div>
            <div class="stat-card">
                <span class="stat-val" style="color:var(--warning)">${inCompanyNoShow}</span>
                <span class="stat-label">In Company (No Show)</span>
            </div>
        `;
    }

    // --- PRESENCE VIEW LOGIC ---
    function openPresenceView() {
        const groupSelect = document.getElementById('presence-group-select');
        groupSelect.innerHTML = '<option value="">Selecione a Turma...</option>';
        Object.keys(studentsData).sort().forEach(g => {
            const opt = document.createElement('option');
            opt.value = g;
            opt.textContent = g;
            groupSelect.appendChild(opt);
        });
        showView('view-presence');
    }

    function renderPresenceTable() {
        const group = document.getElementById('presence-group-select').value;
        const monthIdx = parseInt(document.getElementById('presence-month-select').value);
        const tbody = document.querySelector('#presence-table tbody');
        const theadRow = document.querySelector('#presence-table thead tr');
        
        tbody.innerHTML = '';
        // Reset Header (keep first th)
        while(theadRow.children.length > 1) theadRow.removeChild(theadRow.lastChild);

        if(!group) return;

        const students = studentsData[group] || [];
        const monthName = new Date(2024, monthIdx, 1).toLocaleString('default', { month: 'long' });
        
        // Find all days in this month from scheduleData for this group
        const daysInMonth = scheduleData
            .filter(c => c.group === group && c.dayObj.getMonth() === monthIdx)
            .map(c => ({ label: c.dayLabel, date: c.dayObj, time: c.time }))
            .sort((a,b) => a.date - b.date);

        // Add Headers
        daysInMonth.forEach(d => {
            const th = document.createElement('th');
            th.textContent = d.label.split(' ')[1]; // Just day number
            th.title = d.label;
            theadRow.appendChild(th);
        });

        // Add Rows
        students.forEach(s => {
            const tr = document.createElement('tr');
            const tdName = document.createElement('td');
            tdName.textContent = s;
            tr.appendChild(tdName);

            daysInMonth.forEach(d => {
                const td = document.createElement('td');
                // Find RAD for this day/student
                // Need to find the specific class key for this day/time
                const cls = scheduleData.find(c => c.group === group && c.dayLabel === d.label && c.time === d.time);
                if(cls) {
                    const key = `${cls.teacher}-${cls.dayLabel}-${cls.time}-${cls.group}`;
                    const rad = radData[key];
                    
                    if(rad && rad.students && rad.students[s]) {
                        td.innerHTML = '<div class="p-mark p-present"></div>';
                    } else if (rad && rad.status === 'Cancelada') {
                        td.innerHTML = '<div class="p-mark p-cancel"></div>';
                    } else if (rad && rad.status === 'No Show') {
                         // No Show usually means class happened but student absent, or class cancelled? 
                         // Assuming No Show = Absent for student logic
                        td.innerHTML = '<div class="p-mark p-absent"></div>';
                    } else {
                        td.innerHTML = '-';
                    }
                } else {
                    td.innerHTML = '-';
                }
                tr.appendChild(td);
            });
            tbody.appendChild(tr);
        });
    }

    function closeModal(id) {
        document.getElementById(id).style.display = 'none';
    }

    // Close modal on outside click
    window.onclick = function(event) {
        if(event.target.classList.contains('modal-overlay')) {
            event.target.style.display = 'none';
        }
    }
</script>
