<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cronograma Semanal - Professores</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --text-color: #333;
            --card-bg: #ffffff;
            --shadow: 0 4px 15px rgba(0,0,0,0.08);
            --radius: 12px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        body { background-color: var(--bg-color); color: var(--text-color); padding-bottom: 50px; }

        header {
            background: linear-gradient(135deg, #2c3e50, #4ca1af);
            color: white;
            padding: 2rem 1rem;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        header h1 { font-size: 1.8rem; margin-bottom: 0.5rem; }
        header p { opacity: 0.9; font-size: 0.95rem; }

        .container { max-width: 1000px; margin: 0 auto; padding: 20px; }

        /* Grid de Professores */
        .teachers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .teacher-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: var(--radius);
            text-align: center;
            cursor: pointer;
            box-shadow: var(--shadow);
            transition: transform 0.2s, box-shadow 0.2s;
            border-bottom: 5px solid #ccc;
            font-weight: bold;
            font-size: 1.1rem;
            text-transform: uppercase;
        }

        .teacher-card:hover { transform: translateY(-5px); box-shadow: 0 8px 20px rgba(0,0,0,0.15); }

        /* Tela de Detalhes */
        #schedule-view { display: none; }

        .back-btn {
            background: white;
            border: 2px solid #333;
            color: #333;
            padding: 10px 20px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            margin-bottom: 20px;
            display: inline-block;
            transition: all 0.2s;
        }
        .back-btn:hover { background: #333; color: white; }

        .day-section {
            background: white;
            border-radius: var(--radius);
            margin-bottom: 25px;
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .day-header {
            padding: 15px 20px;
            color: white;
            font-size: 1.2rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        .classes-container {
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* Card da Aula */
        .class-item {
            border: 1px solid #eee;
            border-radius: 8px;
            padding: 15px;
            background: #fafafa;
            border-left: 5px solid #ccc;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .class-time {
            font-size: 1.1rem;
            font-weight: 800;
            color: #2c3e50;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .class-info-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }

        .badge {
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .badge-group { background-color: #e3f2fd; color: #1565c0; } /* Turma */
        .badge-book { background-color: #fff3e0; color: #ef6c00; }   /* G1, G2... */
        .badge-room { background-color: #e8f5e9; color: #2e7d32; }   /* Sala */
        .badge-modal { background-color: #f3e5f5; color: #7b1fa2; }  /* Modalidade */

        .loading { text-align: center; padding: 40px; font-size: 1.2rem; color: #666; }
        .error { color: red; text-align: center; padding: 20px; background: #ffebee; border-radius: 8px; }

    </style>
</head>
<body>

<header>
    <h1>Cronograma Semanal</h1>
    <p>Selecione seu nome para ver suas aulas</p>
</header>

<div class="container">
    
    <!-- Tela Inicial: Lista de Professores -->
    <div id="selection-view">
        <div id="loading-msg" class="loading">Carregando dados da planilha...</div>
        <div id="error-msg" class="error" style="display:none;"></div>
        <div id="teachers-grid" class="teachers-grid"></div>
    </div>

    <!-- Tela de Detalhe: Cronograma do Professor -->
    <div id="schedule-view">
        <button class="back-btn" onclick="voltarParaSelecao()">← Voltar</button>
        <h2 id="teacher-title" style="margin-bottom: 20px; text-align: center; color: #2c3e50;"></h2>
        <div id="schedule-content"></div>
    </div>

</div>

<script>
    // CONFIGURAÇÃO
    const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQmSAl1ndXXSgDWbrjCiSDkmtECkP94Rr2nk-kIHV-zHd4NFSE9CzyQb6YP2Rt4lEQNYOpuvgjCYDal/pub?output=csv';

    // Lista de Professores Válidos
    const TEACHERS = [
        { name: 'MYCAEL', color: '#FF6B6B' },
        { name: 'RAFAEL', color: '#4ECDC4' },
        { name: 'HOPE', color: '#FFE66D' },
        { name: 'PEDRO', color: '#F38181' },
        { name: 'DIOGO', color: '#AA96DA' },
        { name: 'LIVIA', color: '#FCBAD3' },
        { name: 'TOSCA', color: '#A8D8EA' },
        { name: 'IAGO', color: '#FF9F43' },
        { name: 'SARA', color: '#54a0ff' },
        { name: 'CAROL', color: '#5f27cd' }
    ];

    const DAYS_MAP = {
        'Mon': 'Segunda-feira',
        'Tue': 'Terça-feira',
        'Wed': 'Quarta-feira',
        'Thu': 'Quinta-feira',
        'Fri': 'Sexta-feira',
        'Sat': 'Sábado'
    };

    let globalClasses = [];

    // Inicialização
    window.onload = async () => {
        try {
            const response = await fetch(SHEET_URL);
            if (!response.ok) throw new Error('Erro na conexão');
            const text = await response.text();
            processCSV(text);
            renderTeacherGrid();
        } catch (err) {
            document.getElementById('loading-msg').style.display = 'none';
            document.getElementById('error-msg').style.display = 'block';
            document.getElementById('error-msg').innerText = 'Erro ao carregar planilha. Verifique sua internet.';
            console.error(err);
        }
    };

    function processCSV(csvText) {
        const lines = csvText.split('\n').filter(l => l.trim() !== '');
        if (lines.length < 2) return;

        // Cabeçalho
        const headers = lines[0].split(',').map(h => h.trim().replace(/"/g, ''));
        
        // Mapear índices das colunas de dias
        const dayIndices = {};
        headers.forEach((h, i) => {
            const dayKey = Object.keys(DAYS_MAP).find(k => h.includes(k));
            if (dayKey) dayIndices[dayKey] = i;
        });

        globalClasses = [];

        // Processar linhas
        for (let i = 1; i < lines.length; i++) {
            // Split inteligente para CSV
            const row = lines[i].match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g) || lines[i].split(',');
            // Limpeza básica
            const cleanRow = row.map(cell => cell ? cell.trim().replace(/^"|"$/g, '').replace(/<.*?>/g, '') : '');

            const timeSlot = cleanRow[0]; // Coluna 0 é Horário
            if (!timeSlot) continue;

            // Iterar sobre os dias encontrados
            for (const [dayKey, colIndex] of Object.entries(dayIndices)) {
                const cellContent = cleanRow[colIndex];
                if (!cellContent) continue;

                // Extrair Professor
                const teacherFound = TEACHERS.find(t => cellContent.toUpperCase().includes(t.name));
                if (!teacherFound) continue;

                // Estrutura esperada na célula: "Group - Teacher - Room - Mod"
                // Removemos o nome do professor para analisar o resto
                const parts = cellContent.split('-').map(p => p.trim());
                
                let rawGroup = "";
                let rawRoom = "";
                let rawMod = "";

                // Lógica de extração robusta
                // Se tiver múltiplas partes separadas por hífen
                if (parts.length >= 2) {
                    rawGroup = parts[0]; // O primeiro é quase sempre o Group/Turma
                    
                    // O último costuma ser a modalidade (Mod), o penúltimo a sala (Room)
                    // Mas vamos tentar identificar o que sobra
                    const otherParts = parts.slice(1).filter(p => p !== teacherFound.name);
                    
                    if (otherParts.length >= 2) {
                        rawRoom = otherParts[0];
                        rawMod = otherParts[1];
                    } else if (otherParts.length === 1) {
                        // Pode ser só a sala ou só o mod
                        rawRoom = otherParts[0]; 
                    }
                } else {
                    // Formato estranho, tenta usar o que tem
                    rawGroup = cellContent.replace(teacherFound.name, '').replace('-', '');
                }

                // Parsear Group para separar Nome da Turma e Book (G1, G2...)
                const { groupName, bookName } = parseGroupString(rawGroup);

                globalClasses.push({
                    day: dayKey,
                    time: timeSlot,
                    teacher: teacherFound.name,
                    group: groupName,      // Ex: Dune, The 100
                    book: bookName,        // Ex: G1, G2, AW
                    room: rawRoom || '-',  // Ex: 01, 02
                    mod: rawMod || ''      // Ex: FL2, VIP
                });
            }
        }
    }

    function parseGroupString(str) {
        if (!str) return { groupName: 'N/A', bookName: '' };
        
        // Expressão regular para encontrar códigos de livro comuns
        // Procura por G seguido de número, ou palavras como AW, Starter, etc.
        const bookRegex = /\b(G\d{1,2}|AW|Starter|Movers|Flyers|KET|PET|FCE|CAE|IELTS|TOEFL)\b/i;
        const match = str.match(bookRegex);

        let book = match ? match[0].toUpperCase() : '';
        let name = str.replace(bookRegex, '').trim();
        
        // Limpar caracteres sobrantes no nome
        name = name.replace(/^-|-$/, '').replace(/\s+/g, ' ').trim();
        if (!name) name = "Geral";

        return { groupName: name, bookName: book };
    }

    function renderTeacherGrid() {
        document.getElementById('loading-msg').style.display = 'none';
        const grid = document.getElementById('teachers-grid');
        grid.innerHTML = '';

        TEACHERS.forEach(t => {
            const hasClass = globalClasses.some(c => c.teacher === t.name);
            const card = document.createElement('div');
            card.className = 'teacher-card';
            card.style.borderBottomColor = t.color;
            card.style.color = hasClass ? '#333' : '#aaa';
            card.innerHTML = `
                <div>${t.name}</div>
                <div style="font-size:0.8rem; font-weight:normal; margin-top:5px;">
                    ${hasClass ? 'Ver Aulas' : 'Sem aulas'}
                </div>
            `;
            
            if (hasClass) {
                card.onclick = () => openSchedule(t);
            } else {
                card.style.cursor = 'default';
                card.style.opacity = '0.6';
            }
            grid.appendChild(card);
        });
    }

    function openSchedule(teacherObj) {
        const myClasses = globalClasses.filter(c => c.teacher === teacherObj.name);
        
        // Agrupar por dia
        const byDay = {};
        Object.keys(DAYS_MAP).forEach(k => byDay[k] = []);
        myClasses.forEach(c => {
            if(byDay[c.day]) byDay[c.day].push(c);
        });

        // Ordenar por horário
        Object.keys(byDay).forEach(d => {
            byDay[d].sort((a, b) => a.time.localeCompare(b.time));
        });

        // Renderizar
        document.getElementById('selection-view').style.display = 'none';
        document.getElementById('schedule-view').style.display = 'block';
        
        const title = document.getElementById('teacher-title');
        title.innerText = `Cronograma: ${teacherObj.name}`;
        title.style.color = teacherObj.color;

        const content = document.getElementById('schedule-content');
        content.innerHTML = '';

        const daysOrder = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

        daysOrder.forEach(dayKey => {
            if (byDay[dayKey].length === 0) return;

            const dayDiv = document.createElement('div');
            dayDiv.className = 'day-section';

            const header = document.createElement('div');
            header.className = 'day-header';
            header.style.backgroundColor = teacherObj.color;
            header.innerText = DAYS_MAP[dayKey];
            dayDiv.appendChild(header);

            const list = document.createElement('div');
            list.className = 'classes-container';

            byDay[dayKey].forEach(cls => {
                const item = document.createElement('div');
                item.className = 'class-item';
                item.style.borderLeftColor = teacherObj.color;

                // Montar HTML dos badges
                let badgesHtml = '';
                
                // 1. Turma (Group)
                if (cls.group && cls.group !== 'Geral') {
                    badgesHtml += `<span class="badge badge-group">🏫 ${cls.group}</span>`;
                }
                
                // 2. Book/Módulo (G1, G2...) - DESTAQUE
                if (cls.book) {
                    badgesHtml += `<span class="badge badge-book">📚 ${cls.book}</span>`;
                }

                // 3. Sala (Room)
                if (cls.room && cls.room !== '-') {
                    badgesHtml += `<span class="badge badge-room">🚪 Sala ${cls.room}</span>`;
                }

                // 4. Modalidade (se existir)
                if (cls.mod) {
                    badgesHtml += `<span class="badge badge-modal">🎓 ${cls.mod}</span>`;
                }

                item.innerHTML = `
                    <div class="class-time">⏰ ${cls.time}</div>
                    <div class="class-info-row">
                        ${badgesHtml}
                    </div>
                `;
                list.appendChild(item);
            });

            dayDiv.appendChild(list);
            content.appendChild(dayDiv);
        });

        window.scrollTo(0,0);
    }

    function voltarParaSelecao() {
        document.getElementById('schedule-view').style.display = 'none';
        document.getElementById('selection-view').style.display = 'block';
    }
</script>

</body>
</html>
