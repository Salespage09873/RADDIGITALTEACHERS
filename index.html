<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cronograma Semanal - Professores</title>
    <style>
        :root {
            --bg-color: #f0f2f5;
            --text-color: #333;
            --card-bg: #ffffff;
            --shadow: 0 4px 6px rgba(0,0,0,0.1);
            --radius: 12px;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
            color: var(--text-color);
        }

        header {
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: white;
            padding: 2rem;
            text-align: center;
            box-shadow: var(--shadow);
        }

        h1 { margin: 0; font-size: 1.8rem; }
        p { margin: 0.5rem 0 0; opacity: 0.9; }

        .container {
            max-width: 1000px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        /* Tela de Seleção */
        .grid-teachers {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1.5rem;
        }

        .teacher-card {
            background: var(--card-bg);
            padding: 2rem;
            border-radius: var(--radius);
            text-align: center;
            cursor: pointer;
            box-shadow: var(--shadow);
            transition: transform 0.2s, box-shadow 0.2s;
            border-bottom: 6px solid #ccc;
            font-weight: bold;
            font-size: 1.2rem;
            text-transform: uppercase;
        }

        .teacher-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0,0,0,0.2);
        }

        /* Tela de Detalhes */
        #details-view { display: none; }
        
        .btn-back {
            background: #fff;
            border: 2px solid #333;
            padding: 0.5rem 1.5rem;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            margin-bottom: 1.5rem;
            display: inline-block;
        }

        .day-block {
            background: var(--card-bg);
            margin-bottom: 2rem;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .day-header {
            padding: 1rem;
            color: white;
            font-weight: bold;
            font-size: 1.2rem;
            text-transform: uppercase;
        }

        .classes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1rem;
            padding: 1rem;
        }

        .class-item {
            border: 1px solid #eee;
            border-radius: 8px;
            padding: 1rem;
            background: #fafafa;
            border-left: 5px solid #ccc;
        }

        .time-badge {
            font-size: 1.1rem;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 0.5rem;
            display: block;
        }

        .info-row {
            margin-bottom: 0.4rem;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .tag {
            padding: 0.2rem 0.6rem;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: 600;
            display: inline-block;
        }
        .tag-group { background: #e3f2fd; color: #1565c0; }
        .tag-book { background: #fff3e0; color: #ef6c00; }
        .tag-room { background: #e8f5e9; color: #2e7d32; }
        .tag-mod { background: #f3e5f5; color: #7b1fa2; }

        .loading, .error {
            text-align: center;
            padding: 2rem;
            font-size: 1.2rem;
        }
        .error { color: #d32f2f; background: #ffebee; border-radius: 8px; }

    </style>
</head>
<body>

<header>
    <h1>Cronograma Semanal</h1>
    <p>Selecione seu nome para ver suas aulas</p>
</header>

<div class="container">
    
    <!-- View 1: Lista de Professores -->
    <div id="selection-view">
        <div id="loading-msg" class="loading">Carregando dados da planilha...</div>
        <div id="error-msg" class="error" style="display:none;"></div>
        <div id="teachers-list" class="grid-teachers"></div>
    </div>

    <!-- View 2: Detalhe do Professor -->
    <div id="details-view">
        <button class="btn-back" onclick="voltarParaInicio()">← Voltar</button>
        <h2 id="teacher-title" style="margin-bottom: 1.5rem; text-align:center;"></h2>
        <div id="schedule-content"></div>
    </div>

</div>

<script>
    // URL fornecida
    const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQmSAl1ndXXSgDWbrjCiSDkmtECkP94Rr2nk-kIHV-zHd4NFSE9CzyQb6YP2Rt4lEQNYOpuvgjCYDal/pub?gid=0&single=true&output=csv';

    // Lista de Professores Válidos (TA excluído)
    const TEACHERS = [
        { name: 'MYCAEL', color: '#FF6B6B' },
        { name: 'RAFAEL', color: '#4ECDC4' },
        { name: 'HOPE', color: '#FFE66D' },
        { name: 'PEDRO', color: '#F38181' },
        { name: 'DIOGO', color: '#AA96DA' },
        { name: 'LIVIA', color: '#FCBAD3' },
        { name: 'TOSCA', color: '#A8D8EA' },
        { name: 'IAGO', color: '#FF9F43' },
        { name: 'SARA', color: '#54a0ff' },
        { name: 'CAROL', color: '#5f27cd' }
    ];

    const DAYS_PT = {
        'Mon': 'Segunda-feira', 'Tue': 'Terça-feira', 'Wed': 'Quarta-feira',
        'Thu': 'Quinta-feira', 'Fri': 'Sexta-feira', 'Sat': 'Sábado'
    };

    let globalData = [];

    // Inicialização
    window.onload = async () => {
        try {
            const response = await fetch(SHEET_URL);
            if (!response.ok) throw new Error('Falha na conexão');
            
            const csvText = await response.text();
            processCSV(csvText);
            renderTeacherList();
        } catch (err) {
            console.error(err);
            document.getElementById('loading-msg').style.display = 'none';
            const errDiv = document.getElementById('error-msg');
            errDiv.style.display = 'block';
            errDiv.textContent = 'Erro ao carregar a planilha. Tente novamente mais tarde.';
        }
    };

    function processCSV(text) {
        // Divide em linhas e remove vazias
        const lines = text.split(/\r?\n/).filter(line => line.trim() !== '');
        if (lines.length < 2) return;

        // Cabeçalho (Linha 0)
        // Exemplo esperado: ⌚,Mon 17TH,Tue 18TH...
        const headers = lines[0].split(',').map(h => h.trim().replace(/"/g, ''));
        
        // Mapear índices dos dias (procura por Mon, Tue, etc no cabeçalho)
        const dayIndices = {};
        headers.forEach((h, index) => {
            const dayKey = Object.keys(DAYS_PT).find(k => h.includes(k));
            if (dayKey) dayIndices[dayKey] = index;
        });

        globalData = [];

        // Processar linhas de dados (começa na 1)
        for (let i = 1; i < lines.length; i++) {
            // Regex robusto para CSV que pode ter vírgulas dentro de aspas
            const row = lines[i].match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g) || lines[i].split(',');
            
            // Limpeza básica se o regex falhar em casos simples
            const cleanRow = row.map(cell => cell ? cell.replace(/^"|"$/g, '').trim() : '');

            const timeSlot = cleanRow[0]; // Coluna 0 é horário
            if (!timeSlot) continue;

            // Iterar sobre os dias encontrados
            for (const [dayKey, colIndex] of Object.entries(dayIndices)) {
                const cellContent = cleanRow[colIndex];
                
                if (cellContent && cellContent !== '') {
                    // Tentar identificar o professor nesta célula
                    let foundTeacher = null;
                    let teacherNameClean = '';

                    for (const t of TEACHERS) {
                        if (cellContent.toUpperCase().includes(t.name)) {
                            foundTeacher = t;
                            teacherNameClean = t.name;
                            break;
                        }
                    }

                    if (foundTeacher) {
                        // Extrair informações
                        // Formato provável na célula: "Group - Teacher - Room - Mod"
                        // Ou variações. Vamos dividir por '-'
                        const parts = cellContent.split('-').map(p => p.trim());
                        
                        let groupFull = parts[0] || '';
                        let room = parts[2] || 'N/A';
                        let mod = parts[3] || '';

                        // Se a estrutura for diferente, tentamos achar a sala (geralmente número curto)
                        // Mas vamos confiar na ordem padrão do Sheets: Group | Teacher | Room | Mod
                        
                        // Parsing do Group (Turma + Book)
                        // Ex: "Dune G1", "G1 Dune", "Flyers G2"
                        const bookPattern = /\b(G\d|AW|Starter|Movers|Flyers|KET|PET|FCE|CAE|IELTS|TOEFL)\b/i;
                        const matchBook = groupFull.match(bookPattern);
                        
                        let bookName = matchBook ? matchBook[0].toUpperCase() : '';
                        let groupName = groupFull.replace(bookPattern, '').trim();
                        
                        // Limpar groupName de hífens extras ou espaços
                        groupName = groupName.replace(/^-|-$/, '').trim();
                        if(groupName === '') groupName = 'Geral';

                        globalData.push({
                            day: dayKey,
                            time: timeSlot,
                            teacher: teacherNameClean,
                            group: groupName,
                            book: bookName,
                            room: room,
                            mod: mod
                        });
                    }
                }
            }
        }
    }

    function renderTeacherList() {
        document.getElementById('loading-msg').style.display = 'none';
        const list = document.getElementById('teachers-list');
        list.innerHTML = '';

        // Ordenar alfabeticamente
        TEACHERS.sort((a, b) => a.name.localeCompare(b.name)).forEach(t => {
            // Verifica se tem aula
            const hasClass = globalData.some(d => d.teacher === t.name);
            
            const card = document.createElement('div');
            card.className = 'teacher-card';
            card.style.borderBottomColor = t.color;
            card.style.color = t.color;
            card.innerHTML = `${t.name} <div style="font-size:0.8rem; font-weight:normal; margin-top:5px; color:#666">${hasClass ? 'Ver Agenda' : 'Sem aulas'}</div>`;
            
            card.onclick = () => showSchedule(t.name, t.color);
            list.appendChild(card);
        });
    }

    function showSchedule(name, color) {
        // Filtrar dados
        const myClasses = globalData.filter(d => d.teacher === name);
        
        if (myClasses.length === 0) {
            alert("Nenhuma aula encontrada para esta semana.");
            return;
        }

        // Agrupar por dia
        const byDay = {};
        Object.keys(DAYS_PT).forEach(k => byDay[k] = []);
        myClasses.forEach(c => {
            if(byDay[c.day]) byDay[c.day].push(c);
        });

        // Ordenar por horário
        Object.keys(byDay).forEach(k => {
            byDay[k].sort((a, b) => a.time.localeCompare(b.time));
        });

        // Renderizar
        document.getElementById('selection-view').style.display = 'none';
        document.getElementById('details-view').style.display = 'block';
        
        const title = document.getElementById('teacher-title');
        title.textContent = `Agenda de ${name}`;
        title.style.color = color;

        const content = document.getElementById('schedule-content');
        content.innerHTML = '';

        const daysOrder = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

        daysOrder.forEach(day => {
            if (byDay[day].length > 0) {
                const dayBlock = document.createElement('div');
                dayBlock.className = 'day-block';
                
                const header = document.createElement('div');
                header.className = 'day-header';
                header.style.backgroundColor = color;
                header.textContent = DAYS_PT[day];
                dayBlock.appendChild(header);

                const grid = document.createElement('div');
                grid.className = 'classes-grid';

                byDay[day].forEach(cls => {
                    const item = document.createElement('div');
                    item.className = 'class-item';
                    item.style.borderLeftColor = color;

                    let badges = '';
                    if(cls.group) badges += `<span class="tag tag-group">${cls.group}</span> `;
                    if(cls.book) badges += `<span class="tag tag-book">${cls.book}</span> `;
                    if(cls.mod) badges += `<span class="tag tag-mod">${cls.mod}</span> `;
                    if(cls.room) badges += `<span class="tag tag-room">📍 ${cls.room}</span>`;

                    item.innerHTML = `
                        <span class="time-badge">⏰ ${cls.time}</span>
                        <div class="info-row">${badges}</div>
                    `;
                    grid.appendChild(item);
                });

                dayBlock.appendChild(grid);
                content.appendChild(dayBlock);
            }
        });
    }

    function voltarParaInicio() {
        document.getElementById('details-view').style.display = 'none';
        document.getElementById('selection-view').style.display = 'block';
    }
</script>

</body>
</html>
