<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cronograma de Aulas - Inglês</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        /* Teacher Selection */
        .teacher-selection {
            background: white;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .teacher-selection h2 {
            color: #333;
            margin-bottom: 20px;
            text-align: center;
        }

        .teachers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
        }

        .teacher-card {
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
            color: white;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
            border: 3px solid transparent;
        }

        .teacher-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .teacher-card.active {
            border-color: #333;
            transform: scale(1.05);
        }

        /* Schedule Display */
        .schedule-container {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .schedule-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .schedule-header h2 {
            color: #333;
            font-size: 2rem;
        }

        .day-section {
            margin-bottom: 30px;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            overflow: hidden;
        }

        .day-header {
            padding: 15px 20px;
            font-weight: bold;
            font-size: 1.3rem;
            color: white;
            text-align: center;
        }

        .modules-list {
            padding: 0;
        }

        .module-item {
            padding: 15px 20px;
            border-bottom: 1px solid #f0f0f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .module-item:last-child {
            border-bottom: none;
        }

        .module-time {
            font-weight: bold;
            color: #667eea;
            min-width: 120px;
        }

        .module-details {
            flex: 1;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
        }

        .module-group, .module-room, .module-modality, .module-book {
            background: #f5f5f5;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.9rem;
            color: #555;
        }

        .module-modality {
            background: #e3f2fd;
            color: #1976d2;
        }

        .module-book {
            background: #fff3e0;
            color: #f57c00;
        }

        .module-teacher {
            font-weight: bold;
            padding: 5px 12px;
            border-radius: 20px;
            color: white;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }

        .no-classes {
            text-align: center;
            padding: 40px;
            color: #999;
            font-style: italic;
        }

        .loading {
            text-align: center;
            padding: 50px;
            color: white;
            font-size: 1.2rem;
        }

        .error {
            background: #ffebee;
            color: #c62828;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
        }

        @media (max-width: 768px) {
            header h1 {
                font-size: 2rem;
            }

            .teachers-grid {
                grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            }

            .module-item {
                flex-direction: column;
                align-items: flex-start;
            }

            .module-time {
                margin-bottom: 5px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📚 Cronograma Semanal</h1>
            <p>Selecione seu nome para ver suas aulas de inglês</p>
        </header>

        <div id="loading" class="loading">Carregando cronograma...</div>
        <div id="error" class="error" style="display: none;"></div>

        <div id="content" style="display: none;">
            <section class="teacher-selection">
                <h2>👨‍🏫 Selecione o Professor</h2>
                <div class="teachers-grid" id="teachersGrid"></div>
            </section>

            <section class="schedule-container">
                <div class="schedule-header">
                    <h2 id="selectedTeacherName">Cronograma da Semana</h2>
                </div>
                <div id="scheduleContent"></div>
            </section>
        </div>
    </div>

    <script>
        const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQmSAl1ndXXSgDWbrjCiSDkmtECkP94Rr2nk-kIHV-zHd4NFSE9CzyQb6YP2Rt4lEQNYOpuvgjCYDal/pub?output=csv';
        
        // Lista de professores válidos (excluindo TA e outros não-professores)
        const VALID_TEACHERS = ['MYCAEL', 'RAFAEL', 'HOPE', 'PEDRO', 'DIOGO', 'LIVIA', 'TOSCA'];
        
        // Cores para cada professor
        const TEACHER_COLORS = {
            'MYCAEL': '#FF6B6B',
            'RAFAEL': '#4ECDC4',
            'HOPE': '#FFE66D',
            'PEDRO': '#F38181',
            'DIOGO': '#AA96DA',
            'LIVIA': '#FCBAD3',
            'TOSCA': '#A8D8EA'
        };

        let allClasses = [];
        let teachers = new Set();

        // Mapeamento dos dias da semana
        const dayMapping = {
            'Mon 17TH': 'Segunda-feira',
            'Tue 18TH': 'Terça-feira',
            'Wed 19TH': 'Quarta-feira',
            'Thu 20TH': 'Quinta-feira',
            'Fri 21ST': 'Sexta-feira'
        };

        const dayOrder = ['Mon 17TH', 'Tue 18TH', 'Wed 19TH', 'Thu 20TH', 'Fri 21ST'];

        async function loadSchedule() {
            try {
                const response = await fetch(SHEET_URL);
                if (!response.ok) throw new Error('Erro ao carregar planilha');
                
                const csvText = await response.text();
                parseCSV(csvText);
                
                document.getElementById('loading').style.display = 'none';
                document.getElementById('content').style.display = 'block';
                
                renderTeacherButtons();
            } catch (error) {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').textContent = 'Erro: ' + error.message;
                document.getElementById('error').style.display = 'block';
            }
        }

        function parseCSV(csvText) {
            const lines = csvText.split('\n').map(line => line.trim()).filter(line => line);
            if (lines.length < 2) return;

            const headers = lines[0].split(',').map(h => h.trim().replace(/"/g, ''));
            
            // Encontrar colunas relevantes
            const timeColIndex = headers.findIndex(h => h.includes('⌚') || h.toLowerCase().includes('hor'));
            
            for (let i = 1; i < lines.length; i++) {
                const values = parseCSVLine(lines[i]);
                if (values.length <= timeColIndex) continue;

                const time = values[timeColIndex]?.trim() || '';
                if (!time) continue;

                // Processar cada dia da semana
                dayOrder.forEach(dayKey => {
                    const colIndex = headers.indexOf(dayKey);
                    if (colIndex === -1 || colIndex >= values.length) return;

                    const cellData = values[colIndex]?.trim() || '';
                    if (!cellData) return;

                    // Extrair informações da célula - remover < co/TA/2 > e similares
                    const cleanedData = cellData.replace(/<\s*co\/TA\/\d+\s*>/gi, '').trim();
                    if (!cleanedData) return;

                    const parts = cleanedData.split(/(?=[A-Z]{2,}\s)/).map(p => p.trim()).filter(p => p);
                    
                    let group = '', teacher = '', room = '', modality = '', book = '';
                    
                    // Padrões para identificar modalidades
                    const modalityPatterns = ['FL2', 'FL3', 'INTENSIVE', 'VIP', 'G1', 'G2', 'G3', 'G4', 'G5', 'G6', 'G7', 'G8', 'G9', 'AW'];
                    
                    parts.forEach(part => {
                        const partUpper = part.toUpperCase();
                        
                        // Verificar se é um professor válido (não TA)
                        const knownTeacher = VALID_TEACHERS.find(t => partUpper.includes(t));
                        if (knownTeacher) {
                            teacher = knownTeacher;
                        } 
                        // Verificar se é uma modalidade conhecida (G1-G9, AW, FL2, FL3, etc.)
                        else if (modalityPatterns.some(m => partUpper.includes(m))) {
                            // Se já tem grupo, talvez seja o book ou parte do nome do grupo
                            if (group && !book) {
                                // Pode ser o book ou informação adicional
                                if (part.match(/^[A-Z]+\d*$/i) && !part.match(/^G\d$/i)) {
                                    book = part;
                                } else if (!group.includes(part)) {
                                    group += ' ' + part;
                                }
                            } else {
                                group = part;
                            }
                        }
                        // Verificar se parece ser um book (palavras como Starters, Movers, Flyers, KET, PET, etc.)
                        else if (part.match(/^(Starters|Movers|Flyers|KET|PET|FCE|CAE|IELTS|TOEFL|Business|Kids|Teens|Adults)$/i)) {
                            book = part;
                        }
                        // Verificar se é sala
                        else if (part.match(/^(?:room|sala)\s*\d+$/i) || part.match(/^\d+[A-Z]?$/i)) {
                            room = part;
                        }
                        // Tentar identificar modalidade no texto
                        else if (!modality && /FL\d|INTENSIVE|VIP/i.test(part)) {
                            const match = part.match(/(FL\d|INTENSIVE|VIP)/i);
                            if (match) {
                                modality = match[0].toUpperCase();
                            }
                        }
                        else if (!group && !teacher && !room) {
                            // Tentar identificar pelo padrão
                            if (/[A-Z]{3,}/.test(part)) {
                                const potentialTeacher = VALID_TEACHERS.find(t => part.toUpperCase().includes(t));
                                if (potentialTeacher) {
                                    teacher = potentialTeacher;
                                } else {
                                    group = part;
                                }
                            } else {
                                group = part;
                            }
                        }
                    });

                    // Tentar extrair modalidade e book do grupo se não foram encontrados
                    if (group && !modality) {
                        const modMatch = group.match(/(FL\d|INTENSIVE|VIP)/i);
                        if (modMatch) {
                            modality = modMatch[1].toUpperCase();
                        }
                    }
                    
                    if (group && !book) {
                        // Procurar por padrões de book no grupo
                        const bookMatch = group.match(/\b(Starters|Movers|Flyers|KET|PET|FCE|CAE|IELTS|TOEFL|Business|Kids|Teens|Adults)\b/i);
                        if (bookMatch) {
                            book = bookMatch[1];
                        }
                    }

                    // Apenas adicionar se for um professor válido
                    if (teacher && VALID_TEACHERS.includes(teacher)) {
                        teachers.add(teacher);
                        allClasses.push({
                            time,
                            day: dayKey,
                            dayName: dayMapping[dayKey],
                            group: group || 'N/A',
                            teacher,
                            room: room || 'N/A',
                            modality: modality || '',
                            book: book || ''
                        });
                    }
                });
            }
        }

        function parseCSVLine(line) {
            const result = [];
            let current = '';
            let inQuotes = false;
            
            for (let i = 0; i < line.length; i++) {
                const char = line[i];
                if (char === '"') {
                    inQuotes = !inQuotes;
                } else if (char === ',' && !inQuotes) {
                    result.push(current.trim().replace(/^"|"$/g, ''));
                    current = '';
                } else {
                    current += char;
                }
            }
            result.push(current.trim().replace(/^"|"$/g, ''));
            return result;
        }

        function renderTeacherButtons() {
            const grid = document.getElementById('teachersGrid');
            grid.innerHTML = '';

            Array.from(teachers).sort().forEach(teacher => {
                const card = document.createElement('div');
                card.className = 'teacher-card';
                card.textContent = teacher;
                card.style.backgroundColor = TEACHER_COLORS[teacher];
                card.onclick = () => selectTeacher(teacher, card);
                grid.appendChild(card);
            });
        }

        function selectTeacher(teacher, cardElement) {
            // Remover classe active de todos
            document.querySelectorAll('.teacher-card').forEach(c => c.classList.remove('active'));
            cardElement.classList.add('active');

            document.getElementById('selectedTeacherName').textContent = `Aulas de ${teacher}`;

            const teacherClasses = allClasses.filter(c => c.teacher === teacher);
            renderSchedule(teacherClasses);
        }

        function renderSchedule(classes) {
            const container = document.getElementById('scheduleContent');
            
            if (classes.length === 0) {
                container.innerHTML = '<div class="no-classes">Nenhuma aula encontrada para este professor.</div>';
                return;
            }

            // Agrupar por dia
            const classesByDay = {};
            dayOrder.forEach(day => {
                classesByDay[day] = classes.filter(c => c.day === day).sort((a, b) => {
                    return a.time.localeCompare(b.time);
                });
            });

            let html = '';
            dayOrder.forEach(dayKey => {
                const dayClasses = classesByDay[dayKey];
                if (dayClasses.length === 0) return;

                html += `
                    <div class="day-section">
                        <div class="day-header" style="background-color: ${TEACHER_COLORS[dayClasses[0].teacher]}">
                            ${dayMapping[dayKey]}
                        </div>
                        <div class="modules-list">
                `;

                dayClasses.forEach(cls => {
                    html += `
                        <div class="module-item">
                            <div class="module-time">${cls.time}</div>
                            <div class="module-details">
                                <span class="module-group">📋 ${cls.group}</span>
                                ${cls.modality ? `<span class="module-modality">📚 ${cls.modality}</span>` : ''}
                                ${cls.book ? `<span class="module-book">📖 ${cls.book}</span>` : ''}
                                <span class="module-teacher" style="background-color: ${TEACHER_COLORS[cls.teacher]}">${cls.teacher}</span>
                                <span class="module-room">🚪 ${cls.room}</span>
                            </div>
                        </div>
                    `;
                });

                html += `
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html || '<div class="no-classes">Nenhuma aula encontrada.</div>';
        }

        // Iniciar
        loadSchedule();
    </script>
</body>
</html>
