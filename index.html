<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>J.A.R.V.I.S - Groq</title>
    <style>
        /* ============================================================
           RESET E CONFIGURAÇÃO GLOBAL
           ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&family=Share+Tech+Mono&display=swap');

        body {
            font-family: 'Rajdhani', 'Segoe UI', sans-serif;
            background: #010a0f;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                linear-gradient(rgba(0, 240, 255, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.04) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: -1;
            animation: gridMove 15s linear infinite;
            pointer-events: none;
        }

        @keyframes gridMove {
            from { background-position: 0 0; }
            to { background-position: 40px 40px; }
        }

        .container {
            background: rgba(5, 15, 20, 0.85);
            border-radius: 24px;
            padding: 35px 40px 30px;
            max-width: 780px;
            width: 100%;
            border: 1px solid rgba(0, 240, 255, 0.3);
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.2), inset 0 0 30px rgba(0, 240, 255, 0.05);
            position: relative;
            backdrop-filter: blur(10px);
        }

        .container::before {
            content: '';
            position: absolute;
            top: -1px;
            left: 20%;
            right: 20%;
            height: 3px;
            background: linear-gradient(90deg, transparent, #00f0ff, transparent);
            border-radius: 2px;
            box-shadow: 0 0 20px #00f0ff;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
            padding-bottom: 14px;
            border-bottom: 1px solid rgba(0, 240, 255, 0.2);
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-icon {
            font-size: 1.4rem;
            color: #00f0ff;
            text-shadow: 0 0 10px #00f0ff;
        }

        .logo-text {
            font-size: 1.2rem;
            font-weight: 700;
            font-family: 'Orbitron', monospace;
            color: #ffffff;
            letter-spacing: 6px;
            text-shadow: 0 0 15px rgba(0, 240, 255, 0.8);
        }

        .logo-text span {
            color: #00f0ff;
            font-weight: 300;
        }

        .status-area {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.55rem;
            font-family: 'Orbitron', monospace;
            letter-spacing: 1px;
            color: #00f0ff;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
            transition: all 0.3s;
        }

        .status-dot.online {
            background: #00f0ff;
            box-shadow: 0 0 15px #00f0ff, 0 0 30px #00f0ff;
            animation: dot-pulse 2s infinite;
        }
        .status-dot.offline {
            background: #ff3333;
            box-shadow: 0 0 15px #ff3333;
        }
        .status-dot.processing {
            background: #00f0ff;
            box-shadow: 0 0 30px #00f0ff;
            animation: dot-pulse 0.8s infinite;
        }

        @keyframes dot-pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.5); opacity: 0.7; }
        }

        .status-text {
            color: #00f0ff;
            font-size: 0.5rem;
            text-shadow: 0 0 5px #00f0ff;
        }

        .model-badge {
            background: rgba(0, 240, 255, 0.1);
            padding: 3px 12px;
            border-radius: 12px;
            color: #00f0ff;
            font-size: 0.5rem;
            letter-spacing: 1px;
            border: 1px solid rgba(0, 240, 255, 0.3);
            box-shadow: inset 0 0 10px rgba(0, 240, 255, 0.2);
        }

        /* ============================================================
           ESFERA J.A.R.V.I.S. ESTILO RADAR
           ============================================================ */
        .sphere-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 5px auto 25px;
            position: relative;
        }

        .sphere {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, rgba(0, 240, 255, 0.4), rgba(0, 100, 200, 0.1));
            box-shadow: 0 0 60px rgba(0, 240, 255, 0.4), 0 0 120px rgba(0, 240, 255, 0.2),
                inset 0 -30px 60px rgba(0, 0, 0, 0.8), inset 0 20px 40px rgba(0, 240, 255, 0.2);
            position: relative;
            transition: all 0.6s ease;
            border: 2px solid rgba(0, 240, 255, 0.6);
        }

        .sphere-liquid {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            position: relative;
            overflow: hidden;
        }

        .sphere-liquid::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            top: -50%;
            left: -50%;
            background:
                radial-gradient(circle at 30% 40%, rgba(0, 240, 255, 0.4), transparent 50%),
                radial-gradient(circle at 70% 60%, rgba(50, 150, 255, 0.3), transparent 40%),
                radial-gradient(circle at 50% 80%, rgba(100, 200, 255, 0.2), transparent 30%);
            animation: liquid-move 10s ease-in-out infinite alternate;
        }

        @keyframes liquid-move {
            0% { transform: translate(-10%, -5%) rotate(0deg) scale(1); }
            50% { transform: translate(10%, 5%) rotate(3deg) scale(1.02); }
            100% { transform: translate(-5%, 10%) rotate(-3deg) scale(0.98); }
        }

        .sphere-shine {
            position: absolute;
            top: 8%;
            left: 18%;
            width: 35%;
            height: 20%;
            background: radial-gradient(ellipse, rgba(255, 255, 255, 0.5), transparent 70%);
            border-radius: 50%;
            transform: rotate(-30deg);
            pointer-events: none;
            filter: blur(2px);
            z-index: 2;
        }

        .sphere-rings {
            position: absolute;
            width: 190px;
            height: 190px;
            top: -20px;
            left: -20px;
            pointer-events: none;
        }

        .ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            animation: ring-rotate 25s linear infinite;
        }

        .ring:nth-child(1) {
            animation-duration: 5s;
            border: 1px solid rgba(0, 240, 255, 0.7);
        }
        .ring:nth-child(2) {
            width: 220px;
            height: 220px;
            top: -35px;
            left: -35px;
            animation-duration: 8s;
            animation-direction: reverse;
            border: 1px dashed rgba(0, 240, 255, 0.4);
        }
        .ring:nth-child(3) {
            width: 170px;
            height: 170px;
            top: -10px;
            left: -10px;
            animation-duration: 12s;
            border: 1px dotted rgba(0, 240, 255, 0.3);
        }

        @keyframes ring-rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .sphere.active {
            box-shadow: 0 0 100px rgba(0, 240, 255, 0.6), inset 0 0 60px rgba(0, 240, 255, 0.2);
            animation: sphere-pulse 1s ease-in-out infinite;
        }

        @keyframes sphere-pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        /* ============================================================
           CHAT E INTERAÇÃO
           ============================================================ */
        .chat-box {
            background: rgba(0, 10, 15, 0.9);
            border-radius: 16px;
            padding: 18px 20px;
            min-height: 260px;
            max-height: 350px;
            overflow-y: auto;
            margin-bottom: 18px;
            border: 1px solid rgba(0, 240, 255, 0.3);
            box-shadow: inset 0 0 30px rgba(0, 240, 255, 0.05);
        }

        .chat-box::-webkit-scrollbar { width: 4px; }
        .chat-box::-webkit-scrollbar-track { background: #010a0f; }
        .chat-box::-webkit-scrollbar-thumb { background: rgba(0, 240, 255, 0.4); border-radius: 10px;
            box-shadow: 0 0 5px #00f0ff; }

        .message {
            display: flex;
            margin-bottom: 12px;
            animation: msg-fade 0.3s ease;
        }
        .message.user { justify-content: flex-end; }
        .message.bot { justify-content: flex-start; }

        @keyframes msg-fade {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .bubble {
            max-width: 80%;
            padding: 10px 18px;
            border-radius: 14px;
            font-size: 0.9rem;
            line-height: 1.6;
            word-wrap: break-word;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 500;
            letter-spacing: 0.2px;
        }

        .user .bubble {
            background: rgba(0, 240, 255, 0.1);
            color: #ffffff;
            border-bottom-right-radius: 3px;
            border: 1px solid rgba(0, 240, 255, 0.4);
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.1);
        }

        .bot .bubble {
            background: rgba(0, 0, 0, 0.5);
            color: #ccffff;
            border-bottom-left-radius: 3px;
            border: 1px solid rgba(0, 240, 255, 0.2);
        }

        .bot .bubble .timestamp {
            font-size: 0.5rem;
            color: rgba(0, 240, 255, 0.6);
            display: block;
            margin-top: 4px;
            font-family: 'Orbitron', monospace;
            letter-spacing: 0.5px;
        }

        .typing-indicator {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 4px 0;
        }
        .typing-indicator span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #00f0ff;
            box-shadow: 0 0 10px #00f0ff;
            animation: typing-bounce 1.4s infinite;
        }
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing-bounce {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.2; }
            30% { transform: translateY(-6px); opacity: 1; }
        }

        .input-area {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        .input-wrapper {
            flex: 1;
            position: relative;
            min-width: 140px;
        }

        .input-wrapper input {
            width: 100%;
            padding: 14px 20px;
            border-radius: 25px;
            border: 1px solid rgba(0, 240, 255, 0.3);
            background: rgba(0, 10, 15, 0.8);
            color: #00f0ff;
            font-size: 0.9rem;
            outline: none;
            transition: all 0.3s;
            font-family: 'Share Tech Mono', monospace;
            box-shadow: inset 0 0 10px rgba(0, 240, 255, 0.1);
        }

        .input-wrapper input::placeholder {
            color: rgba(0, 240, 255, 0.4);
            font-family: 'Orbitron', monospace;
            font-size: 0.6rem;
            letter-spacing: 2px;
        }

        .input-wrapper input:focus {
            border-color: #00f0ff;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.4), inset 0 0 10px rgba(0, 240, 255, 0.2);
        }

        .btn {
            padding: 14px 24px;
            border: none;
            border-radius: 25px;
            font-size: 0.65rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Orbitron', monospace;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(0, 240, 255, 0.1);
            color: #00f0ff;
            border: 1px solid rgba(0, 240, 255, 0.4);
        }

        .btn:hover {
            background: rgba(0, 240, 255, 0.3);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.4);
        }

        .btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .btn-mic {
            padding: 14px 18px;
            font-size: 1rem;
        }

        .btn-mic.listening {
            border-color: #00f0ff;
            background: rgba(0, 240, 255, 0.4);
            animation: mic-pulse 1s infinite;
        }

        @keyframes mic-pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(0, 240, 255, 0.4); }
            50% { box-shadow: 0 0 0 12px rgba(0, 240, 255, 0); }
        }

        .footer {
            margin-top: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.5rem;
            font-family: 'Orbitron', monospace;
            color: rgba(0, 240, 255, 0.5);
            letter-spacing: 0.5px;
        }

        .footer .stats span {
            color: rgba(0, 240, 255, 0.4);
            margin: 0 3px;
        }

        .footer .stats .highlight {
            color: #00f0ff;
            text-shadow: 0 0 5px #00f0ff;
        }

        @media (max-width: 600px) {
            .container { padding: 20px 16px; }
            .sphere { width: 120px; height: 120px; }
            .sphere-rings { width: 150px; height: 150px; top: -15px; left: -15px; }
            .ring:nth-child(2) { width: 170px; height: 170px; top: -25px; left: -25px; }
            .ring:nth-child(3) { width: 135px; height: 135px; top: -7px; left: -7px; }
            .logo-text { font-size: 1rem; letter-spacing: 3px; }
            .chat-box { min-height: 180px; max-height: 250px; padding: 14px; }
            .btn { padding: 12px 16px; font-size: 0.55rem; }
            .header { flex-wrap: wrap; gap: 8px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="logo-area">
                <span class="logo-icon">◆</span>
                <span class="logo-text">J.A.R.V.I.S</span>
            </div>
            <div class="status-area">
                <span class="status-dot online" id="statusDot"></span>
                <span class="status-text" id="statusText">ONLINE</span>
                <span class="model-badge" id="modelBadge">GROQ</span>
            </div>
        </div>

        <div class="sphere-container">
            <div class="sphere" id="sphere">
                <div class="sphere-liquid"></div>
                <div class="sphere-shine"></div>
                <div class="sphere-rings">
                    <div class="ring"></div>
                    <div class="ring"></div>
                    <div class="ring"></div>
                </div>
            </div>
        </div>

        <div class="chat-box" id="chatBox">
            <div class="message bot">
                <div class="bubble">
                    ⚡ Sistema J.A.R.V.I.S ativado.<br />
                    🧠 Modelo: Llama 3.3 70B (via Groq)<br />
                    🌐 Limite: 14.400 chamadas/dia<br />
                    ⚡ Velocidade ultrarrápida!<br />
                    Como posso auxiliá-lo, senhor?
                    <span class="timestamp">● INICIALIZADO</span>
                </div>
            </div>
        </div>

        <div class="input-area">
            <div class="input-wrapper">
                <input type="text" id="userInput" placeholder="DIGITE SUA MENSAGEM..." />
            </div>
            <button class="btn btn-primary" id="sendBtn">→</button>
            <button class="btn btn-mic" id="micBtn">🎙</button>
        </div>

        <div class="footer">
            <div class="stats">
                <span>●</span> <span class="highlight">14.400</span> / DIA
            </div>
            <div class="stats">
                <span>●</span> GROQ
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        // CONFIGURAÇÃO DA API - GROQ
        // ============================================================
        const API_KEY = "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";
        const BASE_URL = "https://api.groq.com/openai/v1";

        // ============================================================
        // MODELOS GRATUITOS DA GROQ
        // ============================================================
        // "llama-3.3-70b-versatile"   - Inteligente (RECOMENDADO)
        // "llama-3.1-8b-instant"      - Muito rápido
        // "mixtral-8x7b-32768"        - Bom equilíbrio
        // "gemma2-9b-it"              - Rápido e bom
        // ============================================================
        const MODEL = "llama-3.3-70b-versatile";

        // ============================================================
        // CONFIGURAÇÃO DE VOZ - MAIS GROSSA
        // ============================================================
        const SPEECH_RATE = 1.6;
        const SPEECH_PITCH = 0.4;
        const SPEECH_VOLUME = 1;

        // ============================================================
        // HISTÓRICO DA CONVERSA
        // ============================================================
        const conversationHistory = [];

        // ============================================================
        // ELEMENTOS DOM
        // ============================================================
        const chatBox = document.getElementById('chatBox');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const micBtn = document.getElementById('micBtn');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const modelBadge = document.getElementById('modelBadge');
        const sphere = document.getElementById('sphere');

        modelBadge.textContent = "GROQ";

        let isListening = false;
        let recognition = null;
        let isProcessing = false;
        let currentUtterance = null;

        // ============================================================
        // FUNÇÕES DA ESFERA
        // ============================================================
        function setSphereState(state) {
            sphere.classList.remove('active');
            if (state === 'active') {
                sphere.classList.add('active');
            }
        }

        function setStatus(state, text) {
            statusDot.className = `status-dot ${state}`;
            statusText.textContent = text.toUpperCase();
            if (state === 'processing') {
                setSphereState('active');
            } else {
                setSphereState('idle');
            }
        }

        // ============================================================
        // MENSAGENS
        // ============================================================
        function addMessage(text, sender) {
            const div = document.createElement('div');
            div.className = `message ${sender}`;
            const bubble = document.createElement('div');
            bubble.className = 'bubble';

            if (sender === 'bot') {
                const timestamp = new Date().toLocaleTimeString('pt-BR', { hour: '2-digit',
                    minute: '2-digit' });
                bubble.innerHTML = `${text}<span class="timestamp">● ${timestamp}</span>`;
            } else {
                bubble.textContent = text;
            }

            div.appendChild(bubble);
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // ============================================================
        // TYPING INDICATOR
        // ============================================================
        function showTyping() {
            const div = document.createElement('div');
            div.className = 'message bot';
            div.id = 'typingIndicator';
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            bubble.innerHTML = `
                    <div class="typing-indicator">
                        <span></span><span></span><span></span>
                    </div>
                `;
            div.appendChild(bubble);
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function hideTyping() {
            const el = document.getElementById('typingIndicator');
            if (el) el.remove();
        }

        // ============================================================
        // TEXTO-TO-SPEECH
        // ============================================================
        function speakText(text) {
            if (!('speechSynthesis' in window)) {
                console.warn('❌ SpeechSynthesis não suportado');
                return;
            }

            window.speechSynthesis.cancel();

            const voices = window.speechSynthesis.getVoices();

            if (voices.length === 0) {
                console.log('⏳ Aguardando vozes carregarem...');
                window.speechSynthesis.onvoiceschanged = function() {
                    console.log('✅ Vozes carregadas!');
                    speakText(text);
                };
                return;
            }

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'pt-BR';
            utterance.rate = SPEECH_RATE;
            utterance.pitch = SPEECH_PITCH;
            utterance.volume = SPEECH_VOLUME;

            const ptVoices = voices.filter(v => v.lang.startsWith('pt'));
            if (ptVoices.length > 0) {
                utterance.voice = ptVoices[0];
            } else if (voices.length > 0) {
                utterance.voice = voices[0];
            }

            utterance.onstart = function() {
                console.log('🗣️ JARVIS falando...');
                setSphereState('active');
                setStatus('processing', 'Falando...');
            };

            utterance.onend = function() {
                console.log('✅ Fala finalizada');
                setSphereState('idle');
                if (!isProcessing) {
                    setStatus('online', 'Online');
                }
            };

            utterance.onerror = function(event) {
                console.warn('⚠️ Erro na fala:', event.error);
                setSphereState('idle');
                if (!isProcessing) {
                    setStatus('online', 'Online');
                }
            };

            currentUtterance = utterance;

            try {
                window.speechSynthesis.speak(utterance);
            } catch (e) {
                console.warn('Erro ao falar:', e);
                setSphereState('idle');
                setStatus('online', 'Online');
            }
        }

        // ============================================================
        // FUNÇÃO QUE GARANTE QUE AS VOZES ESTÃO CARREGADAS
        // ============================================================
        function ensureVoicesLoaded() {
            if (!('speechSynthesis' in window)) return false;

            const voices = window.speechSynthesis.getVoices();

            if (voices.length === 0) {
                window.speechSynthesis.onvoiceschanged = function() {
                    console.log('✅ Vozes carregadas!');
                };
                return false;
            }

            console.log(`✅ ${voices.length} vozes disponíveis`);
            return true;
        }

        // ============================================================
        // CHAMADA À API - GROQ
        // ============================================================
        async function sendMessageToAI(userMessage) {
            if (isProcessing) return;
            isProcessing = true;
            sendBtn.disabled = true;

            try {
                showTyping();
                setStatus('processing', 'Processando...');

                conversationHistory.push({ role: 'user', content: userMessage });

                const systemPrompt =
                    `Você é o JARVIS, assistente de IA criado por Tony Stark. 
                        Você é extremamente inteligente, analítico, preciso e formal.
                        Suas respostas devem ser:
                        - Bem fundamentadas e detalhadas
                        - Claras e objetivas
                        - Em português
                        - Use o contexto da conversa para respostas coerentes
                        
                        Você é especialista em tecnologia, física, engenharia, ciência e cultura pop.
                        Seja proativo e ofereça insights valiosos.`;

                const messages = [
                    { role: 'system', content: systemPrompt },
                    ...conversationHistory
                ];

                const response = await fetch(`${BASE_URL}/chat/completions`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${API_KEY}`
                    },
                    body: JSON.stringify({
                        model: MODEL,
                        messages: messages,
                        max_tokens: 800,
                        temperature: 0.5,
                        top_p: 0.9
                    })
                });

                hideTyping();

                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({}));
                    throw new Error(`Erro ${response.status}: ${errorData.error?.message || response
                        .statusText}`);
                }

                const data = await response.json();
                const reply = data.choices?.[0]?.message?.content || 'Desculpe, não consegui gerar uma resposta.';

                conversationHistory.push({ role: 'assistant', content: reply });

                if (conversationHistory.length > 20) {
                    conversationHistory.splice(0, 2);
                }

                addMessage(reply, 'bot');
                setStatus('online', 'Online');

                ensureVoicesLoaded();
                setTimeout(function() {
                    speakText(reply);
                }, 300);

            } catch (error) {
                hideTyping();
                addMessage(`⚠️ ${error.message}`, 'bot');
                setStatus('offline', 'Erro');
                console.error('Erro na API:', error);
            } finally {
                isProcessing = false;
                sendBtn.disabled = false;
            }
        }

        // ============================================================
        // ENVIO DE MENSAGEM
        // ============================================================
        function handleSend() {
            const text = userInput.value.trim();
            if (!text || isProcessing) return;

            addMessage(text, 'user');
            userInput.value = '';
            userInput.focus();

            ensureVoicesLoaded();
            sendMessageToAI(text);
        }

        sendBtn.addEventListener('click', handleSend);
        userInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') handleSend();
        });

        // ============================================================
        // MICROFONE
        // ============================================================
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'pt-BR';
            recognition.continuous = false;
            recognition.interimResults = false;

            recognition.onstart = function() {
                isListening = true;
                micBtn.classList.add('listening');
                micBtn.textContent = '⏹';
                setStatus('processing', 'Ouvindo...');
            };

            recognition.onend = function() {
                isListening = false;
                micBtn.classList.remove('listening');
                micBtn.textContent = '🎙';
                if (statusText.textContent === 'OUVINDO...') {
                    setStatus('online', 'Online');
                }
            };

            recognition.onerror = function(event) {
                console.warn('Erro no microfone:', event.error);
                isListening = false;
                micBtn.classList.remove('listening');
                micBtn.textContent = '🎙';
                setStatus('online', 'Online');
                if (event.error === 'not-allowed') {
                    addMessage('⚠️ Permita o acesso ao microfone.', 'bot');
                }
            };

            recognition.onresult = function(event) {
                const transcript = event.results[0][0].transcript;
                userInput.value = transcript;
                ensureVoicesLoaded();
                setTimeout(function() {
                    handleSend();
                }, 300);
            };

            micBtn.addEventListener('click', function() {
                if (isListening) {
                    recognition.stop();
                    return;
                }
                try {
                    recognition.start();
                } catch (e) {
                    console.warn('Erro ao iniciar microfone:', e);
                }
            });

        } else {
            micBtn.style.display = 'none';
            console.warn('❌ Reconhecimento de voz não suportado');
        }

        // ============================================================
        // INICIALIZAÇÃO
        // ============================================================
        function init() {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.getVoices();

                window.speechSynthesis.onvoiceschanged = function() {
                    const voices = window.speechSynthesis.getVoices();
                    console.log(`✅ Vozes carregadas: ${voices.length} disponíveis`);
                };

                setTimeout(function() {
                    const voices = window.speechSynthesis.getVoices();
                    if (voices.length === 0) {
                        console.warn('⚠️ Nenhuma voz encontrada. Interaja com a página para ativar.');
                    }
                }, 2000);
            }

            testConnection();
        }

        // ============================================================
        // TESTE DE CONEXÃO
        // ============================================================
        async function testConnection() {
            try {
                const response = await fetch(`${BASE_URL}/models`, {
                    headers: { 'Authorization': `Bearer ${API_KEY}` }
                });
                if (response.ok) {
                    setStatus('online', 'Online');
                    console.log('✅ API Key válida!');
                    console.log('✅ Modelo:', MODEL);
                    console.log('✅ Limite: 14.400 req/dia!');
                } else {
                    setStatus('offline', 'Falha na chave');
                    console.warn('⚠️ Verifique sua API Key');
                }
            } catch (e) {
                setStatus('offline', 'Sem conexão');
                console.warn('⚠️ Não foi possível conectar');
            }
        }

        // Inicializa o sistema
        init();

        console.log('🚀 J.A.R.V.I.S iniciado com GROQ!');
        console.log(`📦 Modelo: ${MODEL}`);
        console.log(`🗣️ Velocidade: ${SPEECH_RATE}x | Tom: ${SPEECH_PITCH} (MAIS GROSSO)`);
        console.log('🧠 Sistema com personalidade JARVIS e contexto persistente');
        console.log('📱 Modo celular: fala corrigida e funcionando!');
        console.log('🌐 GROQ: 14.400 chamadas/dia grátis!');
        console.log('⚡ Velocidade ultrarrápida!');
    </script>
</body>
</html>
