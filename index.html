<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal do Professor | Cronograma & RAD</title>
    <style>
        :root {
            --bg-color: #050505;
            --card-bg: #121212;
            --text-main: #e0e0e0;
            --text-muted: #a0a0a0;
            --accent: #00f2ff; /* Azul Neon Futurista */
            --accent-dim: rgba(0, 242, 255, 0.1);
            --danger: #ff3b3b;
            --success: #00ff9d;
            --warning: #ffcc00;
            --border-radius: 4px; /* Bordas menos arredondadas */
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Scrollbar Customizada */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-color); }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

        header {
            background: linear-gradient(180deg, #0a0a0a 0%, var(--bg-color) 100%);
            border-bottom: 1px solid #333;
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        h1 { font-size: 1.5rem; letter-spacing: 1px; text-transform: uppercase; color: var(--accent); text-shadow: 0 0 10px rgba(0, 242, 255, 0.3); }
        
        .nav-tabs { display: flex; gap: 1rem; }
        .nav-btn {
            background: transparent;
            border: 1px solid #333;
            color: var(--text-muted);
            padding: 0.5rem 1.2rem;
            cursor: pointer;
            transition: var(--transition);
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 1px;
            border-radius: var(--border-radius);
        }
        .nav-btn:hover, .nav-btn.active {
            border-color: var(--accent);
            color: var(--accent);
            box-shadow: 0 0 15px var(--accent-dim);
        }

        .container { max-width: 1400px; margin: 0 auto; padding: 2rem; }

        /* Animações de Transição */
        .fade-in { animation: fadeIn 0.5s ease-out forwards; opacity: 0; transform: translateY(10px); }
        @keyframes fadeIn { to { opacity: 1; transform: translateY(0); } }

        /* Grid de Professores */
        .teachers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-top: 2rem;
        }

        .teacher-card {
            background: var(--card-bg);
            border: 1px solid #333;
            padding: 2rem;
            text-align: center;
            cursor: pointer;
            transition: var(--transition);
            border-radius: var(--border-radius);
            position: relative;
            overflow: hidden;
        }

        .teacher-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 3px;
            background: var(--accent);
            transform: scaleX(0);
            transition: transform 0.3s ease;
        }

        .teacher-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        .teacher-card:hover::before { transform: scaleX(1); }

        .teacher-name { font-size: 1.2rem; font-weight: 600; color: var(--text-main); text-transform: uppercase; }
        .teacher-status { font-size: 0.8rem; color: var(--text-muted); margin-top: 0.5rem; }

        /* Cronograma */
        .schedule-view { display: none; }
        .back-btn {
            background: transparent;
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 0.6rem 1.5rem;
            cursor: pointer;
            margin-bottom: 2rem;
            text-transform: uppercase;
            font-weight: bold;
            transition: var(--transition);
            border-radius: var(--border-radius);
        }
        .back-btn:hover { background: var(--accent); color: #000; box-shadow: 0 0 20px var(--accent-dim); }

        .day-section {
            background: var(--card-bg);
            border: 1px solid #222;
            margin-bottom: 2rem;
            border-radius: var(--border-radius);
            overflow: hidden;
        }

        .day-header {
            background: #1a1a1a;
            padding: 1rem 1.5rem;
            color: var(--accent);
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid #333;
        }

        .classes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
            padding: 1.5rem;
        }

        .class-card {
            background: #0f0f0f;
            border: 1px solid #222;
            padding: 1.2rem;
            border-radius: var(--border-radius);
            transition: var(--transition);
            position: relative;
        }

        .class-card:hover { border-color: #444; background: #141414; }
        .class-card.completed { border-left: 4px solid var(--success); }
        .class-card.cancelled { border-left: 4px solid var(--danger); opacity: 0.7; }
        .class-card.noshow { border-left: 4px solid var(--warning); }

        .class-time { font-size: 1.1rem; font-weight: bold; color: var(--accent); margin-bottom: 0.5rem; display: block; }
        .class-info { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 0.3rem; }
        .class-info strong { color: var(--text-main); }
        
        .badges { display: flex; flex-wrap: wrap; gap: 0.5rem; margin: 0.8rem 0; }
        .badge {
            font-size: 0.75rem;
            padding: 0.2rem 0.6rem;
            border-radius: 2px;
            text-transform: uppercase;
            font-weight: bold;
        }
        .badge-book { background: rgba(0, 242, 255, 0.1); color: var(--accent); border: 1px solid rgba(0, 242, 255, 0.3); }
        .badge-room { background: rgba(255, 255, 255, 0.05); color: #fff; border: 1px solid #333; }
        .badge-modal { background: rgba(255, 255, 255, 0.05); color: #ccc; border: 1px solid #333; font-style: italic; }

        .action-btn {
            width: 100%;
            padding: 0.8rem;
            margin-top: 1rem;
            background: transparent;
            border: 1px solid #333;
            color: var(--text-main);
            cursor: pointer;
            text-transform: uppercase;
            font-weight: bold;
            transition: var(--transition);
            border-radius: var(--border-radius);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        .action-btn:hover { background: var(--accent); color: #000; border-color: var(--accent); }
        .action-btn.rad-btn { border-color: var(--accent); color: var(--accent); }
        .action-btn.rad-btn:hover { background: var(--accent); color: #000; }

        /* Modal RAD */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: none; justify-content: center; align-items: center;
            z-index: 1000;
            backdrop-filter: blur(5px);
        }
        .modal-content {
            background: #111;
            border: 1px solid #333;
            width: 90%; max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
            border-radius: var(--border-radius);
            padding: 2rem;
            box-shadow: 0 0 50px rgba(0, 242, 255, 0.1);
            position: relative;
        }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; border-bottom: 1px solid #333; padding-bottom: 1rem; }
        .modal-title { color: var(--accent); font-size: 1.4rem; text-transform: uppercase; }
        .close-modal { background: none; border: none; color: #fff; font-size: 1.5rem; cursor: pointer; }

        .form-group { margin-bottom: 1.2rem; }
        .form-label { display: block; margin-bottom: 0.5rem; color: var(--text-muted); font-size: 0.9rem; text-transform: uppercase; }
        .form-input, .form-select, .form-textarea {
            width: 100%;
            background: #0a0a0a;
            border: 1px solid #333;
            color: var(--text-main);
            padding: 0.8rem;
            border-radius: var(--border-radius);
            font-size: 1rem;
        }
        .form-input:focus, .form-select:focus, .form-textarea:focus {
            outline: none; border-color: var(--accent); box-shadow: 0 0 10px var(--accent-dim);
        }
        .form-textarea { resize: vertical; min-height: 100px; }

        .student-list { max-height: 300px; overflow-y: auto; border: 1px solid #333; border-radius: var(--border-radius); margin-top: 0.5rem; }
        .student-item {
            display: flex; align-items: center; padding: 0.8rem;
            border-bottom: 1px solid #222;
            transition: background 0.2s;
        }
        .student-item:last-child { border-bottom: none; }
        .student-item:hover { background: #1a1a1a; }
        .student-checkbox { margin-right: 1rem; accent-color: var(--accent); width: 18px; height: 18px; }
        .student-name { color: var(--text-main); }
        .student-absent { color: var(--danger); text-decoration: line-through; opacity: 0.6; }

        .status-options { display: flex; gap: 1rem; margin-top: 0.5rem; }
        .status-btn {
            flex: 1; padding: 0.8rem; border: 1px solid #333; background: #0a0a0a;
            color: var(--text-muted); cursor: pointer; text-transform: uppercase; font-weight: bold;
            border-radius: var(--border-radius); transition: var(--transition);
        }
        .status-btn.active-realized { background: var(--success); color: #000; border-color: var(--success); }
        .status-btn.active-cancelled { background: var(--danger); color: #fff; border-color: var(--danger); }
        .status-btn.active-noshow { background: var(--warning); color: #000; border-color: var(--warning); }

        .modal-actions { display: flex; gap: 1rem; margin-top: 2rem; }
        .btn-save { flex: 2; background: var(--accent); color: #000; border: none; padding: 1rem; font-weight: bold; text-transform: uppercase; cursor: pointer; border-radius: var(--border-radius); }
        .btn-clear { flex: 1; background: transparent; border: 1px solid #333; color: var(--text-muted); padding: 1rem; cursor: pointer; text-transform: uppercase; border-radius: var(--border-radius); }
        .btn-save:hover { box-shadow: 0 0 20px var(--accent-dim); }
        .btn-clear:hover { border-color: var(--danger); color: var(--danger); }

        /* Class Calculator */
        .calculator-view { display: none; }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }
        .stat-card {
            background: var(--card-bg);
            border: 1px solid #333;
            padding: 1.5rem;
            border-radius: var(--border-radius);
            text-align: center;
        }
        .stat-value { font-size: 2.5rem; font-weight: bold; color: var(--accent); margin: 0.5rem 0; }
        .stat-label { color: var(--text-muted); text-transform: uppercase; font-size: 0.85rem; letter-spacing: 1px; }
        
        .month-selector {
            display: flex; justify-content: center; gap: 1rem; margin-bottom: 2rem;
            background: #111; padding: 1rem; border-radius: var(--border-radius); border: 1px solid #333;
        }
        .month-btn {
            background: transparent; border: 1px solid #333; color: var(--text-muted);
            padding: 0.5rem 1rem; cursor: pointer; border-radius: var(--border-radius);
            transition: var(--transition);
        }
        .month-btn.active { background: var(--accent); color: #000; border-color: var(--accent); }

        .loading-spinner {
            text-align: center; padding: 3rem; color: var(--accent);
            font-size: 1.2rem; text-transform: uppercase; letter-spacing: 2px;
        }
        .error-msg { color: var(--danger); text-align: center; padding: 2rem; border: 1px solid var(--danger); border-radius: var(--border-radius); margin-top: 2rem; }

        /* Lesson Plan Box inside Modal */
        .lesson-plan-box {
            background: #0a0a0a;
            border: 1px solid #333;
            padding: 1rem;
            border-radius: var(--border-radius);
            margin-bottom: 1.5rem;
        }
        .lesson-plan-box label { color: var(--accent); font-size: 0.8rem; text-transform: uppercase; margin-bottom: 0.5rem; display: block; }
    </style>
</head>
<body>

<header>
    <h1>Portal <span style="color:#fff">Professor</span></h1>
    <nav class="nav-tabs">
        <button class="nav-btn active" onclick="switchTab('selection')">Cronograma</button>
        <button class="nav-btn" onclick="switchTab('calculator')">Class Calculator</button>
    </nav>
</header>

<div class="container">
    <!-- Loading -->
    <div id="loading" class="loading-spinner">Carregando Dados...</div>
    <div id="error-display" class="error-msg" style="display:none;"></div>

    <!-- Selection Screen -->
    <div id="selection-screen" style="display:none;">
        <div class="teachers-grid" id="teachers-grid"></div>
    </div>

    <!-- Schedule Screen -->
    <div id="schedule-screen" class="schedule-view fade-in">
        <button class="back-btn" onclick="showSelection()">← Voltar</button>
        <h2 id="teacher-schedule-title" style="margin-bottom: 2rem; color: var(--accent); text-transform: uppercase;"></h2>
        <div id="schedule-content"></div>
    </div>

    <!-- Calculator Screen -->
    <div id="calculator-screen" class="calculator-view fade-in">
        <h2 style="margin-bottom: 1rem; color: var(--accent); text-transform: uppercase;">Class Calculator</h2>
        <p style="color: var(--text-muted); margin-bottom: 2rem;">Selecione o mês para visualizar o desempenho.</p>
        
        <div class="month-selector" id="month-selector">
            <!-- Generated by JS -->
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Aulas Realizadas (Escola)</div>
                <div class="stat-value" id="stat-school-done">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Aulas In-Company</div>
                <div class="stat-value" id="stat-company-done">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">No Show (Escola)</div>
                <div class="stat-value" id="stat-school-noshow" style="color: var(--warning)">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">No Show (In-Company)</div>
                <div class="stat-value" id="stat-company-noshow" style="color: var(--warning)">0</div>
            </div>
        </div>
    </div>
</div>

<!-- RAD Modal -->
<div class="modal-overlay" id="rad-modal">
    <div class="modal-content">
        <div class="modal-header">
            <div class="modal-title">RAD - Registro de Aula</div>
            <button class="close-modal" onclick="closeModal()">&times;</button>
        </div>
        
        <div id="rad-form">
            <div class="form-group">
                <label class="form-label">Status da Aula</label>
                <div class="status-options">
                    <button type="button" class="status-btn" data-status="realized" onclick="setStatus('realized')">Realizada</button>
                    <button type="button" class="status-btn" data-status="cancelled" onclick="setStatus('cancelled')">Cancelada</button>
                    <button type="button" class="status-btn" data-status="noshow" onclick="setStatus('noshow')">No Show</button>
                </div>
                <input type="hidden" id="rad-status">
            </div>

            <div class="lesson-plan-box">
                <label>Lesson Plan / Descrição da Aula</label>
                <textarea id="rad-lesson" class="form-textarea" placeholder="Descreva o que foi feito na aula (Book, Página, Atividades...)"></textarea>
            </div>

            <div id="attendance-section">
                <label class="form-label">Lista de Presença</label>
                <div class="student-list" id="student-list-container">
                    <!-- Students injected here -->
                </div>
                <p style="font-size: 0.8rem; color: var(--text-muted); margin-top: 0.5rem;">* Marque apenas os presentes. Desmarcados são considerados ausentes.</p>
            </div>

            <div class="modal-actions">
                <button class="btn-clear" onclick="clearRadData()">Limpar RAD</button>
                <button class="btn-save" onclick="saveRad()">Salvar Registro</button>
            </div>
        </div>
    </div>
</div>

<script>
    // CONFIGURAÇÕES
    const SCHEDULE_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQmSAl1ndXXSgDWbrjCiSDkmtECkP94Rr2nk-kIHV-zHd4NFSE9CzyQb6YP2Rt4lEQNYOpuvgjCYDal/pub?output=csv';
    const STUDENTS_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSlWLLO76YOXic0n11ttKL-UKoNGTT3VKEogt3pvHONM4Hnb3upvgYj_h8DOC57xmAobUXSIznc7V6x/pub?output=csv';

    // PROFESSORES VÁLIDOS (Rafael removido)
    const VALID_TEACHERS = [
        'MYCAEL', 'HOPE', 'PEDRO', 'DIOGO', 'LIVIA', 'TOSCA', 'IAGO', 'SARA', 'CAROL'
    ];

    const DAYS_MAP = {
        'Monday': 'Segunda-feira',
        'Tuesday': 'Terça-feira',
        'Wednesday': 'Quarta-feira',
        'Thursday': 'Quinta-feira',
        'Friday': 'Sexta-feira'
    };
    
    const MONTHS = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];

    let allClasses = [];
    let studentsDB = {}; // { "TURMA": ["Aluno 1", "Aluno 2"] }
    let currentTeacher = null;
    let currentClassId = null; // ID único para salvar o RAD

    // Inicialização
    document.addEventListener('DOMContentLoaded', () => {
        Promise.all([fetchSchedule(), fetchStudents()])
            .then(() => {
                document.getElementById('loading').style.display = 'none';
                renderTeacherSelection();
                initCalculator();
            })
            .catch(err => {
                console.error(err);
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error-display').style.display = 'block';
                document.getElementById('error-display').textContent = 'Erro ao carregar dados. Verifique sua conexão.';
            });
    });

    async function fetchSchedule() {
        const res = await fetch(SCHEDULE_URL);
        if (!res.ok) throw new Error('Schedule Fetch Failed');
        const csv = await res.text();
        parseSchedule(csv);
    }

    async function fetchStudents() {
        const res = await fetch(STUDENTS_URL);
        if (!res.ok) throw new Error('Students Fetch Failed');
        const csv = await res.text();
        parseStudents(csv);
    }

    function parseSchedule(csv) {
        const lines = csv.split('\n').map(l => l.trim()).filter(l => l);
        if (lines.length < 2) return;

        // Estrutura: A(Lang), B(Book), C(Group), D(Room), E(Mod), F(Time), G(Mon), H(Tue)...
        const headers = lines[0].split(',').map(h => h.replace(/"/g, '').trim());
        
        // Mapeamento de índices baseado na nova estrutura (0-based)
        // A=0, B=1, C=2, D=3, E=4, F=5, G=6(Mon), H=7(Tue), I=8(Wed), J=9(Thu), K=10(Fri)
        const idx = {
            book: 1, group: 2, room: 3, mod: 4, time: 5,
            days: { 'Monday': 6, 'Tuesday': 7, 'Wednesday': 8, 'Thursday': 9, 'Friday': 10 }
        };

        allClasses = [];

        for (let i = 1; i < lines.length; i++) {
            // Split simples considerando aspas básicas
            const row = lines[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(cell => cell.replace(/^"|"$/g, '').trim());
            
            const time = row[idx.time];
            const book = row[idx.book];
            const groupRaw = row[idx.group];
            const room = row[idx.room];
            const mod = row[idx.mod];

            if (!time || !groupRaw) continue;

            // Normalizar nome da turma para busca no DB de alunos
            const groupName = groupRaw.toUpperCase().trim();

            for (const [dayEn, colIdx] of Object.entries(idx.days)) {
                const cellContent = row[colIdx];
                if (!cellContent) continue;

                // Verificar se algum professor válido está na célula
                const foundTeacher = VALID_TEACHERS.find(t => cellContent.toUpperCase().includes(t));
                
                if (foundTeacher) {
                    // Identificar se é In-Company
                    const isCompany = mod.toUpperCase().includes('IN-C') || 
                                      mod.toUpperCase().includes('IN COMPANY') ||
                                      groupRaw.toLowerCase().includes('hotel') || 
                                      groupRaw.toLowerCase().includes('aventura') ||
                                      groupRaw.toLowerCase().includes('get it');

                    allClasses.push({
                        id: `${foundTeacher}-${dayEn}-${time}-${groupName}`, // ID Único
                        day: dayEn,
                        dayPt: DAYS_MAP[dayEn],
                        time: time,
                        teacher: foundTeacher,
                        book: book || 'N/A',
                        group: groupRaw, // Nome original para exibição
                        groupKey: groupName, // Chave normalizada para alunos
                        room: room || 'N/A',
                        mod: mod || 'Normal',
                        isCompany: isCompany
                    });
                }
            }
        }
    }

    function parseStudents(csv) {
        const lines = csv.split('\n').map(l => l.trim()).filter(l => l);
        if (lines.length < 2) return;

        // Coluna A: Turma, Coluna B: Aluno
        for (let i = 1; i < lines.length; i++) {
            const parts = lines[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
            if (parts.length >= 2) {
                const turma = parts[0].replace(/^"|"$/g, '').trim().toUpperCase();
                const aluno = parts[1].replace(/^"|"$/g, '').trim();
                
                if (!studentsDB[turma]) studentsDB[turma] = [];
                studentsDB[turma].push(aluno);
            }
        }
    }

    function renderTeacherSelection() {
        const grid = document.getElementById('teachers-grid');
        grid.innerHTML = '';
        
        // Ordenar alfabeticamente
        const sortedTeachers = [...VALID_TEACHERS].sort();

        sortedTeachers.forEach(teach => {
            const hasClasses = allClasses.some(c => c.teacher === teach);
            const card = document.createElement('div');
            card.className = 'teacher-card';
            card.innerHTML = `
                <div class="teacher-name">${teach}</div>
                <div class="teacher-status">${hasClasses ? 'Ver Cronograma' : 'Sem aulas'}</div>
            `;
            if (hasClasses) {
                card.onclick = () => showSchedule(teach);
            } else {
                card.style.opacity = '0.5';
                card.style.cursor = 'default';
            }
            grid.appendChild(card);
        });
    }

    function showSchedule(teacher) {
        currentTeacher = teacher;
        document.getElementById('selection-screen').style.display = 'none';
        document.getElementById('schedule-screen').style.display = 'block';
        document.getElementById('teacher-schedule-title').textContent = `Cronograma: ${teacher}`;
        
        const content = document.getElementById('schedule-content');
        content.innerHTML = '';

        const daysOrder = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday'];
        
        daysOrder.forEach(day => {
            const dayClasses = allClasses.filter(c => c.teacher === teacher && c.day === day);
            if (dayClasses.length === 0) return;

            const section = document.createElement('div');
            section.className = 'day-section fade-in';
            
            const header = document.createElement('div');
            header.className = 'day-header';
            header.textContent = DAYS_MAP[day];
            section.appendChild(header);

            const grid = document.createElement('div');
            grid.className = 'classes-grid';

            dayClasses.forEach(cls => {
                // Buscar status salvo
                const savedData = getRadData(cls.id);
                const statusClass = savedData ? savedData.status : '';
                
                const card = document.createElement('div');
                card.className = `class-card ${statusClass}`;
                
                let badgesHtml = `
                    <span class="badge badge-book">${cls.book}</span>
                    <span class="badge badge-room">📍 ${cls.room}</span>
                    ${cls.isCompany ? '<span class="badge badge-modal" style="border-color:#ff3b3b; color:#ff3b3b">IN-COMPANY</span>' : ''}
                    <span class="badge badge-modal">${cls.mod}</span>
                `;

                card.innerHTML = `
                    <span class="class-time">⏰ ${cls.time}</span>
                    <div class="class-info"><strong>Turma:</strong> ${cls.group}</div>
                    <div class="badges">${badgesHtml}</div>
                    <button class="action-btn rad-btn" onclick="openRad('${cls.id}', '${cls.groupKey}')">
                        ${savedData ? '✏️ Editar RAD' : '📝 Preencher RAD'}
                    </button>
                `;
                grid.appendChild(card);
            });

            section.appendChild(grid);
            content.appendChild(section);
        });
    }

    function showSelection() {
        document.getElementById('schedule-screen').style.display = 'none';
        document.getElementById('selection-screen').style.display = 'block';
        currentTeacher = null;
    }

    function switchTab(tab) {
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('selection-screen').style.display = 'none';
        document.getElementById('schedule-screen').style.display = 'none';
        document.getElementById('calculator-screen').style.display = 'none';

        if (tab === 'selection') {
            document.querySelector('.nav-btn:nth-child(1)').classList.add('active');
            if (currentTeacher) showSchedule(currentTeacher);
            else document.getElementById('selection-screen').style.display = 'block';
        } else if (tab === 'calculator') {
            document.querySelector('.nav-btn:nth-child(2)').classList.add('active');
            document.getElementById('calculator-screen').style.display = 'block';
            updateCalculatorStats();
        }
    }

    // --- RAD LOGIC ---

    function openRad(classId, groupKey) {
        currentClassId = classId;
        const modal = document.getElementById('rad-modal');
        const data = getRadData(classId);
        
        // Reset form
        document.querySelectorAll('.status-btn').forEach(b => b.className = 'status-btn');
        document.getElementById('rad-status').value = '';
        document.getElementById('rad-lesson').value = '';
        
        // Carregar dados existentes
        if (data) {
            if (data.status) setStatus(data.status);
            if (data.lesson) document.getElementById('rad-lesson').value = data.lesson;
        }

        // Carregar Alunos
        const listContainer = document.getElementById('student-list-container');
        listContainer.innerHTML = '';
        
        const students = studentsDB[groupKey] || [];
        
        if (students.length === 0) {
            listContainer.innerHTML = '<p style="padding:1rem; color:#666;">Nenhum aluno encontrado para esta turma na base de dados.</p>';
        } else {
            students.forEach((student, idx) => {
                const isChecked = data && data.attendance && data.attendance.includes(idx);
                const item = document.createElement('div');
                item.className = 'student-item';
                item.innerHTML = `
                    <input type="checkbox" class="student-checkbox" id="att-${idx}" ${isChecked ? 'checked' : ''}>
                    <label class="student-name" for="att-${idx}">${student}</label>
                `;
                listContainer.appendChild(item);
            });
        }

        modal.style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('rad-modal').style.display = 'none';
        currentClassId = null;
        if (currentTeacher) showSchedule(currentTeacher); // Refresh para mostrar status
    }

    function setStatus(status) {
        document.getElementById('rad-status').value = status;
        document.querySelectorAll('.status-btn').forEach(b => {
            b.classList.remove('active-realized', 'active-cancelled', 'active-noshow');
            if (b.dataset.status === status) {
                b.classList.add(`active-${status}`);
            }
        });
    }

    function clearRadData() {
        if (!confirm('Tem certeza que deseja limpar todos os dados deste RAD?')) return;
        
        localStorage.removeItem(`rad_${currentClassId}`);
        closeModal();
    }

    function saveRad() {
        const status = document.getElementById('rad-status').value;
        const lesson = document.getElementById('rad-lesson').value;
        
        const attendance = [];
        document.querySelectorAll('.student-checkbox:checked').forEach((cb, idx) => {
            attendance.push(idx);
        });

        if (!status) {
            alert('Por favor, selecione o status da aula (Realizada, Cancelada ou No Show).');
            return;
        }

        const data = { status, lesson, attendance, timestamp: new Date().toISOString() };
        localStorage.setItem(`rad_${currentClassId}`, JSON.stringify(data));
        
        closeModal();
        alert('RAD Salvo com Sucesso!');
    }

    function getRadData(classId) {
        const raw = localStorage.getItem(`rad_${classId}`);
        return raw ? JSON.parse(raw) : null;
    }

    // --- CALCULATOR LOGIC ---

    let selectedMonthIndex = new Date().getMonth(); // Mês atual

    function initCalculator() {
        const container = document.getElementById('month-selector');
        container.innerHTML = '';
        MONTHS.forEach((m, idx) => {
            const btn = document.createElement('button');
            btn.className = `month-btn ${idx === selectedMonthIndex ? 'active' : ''}`;
            btn.textContent = m;
            btn.onclick = () => {
                selectedMonthIndex = idx;
                document.querySelectorAll('.month-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                updateCalculatorStats();
            };
            container.appendChild(btn);
        });
        updateCalculatorStats();
    }

    function updateCalculatorStats() {
        // Contadores
        let schoolDone = 0;
        let companyDone = 0;
        let schoolNoShow = 0;
        let companyNoShow = 0;

        // Percorrer todas as aulas do cronograma
        allClasses.forEach(cls => {
            const data = getRadData(cls.id);
            if (!data || !data.status) return;

            // Simulação simples de mês: 
            // Como o CSV não tem data específica, estamos assumindo que o RAD salvo pertence ao "mês atual de visualização"
            // Em um sistema real, precisaríamos salvar a data da aula no RAD.
            // Para este MVP, vamos contar tudo o que foi marcado, pois o usuário pediu "calcular quantas aulas o teacher marcou".
            // Se quiser filtrar por mês real, precisaria salvar a data no objeto RAD.
            // Vamos assumir que o usuário usa o seletor para ver o acumulado geral ou que salvará a data futuramente.
            // *Ajuste*: Vamos considerar que o RAD é atemporal neste MVP e mostra o total acumulado, 
            // ou poderíamos pedir para o usuário inserir a data ao salvar. 
            // Para atender o pedido "clicar e ver o mês", idealmente o RAD teria um campo de data.
            // Vou implementar uma lógica onde o RAD salva a data atual do sistema ao ser preenchido.
            
            const radDate = new Date(data.timestamp);
            if (radDate.getMonth() !== selectedMonthIndex) return; // Filtra pelo mês selecionado

            if (data.status === 'realized') {
                if (cls.isCompany) companyDone++;
                else schoolDone++;
            } else if (data.status === 'noshow') {
                if (cls.isCompany) companyNoShow++;
                else schoolNoShow++;
            }
            // Canceladas não entram na contagem de produtividade usualmente
        });

        document.getElementById('stat-school-done').textContent = schoolDone;
        document.getElementById('stat-company-done').textContent = companyDone;
        document.getElementById('stat-school-noshow').textContent = schoolNoShow;
        document.getElementById('stat-company-noshow').textContent = companyNoShow;
    }
</script>
