<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cronograma Semanal - Escola de Inglês</title>
    <style>
        :root {
            --bg-color: #050505;
            --card-bg: #0a0a0a;
            --text-main: #ffffff;
            --text-sec: #a0a0a0;
            --accent: #00f3ff;
            --accent-dim: rgba(0, 243, 255, 0.1);
            --border: #1a1a1a;
            --radius: 4px; /* Bordas menos arredondadas */
            --shadow: 0 4px 20px rgba(0, 243, 255, 0.05);
            --font-main: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-main);
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-color); }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

        header {
            background: linear-gradient(180deg, #000000 0%, #0a0a0a 100%);
            border-bottom: 1px solid var(--border);
            padding: 1.5rem 1rem;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--text-main);
            margin-bottom: 0.5rem;
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.3);
        }

        header p {
            color: var(--text-sec);
            font-size: 0.9rem;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 1.5rem 1rem;
        }

        /* Telas */
        .screen { display: none; animation: fadeIn 0.4s ease-out; }
        .screen.active { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Grid de Professores */
        .teachers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
        }

        .teacher-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.5rem 1rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100px;
        }

        .teacher-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 3px;
            background: currentColor;
            transform: scaleX(0);
            transition: transform 0.3s ease;
        }

        .teacher-card:hover {
            transform: translateY(-3px);
            border-color: var(--accent);
            box-shadow: var(--shadow);
        }

        .teacher-card:hover::before { transform: scaleX(1); }

        .teacher-name {
            font-size: 1rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-main);
        }

        /* Botão de Presença Geral */
        .presence-btn-container {
            margin-top: 2rem;
            text-align: center;
        }

        .btn-neon {
            background: transparent;
            color: var(--accent);
            border: 1px solid var(--accent);
            padding: 0.8rem 2rem;
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            border-radius: var(--radius);
            transition: all 0.3s ease;
            box-shadow: 0 0 5px rgba(0, 243, 255, 0.2);
        }

        .btn-neon:hover {
            background: var(--accent-dim);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.4);
        }

        /* Tela do Professor */
        .prof-header {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border);
        }

        .prof-title-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .back-btn {
            background: transparent;
            color: var(--text-sec);
            border: 1px solid var(--border);
            padding: 0.5rem 1rem;
            border-radius: var(--radius);
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .back-btn:hover { border-color: var(--text-main); color: var(--text-main); }

        .week-nav {
            display: flex;
            align-items: center;
            gap: 1rem;
            background: var(--card-bg);
            padding: 0.5rem;
            border-radius: var(--radius);
            border: 1px solid var(--border);
        }

        .week-label {
            font-weight: 600;
            color: var(--accent);
            font-size: 0.9rem;
            min-width: 120px;
            text-align: center;
        }

        .nav-btn {
            background: transparent;
            border: none;
            color: var(--text-sec);
            cursor: pointer;
            padding: 0.5rem;
            font-size: 1.2rem;
            transition: color 0.2s;
        }

        .nav-btn:hover:not(:disabled) { color: var(--accent); }
        .nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }

        /* Dias e Aulas */
        .days-container { display: flex; flex-direction: column; gap: 1.5rem; }

        .day-section {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
        }

        .day-header {
            padding: 0.8rem 1rem;
            background: rgba(0, 243, 255, 0.05);
            border-bottom: 1px solid var(--border);
            font-size: 0.9rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent);
            display: flex;
            justify-content: space-between;
        }

        .classes-list {
            padding: 1rem;
            display: grid;
            grid-template-columns: 1fr;
            gap: 1rem;
        }

        @media (min-width: 600px) {
            .classes-list { grid-template-columns: repeat(2, 1fr); }
        }

        .class-card {
            background: #0f0f0f;
            border: 1px solid var(--border);
            border-left: 3px solid var(--accent);
            border-radius: var(--radius);
            padding: 1rem;
            position: relative;
            transition: transform 0.2s;
        }

        .class-card:hover { transform: translateX(3px); border-color: #333; }

        .class-time {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 0.5rem;
            display: block;
        }

        .class-info {
            font-size: 0.85rem;
            color: var(--text-sec);
            margin-bottom: 0.3rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .badge {
            padding: 0.2rem 0.5rem;
            border-radius: 2px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .badge-group { background: rgba(255, 255, 255, 0.1); color: #fff; }
        .badge-book { background: rgba(0, 243, 255, 0.15); color: var(--accent); border: 1px solid rgba(0, 243, 255, 0.3); }
        .badge-room { background: #222; color: #888; }
        .badge-mod { background: rgba(255, 255, 255, 0.05); color: #aaa; font-style: italic; }

        .last-lesson-info {
            margin-top: 0.5rem;
            padding-top: 0.5rem;
            border-top: 1px dashed #333;
            font-size: 0.8rem;
            color: #666;
        }
        .last-lesson-info span { color: var(--accent); font-weight: bold; }

        .action-btn {
            margin-top: 0.8rem;
            width: 100%;
            padding: 0.6rem;
            background: transparent;
            border: 1px solid var(--accent);
            color: var(--accent);
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: var(--radius);
            transition: all 0.2s;
        }

        .action-btn:hover { background: var(--accent-dim); }
        .action-btn.done { background: var(--accent); color: #000; }

        /* Modal RAD */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(5px);
            z-index: 1000;
            display: none;
            justify-content: center;
            align-items: flex-end; /* Mobile first: sheet from bottom */
        }

        .modal-overlay.active { display: flex; }

        .modal-content {
            background: #0a0a0a;
            width: 100%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
            border-top: 2px solid var(--accent);
            padding: 1.5rem;
            animation: slideUp 0.3s ease;
            border-radius: var(--radius) var(--radius) 0 0;
        }

        @media (min-width: 600px) {
            .modal-overlay { align-items: center; }
            .modal-content { 
                max-height: 85vh; 
                border-radius: var(--radius); 
                border: 1px solid var(--border);
            }
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid var(--border);
            padding-bottom: 1rem;
        }

        .modal-title { font-size: 1.2rem; font-weight: 700; color: var(--accent); }
        .close-modal { background: none; border: none; color: #666; font-size: 1.5rem; cursor: pointer; }

        .form-group { margin-bottom: 1.2rem; }
        .form-label { display: block; margin-bottom: 0.5rem; font-size: 0.85rem; color: var(--text-sec); font-weight: 600; }
        
        .status-options { display: flex; gap: 0.5rem; }
        .status-btn {
            flex: 1;
            padding: 0.6rem;
            background: #111;
            border: 1px solid #333;
            color: #666;
            cursor: pointer;
            font-size: 0.8rem;
            border-radius: var(--radius);
            transition: all 0.2s;
        }
        .status-btn.active { background: var(--accent); color: #000; border-color: var(--accent); font-weight: bold; }
        .status-btn[data-val="No Show"].active { background: #ff4757; color: white; border-color: #ff4757; }
        .status-btn[data-val="Cancelada"].active { background: #ffa502; color: black; border-color: #ffa502; }

        .student-list {
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            margin-top: 0.5rem;
        }
        .student-item {
            display: flex;
            align-items: center;
            padding: 0.6rem;
            border-bottom: 1px solid #111;
            font-size: 0.9rem;
        }
        .student-item:last-child { border-bottom: none; }
        .student-item input { margin-right: 0.8rem; accent-color: var(--accent); transform: scale(1.2); }

        .lesson-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 0.5rem;
            max-height: 300px;
            overflow-y: auto;
            padding: 0.5rem;
            border: 1px solid var(--border);
            border-radius: var(--radius);
        }
        .lesson-check {
            display: flex;
            align-items: center;
            font-size: 0.8rem;
            background: #111;
            padding: 0.4rem;
            border-radius: 2px;
            cursor: pointer;
            border: 1px solid transparent;
        }
        .lesson-check:hover { border-color: #333; }
        .lesson-check input { margin-right: 0.5rem; accent-color: var(--accent); }

        .save-btn {
            width: 100%;
            padding: 1rem;
            background: var(--accent);
            color: #000;
            border: none;
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: var(--radius);
            margin-top: 1rem;
            font-size: 1rem;
        }

        /* Loading & Error */
        .loading-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-color);
            z-index: 2000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .spinner {
            width: 40px; height: 40px;
            border: 3px solid rgba(0, 243, 255, 0.3);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 1rem;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Tabs Calculator */
        .tabs { display: flex; border-bottom: 1px solid var(--border); margin-bottom: 1.5rem; }
        .tab {
            flex: 1;
            padding: 1rem;
            text-align: center;
            background: transparent;
            border: none;
            color: var(--text-sec);
            cursor: pointer;
            font-weight: 600;
            border-bottom: 2px solid transparent;
            transition: all 0.3s;
        }
        .tab.active {
            color: var(--accent);
            border-bottom-color: var(--accent);
            background: rgba(0, 243, 255, 0.05);
        }
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.3s; }

        .stat-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        .stat-card {
            background: #111;
            padding: 1rem;
            border-radius: var(--radius);
            text-align: center;
            border: 1px solid var(--border);
        }
        .stat-val { font-size: 1.5rem; font-weight: 700; color: var(--text-main); display: block; }
        .stat-label { font-size: 0.8rem; color: var(--text-sec); text-transform: uppercase; }

        /* Presence View */
        .presence-view { display: none; }
        .presence-view.active { display: block; }
        .month-selector {
            width: 100%;
            padding: 0.8rem;
            background: #111;
            border: 1px solid var(--border);
            color: var(--text-main);
            border-radius: var(--radius);
            margin-bottom: 1rem;
            font-size: 1rem;
        }
        .presence-table-wrapper { overflow-x: auto; }
        .presence-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
            min-width: 600px;
        }
        .presence-table th, .presence-table td {
            padding: 0.6rem;
            border: 1px solid #222;
            text-align: center;
        }
        .presence-table th { background: #111; color: var(--accent); font-weight: 600; }
        .presence-table td:first-child { text-align: left; font-weight: 600; color: var(--text-main); background: #0a0a0a; position: sticky; left: 0; }
        .p-mark { width: 20px; height: 20px; display: inline-block; border-radius: 50%; }
        .p-present { background: var(--accent); box-shadow: 0 0 5px var(--accent); }
        .p-absent { background: #ff4757; }
        .p-cancel { background: #ffa502; }

    </style>
</head>
<body>

<header>
    <h1>School Schedule</h1>
    <p>Select your profile</p>
</header>

<div class="container">
    
    <!-- Loading Screen -->
    <div id="loading-screen" class="loading-screen">
        <div class="spinner"></div>
        <p>Loading Data...</p>
    </div>

    <!-- Main Selection Screen -->
    <div id="selection-screen" class="screen">
        <div class="teachers-grid" id="teachers-grid"></div>
        
        <div class="presence-btn-container">
            <button class="btn-neon" onclick="openPresenceView()">📋 Class Attendance List</button>
        </div>
    </div>

    <!-- Teacher Profile Screen -->
    <div id="teacher-screen" class="screen">
        <div class="prof-header">
            <div class="prof-title-row">
                <button class="back-btn" onclick="showSelection()">← Back</button>
                <h2 id="prof-name-display" style="color:var(--accent); text-transform:uppercase;"></h2>
            </div>
            
            <div class="week-nav">
                <button class="nav-btn" id="prev-week-btn" onclick="changeWeek(-1)">‹</button>
                <span class="week-label" id="current-week-label">Loading...</span>
                <button class="nav-btn" id="next-week-btn" onclick="changeWeek(1)">›</button>
            </div>
        </div>

        <div class="tabs">
            <button class="tab active" onclick="switchTab('schedule')">Schedule</button>
            <button class="tab" onclick="switchTab('calculator')">Class Calculator</button>
        </div>

        <div id="tab-schedule" class="tab-content active">
            <div id="schedule-content" class="days-container"></div>
        </div>

        <div id="tab-calculator" class="tab-content">
            <div class="form-group">
                <label class="form-label">Select Month</label>
                <select id="calc-month" class="month-selector" onchange="updateCalculator()"></select>
            </div>
            <div class="stat-grid">
                <div class="stat-card">
                    <span class="stat-val" id="stat-school-done" style="color:var(--accent)">0</span>
                    <span class="stat-label">School Done</span>
                </div>
                <div class="stat-card">
                    <span class="stat-val" id="stat-in-company-done" style="color:#00ff9d">0</span>
                    <span class="stat-label">In Company Done</span>
                </div>
                <div class="stat-card">
                    <span class="stat-val" id="stat-school-noshow" style="color:#ff4757">0</span>
                    <span class="stat-label">School No Show</span>
                </div>
                <div class="stat-card">
                    <span class="stat-val" id="stat-in-company-noshow" style="color:#ffa502">0</span>
                    <span class="stat-label">In Co. No Show</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Presence View Screen -->
    <div id="presence-screen" class="screen presence-view">
        <div class="prof-header">
            <button class="back-btn" onclick="closePresenceView()">← Back to Teachers</button>
            <h2 style="color:var(--accent)">Attendance Control</h2>
        </div>
        
        <div class="form-group">
            <label class="form-label">Select Class (Group)</label>
            <select id="presence-group-select" class="month-selector" onchange="renderPresenceTable()"></select>
        </div>
        <div class="form-group">
            <label class="form-label">Select Month</label>
            <select id="presence-month-select" class="month-selector" onchange="renderPresenceTable()"></select>
        </div>

        <div class="presence-table-wrapper">
            <table class="presence-table" id="presence-table">
                <!-- Generated via JS -->
            </table>
        </div>
    </div>

</div>

<!-- RAD Modal -->
<div id="rad-modal" class="modal-overlay">
    <div class="modal-content">
        <div class="modal-header">
            <div class="modal-title">RAD - Class Record</div>
            <button class="close-modal" onclick="closeRadModal()">×</button>
        </div>
        
        <input type="hidden" id="rad-class-id">
        
        <div class="form-group">
            <label class="form-label">Class Status</label>
            <div class="status-options">
                <button class="status-btn active" data-val="Realizada" onclick="setRadStatus('Realizada')">Done</button>
                <button class="status-btn" data-val="No Show" onclick="setRadStatus('No Show')">No Show</button>
                <button class="status-btn" data-val="Cancelada" onclick="setRadStatus('Cancelada')">Canceled</button>
            </div>
        </div>

        <div class="form-group">
            <label class="form-label">Lesson Plan (Check performed items)</label>
            <div id="lesson-plan-container" class="lesson-grid"></div>
        </div>

        <div class="form-group">
            <label class="form-label">Attendance List</label>
            <div id="attendance-list" class="student-list"></div>
        </div>

        <button class="save-btn" onclick="saveRad()">Save Record</button>
    </div>
</div>

<script>
    // --- CONFIGURATION ---
    const SCHEDULE_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQmSAl1ndXXSgDWbrjCiSDkmtECkP94Rr2nk-kIHV-zHd4NFSE9CzyQb6YP2Rt4lEQNYOpuvgjCYDal/pub?output=csv';
    const STUDENTS_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSlWLLO76YOXic0n11ttKL-UKoNGTT3VKEogt3pvHONM4Hnb3upvgYj_h8DOC57xmAobUXSIznc7V6x/pub?output=csv';
    
    // Teachers Config
    const TEACHERS = [
        { name: 'MYCAEL', color: '#FF6B6B' },
        { name: 'CARLA', color: '#FF9F43' },
        { name: 'HOPE', color: '#FFE66D' },
        { name: 'PEDRO', color: '#F38181' },
        { name: 'DIOGO', color: '#AA96DA' },
        { name: 'LIVIA', color: '#FCBAD3' },
        { name: 'TOSCA', color: '#A8D8EA' },
        { name: 'IAGO', color: '#FF9F43' },
        { name: 'SARA', color: '#54a0ff' },
        { name: 'CAROL', color: '#5f27cd' },
        { name: 'LUISA', color: '#00d2d3' },
        { name: 'TA', color: '#c8d6e5' } // Kept just in case, but filtered later if needed
    ];

    // Lesson Plans Structure
    const LESSON_PLANS = {
        '1': Array.from({length: 42}, (_, i) => i < 41 ? `Lesson ${i+1}` : 'Test Book 1'), // Simplified for demo, full list below
        '2': Array.from({length: 46}, (_, i) => `Lesson/Test ${i+1}`),
        '3': Array.from({length: 46}, (_, i) => `Lesson/Test ${i+1}`),
        '4': Array.from({length: 46}, (_, i) => `Lesson/Test ${i+1}`),
        '5': Array.from({length: 46}, (_, i) => `Lesson/Test ${i+1}`),
        '6': Array.from({length: 46}, (_, i) => `Lesson/Test ${i+1}`),
        '7': Array.from({length: 46}, (_, i) => `Lesson/Test ${i+1}`),
        '8': Array.from({length: 46}, (_, i) => `Lesson/Test ${i+1}`),
        '9': Array.from({length: 46}, (_, i) => `Lesson/Test ${i+1}`),
        '10': Array.from({length: 46}, (_, i) => `Lesson/Test ${i+1}`)
    };
    
    // Detailed Lists for Books 1-10 (Abbreviated for code length, logic handles dynamic generation)
    const generateLessons = (bookNum) => {
        const lessons = [];
        const total = bookNum === 1 ? 42 : 46;
        for(let i=1; i<=total; i++) {
            if(i % 6 === 0 && i < total) lessons.push(`Revision ${i-5}-${i} / Reading`);
            else if (i === total) lessons.push(`Test Book ${bookNum}`);
            else if (i === total-1 && bookNum > 1) lessons.push(`Test Correction Book ${bookNum}`);

    function parseCSV(text) {
        const lines = text.split('\n').map(l => l.trim()).filter(l => l);
        if(lines.length < 2) return [];
        // Simple CSV parser handling quotes roughly
        return lines.slice(1).map(line => {
            const result = [];
            let start = 0;
            let inQuotes = false;
            for(let i=0; i<line.length; i++) {
                if(line[i] === '"') inQuotes = !inQuotes;
                if(line[i] === ',' && !inQuotes) {
                    result.push(line.substring(start, i).replace(/"/g, '').trim());
                    start = i+1;
                }
            }
            result.push(line.substring(start).replace(/"/g, '').trim());
            return result;
        });
    }

    // Re-implementing CSV fetch to get Headers for Week Detection
    async function processWeeks() {
        const res = await fetch(SCHEDULE_URL);
        const text = await res.text();
        const lines = text.split('\n').map(l => l.trim()).filter(l => l);
        const headers = lines[0].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(h => h.replace(/"/g,'').trim());
        
        // Identify Day Columns (Index >= 6 usually)
        // Format expected: "Mon 25", "Tue 26" or just "Monday", "Tuesday"
        // We need to group them into Weeks.
        // Logic: Iterate cols from 6. If col name contains "Mon", it's a new week start.
        
        let currentWeekDays = [];
        let tempWeeks = [];
        let weekCounter = 0;

        for(let i=6; i<headers.length; i++) {
            const h = headers[i];
            if(!h) continue;
            
            const isMonday = h.toLowerCase().includes('mon');
            if(isMonday && currentWeekDays.length > 0) {
                // New week started
                tempWeeks.push({
                    id: weekCounter++,
                    name: `Week ${weekCounter}`, // Default name
                    days: [...currentWeekDays]
                });
                currentWeekDays = [];
            }
            
            // Try to extract a nicer name if possible, otherwise use generic
            // User wants "This Week", "Next Week". Since CSV doesn't give tab names, 
            // we will name them sequentially unless we find a pattern.
            // BUT, if the user put "This Week" IN THE HEADER CELL? Unlikely for merged cells in CSV.
            // Let's assume sequential and allow renaming in UI or just call them Week 1, Week 2.
            // WAIT: User said "nomeei as páginas... This Week e Next Week". 
            // If they publish the ENTIRE workbook, Google Sheets might duplicate headers? No.
            // Usually you publish ONE sheet. 
            // COMPROMISE: We will detect columns. If we find > 5 days, we split.
            // We will name them "Week 1", "Week 2". 
            // THEN, we check if there is a specific marker in the data? No.
            // Let's just name them "Week 1", "Week 2" and maybe the user can see the dates.
            // OR, better: The first week is "This Week", second is "Next Week".
            
            currentWeekDays.push({ colIndex: i, header: h });
        }
        if(currentWeekDays.length > 0) {
            tempWeeks.push({ id: weekCounter, name: `Week ${weekCounter+1}`, days: currentWeekDays });
        }

        // Rename based on count
        if(tempWeeks.length === 1) tempWeeks[0].name = "This Week";
        if(tempWeeks.length === 2) { tempWeeks[0].name = "This Week"; tempWeeks[1].name = "Next Week"; }
        if(tempWeeks.length > 2) {
            tempWeeks[0].name = "This Week";
            tempWeeks[1].name = "Next Week";
            // others keep numeric
        }

        weeks = tempWeeks;
        
        // Now populate scheduleData structure properly linked to weeks
        // Clear previous
        scheduleData = []; 
        
        for(let r=1; r<lines.length; r++) {
            const row = lines[r].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(c => c.replace(/"/g,'').trim());
            if(row.length < 6) continue;

            const lang = row[0];
            const book = row[1];
            const group = row[2];
            const room = row[3];
            const mod = row[4];
            const time = row[5];

            weeks.forEach(week => {
                week.days.forEach(d => {
                    const cell = row[d.colIndex];
                    if(cell && cell.trim() !== '') {
                        // Parse cell: "Group - Teacher - Room - Mod" ?? 
                        // Wait, the CSV structure described: 
                        // A=Lang, B=Book, C=Group, D=Room, E=Mod, F=Time.
                        // Then G,H,I... contain TEACHER NAMES?
                        // User said: "G Monday...". And earlier "F Horário".
                        // And "o teacher deve marcar...".
                        // Usually in these sheets, the cell content is "Teacher Name" or "Teacher - Details".
                        // Let's assume cell contains TEACHER NAME primarily.
                        
                        const teacherName = findTeacher(cell);
                        if(teacherName) {
                            scheduleData.push({
                                weekId: week.id,
                                dayHeader: d.header,
                                lang, book, group, room, mod, time,
                                teacher: teacherName,
                                rawCell: cell
                            });
                        }
                    }
                });
            });
        }
    }

    function findTeacher(str) {
        if(!str) return null;
        const upper = str.toUpperCase();
        // Remove noise

        for(let t of TEACHERS) {
            if(clean.includes(t.name)) return t.name;
        }
        return null;
    }

            const originalClass = scheduleData.find(d => d.weekId === wId && d.group === grp && d.teacher === currentTeacher.name);
            
            let isInCompany = false;
            if(originalClass) {

            }

            if(data.status === 'Realizada') {

            } else if (data.status === 'No Show') {

                else schoolNo++;
