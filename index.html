<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cronograma Semanal</title>
    <style>
        :root {
            --bg-color: #050505;
            --card-bg: #0a0a0a;
            --text-main: #ffffff;
            --text-sec: #a0a0a0;
            --neon-blue: #00f3ff;
            --neon-dim: rgba(0, 243, 255, 0.1);
            --border-color: #333;
            --danger: #ff2a2a;
            --success: #00ff9d;
            --warning: #ffcc00;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            overflow-x: hidden;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .hidden { display: none !important; }
        .flex { display: flex; }
        .grid { display: grid; }
        .center { align-items: center; justify-content: center; }
        .between { justify-content: space-between; }

        header {
            text-align: center;
            padding: 30px 0;
            border-bottom: 2px solid var(--neon-blue);
            margin-bottom: 30px;
            background: linear-gradient(180deg, rgba(0,243,255,0.05) 0%, transparent 100%);
        }

        h1 {
            font-size: 2rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: var(--neon-blue);
            text-shadow: 0 0 10px var(--neon-blue);
            margin-bottom: 10px;
        }

        h2, h3 { text-transform: uppercase; letter-spacing: 2px; }

        button {
            background: transparent;
            border: 1px solid var(--neon-blue);
            color: var(--neon-blue);
            padding: 12px 24px;
            font-size: 1rem;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
            border-radius: 0;
            margin: 5px;
        }

        button:hover {
            background: var(--neon-blue);
            color: #000;
            box-shadow: 0 0 15px var(--neon-blue);
        }

        button.active {
            background: var(--neon-blue);
            color: #000;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .teachers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            justify-items: center;
            margin-top: 20px;
        }

        .teacher-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 15px;
            width: 100%;
            max-width: 200px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            border-radius: 0;
            position: relative;
            overflow: hidden;
        }

        .teacher-card:hover {
            border-color: var(--neon-blue);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 243, 255, 0.2);
        }

        .teacher-name {
            font-size: 1.1rem;
            font-weight: bold;
            color: #fff;
            text-transform: uppercase;
        }

        .teacher-class-info {
            font-size: 0.7rem;
            color: var(--text-sec);
            margin-top: 5px;
            padding-top: 5px;
            border-top: 1px dashed #333;
            line-height: 1.4;
        }

        .teacher-class-info .highlight {
            color: var(--neon-blue);
        }

        .schedule-header {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
        }

        .week-selector {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .day-section {
            margin-bottom: 40px;
            border: 1px solid var(--border-color);
            border-radius: 0;
            overflow: hidden;
        }

        .day-header {
            background: rgba(0, 243, 255, 0.1);
            color: var(--neon-blue);
            padding: 15px;
            font-weight: bold;
            text-transform: uppercase;
            border-bottom: 1px solid var(--neon-blue);
            font-size: 1.2rem;
        }

        .classes-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 15px;
            padding: 15px;
        }

        .class-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 15px;
            border-radius: 0;
            position: relative;
            transition: 0.3s;
        }

        .class-card:hover {
            border-color: var(--neon-blue);
        }

        .class-time {
            font-size: 1.2rem;
            color: var(--neon-blue);
            font-weight: bold;
            margin-bottom: 10px;
            display: block;
            border-bottom: 1px dashed #333;
            padding-bottom: 5px;
        }

        .class-info {
            font-size: 0.9rem;
            color: #ccc;
            margin-bottom: 5px;
        }

        .badge {
            display: inline-block;
            padding: 2px 6px;
            border: 1px solid #555;
            font-size: 0.75rem;
            margin-right: 5px;
            margin-bottom: 5px;
            color: #fff;
            border-radius: 0;
        }

        .badge-book { border-color: var(--warning); color: var(--warning); }
        .badge-room { border-color: var(--success); color: var(--success); }
        .badge-modal { border-color: var(--neon-blue); color: var(--neon-blue); }

        .action-btn {
            width: 100%;
            margin-top: 10px;
            padding: 8px;
            font-size: 0.8rem;
            border: 1px solid #444;
            color: #aaa;
        }
        
        .action-btn:hover {
            border-color: var(--neon-blue);
            color: var(--neon-blue);
            background: transparent;
            box-shadow: none;
        }

        .status-indicator {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 10px;
            height: 10px;
            border-radius: 0;
        }
        .status-done { background: var(--success); box-shadow: 0 0 5px var(--success); }
        .status-noshow { background: var(--danger); box-shadow: 0 0 5px var(--danger); }
        .status-cancel { background: var(--warning); box-shadow: 0 0 5px var(--warning); }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
        }

        .modal-content {
            background: #000;
            border: 2px solid var(--neon-blue);
            padding: 20px;
            width: 90%;
            max-width: 800px;
            max-height: 90vh;
            overflow-y: auto;
            border-radius: 0;
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.2);
        }

        .modal-content.small {
            max-width: 500px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }

        .close-modal {
            background: none;
            border: none;
            color: #fff;
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0;
            margin: 0;
            box-shadow: none;
        }

        input, select, textarea {
            width: 100%;
            background: #111;
            border: 1px solid #333;
            color: #fff;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 0;
            font-family: inherit;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--neon-blue);
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
            background: #111;
            padding: 8px;
            border: 1px solid #222;
            cursor: pointer;
            transition: 0.2s;
        }

        .checkbox-group:hover {
            border-color: var(--neon-blue);
        }

        .checkbox-group input {
            width: auto;
            margin-right: 10px;
            margin-bottom: 0;
            cursor: pointer;
        }

        .checkbox-group label {
            flex: 1;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .checkbox-group.done {
            border-color: var(--success);
            background: rgba(0, 255, 157, 0.05);
        }

        .checkbox-group.done label {
            color: var(--success);
        }

        .checkbox-group.done::after {
            content: " ✓";
            color: var(--success);
            font-weight: bold;
        }

        .checkbox-group.disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .checkbox-group.disabled input {
            cursor: not-allowed;
        }

        .checkbox-group.disabled label {
            cursor: not-allowed;
        }

        .attendance-checkbox {
            display: flex;
            align-items: center;
            margin-bottom: 6px;
            background: #111;
            padding: 6px 8px;
            border: 1px solid #222;
        }

        .attendance-checkbox input {
            width: auto;
            margin-right: 10px;
            margin-bottom: 0;
        }

        .attendance-checkbox label {
            flex: 1;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .attendance-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            font-size: 0.8rem;
        }

        .attendance-table th, .attendance-table td {
            border: 1px solid #333;
            padding: 8px;
            text-align: center;
        }

        .attendance-table th {
            background: #111;
            color: var(--neon-blue);
        }

        .att-present { color: var(--success); font-weight: bold; }
        .att-absent { color: var(--danger); font-weight: bold; }

        #loading-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            z-index: 2000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .loader {
            width: 50px;
            height: 50px;
            border: 3px solid #333;
            border-top: 3px solid var(--neon-blue);
            border-radius: 0;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .error-message {
            color: var(--danger);
            font-size: 0.85rem;
            padding: 8px;
            border: 1px solid var(--danger);
            margin-bottom: 10px;
            background: rgba(255, 42, 42, 0.1);
            display: none;
        }
        .error-message.show { display: block; }

        .progress-bar {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            margin: 5px 0;
            padding-top: 5px;
            border-top: 1px dashed #333;
        }

        .progress-dot {
            width: 18px;
            height: 18px;
            border: 1px solid #444;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 0.5rem;
            color: #666;
            border-radius: 0;
            transition: 0.2s;
        }

        .progress-dot.done {
            border-color: var(--success);
            background: rgba(0, 255, 157, 0.15);
            color: var(--success);
        }

        .progress-dot.current {
            border-color: var(--neon-blue);
            background: rgba(0, 243, 255, 0.15);
            color: var(--neon-blue);
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.3);
        }

        .progress-label {
            font-size: 0.7rem;
            color: var(--text-sec);
            margin-top: 3px;
        }

        .selected-count {
            font-size: 0.8rem;
            color: var(--neon-blue);
            margin-bottom: 10px;
            padding: 5px;
            border: 1px dashed var(--neon-blue);
            text-align: center;
        }

        .select-all-btn {
            padding: 5px 10px;
            font-size: 0.7rem;
            margin: 5px 0 10px 0;
            border-color: var(--text-sec);
            color: var(--text-sec);
        }

        .select-all-btn:hover {
            border-color: var(--neon-blue);
            color: var(--neon-blue);
        }

        /* Estilos para a lista de turmas (Lesson Plans) */
        .class-group-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 15px;
            margin-bottom: 15px;
            transition: 0.3s;
        }

        .class-group-card:hover {
            border-color: var(--neon-blue);
        }

        .class-group-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 10px;
        }

        .class-group-name {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--neon-blue);
            text-transform: uppercase;
        }

        .class-group-book {
            font-size: 0.9rem;
            color: var(--warning);
            border: 1px solid var(--warning);
            padding: 2px 10px;
        }

        .class-group-progress {
            font-size: 0.8rem;
            color: var(--text-sec);
        }

        .class-group-lessons {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px dashed #333;
        }

        .lesson-tag {
            padding: 2px 8px;
            border: 1px solid #444;
            font-size: 0.7rem;
            color: #666;
            transition: 0.2s;
        }

        .lesson-tag.done {
            border-color: var(--success);
            color: var(--success);
            background: rgba(0, 255, 157, 0.05);
        }

        .lesson-tag.current {
            border-color: var(--neon-blue);
            color: var(--neon-blue);
            background: rgba(0, 243, 255, 0.05);
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.2);
        }

        .lesson-tag.pending {
            border-color: #333;
            color: #555;
        }

        .header-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        @media (max-width: 600px) {
            .teachers-grid { grid-template-columns: repeat(2, 1fr); }
            .classes-list { grid-template-columns: 1fr; }
            h1 { font-size: 1.5rem; }
            .modal-content { width: 95%; padding: 15px; }
            .progress-dot { width: 14px; height: 14px; font-size: 0.4rem; }
            .class-group-header { flex-direction: column; align-items: flex-start; }
        }
    </style>
</head>
<body>

    <div id="loading-screen">
        <div class="loader"></div>
        <p style="margin-top: 20px; color: var(--neon-blue); text-transform: uppercase;">Carregando Sistema...</p>
    </div>

    <header>
        <h1>Sistema de Gestão</h1>
        <p style="color: var(--text-sec); font-size: 0.9rem;">SELECIONE O PROFESSOR</p>
    </header>

    <div class="container">
        <div id="selection-screen">
            <div class="teachers-grid" id="teachers-grid"></div>
            
            <div class="header-buttons">
                <button onclick="openAttendanceList()">📋 Lista de Presença Geral</button>
                <button onclick="openLessonPlans()">📚 Lesson Plans</button>
            </div>
        </div>

        <div id="schedule-screen" class="hidden">
            <div class="schedule-header">
                <button onclick="showSelection()" style="align-self: flex-start;">← Voltar</button>
                <h2 id="current-teacher-name" style="color: var(--neon-blue); text-align: center;"></h2>
                
                <div class="week-selector" id="week-selector"></div>
            </div>

            <div id="schedule-content"></div>
        </div>
    </div>

    <div id="rad-modal" class="modal-overlay hidden">
        <div class="modal-content small">
            <div class="modal-header">
                <h3>RAD - Registro de Aula</h3>
                <button class="close-modal" onclick="closeModal('rad-modal')">✕</button>
            </div>
            
            <div id="rad-class-info" style="margin-bottom: 15px; color: var(--text-sec); font-size: 0.9rem;"></div>

            <div id="rad-error" class="error-message"></div>

            <label style="color: var(--neon-blue); text-transform: uppercase; font-size: 0.8rem;">Status da Aula:</label>
            <select id="rad-status" onchange="toggleRadFields()">
                <option value="">Selecione...</option>
                <option value="realizada">Realizada</option>
                <option value="noshow">No Show (Aluno não veio)</option>
                <option value="cancelada">Cancelada</option>
            </select>

            <div id="rad-fields" class="hidden">
                <hr style="border: 0; border-top: 1px solid #333; margin: 15px 0;">
                
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                    <label style="color: var(--neon-blue); text-transform: uppercase; font-size: 0.8rem;">Lessons Realizadas:</label>
                    <span id="lesson-counter" class="selected-count">0 lessons selecionadas</span>
                </div>
                
                <button class="select-all-btn" onclick="toggleAllLessons()">SELECIONAR TODAS DISPONÍVEIS</button>
                
                <div id="lesson-plan-container" style="max-height: 250px; overflow-y: auto; margin-bottom: 15px; border: 1px solid #333; padding: 5px;"></div>

                <label style="color: var(--neon-blue); text-transform: uppercase; font-size: 0.8rem;">Lista de Presença:</label>
                <div id="attendance-container" style="max-height: 200px; overflow-y: auto; margin-bottom: 15px;"></div>

                <button onclick="saveRad()" style="width: 100%; background: var(--neon-blue); color: #000;">SALVAR RAD</button>
                <button onclick="clearRad()" style="width: 100%; border-color: var(--danger); color: var(--danger); margin-top: 5px;">LIMPAR DADOS</button>
            </div>
        </div>
    </div>

    <!-- MODAL LESSON PLANS -->
    <div id="lesson-plans-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3>📚 Gerenciamento de Lesson Plans por Turma</h3>
                <button class="close-modal" onclick="closeModal('lesson-plans-modal')">✕</button>
            </div>
            
            <div id="lesson-plans-container">
                <!-- Gerado via JS -->
            </div>
        </div>
    </div>

    <div id="attendance-modal" class="modal-overlay hidden">
        <div class="modal-content" style="max-width: 800px;">
            <div class="modal-header">
                <h3>Controle de Presença por Turma</h3>
                <button class="close-modal" onclick="closeModal('attendance-modal')">✕</button>
            </div>
            
            <div class="flex between" style="gap: 10px; flex-wrap: wrap;">
                <select id="att-group-select" onchange="loadAttendanceTable()">
                    <option value="">Selecione a Turma...</option>
                </select>
                <input type="month" id="att-month-select" onchange="loadAttendanceTable()" style="width: auto;">
            </div>

            <div id="attendance-table-container" style="overflow-x: auto; margin-top: 20px;"></div>
        </div>
    </div>

<script>
    const SCHEDULE_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQmSAl1ndXXSgDWbrjCiSDkmtECkP94Rr2nk-kIHV-zHd4NFSE9CzyQb6YP2Rt4lEQNYOpuvgjCYDal/pub?output=csv';
    const STUDENTS_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSlWLLO76YOXic0n11ttKL-UKoNGTT3VKEogt3pvHONM4Hnb3upvgYj_h8DOC57xmAobUXSIznc7V6x/pub?output=csv';

    const VALID_TEACHERS = [
        { name: 'MYCAEL', color: '#FF6B6B' },
        { name: 'HOPE', color: '#FFE66D' },
        { name: 'PEDRO', color: '#F38181' },
        { name: 'DIOGO', color: '#AA96DA' },
        { name: 'LIVIA', color: '#FCBAD3' },
        { name: 'TOSCA', color: '#A8D8EA' },
        { name: 'IAGO', color: '#FF9F43' },
        { name: 'SARA', color: '#54a0ff' },
        { name: 'CAROL', color: '#5f27cd' },
        { name: 'CARLA', color: '#00ff9d' },
        { name: 'LUISA', color: '#ff0055' }
    ];

    const BOOKS_STRUCTURE = {
        'G1': generateLessons(1, 42),
        'G2': generateLessons(2, 46),
        'G3': generateLessons(3, 46),
        'G4': generateLessons(4, 46),
        'G5': generateLessons(5, 46),
        'G6': generateLessons(6, 46),
        'G7': generateLessons(7, 46),
        'G8': generateLessons(8, 46),
        'G9': generateLessons(9, 46),
        'AW': generateLessons(10, 46),
        'DEFAULT': generateLessons(0, 46)
    };

    function generateLessons(bookNum, total) {
        let lessons = [];
        for(let i=1; i<=total; i++) {
            let label = `Lesson ${i}`;
            if(i % 5 === 0 && i < total) label = `Revision ${i-4}-${i} / Reading`;
            if(i === total) label = `Test Book ${bookNum || '?'}`;
            lessons.push({ id: `b${bookNum}_l${i}`, label: label, number: i });
        }
        return lessons;
    }

    let scheduleData = [];
    let studentsData = {};
    let currentTeacher = null;
    let currentWeekData = [];
    let allWeeks = {};
    let allGroups = new Set();

    document.addEventListener('DOMContentLoaded', () => {
        Promise.all([fetchSchedule(), fetchStudents()])
            .then(() => {
                document.getElementById('loading-screen').classList.add('hidden');
                renderTeachers();
                populateGroupSelect();
                const now = new Date();
                document.getElementById('att-month-select').value = now.toISOString().slice(0, 7);
            })
            .catch(err => {
                console.error(err);
                document.getElementById('loading-screen').innerHTML = '<p style="color:red">Erro ao carregar dados. Recarregue a página.</p>';
            });
    });

    async function fetchSchedule() {
        const res = await fetch(SCHEDULE_URL);
        const text = await res.text();
        parseScheduleCSV(text);
    }

    async function fetchStudents() {
        try {
            const res = await fetch(STUDENTS_URL);
            const text = await res.text();
            parseStudentsCSV(text);
        } catch (e) {
            console.warn("Falha ao carregar lista de alunos, operando sem ela.", e);
        }
    }

    function parseScheduleCSV(text) {
        const lines = text.split('\n').map(l => l.trim()).filter(l => l);
        if(lines.length < 2) return;

        const headers = lines[0].split(',').map(h => h.replace(/"/g, '').trim());
        
        const COL_BOOK = 1;
        const COL_GROUP = 2;
        const COL_ROOM = 3;
        const COL_MODAL = 4;
        const COL_TIME = 5;
        const DAYS_START = 6;

        const daysMap = ['Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta'];

        scheduleData = [];

        for(let i=1; i<lines.length; i++) {
            const row = lines[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(c => c.replace(/"/g, '').trim());
            
            const book = row[COL_BOOK] || '';
            const groupRaw = row[COL_GROUP] || '';
            const room = row[COL_ROOM] || '';
            const modal = row[COL_MODAL] || '';
            const time = row[COL_TIME] || '';

            if(!time) continue;

            for(let d=0; d<5; d++) {
                const cellContent = row[DAYS_START + d];
                if(cellContent && cellContent.trim() !== '') {
                    const teacherName = findTeacherInString(cellContent);
                    
                    if(teacherName) {
                        const group = cleanText(groupRaw);
                        const bookClean = cleanText(book);
                        allGroups.add(group);
                        
                        scheduleData.push({
                            book: bookClean,
                            group: group,
                            room: cleanText(room),
                            modal: cleanText(modal),
                            time: cleanText(time),
                            dayIndex: d,
                            dayName: daysMap[d],
                            teacher: teacherName,
                            rawCell: cellContent
                        });
                    }
                }
            }
        }

        allWeeks = {
            'This Week': scheduleData
        };
    }

    function parseStudentsCSV(text) {
        const lines = text.split('\n').map(l => l.trim()).filter(l => l);
        if(lines.length < 2) return;
        
        for(let i=1; i<lines.length; i++) {
            const parts = lines[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
            if(parts.length >= 2) {
                const group = parts[0].replace(/"/g, '').trim();
                const student = parts[1].replace(/"/g, '').trim();
                if(!studentsData[group]) studentsData[group] = [];
                studentsData[group].push(student);
                allGroups.add(group);
            }
        }
    }

    function cleanText(str) {
        return str ? str.replace(/<.*?>/g, '').trim() : '';
    }

    function findTeacherInString(str) {
        const upperStr = str.toUpperCase();
        for(const t of VALID_TEACHERS) {
            if(upperStr.includes(t.name)) return t.name;
        }
        return null;
    }

    function renderTeachers() {
        const grid = document.getElementById('teachers-grid');
        grid.innerHTML = '';
        
        // Para cada professor, descobrir quais turmas ele tem e em qual livro
        VALID_TEACHERS.sort((a,b) => a.name.localeCompare(b.name)).forEach(t => {
            const card = document.createElement('div');
            card.className = 'teacher-card';
            card.style.borderColor = t.color;
            
            // Encontrar aulas deste professor
            const teacherClasses = scheduleData.filter(s => s.teacher === t.name);
            
            // Agrupar por turma para mostrar info
            const classInfo = {};
            teacherClasses.forEach(cls => {
                if(!classInfo[cls.group]) {
                    classInfo[cls.group] = {
                        book: cls.book,
                        days: []
                    };
                }
                if(!classInfo[cls.group].days.includes(cls.dayName)) {
                    classInfo[cls.group].days.push(cls.dayName);
                }
            });
            
            let infoHtml = '';
            const groups = Object.keys(classInfo);
            if(groups.length > 0) {
                infoHtml = '<div class="teacher-class-info">';
                groups.forEach(g => {
                    const info = classInfo[g];
                    // Verificar progresso da turma
                    const progress = getGroupProgress(g, info.book);
                    const structure = getBookStructure(info.book);
                    const doneCount = (progress.lessons || []).length;
                    const totalCount = structure.length;
                    const pct = totalCount > 0 ? Math.round((doneCount / totalCount) * 100) : 0;
                    
                    infoHtml += `<div><span class="highlight">${g}</span> - ${info.book} (${pct}%)</div>`;
                });
                infoHtml += '</div>';
            }
            
            card.innerHTML = `
                <div class="teacher-name" style="color: ${t.color}">${t.name}</div>
                ${infoHtml}
            `;
            card.onclick = () => openTeacherSchedule(t.name, t.color);

    function getProgressKey(group, book) {
        return `progress_${group}_${book}`;
    }

    function getGroupProgress(group, book) {
        const key = getProgressKey(group, book);
        const data = localStorage.getItem(key);
        if(data) {
            try {
                return JSON.parse(data);
            } catch(e) {
                return { lessons: [] };
            }
        }
        return { lessons: [] };
    }

    function getNextLessons(group, book, count = 5) {
        const progress = getGroupProgress(group, book);
        const structure = getBookStructure(book);
        const doneLessons = progress.lessons || [];
        
        const nextLessons = [];
        for(let i = 0; i < structure.length && nextLessons.length < count; i++) {
            if(!doneLessons.includes(structure[i].id)) {
                nextLessons.push(structure[i]);
            }
        }
        return nextLessons;
    }

    function getBookStructure(bookRaw) {
        let structure = BOOKS_STRUCTURE['DEFAULT'];
        const bookClean = (bookRaw || '').toUpperCase();
        
        if(bookClean.includes('G1')) structure = BOOKS_STRUCTURE['G1'];
        else if(bookClean.includes('G2')) structure = BOOKS_STRUCTURE['G2'];
        else if(bookClean.includes('G3')) structure = BOOKS_STRUCTURE['G3'];
        else if(bookClean.includes('G4')) structure = BOOKS_STRUCTURE['G4'];
        else if(bookClean.includes('G5')) structure = BOOKS_STRUCTURE['G5'];
        else if(bookClean.includes('G6')) structure = BOOKS_STRUCTURE['G6'];
        else if(bookClean.includes('G7')) structure = BOOKS_STRUCTURE['G7'];
        else if(bookClean.includes('G8') || bookClean.includes('CROWN')) structure = BOOKS_STRUCTURE['G8'];
        else if(bookClean.includes('G9') || bookClean.includes('SQUID')) structure = BOOKS_STRUCTURE['G9'];
        else if(bookClean.includes('AW') || bookClean.includes('MIB')) structure = BOOKS_STRUCTURE['AW'];
        
        return structure;
    }

    function renderSchedule() {
        const container = document.getElementById('schedule-content');
        container.innerHTML = '';

        if(currentWeekData.length === 0) {
            container.innerHTML = '<p style="text-align:center; color:#555; margin-top:50px;">Nenhuma aula encontrada para esta semana.</p>';
            return;
        }

        const daysOrder = ['Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta'];
        
        daysOrder.forEach(day => {
            const dayClasses = currentWeekData.filter(c => c.dayName === day);
            if(dayClasses.length > 0) {
                const section = document.createElement('div');
                section.className = 'day-section';
                
                const header = document.createElement('div');
                header.className = 'day-header';
                header.textContent = day;
                section.appendChild(header);

                const list = document.createElement('div');
                list.className = 'classes-list';

                dayClasses.forEach(cls => {
                    const card = document.createElement('div');
                    card.className = 'class-card';
                    
                    const radKey = getRadKey(cls);
                    const savedRad = localStorage.getItem(radKey);
                    const status = savedRad ? JSON.parse(savedRad).status : null;

                    let statusBadge = '';
                    if(status === 'realizada') statusBadge = '<div class="status-indicator status-done" title="Realizada"></div>';
                    if(status === 'noshow') statusBadge = '<div class="status-indicator status-noshow" title="No Show"></div>';
                    if(status === 'cancelada') statusBadge = '<div class="status-indicator status-cancel" title="Cancelada"></div>';

                    // Progresso da turma (global)
                    const progress = getGroupProgress(cls.group, cls.book);
                    const structure = getBookStructure(cls.book);
                    const doneLessons = progress.lessons || [];
                    const nextLessons = getNextLessons(cls.group, cls.book, 5);
                    
                    // Renderizar dots de progresso (mostrar até 15)
                    let progressHtml = '<div class="progress-bar">';
                    const maxShow = Math.min(structure.length, 15);
                    for(let i = 0; i < maxShow; i++) {
                        const lesson = structure[i];
                        const isDone = doneLessons.includes(lesson.id);
                        const isNext = nextLessons.some(l => l.id === lesson.id);
                        let clsDot = 'progress-dot';
                        if(isDone) clsDot += ' done';
                        else if(isNext) clsDot += ' current';
                        
                        const num = i + 1;
                        progressHtml += `<span class="${clsDot}" title="${lesson.label}">${num}</span>`;
                    }
                    if(structure.length > 15) {
                        progressHtml += `<span class="progress-dot" style="border-color:#666;">+${structure.length - 15}</span>`;
                    }
                    progressHtml += '</div>';
                    
                    let nextLabel = '';
                    if(doneLessons.length >= structure.length) {
                        nextLabel = '✅ Curso Concluído!';
                    } else if(nextLessons.length > 0) {
                        const labels = nextLessons.map(l => l.label).join(', ');
                        nextLabel = `Próximas: ${labels}`;
                        if(nextLessons.length > 3) {
                            nextLabel = `Próximas: ${nextLessons[0].label}... (+${nextLessons.length - 1} mais)`;
                        }
                    } else {
                        nextLabel = '📚 Aguardando início';
                    }

                    // Mostrar quantas lessons já foram feitas
                    const doneCount = doneLessons.length;
                    const totalCount = structure.length;
                    const progressText = `${doneCount}/${totalCount} lessons`;

                    // Se já foi realizada, mostrar check
                    const doneCheck = status === 'realizada' ? ' ✅' : '';

                    card.innerHTML = `
                        ${statusBadge}
                        <span class="class-time">${cls.time}${doneCheck}</span>
                        <div class="class-info"><strong>Turma:</strong> ${cls.group}</div>
                        <div class="class-info">
                            <span class="badge badge-book">${cls.book || 'N/A'}</span>
                            <span class="badge badge-room">Sala: ${cls.room || '-'}</span>
                            <span class="badge badge-modal">${cls.modal || 'REGULAR'}</span>
                            <span class="badge" style="border-color: var(--neon-blue); color: var(--neon-blue);">${progressText}</span>
                        </div>
                        ${progressHtml}
                        <div class="progress-label">${nextLabel}</div>
                        <button class="action-btn" onclick="openRad('${cls.time}', '${cls.group}', '${cls.book}', '${cls.room}', '${cls.dayName}')">
                            ${status === 'realizada' ? '📝 EDITAR RAD' : 'ABRIR RAD'}
                        </button>
                    `;
                    list.appendChild(card);
                });

                section.appendChild(list);
                container.appendChild(section);
            }
        });
    }

    // ===================== LESSON PLANS (GERENCIAMENTO DE TURMAS) =====================
    function openLessonPlans() {
        document.getElementById('lesson-plans-modal').classList.remove('hidden');
        renderLessonPlans();
    }

    function renderLessonPlans() {
        const container = document.getElementById('lesson-plans-container');
        container.innerHTML = '';
        
        // Pegar todas as turmas únicas do cronograma
        const groups = Array.from(allGroups).sort();
        
        if(groups.length === 0) {
            container.innerHTML = '<p style="color:#555; text-align:center;">Nenhuma turma encontrada.</p>';
            return;
        }

        groups.forEach(group => {
            // Encontrar o livro desta turma
            const classData = scheduleData.find(s => s.group === group);
            if(!classData) return;
            
            const book = classData.book || 'DEFAULT';
            const structure = getBookStructure(book);
            const progress = getGroupProgress(group, book);
            const doneLessons = progress.lessons || [];
            
            const card = document.createElement('div');
            card.className = 'class-group-card';
            
            // Contar lessons feitas
            const doneCount = doneLessons.length;
            const totalCount = structure.length;
            const pct = totalCount > 0 ? Math.round((doneCount / totalCount) * 100) : 0;
            
            // Encontrar próximas lessons (até 5)
            const nextLessons = [];
            for(let i = 0; i < structure.length && nextLessons.length < 5; i++) {
                if(!doneLessons.includes(structure[i].id)) {
                    nextLessons.push(structure[i]);
                }
            }
            
            let nextText = '';
            if(doneCount >= totalCount) {
                nextText = '✅ Todas concluídas!';
            } else if(nextLessons.length > 0) {
                nextText = `Próximas: ${nextLessons.map(l => l.label).join(', ')}`;
                if(nextLessons.length > 3) {
                    nextText = `Próximas: ${nextLessons[0].label}... (+${nextLessons.length - 1})`;
                }
            } else {
                nextText = '📚 Aguardando início';
            }
            
            // Montar tags das lessons
            let lessonsHtml = '';
            const maxShow = Math.min(structure.length, 20);
            for(let i = 0; i < maxShow; i++) {
                const lesson = structure[i];
                const isDone = doneLessons.includes(lesson.id);
                const isNext = nextLessons.some(l => l.id === lesson.id);
                let cls = 'lesson-tag';
                if(isDone) cls += ' done';
                else if(isNext) cls += ' current';
                else cls += ' pending';
                
                lessonsHtml += `<span class="${cls}" title="${lesson.label}">${lesson.number}</span>`;
            }
            if(structure.length > 20) {
                lessonsHtml += `<span class="lesson-tag pending">+${structure.length - 20}</span>`;
            }
            
            card.innerHTML = `
                <div class="class-group-header">
                    <div>
                        <span class="class-group-name">${group}</span>
                        <span class="class-group-book">📖 ${book}</span>
                    </div>
                    <div>
                        <span class="class-group-progress">${doneCount}/${totalCount} (${pct}%)</span>
                    </div>
                </div>
                <div style="font-size:0.8rem; color:var(--neon-blue);">
                    ${nextText}
                </div>
                <div class="class-group-lessons">
                    ${lessonsHtml}
                </div>
            `;
            
            container.appendChild(card);
        });
    }

    // ===================== FUNÇÕES DO RAD =====================
    let currentRadClass = null;

    function getRadKey(cls) {
        return `rad_${currentTeacher.name}_${cls.dayName}_${cls.time}_${cls.group}`;
    }

    function openRad(time, group, book, room, day) {
        currentRadClass = { time, group, book, room, day };
        const modal = document.getElementById('rad-modal');
        const infoDiv = document.getElementById('rad-class-info');
        
        infoDiv.innerHTML = `
            <strong>${day} - ${time}</strong><br>
            Turma: ${group} | Book: ${book} | Sala: ${room}
        `;

        document.getElementById('rad-error').classList.remove('show');
        document.getElementById('rad-error').textContent = '';

        document.getElementById('rad-status').value = '';
        document.getElementById('rad-fields').classList.add('hidden');
        
        const saved = localStorage.getItem(getRadKey(currentRadClass));
        if(saved) {
            const data = JSON.parse(saved);
            document.getElementById('rad-status').value = data.status;
            toggleRadFields();
            if(data.status && data.status !== '') {
                renderLessonCheckboxes(book, group, data.selectedLessons || []);
                renderAttendanceCheckboxes(group, data.attendance || []);
            }
        } else {
            // Pré-selecionar próximas lessons baseado no progresso da turma
            const nextLessons = getNextLessons(group, book, 10);
            const nextIds = nextLessons.map(l => l.id);
            renderLessonCheckboxes(book, group, nextIds);
            renderAttendanceCheckboxes(group, []);
        }

        modal.classList.remove('hidden');
    }

    function toggleRadFields() {
        const status = document.getElementById('rad-status').value;
        const fields = document.getElementById('rad-fields');
        if(status) fields.classList.remove('hidden');
        else fields.classList.add('hidden');
    }

    function renderLessonCheckboxes(bookRaw, group, selectedIds) {
        const container = document.getElementById('lesson-plan-container');
        container.innerHTML = '';
        
        const structure = getBookStructure(bookRaw);
        const progress = getGroupProgress(group, bookRaw);
        const doneLessons = progress.lessons || [];

        structure.forEach(lesson => {
            const div = document.createElement('div');
            div.className = 'checkbox-group';
            const isDone = doneLessons.includes(lesson.id);
            const isChecked = selectedIds.includes(lesson.id) ? 'checked' : '';
            
            if(isDone) {
                div.classList.add('done');
            }
            
            div.innerHTML = `
                <input type="checkbox" class="lesson-check" value="${lesson.id}" ${isChecked} ${isDone ? 'disabled' : ''}>
                <label ${isDone ? 'style="color: var(--success);"' : ''}>${lesson.label} ${isDone ? '✓' : ''}</label>
            `;
            container.appendChild(div);
        });

        updateLessonCounter();

        // Se todas as lessons estão feitas, mostrar mensagem
        if(doneLessons.length >= structure.length) {
            const msg = document.createElement('div');
            msg.style.cssText = 'padding: 10px; color: var(--success); border: 1px solid var(--success); text-align: center; margin-top: 10px;';
            msg.textContent = '✅ Todas as lessons deste livro foram concluídas!';
            container.appendChild(msg);
        }
    }

    function updateLessonCounter() {
        const checked = document.querySelectorAll('.lesson-check:checked:not(:disabled)').length;
        document.getElementById('lesson-counter').textContent = `${checked} lessons selecionadas`;
    }

    function toggleAllLessons() {
        const checkboxes = document.querySelectorAll('.lesson-check:not(:disabled)');
        const allChecked = Array.from(checkboxes).every(cb => cb.checked);
        checkboxes.forEach(cb => cb.checked = !allChecked);
        updateLessonCounter();
    }

    function renderAttendanceCheckboxes(groupRaw, presentList) {
        const container = document.getElementById('attendance-container');
        container.innerHTML = '';
        
        let students = [];
        const keys = Object.keys(studentsData);
        const match = keys.find(k => k.toUpperCase() === groupRaw.toUpperCase() || groupRaw.toUpperCase().includes(k.toUpperCase()));
        
        if(match && studentsData[match]) {
            students = studentsData[match];
        } else {
            students = ["Aluno 1", "Aluno 2", "Aluno 3"];
        }

        students.forEach((student) => {
            const div = document.createElement('div');
            div.className = 'attendance-checkbox';
            const isPresent = presentList.includes(student) ? 'checked' : '';
            
            div.innerHTML = `
                <input type="checkbox" class="att-check" value="${student}" ${isPresent}>
                <label>${student}</label>
            `;
            container.appendChild(div);
        });
    }

    function saveRad() {
        const status = document.getElementById('rad-status').value;
        const errorDiv = document.getElementById('rad-error');
        
        // VALIDAÇÃO: Se status for "Realizada", precisa selecionar pelo menos uma lesson
        if(status === 'realizada') {
            const selectedLessons = document.querySelectorAll('.lesson-check:checked:not(:disabled)');
            if(selectedLessons.length === 0) {
                errorDiv.textContent = '⚠️ Para marcar a aula como REALIZADA, você deve selecionar pelo menos uma Lesson!';
                errorDiv.classList.add('show');
                return;
            }
        }

        errorDiv.classList.remove('show');
        errorDiv.textContent = '';

        // Coletar dados
        const selectedLessons = Array.from(document.querySelectorAll('.lesson-check:checked:not(:disabled)')).map(cb => cb.value);
        const selectedLabels = Array.from(document.querySelectorAll('.lesson-check:checked:not(:disabled)')).map(cb => {
            return cb.closest('.checkbox-group').querySelector('label').textContent.replace(' ✓', '');
        });

        const attendanceChecked = Array.from(document.querySelectorAll('.att-check:checked')).map(cb => cb.value);

        // Salvar RAD do professor
        const radKey = getRadKey(currentRadClass);
        const radData = {
            status,
            selectedLessons: selectedLessons,
            selectedLabels: selectedLabels,
            attendance: attendanceChecked,
            dateSaved: new Date().toISOString(),
            teacher: currentTeacher.name
        };
        localStorage.setItem(radKey, JSON.stringify(radData));

        // Se foi realizada, atualizar o progresso global da turma
        if(status === 'realizada' && selectedLessons.length > 0) {
            const progressKey = getProgressKey(currentRadClass.group, currentRadClass.book);
            let progress = getGroupProgress(currentRadClass.group, currentRadClass.book);
            if(!progress.lessons) progress.lessons = [];
            
            let added = 0;
            selectedLessons.forEach(lessonId => {
                if(!progress.lessons.includes(lessonId)) {
                    progress.lessons.push(lessonId);
                    added++;
                }
            });
            
            if(added > 0) {
                progress.lastUpdated = new Date().toISOString();
                progress.lastTeacher = currentTeacher.name;
                localStorage.setItem(progressKey, JSON.stringify(progress));
            }
        }

        closeModal('rad-modal');
        renderSchedule();
        
        alert('✅ RAD Salvo com Sucesso!');
    }

    function clearRad() {
        if(confirm('Tem certeza que deseja limpar todos os dados deste RAD?')) {
            const radKey = getRadKey(currentRadClass);
            const saved = localStorage.getItem(radKey);
            if(saved) {
                const data = JSON.parse(saved);
                if(data.status === 'realizada' && data.selectedLessons && data.selectedLessons.length > 0) {
                    // Remover do progresso da turma
                    const progressKey = getProgressKey(currentRadClass.group, currentRadClass.book);
                    let progress = getGroupProgress(currentRadClass.group, currentRadClass.book);
                    if(progress.lessons) {
                        progress.lessons = progress.lessons.filter(l => !data.selectedLessons.includes(l));
                        localStorage.setItem(progressKey, JSON.stringify(progress));
                    }
                }
            }
            
            localStorage.removeItem(radKey);
            openRad(
                currentRadClass.time, 
                currentRadClass.group, 
                currentRadClass.book, 
                currentRadClass.room, 
                currentRadClass.day
            );
            renderSchedule();
        }
    }

    function loadAttendanceTable() {
        const group = document.getElementById('att-group-select').value;
        const monthVal = document.getElementById('att-month-select').value;
        const container = document.getElementById('attendance-table-container');
        
        if(!group) {
            container.innerHTML = '<p>Selecione uma turma.</p>';
            return;
        }

        const students = studentsData[group] || [];
        if(students.length === 0) {
            container.innerHTML = '<p>Nenhum aluno encontrado para esta turma.</p>';
            return;
        }

        const [year, month] = monthVal.split('-').map(Number);
        const daysInMonth = new Date(year, month, 0).getDate();
        
        let html = '<table class="attendance-table"><thead><tr><th>Aluno</th>';
        for(let d=1; d<=daysInMonth; d++) {
            html += `<th>${d}</th>`;
        }
        html += '</tr></thead><tbody>';

        students.forEach(student => {
            html += `<tr><td style="text-align:left; padding-left:10px;">${student}</td>`;
            for(let d=1; d<=daysInMonth; d++) {
                html += `<td>-</td>`;
            }
            html += '</tr>';
        });

        html += '</tbody></table>';
        html += '<p style="font-size:0.8rem; color:#666; margin-top:10px;">* Visualização estrutural. O controle detalhado por dia é feito no RAD de cada aula.</p>';
        
        container.innerHTML = html;
    }

    }

    // Adicionar listener para atualizar contador quando checkboxes mudarem
    document.addEventListener('change', function(e) {
        if(e.target.classList.contains('lesson-check')) {
            updateLessonCounter();
        }
    });

</script>
</body>
