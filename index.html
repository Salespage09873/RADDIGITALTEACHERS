<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Portal | Pro</title>
    <style>
        :root {
            --bg-dark: #050505;
            --bg-card: #111111;
            --bg-input: #1a1a1a;
            --text-main: #ffffff;
            --text-muted: #888888;
            --accent: #00f2ff; /* Azul Neon Ciano */
            --accent-dim: rgba(0, 242, 255, 0.1);
            --border: #333333;
            --danger: #ff2a2a;
            --success: #00ff9d;
            --warning: #ffcc00;
            --radius: 4px; /* Bordas menos arredondadas */
            --font-main: 'Inter', 'Segoe UI', sans-serif;
            --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-main);
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Scrollbar Personalizada */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-dark); }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: var(--radius); }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

        header {
            background: rgba(5, 5, 5, 0.95);
            border-bottom: 1px solid var(--border);
            padding: 1.5rem 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            text-transform: uppercase;
        }

        header h1 span { color: var(--accent); }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        /* Botões */
        button {
            cursor: pointer;
            border: 1px solid var(--accent);
            background: transparent;
            color: var(--accent);
            padding: 0.8rem 1.5rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: var(--transition);
            border-radius: var(--radius);
            font-size: 0.9rem;
        }

        button:hover {
            background: var(--accent);
            color: var(--bg-dark);
            box-shadow: 0 0 15px var(--accent-dim);
        }

        button.secondary {
            border-color: var(--border);
            color: var(--text-muted);
        }
        button.secondary:hover {
            border-color: var(--text-main);
            color: var(--text-main);
            background: transparent;
            box-shadow: none;
        }

        button.danger {
            border-color: var(--danger);
            color: var(--danger);
        }
        button.danger:hover {
            background: var(--danger);
            color: white;
        }

        /* Telas e Animações */
        .screen {
            display: none;
            animation: fadeIn 0.4s ease-out;
        }
        .screen.active { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Grid de Professores */
        .teachers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-top: 2rem;
        }

        .teacher-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: 2rem;
            text-align: center;
            transition: var(--transition);
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .teacher-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 3px;
            background: var(--accent);
            transform: scaleX(0);
            transition: var(--transition);
            transform-origin: left;
        }

        .teacher-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .teacher-card:hover::before { transform: scaleX(1); }

        .teacher-name {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 0.5rem;
        }

        /* Dashboard Stats */
        .dashboard-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: 1.5rem;
            border-radius: var(--radius);
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--accent);
            display: block;
        }

        .stat-label {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Cronograma */
        .days-container {
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .day-section {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
        }

        .day-header {
            background: #1a1a1a;
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .classes-list {
            padding: 1.5rem;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
        }

        .class-card {
            background: var(--bg-dark);
            border: 1px solid var(--border);
            padding: 1.5rem;
            border-radius: var(--radius);
            position: relative;
            transition: var(--transition);
        }

        .class-card:hover {
            border-color: var(--accent);
        }

        .class-card.status-realizada { border-left: 4px solid var(--success); }
        .class-card.status-cancelada { border-left: 4px solid var(--danger); opacity: 0.7; }
        .class-card.status-noshow { border-left: 4px solid var(--warning); }

        .class-time {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .badges {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .badge {
            padding: 0.3rem 0.6rem;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            border-radius: 2px;
            background: #222;
            color: var(--text-muted);
            border: 1px solid #333;
        }

        .badge-group { color: var(--accent); border-color: var(--accent-dim); }
        .badge-book { color: var(--warning); border-color: rgba(255, 204, 0, 0.2); }
        .badge-room { color: var(--text-main); }
        .badge-modal { background: var(--accent-dim); color: var(--accent); border: none; }

        .class-actions {
            margin-top: 1.5rem;
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .class-actions button {
            flex: 1;
            padding: 0.5rem;
            font-size: 0.8rem;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(5px);
            z-index: 1000;
            display: none;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.open {
            display: flex;
            opacity: 1;
        }

        .modal-content {
            background: var(--bg-card);
            border: 1px solid var(--border);
            width: 90%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
            border-radius: var(--radius);
            padding: 2rem;
            transform: scale(0.95);
            transition: transform 0.3s ease;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .modal-overlay.open .modal-content { transform: scale(1); }

        .modal-header {
            margin-bottom: 1.5rem;
            border-bottom: 1px solid var(--border);
            padding-bottom: 1rem;
        }

        .modal-title { font-size: 1.5rem; color: var(--accent); font-weight: 700; }

        .form-group { margin-bottom: 1.2rem; }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-muted);
            font-size: 0.9rem;
            text-transform: uppercase;
        }

        input, select, textarea {
            width: 100%;
            background: var(--bg-input);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 0.8rem;
            border-radius: var(--radius);
            font-size: 1rem;
            transition: var(--transition);
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 10px var(--accent-dim);
        }

        /* Class Calculator Styles */
        .calc-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-top: 2rem;
        }
        .calc-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: 2rem;
            text-align: center;
            border-radius: var(--radius);
        }
        .calc-number {
            font-size: 3rem;
            font-weight: 700;
            color: var(--text-main);
            margin: 1rem 0;
        }
        .calc-label { color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
        .text-accent { color: var(--accent); }
        .text-danger { color: var(--danger); }
        .text-warning { color: var(--warning); }

        /* Lesson Plan Specific */
        .lp-section {
            background: var(--bg-input);
            padding: 1rem;
            border-radius: var(--radius);
            margin-bottom: 1rem;
            border: 1px solid var(--border);
        }
        .lp-step {
            display: flex;
            gap: 1rem;
            margin-bottom: 0.5rem;
            align-items: center;
        }
        .lp-step input { flex: 1; }
        .lp-step button { flex: 0 0 40px; padding: 0; display: flex; align-items: center; justify-content: center; }

        .status-badge {
            display: inline-block;
            padding: 0.2rem 0.5rem;
            border-radius: 2px;
            font-size: 0.7rem;
            font-weight: bold;
            text-transform: uppercase;
            margin-left: 0.5rem;
        }
        .st-realizada { background: var(--success); color: #000; }
        .st-cancelada { background: var(--danger); color: #fff; }
        .st-noshow { background: var(--warning); color: #000; }

    </style>
</head>
<body>

<header>
    <h1>Teacher<span>Portal</span></h1>
    <button class="secondary" onclick="showSelection()" id="back-btn" style="display:none;">Voltar</button>
</header>

<div class="container">
    
    <!-- Tela de Seleção -->
    <div id="selection-screen" class="screen active">
        <div id="loading" style="text-align:center; padding: 3rem; color: var(--text-muted);">CARREGANDO DADOS...</div>
        <div id="teachers-grid" class="teachers-grid"></div>
        <div id="error-msg" style="color: var(--danger); text-align: center; display: none;"></div>
    </div>

    <!-- Tela do Professor (Dashboard + Cronograma) -->
    <div id="teacher-screen" class="screen">
        
        <!-- Dashboard Stats -->
        <div class="dashboard-stats">
            <div class="stat-card">
                <span class="stat-value" id="stat-total">0</span>
                <span class="stat-label">Aulas Totais (Semana)</span>
            </div>
            <div class="stat-card">
                <span class="stat-value" id="stat-realized" style="color: var(--success)">0</span>
                <span class="stat-label">Realizadas</span>
            </div>
            <div class="stat-card">
                <span class="stat-value" id="stat-noshow" style="color: var(--warning)">0</span>
                <span class="stat-label">No Show</span>
            </div>
            <div class="stat-card">
                <span class="stat-value" id="stat-canceled" style="color: var(--danger)">0</span>
                <span class="stat-label">Canceladas</span>
            </div>
        </div>

        <div style="margin-bottom: 2rem; display: flex; gap: 1rem;">
            <button onclick="scrollToSchedule()">Ver Cronograma</button>
            <button class="secondary" onclick="openClassCalculator()">Class Calculator</button>
        </div>

        <div id="schedule-content" class="days-container">
            <!-- Preenchido via JS -->
        </div>
    </div>

    <!-- Tela Class Calculator -->
    <div id="calculator-screen" class="screen">
        <button class="secondary" onclick="showTeacherView()" style="margin-bottom: 1rem;">← Voltar ao Painel</button>
        <h2 style="color: var(--accent); text-transform: uppercase; margin-bottom: 1rem;">Class Calculator</h2>
        <p style="color: var(--text-muted);">Resumo mensal de aulas realizadas e status.</p>

        <div class="calc-grid">
            <div class="calc-card">
                <div class="calc-label">Escola (Realizadas)</div>
                <div class="calc-number text-accent" id="calc-school-done">0</div>
            </div>
            <div class="calc-card">
                <div class="calc-label">In Company (Realizadas)</div>
                <div class="calc-number text-accent" id="calc-incompany-done">0</div>
            </div>
            <div class="calc-card">
                <div class="calc-label">Escola (No Show)</div>
                <div class="calc-number text-warning" id="calc-school-noshow">0</div>
            </div>
            <div class="calc-card">
                <div class="calc-label">In Company (No Show)</div>
                <div class="calc-number text-warning" id="calc-incompany-noshow">0</div>
            </div>
        </div>
        
        <div style="margin-top: 3rem; text-align: center;">
            <button class="danger" onclick="resetMonthlyData()">Limpar Dados do Mês</button>
        </div>
    </div>

</div>

<!-- MODAL RAD / LESSON PLAN -->
<div class="modal-overlay" id="rad-modal">
    <div class="modal-content">
        <div class="modal-header">
            <div class="modal-title">RAD & Lesson Plan</div>
            <div style="font-size: 0.9rem; color: var(--text-muted); margin-top: 0.5rem;" id="modal-subtitle"></div>
        </div>

        <!-- Status da Aula -->
        <div class="form-group">
            <label>Status da Aula</label>
            <select id="rad-status" onchange="toggleRadFields()">
                <option value="pending">Pendente</option>
                <option value="realizada">Realizada</option>
                <option value="noshow">No Show (Aluno não veio)</option>
                <option value="cancelada">Cancelada</option>
            </select>
        </div>

        <!-- Campos do RAD (Só aparecem se Realizada ou No Show) -->
        <div id="rad-fields" style="display:none;">
            <div class="form-group">
                <label>Book / Módulo</label>
                <input type="text" id="rad-book" placeholder="Ex: G1, G2, AW">
            </div>
            <div class="form-group">
                <label>Lesson / Página</label>
                <input type="text" id="rad-lesson" placeholder="Ex: Unit 3, p. 45">
            </div>
            
            <!-- Lesson Plan Section -->
            <div class="lp-section">
                <label style="color: var(--accent); font-weight: bold; display:block; margin-bottom:0.5rem;">LESSON PLAN</label>
                <div class="form-group">
                    <input type="text" id="lp-objective" placeholder="Objetivo da aula (Ex: Past Perfect)">
                </div>
                <div class="form-group">
                    <label>Materiais</label>
                    <input type="text" id="lp-materials" placeholder="Ex: Whiteboard, Audio track 4">
                </div>
                <div class="form-group">
                    <label>Etapas da Aula</label>
                    <div id="lp-steps-container"></div>
                    <button type="button" class="secondary" onclick="addLpStep()" style="margin-top:0.5rem; width:100%; font-size:0.8rem;">+ Adicionar Etapa</button>
                </div>
            </div>

            <!-- Lista de Presença (Só se Realizada) -->
            <div id="attendance-section">
                <div class="form-group">
                    <label>Lista de Presença</label>
                    <div id="attendance-list" style="max-height: 200px; overflow-y: auto; border: 1px solid var(--border); padding: 0.5rem; background: var(--bg-input);"></div>
                </div>
            </div>
        </div>

        <div style="margin-top: 2rem; display: flex; gap: 1rem;">
            <button onclick="saveRad()" style="flex: 2;">Salvar RAD</button>
            <button class="danger" onclick="clearRad()" style="flex: 1;">Limpar</button>
            <button class="secondary" onclick="closeModal()" style="flex: 1;">Fechar</button>
        </div>
    </div>
</div>

<script>
    // --- CONFIGURAÇÃO ---
    const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQmSAl1ndXXSgDWbrjCiSDkmtECkP94Rr2nk-kIHV-zHd4NFSE9CzyQb6YP2Rt4lEQNYOpuvgjCYDal/pub?output=csv';
    
    // Estrutura: A(Lang), B(Book), C(Group), D(Room), E(Mod), F(Time), G-K(Days)
    // Índices base 0: 0, 1, 2, 3, 4, 5, 6(Mon), 7(Tue), 8(Wed), 9(Thu), 10(Fri)

    const VALID_TEACHERS = [
        { name: 'MYCAEL', color: '#FF6B6B' },
        { name: 'HOPE', color: '#FFE66D' },
        { name: 'PEDRO', color: '#F38181' },
        { name: 'DIOGO', color: '#AA96DA' },
        { name: 'LIVIA', color: '#FCBAD3' },
        { name: 'TOSCA', color: '#A8D8EA' },
        { name: 'IAGO', color: '#FF9F43' },
        { name: 'SARA', color: '#54a0ff' },
        { name: 'CAROL', color: '#5f27cd' }
        // Rafael removido
    ];

    const DAYS_MAP = {
        'Mon': 'Segunda-feira',
        'Tue': 'Terça-feira',
        'Wed': 'Quarta-feira',
        'Thu': 'Quinta-feira',
        'Fri': 'Sexta-feira'
    };

    // Banco de Alunos (Mapeamento simplificado para demonstração)
    const STUDENTS_DB = {
        'BRIDGE': ['Alice', 'Bob', 'Charlie'],
        'DUNE': ['Ana', 'Sofia'],
        'THE 100': ['Caio', 'Flavia', 'Luiz'],
        'DEFAULT': ['Aluno 1', 'Aluno 2', 'Aluno 3']
    };

    let allClasses = [];
    let currentTeacher = null;
    let currentClassId = null;

    // --- INICIALIZAÇÃO ---
    document.addEventListener('DOMContentLoaded', () => {
        fetchSchedule();
    });

    async function fetchSchedule() {
        try {
            const response = await fetch(SHEET_URL);
            if (!response.ok) throw new Error('Erro na rede');
            const csvText = await response.text();
            parseCSV(csvText);
            renderTeacherSelection();
        } catch (error) {
            console.error(error);
            document.getElementById('loading').style.display = 'none';
            document.getElementById('error-msg').style.display = 'block';
            document.getElementById('error-msg').textContent = 'Erro ao carregar planilha. Verifique a conexão.';
        }
    }

    function parseCSV(text) {
        const lines = text.split('\n').map(l => l.trim()).filter(l => l);
        if (lines.length < 2) return;

        // Ignorar cabeçalho (linha 0)
        for (let i = 1; i < lines.length; i++) {
            // Split simples, cuidado com vírgulas dentro de aspas se houver
            const row = lines[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(c => c.trim().replace(/^"|"$/g, ''));
            
            // Mapeamento baseado na nova estrutura:
            // 0:Lang, 1:Book, 2:Group, 3:Room, 4:Mod, 5:Time, 6:Mon...
            const book = row[1] || '';
            const group = row[2] || '';
            const room = row[3] || '';
            const mod = row[4] || '';
            const time = row[5] || '';
            
            if (!time) continue;

            // Dias: Colunas 6 a 10
            for (let d = 0; d < 5; d++) {
                const dayKey = Object.keys(DAYS_MAP)[d];
                const cellContent = row[6 + d];

                if (cellContent && cellContent.trim() !== '') {
                    // Extrair nome do professor da célula
                    const teacherName = findTeacher(cellContent);
                    
                    if (teacherName) {
                        // Limpar nome do professor da string para obter detalhes extras se necessário
                        // Mas geralmente a célula é só o nome ou "Nome - Obs"
                        
                        allClasses.push({
                            id: `${dayKey}-${time}-${group}-${teacherName}`, // ID único simples
                            day: dayKey,
                            time: time,
                            teacher: teacherName,
                            book: book,
                            group: group,
                            room: room,
                            mod: mod,
                            isInCompany: mod.toLowerCase().includes('in company') || room.toLowerCase().includes('in company') || room.toLowerCase().includes('hotel') || room.toLowerCase().includes('jurássica')
                        });
                    }
                }
            }
        }
    }

    function findTeacher(str) {
        str = str.toUpperCase();
        for (const t of VALID_TEACHERS) {
            if (str.includes(t.name)) return t.name;
        }
        return null;
    }

    // --- RENDERIZAÇÃO ---
    function renderTeacherSelection() {
        const grid = document.getElementById('teachers-grid');
        document.getElementById('loading').style.display = 'none';
        grid.innerHTML = '';

        VALID_TEACHERS.sort((a,b) => a.name.localeCompare(b.name)).forEach(t => {
            const hasClasses = allClasses.some(c => c.teacher === t.name);
            const card = document.createElement('div');
            card.className = 'teacher-card';
            card.innerHTML = `
                <div class="teacher-name">${t.name}</div>
                <div style="color:var(--text-muted); font-size:0.9rem;">${hasClasses ? 'Visualizar Dashboard' : 'Sem aulas'}</div>
            `;
            if(hasClasses) {
                card.onclick = () => selectTeacher(t);
                grid.appendChild(card);
            }
        });
    }

    function selectTeacher(teacher) {
        currentTeacher = teacher;
        document.getElementById('selection-screen').classList.remove('active');
        document.getElementById('teacher-screen').classList.add('active');
        document.getElementById('back-btn').style.display = 'block';
        
        renderDashboard();
        renderSchedule();
        window.scrollTo(0,0);
    }

    function showSelection() {
        document.getElementById('teacher-screen').classList.remove('active');
        document.getElementById('calculator-screen').classList.remove('active');
        document.getElementById('selection-screen').classList.add('active');
        document.getElementById('back-btn').style.display = 'none';
        currentTeacher = null;
    }

    function showTeacherView() {
        document.getElementById('calculator-screen').classList.remove('active');
        document.getElementById('teacher-screen').classList.add('active');
    }

    function scrollToSchedule() {
        document.getElementById('schedule-content').scrollIntoView({ behavior: 'smooth' });
    }

    function renderDashboard() {
        // Filtrar aulas da semana atual do teacher
        const classes = allClasses.filter(c => c.teacher === currentTeacher.name);
        const savedData = getSavedData();

        let realized = 0, noshow = 0, canceled = 0;

        classes.forEach(c => {
            const data = savedData[c.id];
            if (data) {
                if (data.status === 'realizada') realized++;
                else if (data.status === 'noshow') noshow++;
                else if (data.status === 'cancelada') canceled++;
            }
        });

        document.getElementById('stat-total').textContent = classes.length;
        document.getElementById('stat-realized').textContent = realized;
        document.getElementById('stat-noshow').textContent = noshow;
        document.getElementById('stat-canceled').textContent = canceled;
    }

    function renderSchedule() {
        const container = document.getElementById('schedule-content');
        container.innerHTML = '';
        
        const classes = allClasses.filter(c => c.teacher === currentTeacher.name);
        const savedData = getSavedData();

        const daysOrder = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri'];

        daysOrder.forEach(day => {
            const dayClasses = classes.filter(c => c.day === day).sort((a,b) => a.time.localeCompare(b.time));
            
            if (dayClasses.length > 0) {
                const section = document.createElement('div');
                section.className = 'day-section';
                
                const header = document.createElement('div');
                header.className = 'day-header';
                header.innerHTML = `<span>${DAYS_MAP[day]}</span>`;
                section.appendChild(header);

                const list = document.createElement('div');
                list.className = 'classes-list';

                dayClasses.forEach(cls => {
                    const data = savedData[cls.id] || {};
                    const statusClass = data.status ? `status-${data.status}` : '';
                    const statusLabel = data.status ? `<span class="status-badge st-${data.status}">${data.status}</span>` : '';

                    const card = document.createElement('div');
                    card.className = `class-card ${statusClass}`;
                    card.innerHTML = `
                        <div class="class-time">
                            ⏰ ${cls.time} ${statusLabel}
                        </div>
                        <div class="badges">
                            <span class="badge badge-group">${cls.group}</span>
                            <span class="badge badge-book">${cls.book}</span>
                            ${cls.isInCompany ? '<span class="badge badge-modal" style="border-color:#ff2a2a; color:#ff2a2a">IN COMPANY</span>' : ''}
                            <span class="badge badge-room">📍 ${cls.room}</span>
                        </div>
                        <div style="font-size:0.85rem; color:var(--text-muted); margin-bottom:1rem;">
                            ${cls.mod} • ${cls.book}
                        </div>
                        <div class="class-actions">
                            <button onclick="openRad('${cls.id}')">RAD / Lesson Plan</button>
                        </div>
                    `;
                    list.appendChild(card);
                });

                section.appendChild(list);
                container.appendChild(section);
            }
        });
    }

    // --- RAD & LESSON PLAN LOGIC ---
    function openRad(classId) {
        currentClassId = classId;
        const cls = allClasses.find(c => c.id === classId);
        const saved = getSavedData()[classId] || {};

        document.getElementById('modal-subtitle').textContent = `${cls.group} • ${cls.time} • ${DAYS_MAP[cls.day]}`;
        
        // Preencher campos
        document.getElementById('rad-status').value = saved.status || 'pending';
        document.getElementById('rad-book').value = saved.book || cls.book;
        document.getElementById('rad-lesson').value = saved.lesson || '';
        
        // Lesson Plan
        document.getElementById('lp-objective').value = saved.lpObjective || '';
        document.getElementById('lp-materials').value = saved.lpMaterials || '';
        
        const stepsContainer = document.getElementById('lp-steps-container');
        stepsContainer.innerHTML = '';
        const steps = saved.lpSteps || ['Warm-up', 'Main Activity', 'Wrap-up'];
        steps.forEach(step => addLpStep(step));

        toggleRadFields();
        
        // Attendance
        renderAttendance(cls.group, saved.attendance || {});

        document.getElementById('rad-modal').classList.add('open');
    }

    function toggleRadFields() {
        const status = document.getElementById('rad-status').value;
        const fields = document.getElementById('rad-fields');
        const attendanceSec = document.getElementById('attendance-section');
        
        if (status === 'realizada' || status === 'noshow') {
            fields.style.display = 'block';
            if (status === 'realizada') {
                attendanceSec.style.display = 'block';
            } else {
                attendanceSec.style.display = 'none'; // No show não precisa marcar presença individual, é geral
            }
        } else {
            fields.style.display = 'none';
            attendanceSec.style.display = 'none';
        }
    }

    function addLpStep(val = '') {
        const container = document.getElementById('lp-steps-container');
        const div = document.createElement('div');
        div.className = 'lp-step';
        div.innerHTML = `
            <input type="text" value="${val}" placeholder="Etapa (Ex: 10min - Vocab review)" class="lp-step-input">
            <button type="button" class="danger" onclick="this.parentElement.remove()" style="padding:0.5rem;">×</button>
        `;
        container.appendChild(div);
    }

    function renderAttendance(groupName, savedAttendance) {
        const list = document.getElementById('attendance-list');
        list.innerHTML = '';
        
        // Tenta achar alunos no DB, senão usa default
        let students = STUDENTS_DB[groupName.toUpperCase()] || STUDENTS_DB['DEFAULT'];
        // Fallback genérico se o grupo não tiver lista específica hardcoded
        if (!students || students.length === 0) students = ['Aluno 1', 'Aluno 2', 'Aluno 3'];

        students.forEach((student, idx) => {
            const isChecked = savedAttendance[idx] === true;
            const item = document.createElement('div');
            item.style.cssText = "display:flex; justify-content:space-between; padding:0.5rem; border-bottom:1px solid #333; align-items:center;";
            item.innerHTML = `
                <span>${student}</span>
                <input type="checkbox" ${isChecked ? 'checked' : ''} style="width:auto;" onchange="toggleAttendance(${idx}, this.checked)">
            `;
            list.appendChild(item);
        });
    }

    window.toggleAttendance = (idx, checked) => {
        // Apenas lógica visual, salva no final
        const list = document.getElementById('attendance-list');
        // Armazenamos temporariamente no DOM ou variável global se necessário, 
        // mas aqui vamos ler tudo no saveRad
    };

    function saveRad() {
        const status = document.getElementById('rad-status').value;
        const data = {
            status: status,
            book: document.getElementById('rad-book').value,
            lesson: document.getElementById('rad-lesson').value,
            lpObjective: document.getElementById('lp-objective').value,
            lpMaterials: document.getElementById('lp-materials').value,
            lpSteps: Array.from(document.querySelectorAll('.lp-step-input')).map(i => i.value),
            attendance: {}
        };

        // Salvar presença
        if (status === 'realizada') {
            const checkboxes = document.querySelectorAll('#attendance-list input[type="checkbox"]');
            checkboxes.forEach((cb, idx) => {
                data.attendance[idx] = cb.checked;
            });
        }

        const savedData = getSavedData();
        savedData[currentClassId] = data;
        localStorage.setItem('teacherPortalData', JSON.stringify(savedData));

        closeModal();
        renderDashboard();
        renderSchedule();
        alert('RAD salvo com sucesso!');
    }

    function clearRad() {
        if(confirm('Tem certeza que deseja limpar todos os dados desta aula?')) {
            const savedData = getSavedData();
            delete savedData[currentClassId];
            localStorage.setItem('teacherPortalData', JSON.stringify(savedData));
            closeModal();
            renderDashboard();
            renderSchedule();
        }
    }

    function closeModal() {
        document.getElementById('rad-modal').classList.remove('open');
    }

    function getSavedData() {
        return JSON.parse(localStorage.getItem('teacherPortalData') || '{}');
    }

    // --- CLASS CALCULATOR ---
    function openClassCalculator() {
        document.getElementById('teacher-screen').classList.remove('active');
        document.getElementById('calculator-screen').classList.add('active');
        calculateStats();
    }

    function calculateStats() {
        const savedData = getSavedData();
        const classes = allClasses.filter(c => c.teacher === currentTeacher.name);
        
        let schoolDone = 0, inCompanyDone = 0;
        let schoolNoShow = 0, inCompanyNoShow = 0;

        classes.forEach(c => {
            const data = savedData[c.id];
            if (data && data.status !== 'pending') {
                if (c.isInCompany) {
                    if (data.status === 'realizada') inCompanyDone++;
                    if (data.status === 'noshow') inCompanyNoShow++;
                } else {
                    if (data.status === 'realizada') schoolDone++;
                    if (data.status === 'noshow') schoolNoShow++;
                }
            }
        });

        document.getElementById('calc-school-done').textContent = schoolDone;
        document.getElementById('calc-incompany-done').textContent = inCompanyDone;
        document.getElementById('calc-school-noshow').textContent = schoolNoShow;
        document.getElementById('calc-incompany-noshow').textContent = inCompanyNoShow;
    }

    function resetMonthlyData() {
        if(confirm('ATENÇÃO: Isso apagará todos os registros de RAD deste mês. Continuar?')) {
            localStorage.removeItem('teacherPortalData');
            location.reload();
        }
    }

</script>
